- canonical_name: compilation_mode
  knowledge_name: CompilationConfig.cudagraph_mode
  aliases:
  - CompilationConfig.cudagraph_mode
  - compilation.cudagraph_mode
  - --compilation-config
  category: compilation
  performance_impact: high
  risk: medium
  role: tunable
  recall_source: tag_recall
  baseline: FULL_DECODE_ONLY
  values:
  - FULL_DECODE_ONLY
  - PIECEWISE
  value_sources:
  - source: scenario_baseline
    values:
    - FULL_DECODE_ONLY
  - source: registry_policy
    values:
    - FULL_DECODE_ONLY
    - PIECEWISE
  pruned_values: []
  injection:
    kind: env_json_field
    name: COMPILATION_MODE
    object: compilation_config
    field: cudagraph_mode
  integration_status: existing
  availability:
    status: verified
    source: existing_continuous_controller_contract_2026-07-31
  knowledge_file: tag_params/output/params/CompilationConfig.cudagraph_mode.yaml
  constraints_evidence:
  - String values are parsed case-insensitively but must name one of NONE, PIECEWISE,
    FULL, FULL_DECODE_ONLY, or FULL_AND_PIECEWISE.
  - PIECEWISE and FULL_AND_PIECEWISE require CompilationMode.VLLM_COMPILE and usable
    splitting operations; incompatible compilation settings cause a fallback to NONE
    or another mode.
  - Full graph modes depend on the selected attention backend and model features.
    Runtime initialization may downgrade them to the closest supported mode, so the
    configured and effective values can differ.
  - 'Upstream pooling models replace full-containing modes with PIECEWISE. Encoder-decoder
    handling is platform-specific: pinned Ascend replaces full-containing modes with
    PIECEWISE under VLLM_COMPILE and NONE otherwise.'
  - On Ascend, compilation modes other than NONE and VLLM_COMPILE force cudagraph_mode
    to NONE; xlite full mode also forces NONE, while xlite decode-only mode forces
    FULL_DECODE_ONLY.
  - Ascend graph modes are incompatible with ASCEND_LAUNCH_BLOCKING=1 and platform
    configuration raises ValueError when both are active.
  approval: human_required
  approval_reasons:
  - risk_is_medium
  base_activation_score: 61
  history_score_adjustment: 0.0
  activation_score: 61.0
- canonical_name: num_speculative_tokens
  knowledge_name: SpeculativeConfig.num_speculative_tokens
  aliases:
  - SpeculativeConfig.num_speculative_tokens
  - speculative.num_speculative_tokens
  category: scheduling
  performance_impact: high
  risk: medium
  role: tunable
  recall_source: tag_recall
  baseline: 3
  values:
  - 3
  - 0
  - 1
  value_sources:
  - source: scenario_baseline
    values:
    - 3
  - source: registry_policy
    values:
    - 0
    - 1
    - 2
    - 3
  pruned_values:
  - value: 2
    violations:
    - mtp_factor_divides_tensor_parallel
    - cudagraph_sizes_match_speculation_factor
  injection:
    kind: env_json_field
    name: NUM_SPECULATIVE_TOKENS
    object: speculative_config
    field: num_speculative_tokens
  integration_status: existing
  availability:
    status: verified
    source: existing_continuous_controller_contract_2026-07-31
  knowledge_file: tag_params/output/params/SpeculativeConfig.num_speculative_tokens.yaml
  constraints_evidence:
  - The value must be an integer greater than zero.
  - It is required unless compatible draft-model metadata supplies n_predict; suffix
    decoding instead defaults it to suffix_decoding_max_tree_depth.
  - Supplying a positive value without a supported speculative method or draft model
    is rejected.
  - When draft metadata exposes n_predict and K exceeds it, K must be divisible by
    n_predict so the MTP module can be reused.
  - The extract_hidden_states method requires K=1 because it does not perform actual
    speculation.
  - On the documented Ascend fused TND attention path, K+1 cannot exceed 16, so K
    is at most 15.
  - In Ascend full-graph EAGLE or MTP operation, each supported graph capture size
    must be an integer multiple of K+1.
  - With LoRA, max_num_batched_tokens must be at least max_num_seqs multiplied by
    K+1.
  approval: human_required
  approval_reasons:
  - risk_is_medium
  base_activation_score: 62
  history_score_adjustment: 0.0
  activation_score: 62.0

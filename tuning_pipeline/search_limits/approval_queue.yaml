- canonical_name: mlapo
  knowledge_name: additional_config.enable_mlapo
  aliases:
  - additional_config.enable_mlapo
  category: compilation
  performance_impact: high
  risk: medium
  role: tunable
  recall_source: tag_recall
  baseline: true
  values:
  - true
  - false
  value_sources:
  - source: scenario_baseline
    values:
    - true
  - source: registry_policy
    values:
    - true
    - false
  pruned_values: []
  injection:
    kind: json_field
    object: additional_config
    field: enable_mlapo
  integration_status: planned
  availability:
    status: unverified_for_current_image
    source: registry_and_knowledge_only
  knowledge_file: tag_params/output/params/additional_config.enable_mlapo.yaml
  constraints_evidence:
  - The value must be a YAML/JSON boolean in additional_config; the nested value overrides
    the deprecated environment variable.
  - On non-A5 devices, MLAPO is enabled only on a KV-transfer consumer that is not
    also a producer; ordinary or mixed producer-consumer instances do not activate
    it.
  - The MLA implementation supports MLAPO only for layers whose fused projection uses
    Ascend W8A8 or W8A8MXFP8 dynamic quantization.
  - On non-A5 SFA, the fused projection must use supported W8A8 quantization and SFA
    context parallelism must be disabled; A5 SFA additionally supports floating-point
    MLAPO.
  - The guarded non-A5 fused runtime paths accept no more than 1,024 input/decode
    tokens; larger batches fall back to the unfused path.
  approval: human_required
  approval_reasons:
  - risk_is_medium
  - parameter_not_verified_for_current_image
  base_activation_score: 53
  history_score_adjustment: 0.0
  activation_score: 53.0

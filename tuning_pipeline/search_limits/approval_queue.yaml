  - source: registry_policy
    values:
    - 0.85
    - 0.9
    - 0.93
    - 0.95
  pruned_values: []
  injection:
    kind: env_value
    name: GPU_MEMORY_UTILIZATION
    target: vllm_cli
  integration_status: existing
  availability:
    status: verified
    source: existing_continuous_controller_contract_2026-07-31
  knowledge_file: tag_params/output/params/gpu_memory_utilization.yaml
  constraints_evidence:
  - The value must be greater than 0 and less than or equal to 1.
  - At device initialization, free memory must be at least total device memory multiplied
    by this value or the Ascend worker raises ValueError.
  - On 310P, the available KV-cache budget computed from this setting is halved for
    workspace and other caches.
  - When --kv-cache-memory-bytes is set, it takes precedence and gpu_memory_utilization
    is not used for KV-cache sizing.
  approval: human_required
  approval_reasons:
  - risk_is_medium

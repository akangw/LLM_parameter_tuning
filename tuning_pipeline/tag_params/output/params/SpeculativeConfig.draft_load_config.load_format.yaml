name: SpeculativeConfig.draft_load_config.load_format
type: nested
category: model
scope: both
source_file:
- vllm/config/load.py:29
- vllm/config/speculative.py:186
- docs/features/speculative_decoding/README.md:138
- vllm_ascend/spec_decode/llm_base_proposer.py:218
- vllm_ascend/model_loader/netloader/netloader.py:39
- vllm_ascend/model_loader/rfork/rfork_loader.py:38
value_type: str
default: auto
valid_choices: Built-ins documented by the pinned vLLM LoadConfig are auto, pt, safetensors, instanttensor, npcache, dummy,
  tensorizer, runai_streamer, runai_streamer_sharded, bitsandbytes, sharded_state, gguf, and mistral. Loader names registered
  by plugins are also accepted; pinned vllm-ascend registers netloader and rfork.
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- memory
impact_detail: 'This nested field selects how the speculative draft model''s weights are deserialized during engine initialization.
  The default auto path tries safetensors and falls back to PyTorch bin weights. Different loaders can change cold-start I/O
  and peak host-memory behavior: for example, npcache can reuse a NumPy cache, sharded_state loads prepared per-rank shards,
  and streaming or plugin loaders use their own transfer paths. It does not change the speculative decoding algorithm, computation
  graph, or steady-state token throughput. In the pinned Ascend implementation, the proposer passes the complete draft_load_config
  to get_model; therefore the same selection governs draft loading on NPU, including the Ascend-specific netloader and rfork
  plugins. The impact is classified low because this is an internal, initialization-only field and normally inherits the already-resolved
  target load configuration rather than being tuned independently.'
usage_locations:

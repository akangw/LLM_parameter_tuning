related_parameters:
- name: SpeculativeConfig.draft_load_config
  relation: Parent internal configuration; when absent, vLLM uses the target model's load configuration for the draft model.
- name: SpeculativeConfig.draft_model_config
  relation: Identifies the draft checkpoint to which the selected loader applies.
- name: SpeculativeConfig.draft_load_config.model_loader_extra_config
  relation: Supplies loader-specific settings required by loaders such as RFork.
- name: SpeculativeConfig.draft_load_config.safetensors_load_strategy
  relation: Selects lazy, eager, prefetch, or torchao behavior when a safetensors path is used, controlling the detailed startup-I/O
    and host-memory tradeoff.
constraints:
- draft_load_config and this nested field are internal speculative-decoding fields populated by vLLM, not supported user-facing
  keys for --speculative-config in the pinned documentation.
- The selected format must match the draft checkpoint layout and any required optional loader dependency or plugin.
- sharded_state requires checkpoint shards prepared for the deployment's tensor-parallel topology.
- The Ascend RFork loader requires model_loader_extra_config to be a dictionary and falls back to auto when its transfer path
  fails.
- Custom values are valid only after a matching model-loader plugin has been registered; in the pinned Ascend package those
  values include netloader and rfork.
tuning_advice:
  summary: Leave this internal field under vLLM control and use auto for ordinary checkpoints. Framework integrators should
    override it only to match a known draft-checkpoint layout or a configured loader service, then measure cold-start time
    and peak host memory.
  suggested_values:
  - scenario: Standard draft checkpoint or no independently configured draft loader
    value: auto
    reason: It prefers safetensors, falls back to PyTorch bin weights, and is the safe inherited behavior for normal repositories.
  - scenario: Draft checkpoint prepared as per-rank tensor-parallel shards
    value: sharded_state
    reason: This loader is intended for pre-sharded checkpoints and can avoid each worker reading the full unsharded checkpoint
      during initialization.
  - scenario: Ascend deployment with a configured RFork transfer service
    value: rfork
    reason: The pinned Ascend package registers this loader for transfer-based loading and falls back to auto if the transfer
      cannot be used.
  caveats:
  - Loader choice affects initialization, not draft-token acceptance or steady-state decode throughput; benchmark cold starts
    separately.
  - A loader/checkpoint mismatch, missing plugin dependency, or incompatible shard topology prevents the draft model from
    loading.
  - Safetensors strategy is a separate nested field; format alone does not select its lazy, eager, or prefetch policy.
  - Ascend-specific transfer loaders require their external infrastructure and extra configuration, so their names are not
    portable to plain vLLM.
  quick_guide: Keep auto unless integrating a verified specialized draft loader. For a deliberate override, cold-start once
    with an empty cache, record peak host memory, and confirm that the draft checkpoint loads on every parallel rank.
analysis_date: '2026-07-31'

name: additional_config.eplb_config.expert_heat_collection_interval
type: nested
category: scheduling
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:632
- vllm_ascend/ascend_config.py:670
- vllm_ascend/worker/model_runner_v1.py:466
- vllm_ascend/eplb/eplb_updator.py:53
- vllm_ascend/eplb/eplb_updator.py:76
- vllm_ascend/eplb/eplb_updator.py:125

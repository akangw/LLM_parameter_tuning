name: VLLM_DISABLE_COMPILE_CACHE
type: env
category: compilation
scope: both
source_file:
- vllm/envs.py:131
- vllm/envs.py:309
- vllm/envs.py:1118
- vllm_ascend/compilation/compiler_interface.py:227
- vllm_ascend/compilation/compiler_interface.py:260
- docs/design/debug_vllm_compile.md:303
value_type: bool
default: false
valid_choices:
- '0: keep the compile cache enabled'
- '1: disable the compile cache'
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
impact_detail: The default value 0 permits vLLM to reuse compiled artifacts across process starts. Setting the variable to
  1 makes upstream compilation-cache setup pass disable_cache to the selected compiler. AscendCompiler records that flag and,
  for its npugraph_ex path, withholds cache_dir from npugraph_ex_compile; compiled graph code is therefore neither loaded
  from nor saved to the persistent cache. Subsequent server starts must compile those graphs again. Upstream documentation
  explicitly warns that this makes warm server starts much slower. This is a startup/warm-up latency effect, not a steady-state
  request-latency or throughput optimization. Ascend's compiler implementation directly honors the upstream flag, so the behavior
  applies to both vLLM generally and vllm-ascend.
usage_locations:
- file: vllm/envs.py:309
  context: Parses the environment value as an integer-backed boolean, defaulting to 0.
- file: vllm_ascend/compilation/compiler_interface.py:227
  context: AscendCompiler.initialize_cache stores the disable_cache decision supplied by vLLM.
- file: vllm_ascend/compilation/compiler_interface.py:260
  context: The npugraph_ex compile path sets cache_dir to None when caching is disabled.
- file: vllm_ascend/compilation/compiler_interface.py:319
  context: When enabled, the Ascend path loads saved npugraph_ex compiled code from the cache file.
- file: docs/design/debug_vllm_compile.md:329
  context: Documents the variable as a workaround for non-serializable artifacts and warns of slower warm starts.
related_parameters:
- name: VLLM_CACHE_ROOT
  relation: Provides the root containing torch_compile_cache when compilation caching is enabled.
- name: compilation_config.mode
  relation: Compilation mode controls whether compilation runs; disabling compilation also makes its cache irrelevant.
- name: force_disable_caches
  relation: The additional Inductor setting is another cache opt-out considered by upstream cache enablement logic.
constraints:
- The value must be an integer string accepted by int(), normally 0 or 1; arbitrary boolean words are invalid.
- Disabling the cache can avoid failures caused by non-serializable compiled artifacts, but every warm start recompiles.
- Ascend npugraph_ex graphs containing Triton wrapper calls are skipped individually even when the global cache is enabled.
tuning_advice:
  summary: Keep the cache enabled in production; disable it only to isolate or work around compilation-cache correctness or
    serialization problems.
  suggested_values:
  - scenario: Normal production deployment, including Ascend with npugraph_ex
    value: '0'
    reason: Reuses persistent compiled artifacts and avoids repeated graph compilation during warm starts.
  - scenario: Debugging a stale, incorrect, or non-serializable vLLM compile artifact
    value: '1'
    reason: Bypasses vLLM's persistent compile cache so startup can compile fresh artifacts while the underlying issue is
      investigated.
  caveats:
  - The benefit is reduced startup and warm-up time; it does not improve steady-state inference throughput.
  - A cache miss or a graph that Ascend intentionally declines to serialize will still compile even when this variable is
    0.
  - Changing compilation inputs or configuration may invalidate cache keys and trigger compilation despite caching being enabled.
  quick_guide: Use 0 by default. Temporarily use 1 only when cache reuse itself is suspected or artifact serialization fails.
analysis_date: '2026-07-28'

name: additional_config.weight_prefetch_config.prefetch_ratio
type: nested
category: memory
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:573
- vllm_ascend/ops/weight_prefetch.py:12
- vllm_ascend/ops/weight_prefetch.py:23
- vllm_ascend/ops/weight_prefetch.py:46
- vllm_ascend/ops/weight_prefetch.py:71
- vllm_ascend/ops/weight_prefetch.py:88
- vllm_ascend/ops/weight_prefetch.py:110

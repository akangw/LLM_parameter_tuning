name: SpeculativeConfig.num_speculative_tokens
type: nested
category: scheduling
scope: both
source_file:
- vllm/config/speculative.py:79
- vllm/engine/arg_utils.py:2013
- vllm/v1/cudagraph_dispatcher.py:36
- vllm_ascend/platform.py:206

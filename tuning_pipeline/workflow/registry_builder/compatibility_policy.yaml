schema_version: 1

# Purely deterministic candidate normalization. These tokens describe omission,
# not literal values to inject into a process environment or CLI.
normalization:
  omit_tokens: [unset, "<unset>", omit, "<omit>"]
  placeholder_patterns:
    - "^<.*>$"
    - "^namespace::operator$"
    - "^(a|an|the) .*(name|path|class|checkpoint|identifier|callable)"
    - "^.* supplied by .*$"
    - "^.* for a .*$"
  numeric_baseline:
    minimum_factor: 0.5
    maximum_factor: 2.0
    allow_zero: true

# Scenario-level invariants are not Agent tuning dimensions. The value is owned
# by the selected model, topology or benchmark profile.
parameter_rules:
  - match: data_parallel_size
    role: session_fixed
    scenario_path: topology.data_parallel_size
  - match: tensor_parallel_size
    role: session_fixed
    scenario_path: topology.tensor_parallel_size
  - match: pipeline_parallel_size
    role: session_fixed
    scenario_path: topology.pipeline_parallel_size
  - match: max_model_len
    role: session_fixed
    scenario_path: baseline.max_model_len
  - match: dtype
    role: session_fixed
  - match: quantization
    role: session_fixed
  - match: worker_cls
    role: session_fixed
  - match: distributed_executor_backend
    role: session_fixed
  # B0 resolves async scheduling to false, while MTP requires true in this
  # workflow. It must remain a coupled Agent axis rather than a frozen field.
  - match: async_scheduling
    scenario_path: baseline.async_scheduling
    risk_override: medium
  - match: compilation_config__cudagraph_mode
    rename_to: compilation_mode
    scenario_path: baseline.compilation_mode
    risk_override: medium
  - match: compilation_config__pass_config__enable_sp
    rename_to: compilation_enable_sp
    scenario_path: baseline.compilation_enable_sp
  - match: compilation_config__pass_config__sp_min_token_num
    # This threshold has no independent effect while the SP pass is not part
    # of the active profile. Keep it fixed instead of consuming an Active slot.
    role: session_fixed
  - match: additional_config__enable_mlapo
    rename_to: mlapo
    scenario_path: baseline.mlapo
  - match: additional_config__enable_flashcomm1
    rename_to: flashcomm1
    scenario_path: baseline.flashcomm1
    risk_override: medium
  - match: additional_config__enable_fused_mc2
    rename_to: fused_mc2
    scenario_path: baseline.fused_mc2
  - match: e_p_l_b_config__num_redundant_experts
    rename_to: eplb_num_redundant_experts
    scenario_path: baseline.eplb_num_redundant_experts
  # These fields are source-visible but are not safe tuning axes for the
  # pinned Ascend scenario: the platform overrides/ignores them, their value
  # is owned by the deployment, or their advertised alternatives violate the
  # frozen DP2 topology.
  - match: all2all_backend
    role: session_fixed
  - match: attention_backend
    role: session_fixed
  - match: attention_config__mla_prefill_backend
    role: session_fixed
  - match: compilation_config__backend
    role: recovery_only
  - match: additional_config__finegrained_tp_config__lmhead_tensor_parallel_size
    role: session_fixed
  - match: speculative_config__model
    role: session_fixed
  - match: speculative_config__quantization
    role: session_fixed
  - match: cudagraph_capture_sizes
    risk_override: medium
  - match: block_size
    # The target Ascend attention backend owns the effective kernel block
    # size. Upstream's alternative 16 is not a proven online tuning value.
    role: session_fixed
  - match: kv_cache_dtype
    # The upstream enum mixes CUDA/ROCm/model-specific formats. Keep the
    # source/platform resolved value until this exact model path is probed.
    role: session_fixed
  - match: prefill_context_parallel_size
    # PCP multiplies the physical model world size. With DP2 x TP16 on 32
    # NPUs, PCP=2 would require 64 NPUs and cannot be an online candidate.
    role: session_fixed
  - match: cp_kv_cache_interleave_size
    # This is a coupled cache-layout field, not an independent performance
    # knob; it must move with block size and an enabled CP deployment.
    role: session_fixed
  - match: COMPILE_CUSTOM_KERNELS
    role: build_fixed
  - match: TORCH_COMPILE_DISABLE
    role: recovery_only
  - match: PYTORCH_NPU_ALLOC_CONF
    role: recovery_only
  - match: VLLM_MLA_DISABLE
    role: recovery_only
  - match: VLLM_USE_V2_MODEL_RUNNER
    role: session_fixed
  - match: VLLM_ASCEND_APPLY_DSV4_PATCH
    require: {path: model.deepseek_v4, op: truthy}
  - match: enforce_eager
    role: recovery_only
  - match: speculative_config__enforce_eager
    role: recovery_only

  # Feature families are rejected when the selected scenario does not enable
  # the corresponding subsystem.
  - match: "k_v_transfer_config__*"
    require: {path: features.kv_transfer, op: truthy}
  - match: "*lora*"
    require: {path: features.lora, op: truthy}
  - match: "*eplb*"
    require: {path: features.dynamic_eplb, op: truthy}
  # Source extraction spells EPLB object names as e_p_l_b before the canonical
  # rename above. Gate both spellings so the disabled family cannot leak into
  # Reserve through normalization order.
  - match: "*e_p_l_b*"
    require: {path: features.dynamic_eplb, op: truthy}
  - match: "MOONCAKE_*"
    require: {path: features.kv_transfer, op: truthy}
  - match: additional_config__enable_balance_scheduling
    require: {path: features.pd_disaggregated, op: truthy}
  - match: additional_config__layer_sharding
    require: {path: features.pd_disaggregated, op: truthy}
  - match: additional_config__mix_placement
    require: {path: model.mix_placement_supported, op: truthy}
  - match: additional_config__enable_shared_expert_dp
    require: {path: model.shared_expert_dp_supported, op: truthy}
  - match: additional_config__enable_dsa_cp
    require: {path: model.dsa, op: truthy}
  - match: "*xlite*"
    require: {path: features.xlite, op: truthy}
  - match: additional_config__profiling_chunk_config__enabled
    role: diagnostic_only
  - match: speculative_config__rejection_sample_method
    role: session_fixed
  - match: "speculative_config__synthetic_*"
    role: diagnostic_only
  - match: speculative_config__parallel_drafting
    require: {path: features.parallel_drafting, op: truthy}
  - match: "online_quantization_config_args__*"
    role: session_fixed
  - match: num_gpu_blocks_override
    role: recovery_only
  - match: "offload_*"
    role: recovery_only
  - match: enable_sleep_mode
    role: session_fixed
  - match: scheduler_cls
    role: session_fixed
  - match: enable_chunked_prefill
    role_when:
      role: session_fixed
      condition: {path: features.chunked_prefill_disable_safe, op: falsy}
    value_rules:
      - values: [false]
        require: {path: features.chunked_prefill_disable_safe, op: truthy}
        reason: chunked_prefill_false_cannot_cover_current_context_budget

# These constraints are emitted with the isolated Search Limits and can be
# evaluated again before a future Controller submits a complete candidate.
combination_constraints:
  - id: speculative_method_requires_tokens
    kind: require_if_active
    parameter: speculative_config__method
    inactive_values: [null]
    required_parameter: num_speculative_tokens
    required_op: gt
    required_value: 0
  - id: speculative_tokens_require_method
    kind: require_if_active
    parameter: num_speculative_tokens
    inactive_values: [null, 0]
    required_parameter: speculative_config__method
    required_op: not_in
    required_value: [null]
  - id: speculative_tokens_require_async_scheduling
    kind: require_if_active
    parameter: num_speculative_tokens
    inactive_values: [null, 0]
    required_parameter: async_scheduling
    required_op: eq
    required_value: true
  - id: static_kernel_requires_npugraph_ex
    kind: require_if_active
    parameter: additional_config__ascend_compilation_config__enable_static_kernel
    inactive_values: [null, false]
    required_parameter: additional_config__ascend_compilation_config__enable_npugraph_ex
    required_op: eq
    required_value: true
  - id: unpadded_drafter_requires_async_disabled
    kind: require_if_active
    parameter: speculative_config__disable_padded_drafter_batch
    inactive_values: [null, false]
    required_parameter: async_scheduling
    required_op: eq
    required_value: false
  - id: unpadded_drafter_requires_pcp_one
    kind: require_if_active
    parameter: speculative_config__disable_padded_drafter_batch
    inactive_values: [null, false]
    required_parameter: prefill_context_parallel_size
    required_op: eq
    required_value: 1
  - id: shared_expert_dp_requires_expert_parallel
    kind: require_if_active
    parameter: additional_config__enable_shared_expert_dp
    inactive_values: [null, false]
    required_parameter: enable_expert_parallel
    required_op: eq
    required_value: true
  - id: eager_conflicts_with_npugraph
    kind: mutually_exclusive_true
    parameters:
      - speculative_config__enforce_eager
      - additional_config__ascend_compilation_config__enable_npugraph_ex
  - id: mix_placement_conflicts_with_shared_expert_dp
    kind: mutually_exclusive_true
    parameters:
      - additional_config__mix_placement
      - additional_config__enable_shared_expert_dp
  - id: torch_compile_disable_conflicts_with_compilation
    kind: forbidden_pair
    left: {parameter: TORCH_COMPILE_DISABLE, value: "1"}
    right: {parameter: compilation_config__mode, not_in: [null, 0]}

# Search-space construction is a Session-level choice, just like Agent and
# Benchmark profiles. The selected definition is frozen into session_config.yaml.
default_profile: automatic_registry_a8_frontier_v4

profiles:
  curated_registry_v1:
    status: integrated
    mode: curated_registry
    purpose: >-
      Preserve the reviewed curated registry and its historical experiment
      comparability. Tags recall and the compiler are automatic, while registry
      membership and injection contracts remain human curated.
    knowledge_dir: tag_params/output/params
    scenario: workflow/search_space_compiler/scenario.glm52-a3-aligned-l1.yaml
    registry: workflow/search_space_compiler/registry.yaml
    policy: workflow/search_space_compiler/policy.yaml
    activation:
      target_count: 15
      maximum_count: 18
      max_per_category: 5
      additional_core_parameters:
        - fused_mc2
        - enable_balance_scheduling
        - enable_reduce_sample
        - speculative_config__enforce_eager
    # B0 resolves async scheduling to false. When the reviewed MTP token axis is
    # enabled later, async scheduling is its required companion rather than an
    # additional independent search dimension.
    derived_parameters:
      async_scheduling:
        drivers: [num_speculative_tokens]

  automatic_registry_v1:
    status: integrated
    mode: automatic_registry
    purpose: >-
      Build the registry from tagged portraits, pinned source evidence and a
      deterministic compatibility policy before invoking the same compiler.
    knowledge_dir: tag_params/output/params
    scenario: workflow/search_space_compiler/scenario.glm52-a3-aligned-l1.yaml
    policy: workflow/search_space_compiler/policy.yaml
    compatibility_policy: workflow/registry_builder/compatibility_policy.yaml
    source_root: ../portrait_pipeline/sources
    activation:
      # Keep the Agent schema broad enough for one-Session exploration without
      # admitting the low-ranked Ray/special-backend tail of the 102-axis pool.
      target_count: 22
      maximum_count: 26
      max_per_category: 6
      additional_core_parameters:
        - fused_mc2
        - enable_balance_scheduling
        - enable_reduce_sample
        - speculative_config__enforce_eager

  automatic_registry_a8_agentic_v2:
    status: integrated
    mode: automatic_registry
    purpose: >-
      A8-centered automatic registry with a slightly wider high-upside frontier.
      The active set grows from 22 to 26 axes, while the remaining 76 stay in
      auditable reserve instead of burdening every Agent decision.
    knowledge_dir: tag_params/output/params
    scenario: workflow/search_space_compiler/scenario.glm52-a3-aligned-l1.yaml
    policy: workflow/search_space_compiler/policy.yaml
    compatibility_policy: workflow/registry_builder/compatibility_policy.yaml
    source_root: ../portrait_pipeline/sources
    activation:
      target_count: 26
      maximum_count: 30
      max_per_category: 7
      additional_core_parameters:
        - fused_mc2
        - enable_balance_scheduling
        - enable_reduce_sample
        - speculative_config__enforce_eager
        - cudagraph_capture_sizes
        - VLLM_ASCEND_ENABLE_BATCH_MEMCPY
        - additional_config__ascend_compilation_config__fuse_allreduce_rms
        - additional_config__prefill_comm_compute_overlap
    derived_parameters:
      async_scheduling:
        drivers: [num_speculative_tokens]

  automatic_registry_a8_frontier_v3:
    status: integrated
    mode: automatic_registry
    purpose: >-
      High-risk, evidence-driven A8 frontier search. Context capacity is a
      normal tuning axis, impossible Ascend values are filtered before the
      Agent, and the next identity-matched Session may rotate up to three
      measured low-value Active axes with higher-value Reserve axes.
    knowledge_dir: tag_params/output/params
    scenario: workflow/search_space_compiler/scenario.glm52-a3-aligned-l1.yaml
    policy: workflow/search_space_compiler/policy.yaml
    compatibility_policy: workflow/registry_builder/compatibility_policy.yaml
    source_root: ../portrait_pipeline/sources
    activation:
      target_count: 28
      maximum_count: 32
      max_per_category: 8
      additional_core_parameters:
        - max_model_len
        - mlapo
        - fused_mc2
        - enable_balance_scheduling
        - enable_reduce_sample
        - speculative_config__enforce_eager
        - speculative_config__disable_padded_drafter_batch
        - speculative_config__method
        - speculative_config__attention_backend
        - cudagraph_capture_sizes
        - VLLM_ASCEND_ENABLE_BATCH_MEMCPY
        - TASK_QUEUE_ENABLE
        - additional_config__ascend_compilation_config__fuse_allreduce_rms
        - additional_config__prefill_comm_compute_overlap
        - additional_config__ascend_compilation_config__enable_static_kernel
        - additional_config__ascend_compilation_config__enable_npugraph_ex
        - additional_config__ascend_compilation_config__fuse_norm_quant
        - compilation_enable_sp
    derived_parameters:
      async_scheduling:
        drivers: [num_speculative_tokens]

  automatic_registry_a8_frontier_v4:
    status: integrated
    mode: automatic_registry
    purpose: >-
      DP4/TP8 Fast-C32 continuation space with richer useful numeric points,
      reviewed CUDAGraph shape templates, graph-safe TASK_QUEUE_ENABLE 0/1 with
      a graph-disabled value-2 diagnostic, and explicit Agent ownership of graph
      maximum and hybrid-KV policy. Chunked prefill remains fixed on because the
      64k context exceeds the scheduler token budget.
      High-risk boundary values remain available, while proven-invalid values
      are removed from the dominant graph-capture path.
    knowledge_dir: tag_params/output/params
    scenario: workflow/search_space_compiler/scenario.glm52-a3-aligned-l1.yaml
    policy: workflow/search_space_compiler/policy.yaml
    compatibility_policy: workflow/registry_builder/compatibility_policy.frontier_v4.yaml
    source_root: ../portrait_pipeline/sources
    # This continuation already exposes 30 reviewed Active axes. Do not let a
    # generic unexplored-value bonus replace them with topology/Ray Reserve axes
    # at Session creation; Reserve promotion remains a future versioned choice.
    history_rotation:
      maximum_swaps_per_session: 0
    activation:
      target_count: 30
      maximum_count: 36
      max_per_category: 10
      additional_core_parameters:
        - max_model_len
        - max_cudagraph_capture_size
        - cudagraph_capture_sizes
        - disable_hybrid_kv_cache_manager
        - mlapo
        - fused_mc2
        - enable_balance_scheduling
        - enable_reduce_sample
        - speculative_config__enforce_eager
        - speculative_config__disable_padded_drafter_batch
        - speculative_config__method
        - speculative_config__attention_backend
        - VLLM_ASCEND_ENABLE_BATCH_MEMCPY
        - TASK_QUEUE_ENABLE
        - additional_config__ascend_compilation_config__fuse_allreduce_rms
        - additional_config__prefill_comm_compute_overlap
        - additional_config__ascend_compilation_config__enable_static_kernel
        - additional_config__ascend_compilation_config__enable_npugraph_ex
        - additional_config__ascend_compilation_config__fuse_norm_quant
        - compilation_enable_sp
    derived_parameters:
      async_scheduling:
        drivers: [num_speculative_tokens]

  automatic_registry_decode_only_v1:
    # "integrated" means the Search-Limits compiler may resolve it. It still
    # has no runtime allowlist binding and therefore cannot hot-enter an old
    # Session or launch without a new decode-only runtime profile.
    status: integrated
    mode: automatic_registry
    purpose: >-
      Isolated DP4/TP8 decode-256-2048 search. Measured switches are frozen at
      the expert baseline, eleven high-dimensional axes receive the main
      budget, and three additional uncertain switches remain available for
      explicit coupling hypotheses. Chunked prefill true/false is admitted only because
      the Controller revalidates it against each model-length/token-budget pair.
      Upstream and Ascend-native EPLB remain separate semantic surfaces.
    knowledge_dir: tag_params/output/params
    scenario: workflow/search_space_compiler/scenario.glm52-a3-dp4-tp8-decode-only-v1.yaml
    policy: workflow/search_space_compiler/policy.yaml
    compatibility_policy: workflow/registry_builder/compatibility_policy.decode_only_v1.yaml
    source_root: ../portrait_pipeline/sources
    history_rotation:
      maximum_swaps_per_session: 0
    # These upstream CLI fields use reliable false/0 source defaults. Omitting
    # them means the launcher emits neither --enable-eplb nor --eplb-config;
    # they remain visible only in the source capability/audit registry.
    implicit_source_defaults:
      enable_eplb: false
      eplb_num_redundant_experts: 0
      # Inert in this exact runtime: MLAPO requires a non-A5 decode-only KV
      # consumer; batch memcpy is selected while building the extension and
      # needs KV offload; fuse_norm_quant is not consumed by npugraph_ex=true.
      mlapo: true
      VLLM_ASCEND_ENABLE_BATCH_MEMCPY: null
      additional_config__ascend_compilation_config__fuse_norm_quant: true
    activation:
      target_count: 14
      maximum_count: 14
      max_per_category: 10
      additional_core_parameters:
        # List 2: main high-dimensional search axes.
        - num_speculative_tokens
        - cudagraph_capture_sizes
        - max_cudagraph_capture_size
        - max_num_seqs
        - max_num_batched_tokens
        - gpu_memory_utilization
        - max_model_len
        - compilation_mode
        - disable_hybrid_kv_cache_manager
        - speculative_config__attention_backend
        - speculative_config__enforce_eager
        # List 1.3: additional conditional axes. They are legal but the Agent must
        # cite a coupling hypothesis before spending a round on them.
        - enable_chunked_prefill
        - enable_balance_scheduling
        - enable_reduce_sample
    derived_parameters: {}

  automatic_registry_decode_priority_v2:
    status: integrated
    mode: automatic_registry
    purpose: >-
      Decode-only priority search. List 2 high-dimensional axes are the main
      search surface; List 1.3 receives compact required coverage, while List
      1.2/1.1 switches remain available only for evidence-backed optional
      cross-layer revisits.
      Failure recovery may use the complete validated Active schema regardless
      of the normal performance-search phase.
    knowledge_dir: tag_params/output/params
    scenario: workflow/search_space_compiler/scenario.glm52-a3-dp4-tp8-decode-only-v1.yaml
    policy: workflow/search_space_compiler/policy.yaml
    compatibility_policy: workflow/registry_builder/compatibility_policy.decode_priority_v2.yaml
    source_root: ../portrait_pipeline/sources
    history_rotation:
      maximum_swaps_per_session: 0
    implicit_source_defaults:
      enable_eplb: false
      eplb_num_redundant_experts: 0
      mlapo: true
      VLLM_ASCEND_ENABLE_BATCH_MEMCPY: null
      speculative_config__attention_backend: null
    activation:
      target_count: 25
      maximum_count: 28
      max_per_category: 12
      additional_core_parameters:
        # List 2 main axes (9). The explicit speculative FLASH_ATTN selector is
        # fixed to null because this profile does not enable the batch-invariant
        # FA3 prerequisites; searching it would normally reproduce auto-selection.
        - num_speculative_tokens
        - cudagraph_capture_sizes
        - max_cudagraph_capture_size
        - max_num_seqs
        - max_num_batched_tokens
        - gpu_memory_utilization
        - max_model_len
        - compilation_mode
        - disable_hybrid_kv_cache_manager
        # List 1.3 required conditional axes (4).
        - speculative_config__enforce_eager
        - enable_chunked_prefill
        - enable_balance_scheduling
        - enable_reduce_sample
        # Optional List 1.2/1.1 axes (12); stage/quota enforcement belongs to strategy.
        - async_scheduling
        - enable_expert_parallel
        - fused_mc2
        - flashcomm1
        - enable_prefix_caching
        - TASK_QUEUE_ENABLE
        - speculative_config__disable_padded_drafter_batch
        - additional_config__prefill_comm_compute_overlap
        - additional_config__ascend_compilation_config__enable_static_kernel
        - additional_config__ascend_compilation_config__enable_npugraph_ex
        - additional_config__ascend_compilation_config__fuse_allreduce_rms
        - additional_config__ascend_compilation_config__fuse_norm_quant
    derived_parameters: {}

  automatic_registry_glm52_w4a8c8_v1:
    status: integrated
    mode: automatic_registry
    purpose: >-
      Independent automatic Search Limits for GLM-5.2-W4A8C8 on one A3 node,
      anchored at the existing tuned A0 without inheriting W8A8 history.
    knowledge_dir: tag_params/output/params
    scenario: workflow/search_space_compiler/scenario.glm52-w4a8c8-a3-single-aligned-l1.yaml
    policy: workflow/search_space_compiler/policy.yaml
    compatibility_policy: workflow/registry_builder/compatibility_policy.yaml
    source_root: ../portrait_pipeline/sources
    activation:
      target_count: 24
      maximum_count: 28
      max_per_category: 7
      additional_core_parameters:
        - block_size
        - additional_config__enable_dsa_cp
        - additional_config__multistream_overlap_shared_expert
        - fused_mc2
        - enable_balance_scheduling
        - enable_reduce_sample
        - speculative_config__enforce_eager

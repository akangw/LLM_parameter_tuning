  vllm_ascend_commit: 32c8cf190f596b47f0d0b965e64aea9f2b789ad4
  parameter_portrait_exact_match: true

# A future read-only image probe can replace or extend this snapshot. Parameters
# absent here may still be proposed, but can never be auto-approved.
capabilities:
  source: existing_continuous_controller_contract_2026-07-31
  verified_canonical_parameters:
    - max_num_seqs
    - max_model_len
    - max_num_batched_tokens
    - gpu_memory_utilization
    - enable_prefix_caching
    - async_scheduling
    - enable_expert_parallel
    - enable_balance_scheduling
    - enable_reduce_sample
    - speculative_config__enforce_eager
    - compilation_mode
    - num_speculative_tokens
    - long_prefill_token_threshold

model:
  architecture: GlmMoeDsaForCausalLM
  moe: true
  mla: true
  quantized: true
  encoder_decoder: false
  uses_kv_cache: true
  # These pinned Ascend paths are not implemented for the selected GLM model.
  # A future model profile can enable them explicitly after source/runtime proof.
  mix_placement_supported: false
  shared_expert_dp_supported: false

topology:
  nodes: 2
  npu_per_node: 16
  total_npu: 32
  data_parallel_size: 2
  tensor_parallel_size: 16
  pipeline_parallel_size: 1
  worker_generation: v1

features:
  mtp: true
  pd_disaggregated: false
  kv_transfer: false
  lora: false
  hierarchy_communication: false
  dynamic_eplb: false

  # 64k context. A future short-context profile may explicitly set this true.
  chunked_prefill_disable_safe: false

benchmark:
  mode: aligned_l1
  primary_concurrency: 32
  maximum_input_tokens: 8192
  maximum_output_tokens: 2048


规范版本: servebench-suite-v1
测试:
  名称: Decode单场景调优稳定版
  标识: tuning-decode-only-c32-v2
  版本: v2
  状态: 正式
  层级: 调优
  说明: 仅测冻结的256输入、2048输出、C32长Decode工作负载；单次Session执行三次正式测量并取中位数。
  级别: L1
请求:
  接口: /v1/completions
  温度: 0
  TopP: 1
  忽略结束符: true
  失败重试次数: 0
  随机种子: 42
工作负载:
- 名称: 长内容生成
  标识: decode-256-2048
  用途: [代码与推理输出, Decode压力, MTP收益]
  数据:
    类型: 冻结JSONL
    输入Token数: 256
    输出Token数: 2048
    清单: datasets/tuning-structured-decode-256-2048-v1/manifest.json
  提示词模式: 唯一提示词
阶段:
- 名称: Decode C32主目标
  标识: core-fixed-matrix
  类型: 固定并发
  工作负载: [decode-256-2048]
  缓存状态: 不适用
  Case角色: 正式测量
  最大错误数: 1
  测试点:
  - 并发: 32
    正式请求数: 64
    # V1在冻结JSONL模式下把4个预热请求编译为4个串行的2048-token
    # 请求，既耗时又无法预热C32图形状。V2删除这组无效串行预热，
    # 通过三次完整C32正式测量覆盖首轮图编译并以中位数稳健聚合。
    预热请求数: 0
    时间上限秒: 300
公平性:
- 数据集、Tokenizer、随机种子、温度、请求数和Token形状与Decode-only V1保持一致。
- 每个候选在同一服务实例上连续执行三次独立的C32正式测量，主评分取三次输出吞吐中位数。
- 每次测量允许GuideLLM 0.7.2在64请求边界记录63或64个成功请求，但必须零错误、零未完成并通过精确Token形状检查。
- 主评分只使用decode-256-2048的聚合输出吞吐。
- 报告必须同时包含输出吞吐、TTFT P50/P90和TPOT P50/P90，并保留每次重复的原始值与变异系数。
- 不使用benchmark时长作为候选硬截断条件；外层round timeout只处理失控任务。

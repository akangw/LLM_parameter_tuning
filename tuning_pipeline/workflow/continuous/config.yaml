poll_seconds: 60
round_timeout_minutes: 750
partial_exit_grace_seconds: 120
# Unattended recovery uses per-class budgets plus one total cap. Deterministic
# invalid states still fail closed instead of burning NPU time indefinitely.
failure_recovery:
  # In autonomous production mode, budgets remain audit/selection signals but
  # do not terminate the loop. Only a proven immutable dependency may pause.
  hard_terminal_only: true
  same_candidate_retries: 6
  agent_diagnostic_retries: 2
  parameter_adjustments: 4
  total_recovery_rounds: 10
  # Recovery-only controls are deliberately separate from the performance
  # Active Search set.  They may be changed only after a failed round when

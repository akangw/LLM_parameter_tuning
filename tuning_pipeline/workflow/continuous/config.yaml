  gpu_memory_utilization: [0.92, 0.85, 0.90, 0.93, 0.95, 0.97]
  enable_prefix_caching: [false, true]
  async_scheduling: [false, true]
  enable_expert_parallel: [false, true]
  compilation_mode: [FULL_AND_PIECEWISE, FULL_DECODE_ONLY, PIECEWISE]
  num_speculative_tokens: [3, 1, 0]
  long_prefill_token_threshold: [0, 1024, 2048, 4096]
  enable_chunked_prefill: [true, false]
  max_cudagraph_capture_size: [192, 128, 256]
  # The pinned Ascend platform rejects the upstream --enable-eplb CLI. Keep
  # these fields as fixed runtime-contract values until native dynamic EPLB is
  # wired through additional_config and verified on this exact image.
  enable_eplb: [false]
  eplb_num_redundant_experts: [0]
  compilation_enable_sp: [false, true]
  # B0 starts with source-default false; true is an Agent candidate.
  flashcomm1: [false, true]
  mlapo: [true, false]
  fused_mc2: [0, 1, 2]
  enable_balance_scheduling: [false, true]
  enable_reduce_sample: [false, true]
  speculative_config__enforce_eager: [null, false, true]
  cudagraph_capture_sizes:
    # null is the B0 source resolution; the explicit profile is searchable.
    - null
    - [16, 32, 48, 64, 80, 96, 112, 128, 144, 160, 176, 192]
change_policy:
  # The selected Strategy Profile overwrites this compatibility field during
  # Controller initialization; keep the checked-in fallback aligned as well.
  strategy_version: hierarchical_agentic_frontier_v3
  max_parameters_per_round: 4
  max_grid_steps_per_parameter: 2
  max_total_grid_steps: 8
  max_candidate_reselections: 5
  adaptive:
    enabled: true
    exploration:
      preferred_parameters_per_round: [2, 4]
      max_parameters_per_round: 4
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 8
    refinement:
      preferred_parameters_per_round: [1, 2]
      max_parameters_per_round: 2
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 3
  derived_parameters:
    max_cudagraph_capture_size:
      drivers: [max_num_seqs, num_speculative_tokens]
    cudagraph_capture_sizes:
      drivers:
        - max_num_seqs
        - num_speculative_tokens
        - max_cudagraph_capture_size
  parameter_groups:
    context_capacity_geometry:
      - max_model_len
      - max_num_seqs
      - max_num_batched_tokens
      - gpu_memory_utilization
    speculative_graph:
      - num_speculative_tokens
      - max_cudagraph_capture_size
      - cudagraph_capture_sizes
    prefill:
      - enable_chunked_prefill
      - long_prefill_token_threshold
    compilation:
      - compilation_mode
      - compilation_enable_sp
    communication:
      - enable_expert_parallel
      - flashcomm1
      - mlapo
      - fused_mc2
      - enable_reduce_sample
    scheduling_balance:
      - enable_balance_scheduling
      - max_num_seqs
    draft_execution:
      - num_speculative_tokens
      - speculative_config__enforce_eager
  high_risk_parameters:
    - max_model_len
    - gpu_memory_utilization
    - compilation_mode
    - compilation_enable_sp
    - fused_mc2
    - enable_expert_parallel
    - enable_balance_scheduling
    - enable_reduce_sample
    - speculative_config__enforce_eager
  approved_high_risk_interaction_groups:
    context_capacity_geometry:
      parameters:
        - max_model_len
        - gpu_memory_utilization
        - max_num_seqs
        - max_num_batched_tokens
      maximum_parameters_per_round: 4
      policy: >-
        Agent-owned coupled experiments are allowed after explicit memory,
        scheduler-budget and workload-shape checks. OOM excludes only the exact
        conditional combination, never an individual value globally.
measurement_policy:
  minimum_successful_requests: 8
  require_zero_failed_requests: true
  minimum_throughput_gain_percent: 3.0
  maximum_ttft_regression_percent: 10.0
  maximum_tpot_regression_percent: 10.0
  aligned_l1:
    require_all_repetitions: true
    minimum_repetitions: 1
    minimum_throughput_gain_percent: 3.0
    noise_cv_multiplier: 2.0
    maximum_single_workload_throughput_regression_percent: 5.0
    maximum_ttft_p50_ratio: 1.20
    maximum_ttft_p90_ratio: 1.20
    maximum_tpot_p50_ratio: 1.15
    maximum_tpot_p90_ratio: 1.15

baseline:
  # Typed pre-launch estimates. B0-deployable passes only max_model_len=64000;
  # all other serving-performance flags remain source-resolved. After a
  # successful run, the Controller replaces model/platform-dependent estimates
  # from master.log before Agent analysis.
  max_num_seqs: 256
  max_model_len: 64000
  max_num_batched_tokens: 2048
  gpu_memory_utilization: 0.92
  enable_prefix_caching: true
  async_scheduling: false
  enable_expert_parallel: false
  compilation_mode: FULL_AND_PIECEWISE
  num_speculative_tokens: 0
  long_prefill_token_threshold: 0
  enable_chunked_prefill: true
  max_cudagraph_capture_size: 256
  enable_eplb: false
  eplb_num_redundant_experts: 0
  compilation_enable_sp: false
  # null means source/platform resolution; no capture list is passed for B0.
  cudagraph_capture_sizes: null
  # Source default is false; B0 omits --additional-config altogether.
  flashcomm1: false
  # Source defaults resolved from the pinned Ascend configuration. B0 still
  # omits --additional-config; these values define the post-B0 schema.
  mlapo: true
  fused_mc2: 0
  enable_balance_scheduling: false
  enable_reduce_sample: false
  # null and false are both falsey for the draft proposer; null preserves B0.

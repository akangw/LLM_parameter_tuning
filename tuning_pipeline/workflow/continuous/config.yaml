  max_recovery_parameter_changes: 2
  recovery_parameters:
    additional_config__multistream_overlap_shared_expert:
      initial_value: false
      allowed_values: [false, true]
      injection:
        kind: json_path
        path: [additional_config, multistream_overlap_shared_expert]

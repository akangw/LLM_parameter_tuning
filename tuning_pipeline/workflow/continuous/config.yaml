# Search-space construction is selected and frozen exactly like Agent and
# Search-Space profiles. The server-authoritative default is the independently
# generated automatic registry; the reviewed curated registry remains opt-in.
search_space:
  profile: automatic_registry_a8_frontier_v4
  profiles_file: workflow/search_space_profiles.yaml
  # Recompile a new Session from the latest identity-matched completed history.
  # The current Session stays frozen; rotation can promote up to three Reserve
  # axes only at the next Session boundary.
  history_source: latest_completed_session
  # Used by curated_registry_v1 for entries marked planned. Automatic registry
  # entries are admitted by source, compatibility and runtime checks instead.
  approved_planned_parameters:
    - enable_chunked_prefill
    - max_cudagraph_capture_size
    - compilation_enable_sp
    - cudagraph_capture_sizes
    - flashcomm1
    - mlapo
    - fused_mc2
    - enable_balance_scheduling
    - enable_reduce_sample
    - speculative_config__enforce_eager


# Strategy profiles are deliberately separate from config.yaml. The live
# controller freezes the selected profile into each Session.
default_strategy: hierarchical_agentic_guided_v5

strategies:
  decode_priority_agentic_v1:
    extends: hierarchical_agentic_guided_v5
    status: integrated
    purpose: >-
      Decode-only expert-anchor strategy. First measure the List 1 expert
      switches plus the measured List 2 anchor unchanged. If startup fails,
      normal autonomous failure recovery may change any validated Active
      parameter or evidence-gated Recovery Registry parameter. After a healthy
      baseline, spend the main budget on high-dimensional List 2 geometry,
      require compact coverage of conditional List 1.3 axes, and leave List
      1.2/1.1 revisits to evidence-backed Agent judgment during cross-layer work.
    structured_candidate_guidance:
      cudagraph_capture_sizes:
        decision_owner: agent
        semantics: frozen_categorical_shape_template
        required_checks:
          - nonempty_positive_integer_list_when_explicit_graph_capture_is_used
          - maximum_matches_max_cudagraph_capture_size
          - full_graph_mtp_k_gt_one_sizes_are_multiples_of_k_plus_one
          - effective_sequence_parallel_list_retains_at_least_one_tp_multiple
        normalization_notes:
          - vllm_sorts_and_deduplicates_explicit_sizes
          - ascend_filters_non_tp_sequence_parallel_sizes
          - full_decode_only_filters_unreachable_decode_sizes
        normal_mode: graph_enabled
        graph_disabled_mode: diagnostic_ablation_only
      mtp_graph_joint_experiment:
        encouraged: true
        parameters:
          - num_speculative_tokens
          - cudagraph_capture_sizes
          - max_cudagraph_capture_size
          - compilation_mode
          - max_num_seqs
        maximum_independent_parameters: 4
        intent: Let the Agent choose coherent K, graph mode and capture coverage jointly.
    measurement_policy:
      latency_guardrail_mode: advisory
      aligned_l1:
        latency_guardrail_mode: advisory
        minimum_throughput_gain_percent: 1.0
        maximum_single_workload_throughput_regression_percent: 100.0
        confirmation:
          enabled: true
          upper_gain_percent: 3.0
          required_successful_measurements: 2
    exploration:
      independent_parameters_per_round: [1, 4]
      max_grid_steps_per_parameter: 3
      max_total_grid_steps: 10
    priority_search:
      baseline_must_be_measured_first: true
      failure_recovery_bypasses_phase_priority: true
      primary_label: list2_high_dimensional_axes
      primary_parameters:
        - num_speculative_tokens
        - cudagraph_capture_sizes
        - max_cudagraph_capture_size
        - max_num_seqs
        - max_num_batched_tokens
        - gpu_memory_utilization
        - max_model_len
        - compilation_mode
        - disable_hybrid_kv_cache_manager
      conditional_label: list1_3_required_conditional_axes
      conditional_parameters:
        - speculative_config__enforce_eager
        - enable_chunked_prefill
        - enable_balance_scheduling
        - enable_reduce_sample
      secondary_label: list1_2_then_list1_1_optional_revisit
      secondary_parameters:
        - enable_prefix_caching
        - TASK_QUEUE_ENABLE
        - speculative_config__disable_padded_drafter_batch
        - additional_config__prefill_comm_compute_overlap
        - additional_config__ascend_compilation_config__enable_static_kernel
        - async_scheduling
        - enable_expert_parallel
        - fused_mc2
        - flashcomm1
        - additional_config__ascend_compilation_config__enable_npugraph_ex
        - additional_config__ascend_compilation_config__fuse_allreduce_rms
        - additional_config__ascend_compilation_config__fuse_norm_quant
      secondary_groups:
        list1_2_default_off_optional:
          - enable_prefix_caching
          - TASK_QUEUE_ENABLE
          - speculative_config__disable_padded_drafter_batch
          - additional_config__prefill_comm_compute_overlap
          - additional_config__ascend_compilation_config__enable_static_kernel
        list1_1_default_on_optional:
          - async_scheduling
          - enable_expert_parallel
          - fused_mc2
          - flashcomm1
          - additional_config__ascend_compilation_config__enable_npugraph_ex
          - additional_config__ascend_compilation_config__fuse_allreduce_rms
          - additional_config__ascend_compilation_config__fuse_norm_quant
      secondary_successful_measurement_cap: 4
      rationale: >-
        List 2 is the main search budget and List 1.3 receives mandatory compact
        coverage. List 1.2 and List 1.1 are never mandatory: the Agent may spend
        up to four successful cross-layer measurements on them, preferring List
        1.2 before List 1.1 when evidence supports a high-upside interaction.
        Every such proposal needs a mechanism hypothesis, history or portrait
        evidence, constraint checks and expected payoff. Failed recovery rounds
        do not consume this performance-search quota.
    hierarchy:
      selection_contract: controller_selects_layer_agent_selects_experiment
      cross_layer_selection: agent_autonomous
      controller_candidate_parameter_selection: disabled
      coupling_hints_are_binding: false
      promising_incremental_gain_percent: 0.0
      ordered_probes:
        - name: list2_capacity_geometry
          order: 1
          parameter_selection_owner: agent
          independent_parameters_per_round: [2, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 2
          maximum_successful_measurements: 3
          parameters:
            - max_model_len
            - gpu_memory_utilization
            - max_num_seqs
            - max_num_batched_tokens
          coupling_hints:
            - parameters: [max_model_len, gpu_memory_utilization, max_num_seqs, max_num_batched_tokens]
              hypothesis: Jointly approach the KV/scheduler saturation boundary instead of sweeping four axes independently.
          intent: Establish the fastest stable decode capacity and memory envelope.
        - name: list2_mtp_graph_joint
          order: 2
          parameter_selection_owner: agent
          independent_parameters_per_round: [2, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 2
          maximum_successful_measurements: 4
          parameters:
            - num_speculative_tokens
            - compilation_mode
            - cudagraph_capture_sizes
            - max_cudagraph_capture_size
          coupling_hints:
            - parameters: [num_speculative_tokens, compilation_mode, cudagraph_capture_sizes, max_cudagraph_capture_size]
              hypothesis: K changes the decode query shape, so graph coverage should be selected jointly.
          intent: Search the highest-upside MTP and graph-shape combinations.
        - name: list2_scheduler_capacity_refinement
          order: 3
          parameter_selection_owner: agent
          independent_parameters_per_round: [1, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - disable_hybrid_kv_cache_manager
            - max_num_seqs
            - max_num_batched_tokens
            - gpu_memory_utilization
          coupling_hints:
            - parameters: [disable_hybrid_kv_cache_manager, max_model_len, gpu_memory_utilization, max_num_seqs]
              hypothesis: KV policy value appears only under meaningful capacity pressure.
          intent: Refine the scheduler-capacity and KV envelope after the main geometry is measured.
        - name: list1_3_conditional_switches
          order: 4
          parameter_selection_owner: agent
          independent_parameters_per_round: [1, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 2
          maximum_successful_measurements: 3
          parameters:
            - enable_chunked_prefill
            - enable_balance_scheduling
            - enable_reduce_sample
            - speculative_config__enforce_eager
          coupling_hints:
            - parameters: [enable_chunked_prefill, max_model_len, max_num_batched_tokens]
              hypothesis: Chunking value depends on the model-length and token-budget legality boundary.
            - parameters: [enable_balance_scheduling, max_num_seqs, gpu_memory_utilization]
              hypothesis: DP balancing value depends on queue and memory saturation.
            - parameters: [enable_reduce_sample, num_speculative_tokens]
              hypothesis: Sampling-communication savings can change with accepted speculative width.
            - parameters: [speculative_config__enforce_eager, num_speculative_tokens, compilation_mode]
              hypothesis: Speculative eager execution is useful only at a graph-compatibility boundary.
          intent: >-
            Obtain compact evidence for the four conditional switches after the
            List 2 basin is known. The Agent chooses single or coupled changes;
            hints are non-binding and List 2 companions remain allowed.
    autonomous_cross_layer:
      decision_owner: agent
      controller_supplies:
        - per_layer_measurement_summary
        - complete_active_whitelist
        - attempted_combinations
        - conditional_failure_exclusions
        - parameter_portraits_and_constraints
        - best_accepted_anchor
        - measured_exploration_budget_state
        - priority_search_budget_state
      controller_must_not_supply: preselected_candidate_layer_or_parameters
      objectives:
        - exploit the best measured List 2 basin with coherent local moves
        - compose high-upside List 2 cross-layer combinations humans rarely test
        - continue evidence-backed List 1.3 interactions where they remain promising
        - optionally test List 1.2 before List 1.1 when a concrete coupling hypothesis justifies it
        - test fuse_norm_quant only with enable_npugraph_ex=false, where the pinned compiler actually consumes it
        - require mechanism, history or portrait evidence, constraint checks and expected payoff for every high-risk proposal
        - avoid blind random combinations, independent switch rescans and exact repeated failed candidates
      exploration_budget:
        programmatic_tracking: true
        agent_final_choice: true
        exploitation_fraction: 0.60
        cross_layer_interaction_fraction: 0.30
        frontier_novelty_fraction: 0.10
    completion_gate:
      enabled: true
      require_all_ordered_probes: true
      minimum_cross_layer_successful_measurements: 8
      post_floor_stop_requirements:
        - no_promising_untested_list2_hypothesis_remains
        - list1_3_results_are_sufficiently_resolved_or_consistently_negative
        - optional_list1_2_and_list1_1_opportunities_were_assessed_and_any_skip_is_explained
        - remaining_frontier_uncertainty_is_unlikely_to_repay_another_measurement
      rationale: >-
        Require compact List 2 and List 1.3 coverage plus eight autonomous
        cross-layer measurements before normal completion. List 1.2/1.1 remain
        optional, and reaching this floor only permits completion: the Agent
        should continue while justified untested hypotheses or meaningful
        frontier uncertainty remain. Startup failures and incomplete benchmark
        rounds do not satisfy this floor.

  hierarchical_agentic_guided_v5:
    extends: hierarchical_agentic_guided_v4
    status: integrated
    purpose: >-
      Versioned continuation of Guided V4 for the richer Frontier-V4 candidate
      language. Layers still guide coverage and the Agent still owns parameter
      count, exact parameters, values and cross-layer experiments. V5 adds
      explicit MTP/CUDAGraph shape ownership and keeps graph-disabled execution
      diagnostic-only while preserving bounded high-risk exploration.
    structured_candidate_guidance:
      cudagraph_capture_sizes:
        decision_owner: agent
        semantics: categorical_shape_template
        required_checks:
          - strictly_increasing_unique_positive_integers
          - maximum_matches_max_cudagraph_capture_size
          - full_graph_mtp_sizes_are_multiples_of_k_plus_one
          - sequence_parallel_sizes_are_multiples_of_tensor_parallel_size
          - full_decode_only_maximum_is_reachable_by_scheduler_decode_capacity
        normal_mode: graph_enabled
        graph_disabled_mode: diagnostic_ablation_only
      mtp_graph_joint_experiment:
        encouraged: true
        parameters:
          - num_speculative_tokens
          - cudagraph_capture_sizes
          - max_cudagraph_capture_size
          - max_num_batched_tokens
        maximum_independent_parameters: 4
        intent: >-
          Let the Agent jointly select K, a K+1-compatible graph template and
          its bound; include scheduler budget only when the K change requires
          or strongly motivates it.
      task_queue:
        graph_enabled_values: [0, 1]
        graph_disabled_diagnostic_values: [2]
        value_2_requires:
          compilation_mode: NONE
          cudagraph_capture_sizes: null
      coupled_domain_policy:
        defer_baseline_only_pruning: true
        controller_validates_complete_candidate: true
    completion_gate:
      enabled: true
      require_all_ordered_probes: true
      minimum_cross_layer_successful_measurements: 4
      rationale: >-
        The Agent cannot terminate during compact layer coverage or before four
        successful autonomous cross-layer measurements. Failed startup and
        incomplete benchmark rounds never satisfy this evidence floor.

  hierarchical_agentic_guided_v4:
    status: integrated
    purpose: >-
      Dependency-ordered layers with Agent-owned experiments. The Controller
      selects only the current semantic layer; the Agent owns the parameter
      count, exact parameters, values and any justified companions. Coupling
      hints are non-binding. After compact one-or-two-measurement coverage, the
      Agent autonomously composes evidence-backed cross-layer and frontier
      experiments while deterministic filters reject only impossible, conflicting
      or exactly repeated failed configurations.
    topology_stage:
      order: 0
      mode: outer_session
      planner: workflow/continuous/topology_advisor.py
      decision_owner: agent
      controller_role: feasibility_filter_identity_freeze_and_metrics_gate
      requires_new_session_per_topology: true
      completion_rule: >-
        Continue only after one validated topology remains or the Agent selects
        the highest-value gate-passed topology from comparable Session metrics.
    measurement_policy:
      latency_guardrail_mode: advisory
      aligned_l1:
        latency_guardrail_mode: advisory
        minimum_throughput_gain_percent: 3.0
        maximum_single_workload_throughput_regression_percent: 5.0
    exploration:
      independent_parameters_per_round: [1, 4]
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 8
    hierarchy:
      selection_contract: controller_selects_layer_agent_selects_experiment
      cross_layer_selection: agent_autonomous
      controller_candidate_parameter_selection: disabled
      coupling_hints_are_binding: false
      promising_incremental_gain_percent: 0.0
      ordered_probes:
        - name: context_capacity_geometry
          order: 1
          parameter_selection_owner: agent
          independent_parameters_per_round: [2, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - max_model_len
            - gpu_memory_utilization
            - max_num_seqs
            - max_num_batched_tokens
          coupling_hints:
            - parameters: [max_model_len, gpu_memory_utilization]
              hypothesis: Context reservation and usable KV-pool headroom interact.
            - parameters: [max_num_seqs, max_num_batched_tokens]
              hypothesis: Concurrency capacity and scheduler token budget jointly set saturation.
            - parameters: [max_model_len, gpu_memory_utilization, max_num_seqs, max_num_batched_tokens]
              hypothesis: A coherent four-axis boundary probe may converge faster than isolated sweeps.
          intent: >-
            Establish a workload-valid context and memory/scheduler operating
            envelope before changing execution features. The Agent may choose
            any coherent one-to-four parameter experiment in this layer.
        - name: speculative_decode_path
          order: 2
          parameter_selection_owner: agent
          independent_parameters_per_round: [2, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - num_speculative_tokens
            - speculative_config__method
            - async_scheduling
            - speculative_config__attention_backend
            - speculative_config__disable_padded_drafter_batch
            - speculative_config__enforce_eager
            - enable_reduce_sample
          coupling_hints:
            - parameters: [num_speculative_tokens, async_scheduling]
              hypothesis: Draft depth changes scheduler pressure and must preserve the valid async path.
            - parameters: [num_speculative_tokens, speculative_config__attention_backend, speculative_config__disable_padded_drafter_batch]
              hypothesis: Drafter depth, attention implementation and padding jointly affect acceptance and decode cost.
          diagnostic_ablation:
            maximum_per_session: 1
            trigger: explicit_hypothesis_only
            dominant_mode:
              speculative_config__method: mtp
              async_scheduling: true
              num_speculative_tokens: [1, 3]
          intent: >-
            Keep MTP dominant in normal experiments and let the Agent jointly
            optimize draft depth, scheduling, drafter shape and sampling path.
        - name: prefill_kv_scheduler
          order: 3
          parameter_selection_owner: agent
          independent_parameters_per_round: [2, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - enable_prefix_caching
            - enable_chunked_prefill
            - long_prefill_token_threshold
            - disable_hybrid_kv_cache_manager
          coupling_hints:
            - parameters: [enable_chunked_prefill, long_prefill_token_threshold, max_num_batched_tokens]
              hypothesis: Chunking threshold and token budget control long-prefill scheduling together.
            - parameters: [enable_prefix_caching, disable_hybrid_kv_cache_manager, gpu_memory_utilization]
              hypothesis: KV policy value depends on cache layout and available pool headroom.
          intent: >-
            Optimize long-input prefill, KV reuse and scheduler behavior after
            the basic capacity envelope and MTP path have measurements.
        - name: compilation_and_graph_shape
          order: 4
          parameter_selection_owner: agent
          independent_parameters_per_round: [2, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - compilation_mode
            - compilation_enable_sp
            - max_cudagraph_capture_size
            - cudagraph_capture_sizes
            - additional_config__ascend_compilation_config__enable_npugraph_ex
            - additional_config__ascend_compilation_config__enable_static_kernel
          coupling_hints:
            - parameters: [compilation_mode, cudagraph_capture_sizes, max_num_seqs]
              hypothesis: Graph mode and captured shapes should cover the measured concurrency envelope.
            - parameters: [additional_config__ascend_compilation_config__enable_npugraph_ex, additional_config__ascend_compilation_config__enable_static_kernel]
              hypothesis: Ascend graph and static-kernel switches alter compatible execution paths together.
          intent: >-
            Align compilation mode and graph shape coverage with the already
            measured scheduler, MTP and concurrency operating region.
        - name: moe_routing_and_balance
          order: 5
          parameter_selection_owner: agent
          independent_parameters_per_round: [2, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - enable_expert_parallel
            - enable_eplb
            - eplb_num_redundant_experts
            - enable_balance_scheduling
          coupling_hints:
            - parameters: [enable_expert_parallel, enable_eplb, eplb_num_redundant_experts]
              hypothesis: Expert placement, balancing and redundancy form one constrained routing system.
            - parameters: [enable_expert_parallel, enable_balance_scheduling, gpu_memory_utilization]
              hypothesis: Routing balance can trade communication against memory headroom.
          intent: >-
            Let the Agent test MoE execution and balancing only with explicit
            prerequisites, memory evidence and topology-aware reasoning.
        - name: ascend_communication_and_fusion_kernels
          order: 6
          parameter_selection_owner: agent
          independent_parameters_per_round: [2, 4]
          minimum_independent_parameters: 1
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - flashcomm1
            - mlapo
            - fused_mc2
            - VLLM_ASCEND_ENABLE_BATCH_MEMCPY
            - TASK_QUEUE_ENABLE
            - additional_config__ascend_compilation_config__fuse_allreduce_rms
            - additional_config__ascend_compilation_config__fuse_norm_quant
            - additional_config__prefill_comm_compute_overlap
          coupling_hints:
            - parameters: [fused_mc2, flashcomm1, additional_config__ascend_compilation_config__fuse_allreduce_rms]
              hypothesis: Communication and collective fusion paths can interact nonlinearly.
            - parameters: [TASK_QUEUE_ENABLE, VLLM_ASCEND_ENABLE_BATCH_MEMCPY, additional_config__prefill_comm_compute_overlap]
              hypothesis: Queueing, memcpy and overlap jointly shape host/device pipeline efficiency.
            - parameters: [mlapo, additional_config__ascend_compilation_config__fuse_norm_quant]
              hypothesis: Fused model kernels may expose gains or runtime-specific incompatibilities.
          intent: >-
            Explore difficult Ascend queue, communication and fused-kernel
            interactions after upstream execution choices are measured.
    autonomous_cross_layer:
      decision_owner: agent
      controller_supplies:
        - per_layer_measurement_summary
        - complete_active_whitelist
        - attempted_combinations
        - conditional_failure_exclusions
        - parameter_portraits_and_constraints
        - best_accepted_anchor
        - measured_exploration_budget_state
      controller_must_not_supply: preselected_candidate_layer_or_parameters
      objectives:
        - converge quickly by exploiting the strongest measured basin
        - compose historically supported cross-layer interactions for larger gains
        - reserve meaningful rounds for risky high-upside combinations humans rarely test
        - avoid evidence-free bundles and exact repeated failed configurations
      exploration_budget:
        programmatic_tracking: true
        agent_final_choice: true
        exploitation_fraction: 0.55
        cross_layer_interaction_fraction: 0.30
        frontier_novelty_fraction: 0.15
    local_refinement:
      independent_parameters_per_round: [1, 4]
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 8

  hierarchical_agentic_frontier_v3:
    status: integrated
    purpose: >-
      Topology-first, high-risk A8 frontier search. Impossible combinations are
      rejected deterministically, while the Agent may compose evidence-backed
      two-to-four parameter interactions. Context capacity is tunable, exact
      failed combinations are remembered conditionally, and cross-layer budget
      usage is measured by the Controller without preselecting the next layer.
    topology_stage:
      order: 0
      mode: outer_session
      planner: workflow/continuous/topology_advisor.py
      decision_owner: agent
      controller_role: feasibility_filter_identity_freeze_and_metrics_gate
      requires_new_session_per_topology: true
      completion_rule: >-
        Continue only after one validated topology remains or the Agent selects
        the highest-value gate-passed topology from comparable Session metrics.
    measurement_policy:
      latency_guardrail_mode: advisory
      aligned_l1:
        latency_guardrail_mode: advisory
        minimum_throughput_gain_percent: 3.0
        maximum_single_workload_throughput_regression_percent: 5.0
    exploration:
      independent_parameters_per_round: [1, 4]
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 8
    hierarchy:
      cross_layer_selection: agent_autonomous
      controller_candidate_layer_selection: disabled
      promising_incremental_gain_percent: -2.0
      ordered_probes:
        - name: context_capacity_geometry
          independent_parameters_per_round: [2, 4]
          minimum_successful_measurements: 2
          maximum_successful_measurements: 3
          parameters:
            - max_model_len
            - gpu_memory_utilization
            - max_num_seqs
            - max_num_batched_tokens
            - long_prefill_token_threshold
          interaction_plan:
            - [max_model_len, gpu_memory_utilization]
            - [max_num_seqs, max_num_batched_tokens]
            - [max_model_len, gpu_memory_utilization, max_num_seqs, max_num_batched_tokens]
          intent: >-
            First map context and memory headroom, then scheduler capacity, then
            compose their best evidence-backed pair into a four-axis frontier
            experiment. OOM is useful evidence for that exact combination.
        - name: speculative_decode_path
          independent_parameters_per_round: [1, 3]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - num_speculative_tokens
            - speculative_config__method
            - async_scheduling
            - speculative_config__attention_backend
            - speculative_config__disable_padded_drafter_batch
            - speculative_config__enforce_eager
          diagnostic_ablation:
            maximum_per_session: 1
            trigger: explicit_hypothesis_only
            dominant_mode:
              speculative_config__method: mtp
              async_scheduling: true
              num_speculative_tokens: [1, 3]
          intent: >-
            Keep the proven MTP path dominant, refine valid TP16 draft depths and
            Ascend-supported draft attention, and permit at most one explicit
            MTP-off diagnostic rather than repeatedly rediscovering the obvious.
        - name: prefill_kv_scheduler
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - enable_prefix_caching
            - enable_chunked_prefill
            - long_prefill_token_threshold
            - disable_hybrid_kv_cache_manager
          intent: Explore long-input scheduling and KV policy against the frozen workload evidence.
        - name: compilation_and_graph_shape
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - compilation_mode
            - compilation_enable_sp
            - max_cudagraph_capture_size
            - cudagraph_capture_sizes
            - additional_config__ascend_compilation_config__enable_npugraph_ex
            - additional_config__ascend_compilation_config__enable_static_kernel
          intent: Tune graph mode, shape coverage and Ascend graph switches as one constrained family.
        - name: moe_routing_and_balance
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - enable_expert_parallel
            - enable_eplb
            - eplb_num_redundant_experts
            - enable_balance_scheduling
          intent: Test expert execution and balancing only with explicit prerequisites and memory evidence.
        - name: ascend_communication_and_kernels
          independent_parameters_per_round: [1, 3]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - flashcomm1
            - mlapo
            - fused_mc2
            - enable_reduce_sample
            - VLLM_ASCEND_ENABLE_BATCH_MEMCPY
            - TASK_QUEUE_ENABLE
            - additional_config__ascend_compilation_config__fuse_allreduce_rms
            - additional_config__ascend_compilation_config__fuse_norm_quant
            - additional_config__prefill_comm_compute_overlap
          intent: Explore difficult Ascend communication, queue and fusion interactions with explicit source constraints.
    autonomous_cross_layer:
      decision_owner: agent
      controller_supplies:
        - per_layer_measurement_summary
        - complete_active_whitelist
        - attempted_combinations
        - conditional_failure_exclusions
        - parameter_portraits_and_constraints
        - best_accepted_anchor
        - measured_exploration_budget_state
      controller_must_not_supply: preselected_candidate_layer
      objectives:
        - exploit the strongest measured basin with small local moves
        - reserve measured rounds for untested high-upside cross-layer interactions
        - promote frontier novelty without repeating evidence-free directions
      exploration_budget:
        programmatic_tracking: true
        agent_final_choice: true
        exploitation_fraction: 0.65
        cross_layer_interaction_fraction: 0.25
        frontier_novelty_fraction: 0.10
    local_refinement:
      independent_parameters_per_round: [1, 2]
      max_grid_steps_per_parameter: 1
      max_total_grid_steps: 2

  hierarchical_agentic_topology_v2:
    status: integrated
    purpose: >-
      Topology-first, expert-baseline search. Topology is selected by the Agent
      outside the serving-parameter Session after deterministic feasibility
      filtering. Inside a Session, ordered family coverage accelerates early
      convergence; after coverage, the Agent autonomously chooses layers and
      cross-layer interactions while the Controller enforces only safety,
      identity and change-budget constraints.
    topology_stage:
      order: 0
      mode: outer_session
      planner: workflow/continuous/topology_advisor.py
      decision_owner: agent
      controller_role: feasibility_filter_identity_freeze_and_metrics_gate
      requires_new_session_per_topology: true
      completion_rule: >-
        Continue only after one validated topology remains or the Agent selects
        the highest-value gate-passed topology from comparable Session metrics.
    measurement_policy:
      latency_guardrail_mode: advisory
      aligned_l1:
        latency_guardrail_mode: advisory
        minimum_throughput_gain_percent: 3.0
        maximum_single_workload_throughput_regression_percent: 5.0
    exploration:
      independent_parameters_per_round: [1, 3]
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 7
    hierarchy:
      cross_layer_selection: agent_autonomous
      controller_candidate_layer_selection: disabled
      promising_incremental_gain_percent: -2.0
      ordered_probes:
        - name: capacity_and_memory_geometry
          independent_parameters_per_round: [2, 3]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - max_num_seqs
            - max_num_batched_tokens
            - gpu_memory_utilization
            - long_prefill_token_threshold
          intent: >-
            Establish the safe saturation region around A8 before changing
            execution features. Couple capacity and memory only when the
            hypothesis explains the expected queue/KV effect.
        - name: speculative_decode_path
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - num_speculative_tokens
            - async_scheduling
            - speculative_config__disable_padded_drafter_batch
            - speculative_config__enforce_eager
          intent: >-
            Refine A8's MTP path, including drafter batching and eager-mode
            interactions instead of treating speculative depth in isolation.
        - name: prefill_kv_scheduler
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - enable_prefix_caching
            - enable_chunked_prefill
            - long_prefill_token_threshold
            - disable_hybrid_kv_cache_manager
          intent: >-
            Explore prefill scheduling and KV-cache policy using the long-input
            workload as explicit evidence.
        - name: compilation_and_graph_shape
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - compilation_mode
            - compilation_enable_sp
            - max_cudagraph_capture_size
            - cudagraph_capture_sizes
            - additional_config__ascend_compilation_config__enable_npugraph_ex
            - additional_config__ascend_compilation_config__enable_static_kernel
          intent: >-
            Tune graph mode, shape coverage and Ascend graph switches as one
            constrained compilation family.
        - name: moe_routing_and_balance
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - enable_expert_parallel
            - enable_eplb
            - eplb_num_redundant_experts
            - enable_balance_scheduling
          intent: >-
            Test expert execution and balancing together only where their
            prerequisites and memory cost are explicit.
        - name: ascend_communication_and_kernels
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - flashcomm1
            - mlapo
            - fused_mc2
            - enable_reduce_sample
            - VLLM_ASCEND_ENABLE_BATCH_MEMCPY
            - additional_config__ascend_compilation_config__fuse_allreduce_rms
            - additional_config__prefill_comm_compute_overlap
          intent: >-
            Explore Ascend communication and fusion axes that are difficult to
            cover manually, with one high-risk switch per experiment unless a
            documented interaction requires a pair.
    autonomous_cross_layer:
      decision_owner: agent
      controller_supplies:
        - per_layer_measurement_summary
        - complete_active_whitelist
        - attempted_combinations
        - parameter_portraits_and_constraints
        - best_accepted_anchor
      controller_must_not_supply: preselected_candidate_layer
      objectives:
        - exploit the strongest measured basin with small local moves
        - reserve some rounds for untested high-upside cross-layer interactions
        - avoid repeating negative directions without a new interaction hypothesis
      exploration_budget:
        exploitation_fraction: 0.65
        cross_layer_interaction_fraction: 0.25
        frontier_novelty_fraction: 0.10
    local_refinement:
      independent_parameters_per_round: [1, 2]
      max_grid_steps_per_parameter: 1
      max_total_grid_steps: 2

  best_anchor_coverage_v2:
    status: integrated
    purpose: >-
      Full-matrix, best-accepted-anchor search. Every candidate runs the frozen
      aligned-L1 matrix, so its result is directly comparable with A0.
    exploration:
      independent_parameters_per_round: [2, 3]
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 6
    refinement:
      independent_parameters_per_round: [1, 2]
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 3

  best_anchor_coverage_v3:
    status: integrated
    purpose: >-
      More aggressive hierarchical parameter-selection policy. It prefers
      coupled 2-3 parameter probes and tighter local refinement. Every submitted
      candidate still runs the full frozen L1 matrix; the screening helpers are
      reserved for a future reduced-cost benchmark stage.
    exploration:
      independent_parameters_per_round: [2, 3]
      minimum_independent_parameters: 2
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 6
      probe_templates:
        - name: scheduler_capacity
          parameters: [max_num_seqs, max_num_batched_tokens]
          intent: Test whether more concurrent work and token budget improve C32 throughput together.
        - name: scheduling_prefill
          parameters: [max_num_batched_tokens, long_prefill_token_threshold]
          intent: Test batching and long-prefill scheduling as one workload-aware hypothesis.
        - name: concurrency_memory
          parameters: [max_num_seqs, gpu_memory_utilization]
          intent: Test additional concurrency with an explicit memory-headroom check.
    screening:
      benchmark_mode: aligned_l1_screen
      # Four C32 formal cases plus their warmups: one representative case per
      # frozen workload. Screening is a ranking gate, never final acceptance.
      selected_cases:
        - {workload: chat-1024-256, concurrency: 32}
        - {workload: prefill-8192-512, concurrency: 32}
        - {workload: balanced-1024-1024, concurrency: 32}
        - {workload: decode-256-2048, concurrency: 32}
      require_zero_errors: true
      minimum_geomean_tps_ratio_vs_anchor: 0.99
      minimum_each_workload_tps_ratio_vs_anchor: 0.95
    full_verification:
      benchmark_mode: aligned_l1
      required_before_accepting_improvement: true
    local_refinement:
      independent_parameters_per_round: [1, 2]
      max_grid_steps_per_parameter: 1
      max_total_grid_steps: 2

  hierarchical_throughput_v1:
    status: integrated
    purpose: >-
      Session-local, throughput-first hierarchical search. It contains only
      general parameter-family priors and never imports candidates or metrics
      from another Session. High-impact feature families are tested before
      low-impact local refinement.
    measurement_policy:
      # Latency is still measured, compared, and reported, but it cannot veto
      # an otherwise valid output-throughput improvement in this profile.
      latency_guardrail_mode: advisory
      aligned_l1:
        latency_guardrail_mode: advisory
    exploration:
      independent_parameters_per_round: [1, 4]
      max_grid_steps_per_parameter: 2
      max_total_grid_steps: 10
    hierarchy:
      promising_incremental_gain_percent: -3.0
      ordered_probes:
        - name: mtp_enablement
          independent_parameters_per_round: [1, 1]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - num_speculative_tokens
            - async_scheduling
            - max_cudagraph_capture_size
            - cudagraph_capture_sizes
          intent: >-
            Test speculative decoding/MTP first, including only the scheduler
            and graph-shape companions required by the runtime constraints.
        - name: moe_communication
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters: [enable_expert_parallel, flashcomm1]
          intent: >-
            Test expert-parallel execution and its Ascend communication path
            before spending rounds on small scheduler changes.
        - name: scheduler_capacity
          independent_parameters_per_round: [2, 3]
          minimum_successful_measurements: 2
          maximum_successful_measurements: 3
          parameters: [max_num_seqs, max_num_batched_tokens, gpu_memory_utilization]
          intent: >-
            Right-size concurrency, token batching, and memory headroom as one
            throughput-capacity hypothesis.
        - name: compilation_graph
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - compilation_mode
            - compilation_enable_sp
            - max_cudagraph_capture_size
            - cudagraph_capture_sizes
          intent: >-
            Tune compilation and graph capture after the execution features
            and scheduler operating region have been established.
        - name: ascend_communication_refinement
          independent_parameters_per_round: [1, 2]
          minimum_successful_measurements: 1
          maximum_successful_measurements: 2
          parameters:
            - mlapo
            - fused_mc2
            - enable_balance_scheduling
            - enable_reduce_sample
          intent: >-
            Refine Ascend-specific communication and balancing only after the
            larger execution-path questions have measurements.
    local_refinement:
      independent_parameters_per_round: [1, 2]
      max_grid_steps_per_parameter: 1
      max_total_grid_steps: 2

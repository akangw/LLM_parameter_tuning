# Copy this file to config.local.yaml and replace every CHANGE_ME value.
# config.local.yaml is intentionally ignored by Git and is auto-detected by
# the Windows start and prepare-remote entry points.
base_config: config.yaml

# To replace ktp-lab for a NEW Session, copy and merge the separate example:
# workflow/executor_adapters/executor_adapter.example.yaml
# The production default remains execution_mode: ktp_lab.

# Optional: select one integrated Ascend model/image/topology adapter. Its
# topology, scenario, B0, Benchmark and Search-Space bindings take precedence.
# runtime:
#   adapter_file: workflow/continuous/adapters/CHANGE_ME.yaml

remote_host: CHANGE_ME_SSH_ALIAS
remote_project: /CHANGE_ME/writable/project-root

deployment:
  model_path: /CHANGE_ME/model-path
  served_model_name: CHANGE_ME_SERVED_MODEL
  service_port: 8000
  network_interface: CHANGE_ME_NETWORK_INTERFACE
  init_env_script: /CHANGE_ME/init_env.sh
  cann_env_script: /usr/local/Ascend/cann/set_env.sh

# Leave empty when speculative decoding is disabled. When it is enabled, this
# must point to the sliced MTP-only checkpoint on the target server.
mtp_draft_model: ""

lab:
  lease_name: CHANGE_ME_VERSIONED_LEASE_NAME
  output_root: /CHANGE_ME/writable/project-root/workflow/auto/lab_runs

# Portable defaults: no Codex installation and no private ServeBench required.
agent:
  provider: deepseek

# Optional Codex-Agent-over-DeepSeek route for a NEW Session. The server must
# expose `codex` in the service PATH and provide
# $CODEX_HOME/deepseek-v4-flash.config.toml. Keep provider=deepseek for the
# direct API route; select provider=codex only after preflight succeeds.
# agent:
#   provider: codex
#   providers:
#     codex:
#       command: auto
#       profile: deepseek-v4-flash
#       ephemeral: true
# A server-managed base config may be selected instead of a named profile:
#       command: /ABSOLUTE/PATH/TO/codex
#       codex_home: /ABSOLUTE/PATH/TO/.codex
#       use_user_config: true

benchmark:
  profile: vllm_bench_public_v1

search_space:
  profile: automatic_registry_v1

strategy:
  profile: best_anchor_coverage_v2

# Benchmark selection is separate from the Agent strategy. A profile chooses
# one fully configured definition from config.yaml and is frozen per Session.
default_profile: aligned_fast_c32_v2

profiles:
  decode_only_c32_v1:
    status: integrated
    mode: aligned_l1
    definition_key: aligned_l1_decode_only_v1
    purpose: >-
      Isolated decode-256-2048 C32 benchmark. Output-token throughput is the
      sole optimization score; TTFT P50/P90 and TPOT P50/P90 remain mandatory
      report metrics and request correctness remains a hard gate.

  aligned_fast_c32_v2:
    status: integrated
    mode: aligned_l1
    definition_key: aligned_l1_fast_v2
    purpose: >-
      Versioned repair of Fast-C32: four C32 workloads with complete
      throughput/TTFT/TPOT reporting and a pre-launch suite/dataset contract.

  aligned_fast_c32_v1:
    status: integrated
    mode: aligned_l1
    definition_key: aligned_l1_fast
    purpose: >-
      Fixed four-workload C32 benchmark with 64 formal requests per workload,
      explicit throughput/TTFT/TPOT reporting. Its 600-second value is planning
      metadata, not an execution cutoff.

  aligned_l1_v4:
    status: integrated
    mode: aligned_l1
    definition_key: aligned_l1
    purpose: Frozen 4-workload, 12-case Aligned-L1 acceptance benchmark.

  aligned_l1_glm52_w4a8c8_v1:
    status: integrated
    mode: aligned_l1
    definition_key: aligned_l1_w4a8c8
    purpose: Isolated Aligned-L1 identity for GLM-5.2-W4A8C8 single-node tuning.

  vllm_bench_public_v1:
    status: integrated
    mode: vllm_bench_serve
    definition_key: vllm_bench_public
    purpose: Public, dependency-free vllm bench serve profile for portable tuning.

  custom_adapter_v1:
    status: integrated
    mode: custom_adapter
    definition_key: custom_benchmark
    purpose: Operator-configured project-local benchmark using the result-v1 contract.

base_config: ../config.yaml

operation_mode: server_autonomous
remote_transport: local
remote_host: localhost
remote_project: /mnt/host-model/slai/user-1-wangakang/wangakang/cjx-workspace/vllmtkb-server-autonomous-418bd627-32c8cf190

autonomous:
  allowed_write_root: /mnt/host-model/slai/user-1-wangakang/wangakang/cjx-workspace/vllmtkb-server-autonomous-418bd627-32c8cf190

runtime:
  profile: glm52_w8a8_a3_dp4_tp8_search_v4
  profiles_file: workflow/continuous/runtime_profiles.yaml

# Parameter-only validation phase: DP4/TP8 is operator-frozen for every new
# Session. The completed V4 outer Campaign remains configured below but dormant;
# re-enable it only with its topology_campaign_v4 runtime profile and a new
# isolated runtime root after this fixed-topology chain is proven.
topology_campaign:
  enabled: false
  candidate_profiles: [a3_dp2_tp16, a3_dp4_tp8, a3_dp1_tp32]
  screen_measurements_per_topology: 3
  competitive_slice_rounds: 4
  minimum_challenger_rounds_per_slice: 1
  final_challenger_verification_rounds: 2
  maximum_competitive_cycles: 8
  maximum_candidate_index_per_topology: 24

# Freeze the autonomous experiment choices independently from the default
# Windows-to-server chain. Fixed DP4/TP8, compiled Search Limits, history and
# the measured incumbent stay inside the selected Runtime identity.
search_space:
  profile: automatic_registry_a8_frontier_v4
  history_source: latest_completed_session

strategy:
  profile: hierarchical_agentic_guided_v5

initial_baseline:
  label: incumbent_search_v4
  launch_profile: explicit_candidate
  definition: workflow/baselines/incumbent_glm52_w8a8_dp4_tp8_search_v4.yaml

agent:
  # Codex supplies the agent loop and structured tool discipline; its frozen
  # server-managed CODEX_HOME routes model inference to DeepSeek V4 Flash.
  provider: codex
  settings:
    max_protocol_retries: 4
  providers:
    # Optional NEW-Session route. It remains inactive while provider=deepseek.
    # This server-managed Codex installation and CODEX_HOME were verified with
    # a zero-NPU DeepSeek V4 Flash smoke test; no secret belongs in this YAML.
    codex:
      command: /mnt/host-model/slai/user-1-wangakang/wangakang/cjx-workspace/tools/codex/releases/0.147.0/codex
      codex_home: /mnt/host-model/slai/user-1-wangakang/wangakang/cjx-workspace/tools/codex/home
      tmp_dir: /mnt/host-model/slai/user-1-wangakang/wangakang/cjx-workspace/tools/codex/tmp
      use_user_config: true
      ephemeral: true
    deepseek:
      base_url: https://api.deepseek.com
      model: deepseek-v4-flash
      api_key_env: DEEPSEEK_API_KEY
      thinking: enabled
      reasoning_effort: high
      response_format: json_object
      max_tokens: 16384
      max_api_retries: 3

lab:
  lease_name: vllmtkb-auto-fixed-dp4tp8-v2-20260817-2x16npu
  lease_yaml: workflow/auto/lease_loop.yaml
  output_root: /mnt/host-model/slai/user-1-wangakang/wangakang/cjx-workspace/vllmtkb-server-autonomous-418bd627-32c8cf190/workflow/auto/lab_runs_fixed_dp4_tp8_v4
  # Platform rescheduling can temporarily remove both worker heartbeats between
  # rounds. Wait for 2/2 Ready instead of treating missing heartbeats as v1.
  readiness_wait_seconds: 7200
  readiness_poll_seconds: 30
  submission_readiness_retry_limit: 12
  # Autonomous mode fails closed while either existing chain owns resources.
  blocked_lease_names:
    - vllmtkb-auto-fixed-dp4tp8-v1-20260814-2x16npu
    - vllmtkb-auto-topology-v4-20260814-2x16npu
    - vllmtkb-server-auto-418bd627-32c8cf190-glm52-a3-32npu
    - vllmtkb-418bd627-32c8cf190-glm52-a3-32npu
    - vllmtkb-senior-migrated-w8a8-dp2tp16-20260806

benchmark:
  profile: aligned_fast_c32_v2
  aligned_l1_fast:
    servebench_root: /mnt/host-model/slai/user-1-wangakang/wangakang/cjx-workspace/vllmtkb-server-autonomous-418bd627-32c8cf190/workflow/auto/vendor/servebench-1.0.1-5f01dca
    spec_root: /mnt/host-model/slai/user-1-wangakang/wangakang/cjx-workspace/vllmtkb-server-autonomous-418bd627-32c8cf190/workflow/auto/vendor/benchmark-tuning-fast-c32-v1/spec
    dataset_root: /mnt/host-model/slai/user-1-wangakang/wangakang/cjx-workspace/vllmtkb-server-autonomous-418bd627-32c8cf190/workflow/auto/vendor/benchmark-tuning-fast-c32-v1/datasets
  aligned_l1_fast_v2:

schema_version: 1
default_profile: dtfs_page_cache_v1
profiles:
  # Existing behavior. This warms the Linux page cache once per node; it is
  # intentionally not described as a true NPU-weight warm start.
  dtfs_page_cache_v1:
    status: integrated
    backend: dtfs_page_cache
    load_format: auto
    require_transfer_hit: false
    safetensors_prefetch_mode: node_blocking
    safetensors_load_strategy: prefetch
    safetensors_prefetch_num_threads: 8
    safetensors_prefetch_block_size: 16777216

  # Opt-in true warm start. A compatible seed must remain alive on separate
  # Ascend capacity. Any RFork fallback is rejected before benchmarking.
  rfork_external_seed_v1:
    status: integrated
    backend: rfork
    load_format: rfork
    require_transfer_hit: true
    safetensors_prefetch_mode: disabled
    safetensors_load_strategy: lazy
    safetensors_prefetch_num_threads: 8
    safetensors_prefetch_block_size: 16777216
    model_url: glm-5.2-w8a8
    model_deploy_strategy_name: a3-dp2-tp16
    rfork_scheduler_url_env: VLLMTKB_RFORK_SCHEDULER_URL
    rfork_seed_timeout_sec: 120

  # Bootstrap role for the first instance on external matching capacity. It
  # may fall back once to storage, then registers itself with the planner.
  # Do not use this Profile when measuring client warm-start latency.
  rfork_seed_v1:
    status: integrated
    backend: rfork
    load_format: rfork
    require_transfer_hit: false
    safetensors_prefetch_mode: disabled
    safetensors_load_strategy: lazy
    safetensors_prefetch_num_threads: 8
    safetensors_prefetch_block_size: 16777216
    model_url: glm-5.2-w8a8
    model_deploy_strategy_name: a3-dp2-tp16
    rfork_scheduler_url_env: VLLMTKB_RFORK_SCHEDULER_URL
    rfork_seed_timeout_sec: 120

# B0-deployable is the online acceptance anchor for the pinned GLM-5.2 image.
# It preserves the official-source-default launch and adds exactly one measured
# compatibility override: max_model_len=64000.
schema_version: 1
baseline_id: b0-deployable-64k
status: approved_for_online_session_start

launch_profile: official_source_defaults_deployable

purpose: >-
  Retain the target image's source defaults while making the model deployable
  on the fixed 2x16-NPU topology. The model-native 1,048,576-token context
  cannot initialize its KV cache on this deployment.

target_identity:
  image: 10.1.30.201:31443/user-cdy-normal/vllm-ascend:glm5.2-a3
  image_digest: sha256:37f43036c21c80c9cc6c6656f472df0f1b79d2fce2027168d270a43d725e0305
  vllm_commit: 418bd6273c03bf48d5066733769e0a74bdc51694
  vllm_ascend_commit: 32c8cf190f596b47f0d0b965e64aea9f2b789ad4

isolation:
  controller_session: new_session_with_round_000_b0_deployable
  lease: may_reuse_an_idle_version_pinned_lease

deployment_override:
  parameter: max_model_len
  cli_flag: --max-model-len
  value: 64000
  override_count: 1
  rationale: >-
    The official model default requires 107.25 GiB of KV cache, while the
    measured deployment exposes 28.82 GiB. The fixed Aligned-L1 scenario fits
    within 64000 tokens, so this override restores deployability without adding
    a throughput optimization.

all_other_serving_parameters:
  resolution: target_image_source_defaults
  prohibited_overrides:
    - max_num_seqs
    - max_num_batched_tokens
    - gpu_memory_utilization
    - enable_prefix_caching
    - enable_chunked_prefill
    - async_scheduling
    - enable_expert_parallel
    - speculative_config
    - compilation_config
    - additional_config

deployment_invariants:
  model: /models/share/GLM-5.2-w8a8
  topology: {pods: 2, npu_per_pod: 16, data_parallel_size: 2, tensor_parallel_size: 16}
  safetensors_load_strategy: prefetch
  safetensors_prefetch_num_threads: 8
  safetensors_prefetch_block_size: 16777216

acceptance_contract:
  benchmark_profile: aligned_l1_v4
  repetitions: 3
  reconcile_source_defaults_from_master_log: true
  use_as_agent_search_anchor_only_after_metrics_gate_passes: true

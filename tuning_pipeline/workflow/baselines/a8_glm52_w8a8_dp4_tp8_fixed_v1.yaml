schema_version: 1
baseline_id: a8-glm52-w8a8-dp4-tp8-fixed-v1
status: approved_for_fixed_topology_feasibility_start
launch_profile: explicit_candidate

purpose: >-
  Start a fixed DP4/TP8 parameter-tuning Session from the proven A8 lineage.
  Only capacity, speculative depth and graph-capture headroom are reduced for
  the first live-fit measurement. After startup and Fast-C32 pass, this
  topology owns an independent Agent history and may tune those axes upward.

source:
  baseline: a8-glm52-w8a8-expert-fast-v1
  lineage_session: cjx_glm52_continuous_20260807_093620
  lineage_round: round_009_a8
  adaptation_policy:
    unchanged_a8_axes: preserve_except_the_explicit_adjustments_below
    max_num_seqs: reduce_from_256_to_64_for_initial_kv_and_graph_headroom
    gpu_memory_utilization: reduce_from_0.92_to_0.90
    num_speculative_tokens: reduce_from_3_to_1_but_keep_mtp_enabled
    graph_capture: reduce_from_192_to_64_for_first_live_fit
  evidence_policy: startup_and_fast_c32_required_before_agent_incumbent

target_identity:
  model_contract: glm-5.2-w8a8
  topology_profile: a3_dp4_tp8
  reuse_policy: never_reuse_dp2_tp16_history_or_anchor

deployment_invariants:
  model: /models/share/GLM-5.2-w8a8
  topology:
    pods: 2
    npu_per_pod: 16
    data_parallel_size: 4
    data_parallel_size_local: 2
    tensor_parallel_size: 8
    decode_context_parallel_size: 1
  max_model_len: 64000
  model_loading_backend: dtfs_page_cache
  safetensors_prefetch_mode: node_blocking

reference_parameters:
  max_num_seqs: 64
  max_num_batched_tokens: 2048
  gpu_memory_utilization: 0.90
  compilation_mode: FULL_DECODE_ONLY
  num_speculative_tokens: 1
  async_scheduling: true
  enable_expert_parallel: false
  speculative_config__method: mtp
  long_prefill_token_threshold: 0
  fused_mc2: 0
  enable_balance_scheduling: false
  enable_reduce_sample: false
  speculative_config__enforce_eager: null
  compilation_enable_sp: false
  max_cudagraph_capture_size: 64
  mlapo: true
  enable_prefix_caching: true
  flashcomm1: false
  speculative_config__disable_padded_drafter_batch: false
  additional_config__ascend_compilation_config__enable_npugraph_ex: true
  additional_config__ascend_compilation_config__enable_static_kernel: false
  disable_hybrid_kv_cache_manager: null
  max_model_len: 64000
  enable_chunked_prefill: true
  enable_eplb: false
  eplb_num_redundant_experts: 0
  cudagraph_capture_sizes: [16, 32, 48, 64]

acceptance_contract:
  benchmark_profile: aligned_fast_c32_v1
  repetitions: 1
  expected_formal_cases: 4
  target_benchmark_seconds: 600
  require_zero_failed_requests: true
  require_service_ready: true
  first_round_is_topology_feasibility_measurement: true
  use_as_initial_agent_incumbent_after_metrics_gate_passes: true

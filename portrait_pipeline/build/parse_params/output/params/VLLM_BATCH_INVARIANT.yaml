related_parameters:
- name: VLLM_ASCEND_ENABLE_NZ
  relation: When batch_invariant is enabled, async exponential is disabled which affects NZ mode behavior
- name: enable_async_exponential
  relation: Automatically disabled when VLLM_BATCH_INVARIANT is enabled
- name: disable_custom_all_reduce
  relation: Forced to True when VLLM_BATCH_INVARIANT is enabled
- name: disable_cascade_attn
  relation: Forced to True when VLLM_BATCH_INVARIANT is enabled
- name: attention_backend
  relation: FA3 requires VLLM_BATCH_INVARIANT=1 on Ascend
constraints:
- VLLM_BATCH_INVARIANT=1 requires Triton or AscendC batch-invariant ops to be available on Ascend NPU; otherwise initialization
  is skipped with a warning
- VLLM_BATCH_INVARIANT=1 is required to use FlashAttention 3 (FA3) backend on Ascend NPU
- On NVIDIA GPUs, VLLM_BATCH_INVARIANT=1 requires compute capability >= 9.0 (SM90+)
tuning_advice:
  summary: 'Only enable VLLM_BATCH_INVARIANT=1 when deterministic results across different batch sizes are strictly required
    (e.g., debugging, reproducibility testing). For production serving on Ascend NPU, keep it disabled (default) to maximize
    throughput and minimize latency.

    '
  suggested_values:
  - scenario: Production serving on Ascend NPU (default)
    value: '0'
    reason: 'Maximizes throughput and minimizes latency by allowing all optimizations: custom all-reduce, cascade attention,
      FA4, AOT scheduling, split-kernel execution, Ascend custom ops, and async exponential sampling.

      '
  - scenario: Debugging or reproducibility testing requiring deterministic output
    value: '1'
    reason: 'Ensures identical logprobs and generated tokens regardless of batch composition. Required for FlashAttention
      3 (FA3) backend on Ascend NPU.

      '
  - scenario: Using FlashAttention 3 (FA3) on Ascend NPU
    value: '1'
    reason: 'FA3 backend on Ascend NPU requires batch invariant mode to be enabled. This is a hard requirement documented
      in vllm-ascend flash_attention guide.

      '
  caveats:
  - Enabling batch invariance disables custom all-reduce, which can significantly reduce multi-GPU throughput on Ascend NPU
  - Cascade attention is disabled, reducing efficiency for mixed-length batches
  - FlashAttention is downgraded from FA4 to FA2, losing performance optimizations
  - AOT scheduling is disabled, adding runtime scheduling overhead
  - Split-kernel execution is disabled, reducing throughput for long sequences
  - All Ascend custom operators are disabled, falling back to slower generic implementations
  - Async exponential sampling is disabled, increasing sampling latency
  - FlashInfer uses larger workspace buffers, increasing memory usage
  - On Ascend 310P chips, the optimized sampling path is bypassed entirely
  - If Triton or AscendC batch-invariant ops are not available, the mode silently fails to initialize
  quick_guide: 'Set VLLM_BATCH_INVARIANT=1 only for debugging or FA3; keep it 0 for production Ascend serving.

    '

impact_detail: 'When VLLM_BATCH_INVARIANT=1, vLLM and vllm-ascend enforce deterministic computation regardless of batch composition.
  This triggers a cascade of changes across multiple subsystems that collectively reduce performance but guarantee bitwise
  reproducibility:

  1. **Custom all-reduce disabled** (vllm/config/parallel.py:919): `disable_custom_all_reduce` is forced to True, falling
  back to standard NCCL/HCCL all-reduce which is slower than custom all-reduce kernels.

  2. **Cascade attention disabled** (vllm/config/vllm.py:1269-1272): `disable_cascade_attn` is forced to True, preventing
  the use of cascade attention optimizations that improve throughput for mixed-length batches.

  3. **FlashAttention version downgrade** (vllm/v1/attention/backends/fa_utils.py:144): FA4 is downgraded to FA2 because FA4
  uses batch-shape-dependent scheduling heuristics that break batch invariance.

  4. **AOT scheduling disabled** (vllm/v1/attention/backends/flash_attn.py:414): Ahead-of-time scheduling is disabled because
  the schedule varies with max_seqlen_q/k, forcing runtime scheduling which adds overhead.

  5. **FlashAttention max_num_splits forced to 1** (vllm/v1/attention/backends/flash_attn.py:445, vllm/v1/attention/backends/mla/flashattn_mla.py:157):
  Prevents split-kernel execution that improves throughput for long sequences.

  6. **FlashInfer fixed split sizes** (vllm/v1/attention/backends/flashinfer.py:560-567): Decode split size fixed to 2048,
  prefill split size fixed to 4096, and split-kv disabled. Larger workspace buffer allocated (vllm/v1/attention/backends/flashinfer.py:751-752).

  7. **FlexAttention kernel options** (vllm/v1/attention/backends/flex_attention.py:1173-1177): BLOCK_M and BLOCK_N forced
  to 16 with IS_DIVISIBLE=False, reducing kernel efficiency.

  8. **Ascend-specific: custom ops disabled** (vllm_ascend/utils.py:374): All custom Ascend operators are disabled, falling
  back to generic implementations.

  9. **Ascend-specific: async exponential disabled** (vllm_ascend/ascend_config.py:225): The async exponential sampling optimization
  is disabled because it makes batch_invariant mode non-functional.

  10. **Ascend-specific: sampler fallback** (vllm_ascend/sample/sampler.py:135, vllm_ascend/_310p/sample/sampler.py:63): Ascend-optimized
  sampling kernels are bypassed in favor of vLLM''s upstream implementation.

  The net effect is significantly reduced throughput and increased latency, with potentially higher memory usage due to larger
  workspace buffers. This mode should only be used for debugging or when deterministic results are strictly required.

  '

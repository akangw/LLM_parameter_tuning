related_parameters:
- name: --limit-mm-per-prompt
  relation: Controls the maximum number of media items per prompt; media_io_kwargs controls how each item is processed
- name: --mm-processor-kwargs
  relation: Similar pattern — passes additional kwargs to the HF processor; media_io_kwargs targets media IO connectors specifically
- name: --mm-processor-cache-gb
  relation: Caches processed media inputs; larger num_frames increases cache entry size, making cache sizing more important
- name: --video-pruning-rate
  relation: Alternative way to reduce video frames via pruning; media_io_kwargs num_frames sets the initial extraction count
constraints:
- Must be a valid JSON dict with modality keys (e.g., 'video', 'image') mapping to dicts of kwargs
- The specific kwargs available depend on the model's media IO connector implementation
- Per-request media_io_kwargs are merged with engine-level media_io_kwargs; request-level values take precedence
tuning_advice:
  summary: Reduce video num_frames to lower vision encoder latency and KV cache memory usage on Ascend NPU
  suggested_values:
  - scenario: High-throughput video serving with acceptable quality loss
    value: '{"video": {"num_frames": 8}}'
    reason: Minimizes vision encoder compute and visual token count; suitable when temporal detail is not critical
  - scenario: Balanced quality and performance
    value: '{"video": {"num_frames": 16}}'
    reason: Common default for many video models; provides reasonable temporal coverage without excessive overhead
  - scenario: Maximum video understanding quality (low throughput acceptable)
    value: '{"video": {"num_frames": 32}}'
    reason: Captures more temporal information; expect 2-4x higher TTL latency and visual token memory vs 8 frames
  caveats:
  - On Ascend NPU, the vision encoder runs on NPU — more frames linearly increases NPU compute time for encoding
  - More visual tokens from additional frames consume KV cache memory, which is especially limited on NPU compared to GPU
  - The actual effect of num_frames depends on the model's media IO connector — some models may ignore or clamp this value
  - Per-request media_io_kwargs override engine-level settings, allowing dynamic quality adjustments per client
  quick_guide: For Ascend NPU video serving, start with num_frames=16 and reduce to 8 if latency or memory pressure is observed

name: --media-io-kwargs
type: cli
category: model
scope: vllm
source_file:
- vllm/config/multimodal.py:110
- vllm/engine/arg_utils.py:1177
- vllm/entrypoints/chat_utils.py:547
- vllm/entrypoints/openai/chat_completion/protocol.py:309
value_type: dict
default: '{}'
valid_choices: dict[str, dict[str, Any]] keyed by modality (e.g., 'video', 'image')
cli_example: '--media-io-kwargs ''{"video": {"num_frames": 40}}'''
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter controls how media inputs (images, videos) are processed before being fed into the multimodal\
  \ model. The key performance-relevant sub-parameter is `num_frames` for video modality, which directly determines: 1) The\
  \ number of video frames extracted and encoded by the vision encoder — more frames means more encoder computation,\n   increasing\
  \ time-to-first-token (TTL) latency and reducing throughput.\n2) The number of visual tokens injected into the LLM's KV\
  \ cache — more frames means more visual tokens,\n   consuming more KV cache memory and potentially causing preemption or\
  \ OOM under high concurrency.\n3) For models with unified vision_chunk modality (e.g., Qwen2-VL), the `media_io_kwargs`\
  \ are passed through\n   `BaseMultiModalItemTracker` (vllm/entrypoints/chat_utils.py:547) and used during media IO connector\
  \ processing.\nOn Ascend NPU, the vision encoder typically runs on NPU as well, so the computational cost of processing\
  \ more frames scales with NPU compute. Reducing `num_frames` is the most direct way to trade off video understanding quality\
  \ for lower latency and higher throughput. The parameter can also be set per-request via the OpenAI-compatible API (vllm/entrypoints/openai/chat_completion/protocol.py:309),\
  \ allowing dynamic quality/performance tradeoffs.\n"

- vllm/config/speculative.py
value_type: dict
default: <computed>
valid_choices: <computed>
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: "This nested configuration controls the tensor parallelism (TP) and other parallel settings for the draft model\
  \ in speculative decoding. On Ascend NPU, it directly affects:\n1. **Draft model TP size**: When `draft_parallel_config.tensor_parallel_size`\
  \ is set, it\n   overrides `draft_tensor_parallel_size` and the target model's TP size for the draft model\n   (vllm_ascend/platform.py:332-338).\
  \ This determines how many NPUs the draft model uses.\n\n2. **Decode Context Parallel (DCP) validation**: When DCP is enabled\n\
  \   (`decode_context_parallel_size > 1`), the draft TP size must be greater than the draft\n   model's total KV heads for\
  \ GQA/MQA models (vllm_ascend/platform.py:343-349). Violating\n   this raises a ValueError.\n\n3. **Memory allocation**:\
  \ The draft model runs on a subset of NPUs determined by its TP\n   configuration. A smaller draft TP size reduces memory\
  \ pressure on the draft model's\n   devices but may create load imbalance if the target model uses more devices.\n\n4. **Throughput\
  \ impact**: Draft model TP size affects draft token generation speed. Too\n   small a TP size may bottleneck the draft phase;\
  \ too large wastes resources that could\n   serve the target model.\n\nThe parameter is a `ParallelConfig`-like nested dict\
  \ that vllm-ascend reads to determine draft model parallelism independently from the target model's parallel configuration.\n"
usage_locations:
- file: vllm_ascend/platform.py:332
  context: 'Reads draft_parallel_config.tensor_parallel_size to determine draft model TP size for DCP head-sharding validation.
    Falls back to draft_tensor_parallel_size then target model TP size if not set.

    '

    = 1 for AscendDraftModelProposer.

    '
- file: tests/v1/e2e/spec_decode/test_spec_decode.py:1017
  context: 'Upstream test uses draft_parallel_config to construct the draft model''s VllmConfig with independent TP size (1
    vs target''s 2), verifying quantization isolation.

    '
related_parameters:
- name: speculative.draft_tensor_parallel_size
  relation: 'Fallback: "if draft_parallel_config.tensor_parallel_size is not set, vllm-ascend" checks draft_tensor_parallel_size
    next (vllm_ascend/platform.py:335-336).

    '
- name: parallel_config.decode_context_parallel_size
  relation: 'When DCP is enabled (>1), draft_parallel_config.tensor_parallel_size must satisfy additional constraints relative
    to the draft model''s KV head count.

    '
- name: speculative.target_parallel_config
  relation: 'Defines the target model''s parallel configuration. On Ascend, target_tp != draft_tp is noted as not yet supported
    in test comments (test_eagle_proposer.py:284).

    '
constraints:
- When decode_context_parallel_size > 1 and the draft model uses GQA/MQA (not MLA), draft_parallel_config.tensor_parallel_size
  must be greater than the draft model's total_num_kv_heads.
- On Ascend NPU, target model TP size and draft model TP size should currently be equal (target_tp != draft_tp is not yet
  supported per test comments).
tuning_advice:
  summary: 'Set draft_parallel_config.tensor_parallel_size equal to the target model''s TP size on Ascend NPU to avoid unsupported
    configurations and ensure balanced resource usage.

    '
  suggested_values:
  - scenario: Standard speculative decoding on Ascend NPU (v1 worker)
    value: Same as target model tensor_parallel_size
    reason: 'Ascend test comments indicate target_tp != draft_tp is not yet supported. Matching TP sizes avoids validation
      errors and ensures consistent device utilization across target and draft model execution.

      '
  - scenario: DCP enabled with GQA/MQA draft model
    value: Must be > total_num_kv_heads of draft model
    reason: 'vllm-ascend enforces this constraint at platform.py:343-349. The DCP head-sharding rule requires TP size to exceed
      KV head count for correct sharding. Choose the smallest value satisfying both this constraint and the target TP match
      requirement.

      '
  caveats:
  - On Ascend NPU, setting draft TP different from target TP is noted as unsupported in vllm-ascend test code. Attempting
    this may cause runtime errors or incorrect results.
  - MLA draft models skip the DCP head-sharding validation (vllm_ascend/platform.py:329-330), so the KV-head constraint does
    not apply to them.
  - The draft model runs on a subset of devices determined by its TP configuration. Ensure sufficient NPU memory on those
    devices for both draft and target model components.
  quick_guide: Match draft_parallel_config.tensor_parallel_size to target model TP size on Ascend NPU; ensure it exceeds draft
    KV head count when using DCP with GQA/MQA models.

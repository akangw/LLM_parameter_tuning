  context: 'Test: sets expandable_segments:True for Qwen3-30B accuracy test'
related_parameters:
- name: enable_sleep_mode
  relation: When enable_sleep_mode is True, vllm-ascend skips setting PYTORCH_NPU_ALLOC_CONF entirely (platform.py:654)
- name: VLLM_ASCEND_ENABLE_FLASHCOMM1
  relation: Often set together in test configurations; both affect memory and communication patterns
constraints:
- expandable_segments:True cannot be used together with max_split_size_mb or garbage_collection_threshold
- expandable_segments:True is incompatible with CaMemAllocator (memory pool); using both will raise an AssertionError
- vllm-ascend does not set this environment variable when enable_sleep_mode is True (RL sleep scenarios)
tuning_advice:
  summary: 'Use expandable_segments:True (the vllm-ascend default) for most inference workloads to reduce memory fragmentation;
    switch to max_split_size_mb only when using CaMemAllocator or when expandable_segments causes issues.

    '
  suggested_values:
  - scenario: Standard inference (default vllm-ascend behavior)
    value: expandable_segments:True
    reason: vllm-ascend automatically applies this; it reduces memory fragmentation and helps avoid OOM errors during inference
  - scenario: Using CaMemAllocator (memory pool)
    value: max_split_size_mb:256
    reason: expandable_segments is incompatible with CaMemAllocator; max_split_size_mb prevents large block splits and reduces
      fragmentation as an alternative
  - scenario: Model quantization (e.g., W8A8)
    value: expandable_segments:False
    reason: Documentation explicitly recommends setting expandable_segments:False during quantization workflows
  - scenario: Large models with memory fragmentation issues
    value: max_split_size_mb:256
    reason: Prevents the native allocator from splitting blocks larger than 256MB, reducing fragmentation for borderline OOM
      workloads
  - scenario: RL scenarios with sleep mode enabled
    value: (not set by vllm-ascend)
    reason: vllm-ascend skips setting this variable when enable_sleep_mode is True; user should configure manually if needed
  caveats:
  - expandable_segments:True and max_split_size_mb are mutually exclusive — setting both will cause expandable_segments to
    NOT be applied
  - CaMemAllocator (memory pool) explicitly rejects expandable_segments:True with an assertion error
  - The default value is only applied when enable_sleep_mode is False; RL sleep mode users must configure manually
  - page_size can be combined with expandable_segments (e.g., 'page_size:1g,expandable_segments:True')
  quick_guide: Keep the default expandable_segments:True for most cases; use max_split_size_mb:256 only if using CaMemAllocator
    or experiencing OOM with expandable segments.
analysis_date: '2026-07-06'

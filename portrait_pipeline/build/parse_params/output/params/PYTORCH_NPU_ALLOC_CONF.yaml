  context: 'Test: sets expandable_segments:True for Qwen3-VL multimodal test'
- file: tests/e2e/pull_request/four_card/test_deepseek_v4.py:24
  context: 'Test: sets expandable_segments:True at module level for DeepSeek V4 tests'

name: PYTORCH_NPU_ALLOC_CONF
type: env
category: memory
scope: vllm-ascend
source_file:
- vllm_ascend/platform.py:655
- vllm_ascend/device_allocator/camem.py:150
value_type: str
default: expandable_segments:True
valid_choices: 'comma-separated key:value pairs; supported keys: expandable_segments, max_split_size_mb, garbage_collection_threshold,
  page_size'
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- memory
- throughput
impact_detail: 'This environment variable controls the NPU memory allocator behavior in PyTorch Ascend. vllm-ascend automatically
  sets it to "expandable_segments:True" by default (platform.py:655) when sleep mode is not enabled. The expandable segments
  feature allows the allocator to grow memory segments dynamically, reducing memory fragmentation and OOM errors during inference.
  However, it is incompatible with max_split_size_mb and garbage_collection_threshold (platform.py:659-660) — if either is
  present, expandable_segments is not appended. The CaMemAllocator (camem.py:150) explicitly asserts that expandable_segments:True
  is NOT set, as it conflicts with the memory pool mechanism. The documentation also shows that max_split_size_mb can be used
  as an alternative strategy to reduce fragmentation by preventing large block splits (optimization_and_tuning.md:150). The
  choice between expandable_segments and max_split_size_mb directly impacts memory utilization efficiency and can determine
  whether a model fits in NPU memory at all.

  '
usage_locations:
- file: vllm_ascend/platform.py:655
  context: 'Default setting: appends expandable_segments:True if not already present and no conflicting keys exist'
- file: vllm_ascend/device_allocator/camem.py:150
  context: 'CaMemAllocator initialization: asserts expandable_segments:True is NOT set (incompatible with memory pool)'
- file: tests/e2e/conftest.py:497
  context: 'Test fixture: explicitly sets expandable_segments:True for PD-disaggregated server tests'

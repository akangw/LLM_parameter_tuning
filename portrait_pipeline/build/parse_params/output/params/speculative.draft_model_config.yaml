related_parameters:
- name: speculative_config.method
  relation: Determines which draft model architecture is used (eagle, mtp, etc.) and how draft_model_config is interpreted
- name: speculative_config.draft_tensor_parallel_size
  relation: Controls tensor parallelism for the draft model; draft_model_config.hf_config determines if TP is applicable
- name: speculative_config.num_speculative_tokens
  relation: Number of speculative tokens interacts with draft model's computational cost per step
- name: parallel_config.decode_context_parallel_size
  relation: DCP validation checks draft_model_config.use_mla to determine if head-sharding rules apply
- name: parallel_config.enable_eplb
  relation: EPLB registration checks if draft model is MoE via draft_model_config.hf_config
constraints:
- For extract_hidden_states method, draft_model_config.hf_config must have eagle_aux_hidden_state_layer_ids set
- Draft model config must not be None when speculative_config is present and method is not mtp (for KV transfer layer counting)
- MLA draft models (use_mla=True) skip DCP head-sharding validation
- Elastic EP is not supported with draft models that are MoE
tuning_advice:
  summary: 'Choose the smallest draft model architecture that maintains acceptable acceptance rates; on Ascend NPU, prefer
    MTP over EAGLE when available to reduce KV transfer overhead and simplify CUDA graph allocation.

    '
  suggested_values:
  - scenario: PD-disaggregated deployment with KV transfer
    value: Use MTP method draft models
    reason: MTP draft models use only 1 KV cache layer for transfer (all layers share the same KV cache), minimizing KV transfer
      bandwidth compared to EAGLE-style draft models which transfer num_hidden_layers worth of KV cache
  - scenario: Memory-constrained Ascend NPU deployment
    value: Use draft models with smaller hidden_size and fewer layers
    reason: Draft model hidden_size directly determines buffer allocations (hidden_states, input_ids, positions) scaled by
      max_num_tokens; fewer layers reduce CUDA graph resource count (resources_per_graph += draft_layers + 1)
  - scenario: High-throughput with decode context parallelism
    value: Use MLA draft models
    reason: MLA draft models skip the GQA/MQA DCP head-sharding validation, avoiding potential compatibility issues with decode
      context parallelism on Ascend
  caveats:
  - DeepSeek V4 MTP draft models multiply hidden_size by hc_mult from draft_model_config.hf_config, significantly increasing
    memory footprint for hidden_states buffer
  - Draft models with MoE architecture trigger EPLB registration but disable elastic EP, which may limit flexibility in expert-parallel
    deployments
  - The draft model's max_model_len, if set, overrides the target model's max_model_len for drafter scheduling (effective_drafter_max_model_len)
  - On Ascend v1 worker, draft model loading goes through AscendSpecDecodeBaseProposer which may have different model loading
    behavior than upstream
  quick_guide: For Ascend NPU, prefer MTP draft models to minimize KV transfer overhead; use the smallest draft model that
    meets your acceptance rate targets to reduce memory and compute pressure.

name: --max-num-seqs
type: cli
category: scheduling
scope: both
source_file:
- vllm/engine/arg_utils.py:1327
- vllm/config/scheduler.py:63
- vllm_ascend/platform.py:189
value_type: int
default: '128'
valid_choices: integer >= 1
cli_example: --max-num-seqs 256
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: "This parameter controls the maximum number of concurrent sequences (requests) the scheduler can process in\
  \ a single iteration. It directly bounds batch size, which is the primary lever for throughput on Ascend NPU.\nOn Ascend,\
  \ the impact is amplified by several vllm-ascend mechanisms:\n1. **CUDA Graph capture size**: vllm-ascend overrides the\
  \ default\n   `max_cudagraph_capture_size` to `min(max_num_seqs * decode_query_len, 512)`\n   (vllm_ascend/platform.py:211).\
  \ This means `--max-num-seqs` directly\n   determines how many CUDA graph sizes are captured, affecting startup time\n \
  \  and memory usage. The upstream vLLM default multiplies by 2; Ascend removes\n   this multiplier to reduce memory pressure.\n\
  \n2. **Buffer allocation**: Multiple Ascend attention backends allocate tensors\n   sized by `max_num_seqs`:\n   - \"`start_pos_prefill`\
  \ and `start_pos_decode` tensors in DSA metadata builder\"\n     (vllm_ascend/attention/dsa_v1.py:421-422)\n   - \"`actual_seq_lengths_query`\
  \ in SFA metadata builder\"\n     (vllm_ascend/attention/sfa_v1.py:208-209)\n   - \"`local_query_start_loc` and `local_seq_lens`\
  \ in DSA CP builder\"\n     (vllm_ascend/attention/context_parallel/dsa_cp.py:200-209)\n   - \"Slot mapping buffer padding\
  \ in SFA CP:\"\n     `max_num_batched_tokens + 2 * pcp_size * max_num_seqs`\n     (vllm_ascend/attention/context_parallel/sfa_cp.py:54)\n\
  \n3. **PCP padding**: In the v1 model runner, `max_num_batched_tokens` is\n   temporarily increased by `pcp_size * 2 * max_num_seqs`\
  \ to accommodate\n   context-parallel padding (vllm_ascend/worker/model_runner_v1.py:259).\n\n4. **Speculative decoding**:\
  \ `max_num_seqs` multiplies with\n   `max_num_new_slots_for_drafting` to reserve token budget for draft slots\n   (vllm/config/vllm.py:1437).\
  \ Setting it too high with speculative decoding\n   can cause `max_num_scheduled_tokens <= 0` errors.\n\n5. **Mamba models**:\
  \ Each decode sequence requires one Mamba cache block.\n   If `max_num_seqs > num_blocks`, CUDA graph capture raises a ValueError\n\
  \   (vllm/config/compilation.py:1435-1441).\n\nHigher values increase maximum throughput but consume more NPU memory for\
  \ buffers and KV cache. Lower values reduce memory pressure and startup time but cap concurrency.\n"

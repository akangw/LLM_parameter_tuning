related_parameters:
- name: --max-num-batched-tokens
  relation: Must be >= max_num_seqs; together they bound batch dimensions
- name: --max-model-len
  relation: max_num_batched_tokens should not exceed max_num_seqs * max_model_len
- name: --enable-chunked-prefill
  relation: Required if max_num_batched_tokens < max_model_len
- name: --gpu-memory-utilization
  relation: Higher max_num_seqs requires more KV cache memory; may need to adjust this
- name: --num-speculative-tokens
  relation: 'Affects token budget reservation: max_num_seqs * max_num_new_slots_for_drafting'
- name: --max-cudagraph-capture-size
  relation: Ascend derives default from max_num_seqs; explicit setting overrides
constraints:
- --max-num-seqs must be >= 1
- --max-num-batched-tokens must be >= --max-num-seqs
- For Mamba models with full CUDA graphs, --max-num-seqs must not exceed available Mamba cache blocks (num_blocks)
- With speculative decoding, --max-num-seqs * max_num_new_slots_for_drafting must leave room for at least one scheduled token
tuning_advice:
  summary: 'Set --max-num-seqs based on available NPU memory and target concurrency. On Ascend, this parameter also controls
    CUDA graph capture size (capped at 512), so larger values increase startup time. Start with 128-256 for most models, reduce
    if OOM occurs.

    '
  suggested_values:
  - scenario: High-throughput serving with abundant NPU memory (e.g., Qwen3-235B on multi-NPU)
    value: '144'
    reason: Documented as providing good weight prefetch performance for Qwen3-235B-A22B-W8A8
  - scenario: Moderate concurrency for dense models (e.g., Qwen3-32B-W8A8)
    value: '72'
    reason: Documented as providing good weight prefetch performance for Qwen3-32B-W8A8
  - scenario: Memory-constrained deployment or OOM at startup
    value: '32'
    reason: Reduces buffer allocations and KV cache pressure; documented as first troubleshooting step for OOM
  - scenario: General-purpose serving with balanced memory/throughput
    value: '128'
    reason: Matches the upstream default; reasonable starting point for most Ascend deployments
  caveats:
  - On Ascend, --max-num-seqs directly controls CUDA graph capture size (capped at 512). Values above 512 do not increase
    graph capture but still allocate larger buffers.
  - Context-parallel (PCP) deployments add padding of `pcp_size * 2 * max_num_seqs` to max_num_batched_tokens, increasing
    memory usage.
  - Higher values increase NPU memory consumption for attention metadata tensors (start_pos, seq_lens, slot_mapping buffers).
  - With speculative decoding, setting max_num_seqs too high can cause max_num_scheduled_tokens to become <= 0, raising a
    ValueError.
  - For Mamba-family models, max_num_seqs must not exceed the number of available Mamba cache blocks.
  quick_guide: Start with 128, reduce to 32-72 if OOM, increase to 144-256 for high-throughput scenarios with sufficient NPU
    memory.

cli_example: --pipeline-parallel-size 2
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'Pipeline parallelism splits model layers across multiple Ascend NPUs, enabling models that exceed single-device
  memory to run. On Ascend, this parameter directly controls:

  1) **Memory distribution**: Each pipeline stage holds only a subset of layers, reducing per-device memory pressure proportionally
  to pp_size. This is the primary mechanism for running large models on Ascend NPUs with limited HBM.

  2) **Throughput via pipelining**: Multiple micro-batches can be in-flight simultaneously across pipeline stages, improving
  device utilization. The Ascend-specific dynamic chunked pipeline parallel feature (profiling_chunk_config) requires pp_size
  > 1 and dynamically adjusts chunk sizes based on profiling data to optimize pipeline bubble reduction.

  3) **Communication overhead**: Pipeline parallelism introduces point-to-point communication between stages via HCCL. The
  communication volume is proportional to hidden_size × num_microbatches, which can become a bottleneck if stages are imbalanced
  or chunk sizes are suboptimal.

  4) **Ascend-specific constraints**: vllm-ascend enforces that xlite graph mode is incompatible with pp_size > 1 (raises
  RuntimeError). The profiling_chunk_config feature requires pp_size > 1 (raises ValueError otherwise). MoE communication
  type selection uses pp_size in world_size_across_dp // pp_size calculation.

  5) **KV transfer impact**: Mooncake connectors use pp_size for device ID calculation and port assignment in disaggregated
  prefill-decode setups.

  6) **Model compatibility**: Only models implementing the SupportsPP interface can use pipeline parallelism; otherwise a
  NotImplementedError is raised.

  '

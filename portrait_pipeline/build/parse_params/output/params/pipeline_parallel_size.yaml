related_parameters:
- name: --tensor-parallel-size
  relation: Combined with pp_size to determine total world_size; tp_size × pp_size must not exceed available NPUs
- name: --enable-chunked-prefill
  relation: Required when using dynamic chunked pipeline parallel (profiling_chunk_config) on Ascend
- name: profiling_chunk_config (in --additional-config)
  relation: Ascend-specific feature that requires pp_size > 1; dynamically optimizes chunk sizes for pipeline efficiency
- name: VLLM_ASCEND_BALANCE_SCHEDULING
  relation: Incompatible with dynamic chunked pipeline parallel which requires pp_size > 1
- name: --data-parallel-size
  relation: Combined with pp_size and tp_size to determine total device allocation
- name: --distributed-executor-backend
  relation: When pp_size × tp_size fits on one node, 'mp' backend is used; otherwise 'ray' or explicit setting required
constraints:
- pipeline_parallel_size must be a positive integer
- pipeline_parallel_size > 1 requires the model to implement the SupportsPP interface, otherwise a NotImplementedError is
  raised
- When profiling_chunk_config is enabled, pipeline_parallel_size must be greater than 1, otherwise a ValueError is raised
- Xlite graph mode is incompatible with pipeline_parallel_size > 1 and will raise a RuntimeError
- mm_tensor_ipc='torch_shm' is not supported when pipeline_parallel_size > 1
- When using dynamic chunked pipeline parallel, --enable-chunked-prefill must also be set
- When using dynamic chunked pipeline parallel, VLLM_ASCEND_BALANCE_SCHEDULING must not be enabled
- Sequence parallelism with pipeline_parallel_size > 1 requires custom rms_norm op to avoid tracing errors
tuning_advice:
  summary: Use pipeline_parallel_size > 1 only when model exceeds single-NPU memory or when leveraging Ascend dynamic chunked
    pipeline parallel for throughput optimization; otherwise keep at 1 to avoid communication overhead.
  suggested_values:
  - scenario: Model fits on a single Ascend NPU
    value: 1
    reason: Avoids pipeline communication overhead and bubble; single-device execution is most efficient when memory permits
  - scenario: Large model exceeding single-NPU HBM, or leveraging dynamic chunked pipeline parallel
    value: 2
    reason: Minimum pipeline parallelism for memory distribution; enables Ascend dynamic chunked pipeline parallel feature
      for optimized scheduling
  - scenario: Very large model requiring more than 2 pipeline stages
    value: 4
    reason: Further distributes memory across more NPUs; balance with tp_size to fully utilize available devices
  caveats:
  - Pipeline parallelism introduces communication bubbles between stages; throughput gains require careful tuning of chunk
    sizes via profiling_chunk_config
  - On Ascend, dynamic chunked pipeline parallel (profiling_chunk_config) adds ~64 forward passes of profiling overhead at
    startup (tens of seconds)
  - Xlite graph mode cannot be used with pipeline parallelism; disable one or the other
  - Pipeline parallelism is not supported for all models; only models implementing SupportsPP interface work with pp_size
    > 1
  - When combined with sequence parallelism, custom rms_norm ops are automatically added to avoid tracing errors
  - MoE communication type selection (MC2 vs ALLGATHER) depends on pp_size via world_size calculation; changing pp_size may
    affect MoE performance
  quick_guide: Set --pipeline-parallel-size to 1 unless model exceeds single-NPU memory or you need Ascend dynamic chunked
    pipeline parallel; use 2 as starting point for multi-NPU deployments.

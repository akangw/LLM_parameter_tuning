name: --data-parallel-size
type: cli
category: parallelism
scope: both
source_file:
- vllm/engine/arg_utils.py:968
- vllm/config/parallel.py:117
value_type: int
default: '1'
valid_choices: positive integer
cli_example: --data-parallel-size 2
deprecated: false
performance_impact: high
performance_scope:
- throughput
- memory
- latency
impact_detail: 'Controls the number of data parallel (DP) replicas for MoE models. On Ascend NPU, this parameter directly
  determines how expert layers are sharded across devices: the effective expert parallel world size is `tensor_parallel_size
  * data_parallel_size`. Each DP replica maintains its own KV cache and processes an independent subset of requests, so increasing
  DP size linearly scales total serving throughput at the cost of proportionally higher HBM usage (each replica stores full
  non-expert weights and its own KV cache). On Ascend, vllm-ascend patches the scheduler to use a balance-aware DP engine
  core (BalanceDPEngineCoreProc) when data_parallel_size > 1, which coordinates batch sizes across DP replicas via all_gather
  to avoid load imbalance. The parameter also affects compilation: "when data_parallel_size > 1 and piecewise cudagraph is
  used," splitting_ops are configured to include all2all operations for MoE dispatch. For DeepEP high-throughput all2all backend,
  data_parallel_size > 1 forces cudagraph_mode to NONE. On Ascend, the v1 model runner uses dp_size and dp_rank to manage
  per-replica state, and the Mooncake KV connector uses data_parallel_size to compute max_device_id for cross-node KV transfer
  handshake ports.

  '
usage_locations:
- file: vllm_ascend/patch/platform/patch_balance_schedule.py:62
  context: Creates balance_queue with one entry per DP replica for load-balancing across DP groups
- file: vllm_ascend/patch/platform/patch_balance_schedule.py:695
  context: Selects BalanceDPEngineCoreProc when data_parallel_size > 1 or dp_rank > 0
- file: vllm_ascend/platform.py:514
  context: Passes data_parallel_size to set_splitting_ops_for_v1 for piecewise cudagraph compilation
- file: vllm_ascend/worker/model_runner_v1.py:296
  context: Stores dp_size and dp_rank for per-replica state management in v1 model runner
- file: vllm_ascend/worker/model_runner_v1.py:1820
  context: Coordinates dummy run across DP replicas when external launcher and DP are both enabled
- file: vllm_ascend/worker/worker.py:295
  context: Validates local_world_size against visible NPU device count for DP setups
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:1387
  context: Computes max_device_id as tp_size * dp_size * pcp_size * pp_size for KV transfer
- file: vllm_ascend/ascend_config.py:466
  context: Validates that fine-grained TP module sizes divide data_parallel_size for MoE models
- file: vllm/config/compilation.py:1083
  context: set_splitting_ops_for_v1 accepts data_parallel_size to configure all2all splitting ops
- file: vllm/config/compilation.py:1174
  context: Disables CUDA graphs for DeepEP high-throughput when data_parallel_size > 1
related_parameters:
- name: --tensor-parallel-size
  relation: Expert parallel world size = data_parallel_size * tensor_parallel_size; must be set consistently
- name: --enable-expert-parallel
  relation: Required for MoE expert sharding; DP distributes experts across replicas when EP is enabled
- name: --data-parallel-rank
  relation: Specifies which DP replica this instance is; used in external load balancer mode
- name: --data-parallel-size-local
  relation: Number of DP replicas on this node; must not exceed available NPU count
- name: --data-parallel-backend
  relation: Backend for DP communication (mp or ray); nnodes > 1 requires mp backend
- name: --all2all-backend
  relation: DeepEP high-throughput backend disables cudagraph when data_parallel_size > 1
- name: --max-num-seqs
  relation: Per-DP-replica limit; total concurrency = max_num_seqs * data_parallel_size
- name: --nnodes
  relation: Multi-node DP requires world_size = dp_size * pp_size * tp_size to be divisible by nnodes
constraints:
- data_parallel_size must be a positive integer.
- For MoE models with fine-grained TP (lmhead/embedding/MLP tensor parallel), data_parallel_size must be divisible by each
  enabled module_tp_size.
- Fine-grained TP features (lmhead parallel, etc.) can only be enabled for MoE models, not dense models.
- When nnodes > 1, data_parallel_backend must be 'mp' (not 'ray').
- data_parallel_hybrid_lb and data_parallel_external_lb cannot both be True.
- data_parallel_hybrid_lb is not applicable in headless mode.
- mm_tensor_ipc='torch_shm' is not supported with data_parallel_size > 1.
- When data_parallel_size > 1 and data_parallel_size_local > 0 with mp backend on single node, local_world_size must not exceed
  visible NPU device count.
tuning_advice:
  summary: Set data_parallel_size to the number of independent request streams needed; each replica consumes full non-expert
    weights plus its own KV cache, so size it based on available HBM and desired total throughput.
  suggested_values:
  - scenario: Single-node MoE inference with 8 NPUs, TP=8
    value: '1'
    reason: With TP=8 using all 8 NPUs, DP=1 avoids duplicating non-expert weights; expert parallel is handled within the
      TP group.
  - scenario: Multi-node MoE deployment with 16 NPUs (2 nodes × 8), TP=8
    value: '2'
    reason: DP=2 with TP=8 gives effective EP world size of 16, fully utilizing both nodes; each node runs one DP replica.
  - scenario: High-throughput serving requiring more concurrent requests than a single replica can handle
    value: 2 to 4
    reason: Each DP replica independently schedules up to max_num_seqs requests; total capacity scales linearly with DP size.
      Ensure sufficient HBM per replica.
  - scenario: Dense (non-MoE) model
    value: '1'
    reason: Data parallel is designed for MoE expert sharding; for dense models, launch independent vLLM instances instead.
  caveats:
  - Each DP replica stores a full copy of non-expert weights and its own KV cache — HBM usage scales linearly with data_parallel_size.
    Monitor HBM utilization carefully.
  - On Ascend, data_parallel_size > 1 triggers the balance-aware DP scheduler (BalanceDPEngineCoreProc), which adds all_gather
    communication overhead per step to coordinate batch sizes across replicas.
  - When using DeepEP high-throughput all2all backend, data_parallel_size > 1 disables CUDA graphs entirely, which may increase
    per-step latency for decode-heavy workloads.
  - For piecewise cudagraph mode on Ascend, data_parallel_size > 1 causes additional splitting ops to be inserted for all2all,
    which may affect compilation time and graph capture.
  - The effective expert parallel world size is tp_size * dp_size; ensure this divides the total number of experts evenly
    for balanced load.
  - When using external load balancer mode (--data-parallel-external-lb), each DP rank must be launched as a separate process
    with --data-parallel-rank set explicitly.
  quick_guide: For MoE models, set data_parallel_size to scale total throughput across replicas; each replica needs its own
    NPU resources and HBM for full non-expert weights plus KV cache.
analysis_date: '2026-07-06'

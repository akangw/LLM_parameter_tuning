name: --data-parallel-backend
type: cli
category: parallelism
scope: both
source_file:
- vllm/engine/arg_utils.py:1004
- vllm/config/parallel.py:133
- vllm_ascend/worker/worker.py:298
- vllm_ascend/_310p/worker_310p.py:177
value_type: str
default: mp
valid_choices:
- mp
- ray
cli_example: --data-parallel-backend mp
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: 'Controls the communication backend for data-parallel (DP) coordination. On Ascend NPU, this parameter determines
  how DP ranks discover each other and allocate devices. When set to "mp" (multiprocessing, the default), vllm-ascend workers
  use local process-based coordination and compute device indices by offsetting the local rank by `dp_local_rank * tp_pp_world_size`
  (see vllm_ascend/worker/worker.py:298 and vllm_ascend/_310p/worker_310p.py:177). This path triggers an assertion that `local_world_size
  <= visible_device_count`, which can fail if DP replicas exceed available NPUs on a single node. When set to "ray", vllm-ascend
  delegates DP coordination to Ray''s CoreEngineActorManager (vllm/v1/engine/utils.py:1048), which creates separate Ray actors
  per DP rank with their own placement groups — this avoids the local device count assertion but introduces Ray scheduling
  overhead. The "ray" backend is also required for elastic expert parallelism scaling (vllm/v1/engine/core_client.py:1491).
  Multi-node deployments (nnodes > 1) are only supported with backend="mp" (vllm/engine/arg_utils.py:1758). The backend choice
  does not affect the computation graph hash (vllm/config/parallel.py:722), meaning it does not change model sharding or collective
  communication patterns, only the process launch and device binding mechanism.

  '
usage_locations:
- file: vllm_ascend/worker/worker.py:298
  context: 'Ascend v1 worker: checks data_parallel_backend != ''ray'' to decide whether to validate local_world_size against
    visible NPU count'
- file: vllm_ascend/_310p/worker_310p.py:177
  context: 'Ascend 310P worker: same device count validation logic as v1 worker'
- file: vllm/v1/engine/utils.py:1048
  context: 'v1 upstream: when backend=''ray'', creates CoreEngineActorManager for Ray-based DP coordination'
- file: vllm/v1/engine/core_client.py:1491
  context: 'v1 upstream: elastic EP scaling requires backend=''ray'''
- file: vllm/engine/arg_utils.py:1758
  context: 'Upstream: asserts backend=''mp'' when nnodes > 1'
- file: vllm/v1/worker/gpu_worker.py:247
  context: 'v1 upstream GPU worker: uses backend check to compute DP-adjusted local_rank for CUDA devices'
- file: vllm/utils/numa_utils.py:121
  context: 'Upstream NUMA: uses backend check to compute physical GPU index for NUMA binding'
related_parameters:
- name: --data-parallel-size
  relation: Must be > 1 for this parameter to have any effect; DP backend is only used when data_parallel_size > 1
- name: --data-parallel-size-local
  relation: When > 0 and backend='mp', triggers local device count validation on Ascend
- name: --distributed-executor-backend
  relation: When set to 'ray' or 'external_launcher', the device count assertion is skipped regardless of data_parallel_backend
- name: --nnodes
  relation: Multi-node (nnodes > 1) is only supported with data_parallel_backend='mp'
- name: --enable-elastic-ep
  relation: Elastic EP scaling requires data_parallel_backend='ray'
constraints:
- nnodes > 1 is only supported with data_parallel_backend=mp
- Elastic expert parallelism scaling requires data_parallel_backend=ray
- When data_parallel_backend is not 'ray' and distributed_executor_backend is not 'ray' or 'external_launcher', local_world_size
  must not exceed the number of visible NPU devices on Ascend
tuning_advice:
  summary: Use 'mp' (default) for single-node Ascend deployments; use 'ray' only when elastic EP scaling is needed or when
    DP replicas exceed available NPUs on a single node.
  suggested_values:
  - scenario: Single-node Ascend deployment with DP replicas fitting within available NPUs
    value: mp
    reason: Default backend with lowest overhead; uses local multiprocessing without Ray scheduling latency. Device binding
      is straightforward via local rank offset.
  - scenario: Multi-node Ascend deployment (nnodes > 1)
    value: mp
    reason: Only 'mp' backend supports multi-node data parallel; 'ray' backend will raise an assertion error when nnodes >
      1.
  - scenario: Elastic expert parallelism with dynamic DP scaling
    value: ray
    reason: Elastic EP scale-up/scale-down operations require the Ray backend for actor management and dynamic placement group
      creation.
  - scenario: DP replicas exceed available NPUs on a single node and Ray is already initialized
    value: ray
    reason: Avoids the local device count assertion in vllm-ascend workers; Ray manages placement groups across available
      resources.
  caveats:
  - On Ascend NPU, when backend='mp' and data_parallel_size_local > 0, vllm-ascend asserts that local_world_size <= visible
    NPU count. If DP replicas exceed NPUs, the server will crash at startup.
  - The 'ray' backend introduces Ray actor scheduling overhead and requires a running Ray cluster, which adds complexity and
    potential latency to DP coordination.
  - This parameter is excluded from the computation graph hash, so changing it does not invalidate caches or require model
    reloading.
  quick_guide: Stick with the default 'mp' for single-node Ascend DP; switch to 'ray' only for elastic EP or when DP replicas
    outnumber local NPUs.
analysis_date: '2026-07-06'

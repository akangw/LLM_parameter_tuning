name: --scheduler-reserve-full-isl
type: cli
category: scheduling
scope: both
source_file:
- vllm/config/scheduler.py:140
- vllm/engine/arg_utils.py:589
- vllm/engine/arg_utils.py:1363
- vllm/v1/core/sched/scheduler.py:245
- vllm/v1/core/sched/scheduler.py:711
- vllm_ascend/core/scheduler_profiling_chunk.py:587
value_type: bool
default: true
valid_choices:
- true
- false
cli_example: --scheduler-reserve-full-isl
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: 'When enabled (default), the scheduler checks whether the FULL input sequence length (ISL) of a new request
  fits in the KV cache before admitting it, rather than only checking the first chunk. This prevents over-admission: without
  this check, the scheduler might admit a request whose first chunk fits, only to later discover the full sequence cannot
  be accommodated, causing preemption and KV cache thrashing. The parameter is passed as `full_sequence_must_fit` to `kv_cache_manager.allocate_slots()`
  in both the upstream v1 scheduler (vllm/v1/core/sched/scheduler.py:711) and the vllm-ascend profiling scheduler (vllm_ascend/core/scheduler_profiling_chunk.py:587).
  On Ascend NPU, where KV cache memory is managed via CANN and may have different allocation granularity than GPU, preventing
  over-admission is critical to avoid expensive preemption cycles that involve HCCL communication for KV block swaps. Setting
  this to false can increase throughput by admitting more requests concurrently, but risks KV cache thrashing under high load
  with long sequences.

  '
usage_locations:
- file: vllm/v1/core/sched/scheduler.py:245
  context: Stored as self.scheduler_reserve_full_isl from SchedulerConfig
- file: vllm/v1/core/sched/scheduler.py:711
  context: Passed to kv_cache_manager.allocate_slots() as full_sequence_must_fit during request scheduling
- file: vllm_ascend/core/scheduler_profiling_chunk.py:587
  context: Same usage in vllm-ascend's profiling scheduler; passed to allocate_slots()

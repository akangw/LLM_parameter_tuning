related_parameters:
- name: --enable-chunked-prefill
  relation: This parameter is most relevant when chunked prefill is enabled; without chunked prefill, the full ISL check is
    less critical since requests are not split into chunks.
- name: --max-num-batched-tokens
  relation: Limits total tokens per batch; interacts with full ISL reservation by capping how many long-sequence requests
    can be admitted.
- name: --max-num-seqs
  relation: Limits concurrent sequences; full ISL reservation may reduce effective concurrency when sequences are long.
constraints:
- This parameter has no effect when chunked prefill is disabled, since requests are always scheduled with their full sequence
  length.
tuning_advice:
  summary: Keep enabled (default) for stable KV cache management on Ascend NPU; disable only if you observe under-utilization
    and can tolerate occasional preemption.
  suggested_values:
  - scenario: Production serving with mixed sequence lengths on Ascend NPU
    value: true
    reason: Prevents KV cache thrashing and expensive preemption cycles that involve HCCL communication on Ascend. The default
      value is safe and recommended.
  - scenario: High-throughput batch processing with uniform short sequences
    value: false
    reason: When all sequences are short and uniform, the full ISL check is unnecessary overhead. Disabling allows the scheduler
      to pack more requests, improving throughput.
  - scenario: Debugging or testing scheduler behavior
    value: false
    reason: Disabling can help isolate whether KV cache admission is the bottleneck when diagnosing throughput issues.
  caveats:
  - Disabling this flag on Ascend NPU may lead to more frequent preemption events, which are more expensive than on GPU due
    to HCCL-based KV block swaps.
  - The vllm-ascend profiling scheduler (scheduler_profiling_chunk.py) uses this parameter identically to upstream; no Ascend-specific
    override exists, but the performance implications are amplified by NPU memory management characteristics.
  - When disabled, monitor KV cache usage and preemption metrics closely — thrashing can negate any throughput gains from
    higher concurrency.
  quick_guide: Keep the default (true) for stable Ascend NPU serving; only disable for uniform short-sequence workloads where
    KV cache pressure is low.
analysis_date: '2026-07-06'

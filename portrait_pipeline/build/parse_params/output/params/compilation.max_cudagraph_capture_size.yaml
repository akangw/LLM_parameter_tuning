related_parameters:
- name: compilation.cudagraph_capture_sizes
  relation: If `cudagraph_capture_sizes` is set, `max_cudagraph_capture_size` must equal its maximum value; otherwise a ValueError
    is raised or a truncation warning is issued.
- name: compilation.cudagraph_mode
  relation: When `cudagraph_mode` is NONE or `enforce_eager` is True, `max_cudagraph_capture_size` is set to 0, disabling
    all graph capture.
- name: scheduler_config.max_num_seqs
  relation: The Ascend default is computed as `min(max_num_seqs * decode_query_len, 512)`, so increasing `max_num_seqs` may
    increase the default capture size up to the 512 cap.
- name: speculative_config.num_speculative_tokens
  relation: '`decode_query_len = 1 + num_speculative_tokens`; more speculative tokens increase the default capture size. For
    MTP with large EP, explicitly set this to `max_concurrency * (1 + num_speculative_tokens)` to avoid graph capture buffer
    overflow.'
constraints:
- If both `max_cudagraph_capture_size` and `cudagraph_capture_sizes` are explicitly set, `max_cudagraph_capture_size` must
  equal the maximum value in `cudagraph_capture_sizes`; otherwise a ValueError is raised.
- When `enforce_eager` is True, `max_cudagraph_capture_size` is forced to 0 and graph capture is disabled.
- The value must be a positive integer when graph capture is enabled; upstream asserts `max_cudagraph_capture_size >= 1`.
tuning_advice:
  summary: On Ascend, the default is `min(max_num_seqs * decode_query_len, 512)` — capped at 512. For most deployments this
    is sufficient; increase only if you observe frequent eager fallback for large batches, and decrease if NPU memory is tight.
  suggested_values:
  - scenario: Default (most deployments)
    value: <computed>
    reason: The Ascend-computed default (`min(max_num_seqs * decode_query_len, 512)`) balances graph coverage with memory.
      No explicit setting needed.
  - scenario: High-concurrency MTP with large EP
    value: max_concurrency * (1 + num_speculative_tokens)
    reason: Per vllm-ascend release notes (release_notes.md:574), MTP with large EP may cause graph capture buffer overflow.
      Explicitly setting this value avoids the bug.
  - scenario: Memory-constrained NPU (e.g., large model on A2)
    value: '128'
    reason: Reducing the capture size lowers NPU memory usage for graph buffers. 128 covers most common batch sizes while
      saving memory.
  - scenario: High-throughput with large batches
    value: '512'
    reason: The Ascend cap of 512 is the maximum; setting it explicitly ensures full graph coverage for batches up to 512
      tokens.
  caveats:
  - On Ascend, the default calculation removes the upstream `* 2` multiplier — the capture upper bound is `max_num_seqs *
    decode_query_len` (not doubled), capped at 512. This is more memory-efficient but may cause eager fallback for very large
    batches sooner than on GPU.
  - When `cudagraph_capture_sizes` is also set, `max_cudagraph_capture_size` is overridden to match the max of that list.
    A warning is logged if they differ.
  - Larger values increase MoE dispatch/combine buffer sizes (`_mc2_tokens_capacity` and `global_bs`), which can significantly
    increase NPU memory usage in expert-parallel deployments.
  - Setting this too low causes more requests to bypass graph acceleration, increasing per-step latency.
  quick_guide: Leave at default unless you hit MTP buffer overflow (set to `max_concurrency * (1 + num_speculative_tokens)`)
    or need to save NPU memory (reduce to 128-256).
analysis_date: '2026-07-06'

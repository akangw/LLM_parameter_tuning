name: compilation.max_cudagraph_capture_size
type: nested
category: compilation
scope: both
source_file:
- vllm_ascend/platform.py:182
- vllm_ascend/utils.py:598
- vllm/config/vllm.py:1527
- vllm/engine/arg_utils.py:1388
value_type: int
default: <computed>
valid_choices: positive integer, typically 1-512 on Ascend
cli_example: '--compilation-config ''{"max_cudagraph_capture_size": 256}'''
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter sets the upper bound on the number of tokens for which CUDA graph (or Ascend ACL graph) capture\
  \ is performed. On Ascend NPU, vllm-ascend overrides the upstream default calculation in `_get_default_max_cudagraph_capture_size()`\
  \ (platform.py:182): instead of `max_num_seqs * decode_query_len * 2` (upstream), Ascend uses `min(max_num_seqs * decode_query_len,\
  \ 512)` — removing the `* 2` multiplier and capping at 512. This default is injected via `apply_config_platform_defaults()`\
  \ (platform.py:231) when neither `max_cudagraph_capture_size` nor `cudagraph_capture_sizes` is explicitly set.\nThe value\
  \ directly controls: 1. The maximum batch size for full-graph capture in attention backends (flash_attn.py:355,\n   flashinfer.py:591,\
  \ gdn_attn.py:109, mamba_attn.py:104, flashattn_mla.py:133).\n2. The token capacity for MoE dispatch/combine operations\
  \ (token_dispatcher.py:131,\n   ascend_forward_context.py:203) — a larger value increases the global batch size\n   for\
  \ expert parallelism, directly affecting memory allocation and communication\n   buffer sizes.\n3. The cudagraph capture\
  \ size list generation: the default list includes multiples\n   of 8 up to 255, then multiples of 16 up to this max value\
  \ (ACL_Graph.md:39).\n\nSetting this too high wastes NPU memory on graph capture buffers; setting it too low causes more\
  \ requests to fall back to eager execution (no graph acceleration), hurting throughput. On Ascend, the 512 cap is intentionally\
  \ conservative to balance memory usage against graph coverage.\n"

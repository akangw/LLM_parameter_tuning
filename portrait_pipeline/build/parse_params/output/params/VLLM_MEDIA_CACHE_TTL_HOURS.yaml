name: VLLM_MEDIA_CACHE_TTL_HOURS
type: env
category: other
scope: vllm
source_file:
- vllm/envs.py:829
- vllm/envs.py:73
- vllm/multimodal/media/connector.py:142
value_type: float
default: '24'
valid_choices: any positive float (hours)
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: "This parameter controls the Time-To-Live (TTL) for cached media files (images, video, audio) fetched from\
  \ URLs during multimodal inference. It is only active when VLLM_MEDIA_CACHE is set to a writable directory path. When a\
  \ cached entry's age exceeds VLLM_MEDIA_CACHE_TTL_HOURS, the entry is evicted and must be re-fetched from the source URL\
  \ on the next request.\nPerformance impact is indirect and limited to multimodal serving workloads: - \"If TTL is too short,\
  \ media files expire frequently, causing repeated HTTP fetches that add\"\n  network latency to request processing (VLLM_IMAGE_FETCH_TIMEOUT\
  \ defaults to 5s,\n  VLLM_VIDEO_FETCH_TIMEOUT to 30s, VLLM_AUDIO_FETCH_TIMEOUT to 10s).\n- \"If TTL is very long, the cache\
  \ may retain stale or unused files, consuming disk space up to\"\n  VLLM_MEDIA_CACHE_MAX_SIZE_MB (default 5120 MB). This\
  \ does not directly affect NPU memory\n  or compute throughput, but disk I/O for cache maintenance could marginally impact\n\
  \  co-located storage.\n\nOn Ascend NPU, this parameter has no hardware-specific behavior — it operates entirely at the\
  \ Python HTTP/media layer in vllm/multimodal/media/connector.py. vllm-ascend does not override or modify this parameter.\
  \ The TTL check happens at line 142 where hours are converted to seconds (self._media_cache_ttl_secs = envs.VLLM_MEDIA_CACHE_TTL_HOURS\
  \ * 3600) and used in _get_cached_bytes() to determine cache validity.\nFor pure text workloads or when VLLM_MEDIA_CACHE\
  \ is unset (empty string), this parameter has zero effect.\n"
usage_locations:
- file: vllm/envs.py:73
  context: Default value declaration in EnvironmentVariables class (24 hours)

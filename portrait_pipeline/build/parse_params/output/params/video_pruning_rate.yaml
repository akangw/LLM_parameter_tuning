related_parameters:
- name: --limit-mm-per-prompt
  relation: Also controls multimodal token limits but operates at the prompt level rather than per-video token pruning
- name: --mm-processor-kwargs
  relation: Can pass additional kwargs to the multimodal processor that may interact with video processing
constraints:
- video_pruning_rate must be >= 0.0 and < 1.0
- video_pruning_rate only takes effect when set to a value > 0.0 (None or 0.0 disables pruning)
tuning_advice:
  summary: Set to a value between 0.1 and 0.5 to reduce video token count and improve throughput/latency with minimal accuracy
    loss; higher values save more memory but may degrade video understanding quality.
  suggested_values:
  - scenario: High-throughput video serving with acceptable quality tradeoff
    value: '0.3'
    reason: Prunes 30% of video tokens, providing significant KV cache and compute savings while retaining enough frames for
      most video understanding tasks
  - scenario: Memory-constrained deployment on Ascend NPU with long videos
    value: '0.5'
    reason: Aggressive pruning halves video token count, critical when NPU memory is limited and videos have many frames
  - scenario: Quality-sensitive applications (e.g., detailed video captioning)
    value: 0.0 or null
    reason: Disables pruning to preserve all video tokens for maximum accuracy
  caveats:
  - Pruning is applied per-video before encoding; the same rate applies to all videos in a batch
  - Higher pruning rates may cause the model to miss fine-grained temporal details in videos
  - On Ascend NPU, the performance gain from token reduction is amplified because shorter sequences reduce CANN graph compilation
    complexity and dynamic shape overhead
  - The actual token reduction depends on the model's video processing pipeline (e.g., num_frames, tokens_per_frame); test
    with representative videos to calibrate the rate
  quick_guide: Start with --video-pruning-rate 0.3 for a good balance of performance and quality; increase to 0.5 if memory
    is tight, or disable (omit flag) for maximum accuracy.
analysis_date: '2026-07-06'

name: --video-pruning-rate
type: cli
category: model
scope: vllm
source_file:
- vllm/config/multimodal.py:190
- vllm/engine/arg_utils.py:1226
- vllm/config/model.py:340
value_type: float
default: 'null'
valid_choices: '[0.0, 1.0)'
cli_example: --video-pruning-rate 0.5
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: 'This parameter controls Efficient Video Sampling (EVS), which prunes a fraction of media tokens from each
  video before they enter the vision encoder and language model. The pruning rate q ∈ [0, 1) determines what fraction of tokens
  is dropped. For example, q=0.5 means 50% of video tokens are pruned. The pruning is applied in the multimodal processor
  (e.g., NanoNemotronVLProcessingInfo at vllm/model_executor/models/nano_nemotron_vl.py:524-539) via compute_retained_tokens_count(),
  which reduces the number of visual tokens per video frame. Since video models can produce thousands of tokens per video
  (num_frames × tokens_per_frame), pruning directly reduces: (1) Vision encoder compute — fewer patches to encode. (2) Language
  model prefill compute — fewer visual tokens to attend to. (3) KV cache memory — fewer visual token KV entries to store.
  (4) Decode latency — shorter sequence lengths for cross-attention or full-attention over visual tokens. On Ascend NPU, reducing
  token count alleviates both compute and memory pressure, which is especially beneficial given the NPU''s fixed on-chip memory
  and the overhead of dynamic shape handling in CANN. The parameter is only effective when video_pruning_rate is not None
  and > 0 (checked at vllm/config/multimodal.py:338). No vllm-ascend override was found; the parameter passes through to the
  model''s multimodal processor unchanged.

  '
usage_locations:
- file: vllm/config/multimodal.py:190
  context: Field definition with ge=0.0, lt=1.0 constraint
- file: vllm/config/multimodal.py:338
  context: is_multimodal_pruning_enabled() checks if rate is not None and > 0
- file: vllm/model_executor/models/nano_nemotron_vl.py:524-539
  context: 'EVS pruning applied: compute_retained_tokens_count reduces tokens_per_frame'
- file: vllm/model_executor/models/nano_nemotron_vl.py:206

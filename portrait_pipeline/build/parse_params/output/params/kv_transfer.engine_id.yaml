  context: Hybrid Mooncake connector reads engine_id for registration
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_layerwise_connector.py:691
  context: Layerwise Mooncake connector reads engine_id for registration
- file: vllm/distributed/kv_transfer/kv_connector/v1/nixl/connector.py:95
  context: Nixl connector asserts engine_id is not None and uses it for registration

  context: Factory logs engine_id when creating v1 connectors
related_parameters:
- name: kv_transfer.kv_role
  relation: engine_id is only meaningful when kv_role enables KV transfer (kv_producer, kv_consumer, or kv_both)
- name: kv_transfer.kv_port
  relation: Both engine_id and kv_port must be unique per instance to avoid registration conflicts
- name: parallel_config.data_parallel_size
  relation: When data_parallel_size > 1, engine_id is automatically suffixed with _dp{rank}
constraints:
- engine_id must be unique across all P/D nodes in a disaggregated serving cluster to avoid registration collisions
- engine_id must be unique across all data-parallel ranks when KV transfer is enabled
- engine_id must not be None when using Nixl connector (assertion enforced)
tuning_advice:
  summary: Ensure each engine instance has a unique engine_id to prevent KV transfer registration collisions in disaggregated
    or data-parallel deployments.
  suggested_values:
  - scenario: Single-node disaggregated prefill-decode with Mooncake
    value: <auto-generated by vllm-ascend>
    reason: vllm-ascend automatically appends a UUID to ensure uniqueness; manual setting is unnecessary
  - scenario: Multi-node disaggregated prefill-decode
    value: <unique string per node>
    reason: Each node must have a distinct engine_id to avoid bootstrap server registration conflicts
  - scenario: Data-parallel KV sharing
    value: <auto-suffixed with _dp{rank}>
    reason: vLLM upstream automatically appends the DP rank suffix; manual setting is unnecessary
  caveats:
  - vllm-ascend silently patches engine_id with a UUID suffix at startup — any manually set value will be modified
  - Duplicate engine_ids cause silent KV transfer failures, not explicit errors, leading to degraded throughput
  - On Ascend NPU, Mooncake uses AscendDirectTransport which allocates ports in range [20000, 20000 + npu_per_node × 1000);
    ensure kv_port does not overlap
  quick_guide: Let vllm-ascend auto-generate engine_id; only set manually for multi-node deployments where each node needs
    a distinct, predictable identifier.
analysis_date: '2026-07-06'

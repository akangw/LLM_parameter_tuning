name: kv_transfer.engine_id
type: nested
category: communication
scope: both
source_file:
- vllm_ascend/platform.py:389
- vllm/v1/engine/core.py:1094
- vllm/v1/engine/utils.py:318
value_type: str
default: <computed>
valid_choices: any unique string
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: 'The engine_id uniquely identifies a vLLM engine instance for KV cache transfer (disaggregated prefill-decode
  or data-parallel KV sharing). On Ascend NPU, vllm-ascend patches the engine_id at startup by appending a UUID suffix (vllm_ascend/platform.py:389)
  to prevent collisions between co-located instances. In data-parallel setups, vLLM upstream further appends "_dp{rank}" (vllm/v1/engine/core.py:1094,
  vllm/v1/engine/utils.py:318). The engine_id is used by KV connectors (Mooncake, Nixl, Moriio) to register with bootstrap
  servers and route KV transfer requests. A non-unique engine_id causes registration collisions, preventing KV transfers and
  breaking disaggregated serving or DP KV sharing — resulting in failed requests or degraded throughput. The parameter itself
  is not directly user-tunable for performance gains, but incorrect configuration (duplicate IDs across nodes/instances) causes
  functional failures that manifest as performance degradation.

  '
usage_locations:
- file: vllm_ascend/platform.py:389
  context: Patches engine_id with UUID suffix to ensure uniqueness on Ascend
- file: vllm/v1/engine/core.py:1094
  context: Appends _dp{rank} suffix for data-parallel KV transfer uniqueness

name: --hf-overrides
type: cli
category: model
scope: vllm
source_file:
- vllm/engine/arg_utils.py:816
- vllm/config/model.py:275
value_type: dict
default: '''{}'''
valid_choices: A JSON dictionary of HuggingFace config overrides, or a callable
cli_example: '''--hf-overrides ''''{"rope_theta": 1000000, "rope_type": "yarn"}'''''''
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
- memory
impact_detail: 'This parameter directly modifies the HuggingFace model configuration before model initialization. On Ascend
  NPU, it is commonly used to override RoPE parameters (rope_theta, rope_type, factor, original_max_position_embeddings) for
  long-sequence inference, which affects attention computation patterns and memory layout. It can also override model architectures
  (e.g., reranker models switching from CausalLM to SequenceClassification), quantization config (setting quantization_config
  to None to strip fp8 quant), and model-specific flags (use_index_cache, index_topk_freq for DeepSeek-V4). These overrides
  change the model graph structure, operator selection, and memory allocation, directly impacting throughput, latency, and
  memory usage on Ascend hardware. The parameter is excluded from hash computation for KV cache block hashing (vllm/config/model.py:372),
  meaning changes to hf_overrides do not invalidate cached KV blocks. vllm-ascend does not override this parameter; it inherits
  the upstream behavior.

  '
usage_locations:

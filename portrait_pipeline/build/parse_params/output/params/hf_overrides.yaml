related_parameters:
- name: --hf-config-path
  relation: Alternative way to provide HuggingFace config; hf_overrides applies on top of the loaded config
- name: --max-model-len
  relation: RoPE overrides in hf_overrides are often used to extend max_model_len for long sequences
- name: --quantization
  relation: hf_overrides can set quantization_config to None to disable quantization from model config
constraints:
- The value must be a JSON-serializable dictionary or a callable that accepts and returns a HuggingFace config dictionary.
- When provided as a JSON string on CLI, it must be valid JSON with double-quoted keys and values.
- Override keys must correspond to valid fields in the target model's HuggingFace config; invalid keys are silently ignored
  or may cause model loading errors.
tuning_advice:
  summary: Use hf_overrides to adjust RoPE parameters for long-sequence inference on Ascend NPU, or to override model architecture
    for reranker/compatibility scenarios.
  suggested_values:
  - scenario: Long-sequence inference (>32K tokens) on Ascend NPU with YaRN RoPE
    value: '''{"rope_parameters": {"rope_type": "yarn", "rope_theta": 1000000, "factor": 4, "original_max_position_embeddings":
      32768}}'''
    reason: Extends the model's effective context length using YaRN scaling; tested in vllm-ascend chunked prefill with context
      parallelism tests
  - scenario: DeepSeek-V4 with index cache optimization on Ascend NPU
    value: '''{"use_index_cache": true, "index_topk_freq": 4}'''
    reason: Enables index cache with frequency 4 for DeepSeek-V4 MoE models, improving expert selection throughput on Ascend
      hardware
  - scenario: Qwen3-Reranker original model loading on Ascend NPU
    value: '''{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker":
      true}'''
    reason: Routes the model to sequence classification architecture for efficient score API usage; documented in vllm-ascend
      tutorials
  - scenario: Stripping quantization config for precision testing or debugging
    value: '''{"quantization_config": null}'''
    reason: Removes quantization config from model config, forcing full-precision execution; used in vllm-ascend attention
      precision unit tests
  caveats:
  - RoPE overrides must match the model's expected parameter names; incorrect keys are silently ignored and may not produce
    the desired scaling effect.
  - Overriding architectures changes the model class instantiated by vLLM; ensure the target architecture is supported by
    vllm-ascend on NPU.
  - hf_overrides is excluded from KV cache hashing, so changing it does not invalidate cached blocks — but this also means
    different overrides can share the same cache, potentially causing subtle correctness issues.
  - When using hf_overrides with speculative decoding, the overrides are applied to the draft model config as well, which
    may affect draft model behavior.
  quick_guide: Use hf_overrides to tune RoPE parameters for long-sequence Ascend inference or to switch model architectures
    for reranker models; provide a JSON dictionary with valid HuggingFace config keys.
analysis_date: '2026-07-06'

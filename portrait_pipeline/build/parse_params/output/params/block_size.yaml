name: --block-size
type: cli
category: kv_cache
scope: both
source_file:
- vllm/engine/arg_utils.py:1081
- vllm/config/cache.py:47
- vllm_ascend/ascend_config.py:560
- vllm_ascend/patch/platform/patch_kv_cache_utils.py:20
value_type: int
default: '16'
valid_choices: positive integer; None (uses default 16)
cli_example: --block-size 128
deprecated: false
performance_impact: high
performance_scope:
- throughput
- memory
- latency
impact_detail: "--block-size controls the number of tokens stored in each contiguous KV cache block. On Ascend NPU, this parameter\
  \ has multiple performance-critical effects:\n1. **KV cache memory efficiency**: Larger block sizes reduce per-block metadata\
  \ overhead\n   but increase internal fragmentation (wasted space when sequences don't fill blocks).\n   The page_size_bytes\
  \ property in vllm_ascend/patch/platform/patch_kv_cache_interface.py:86\n   shows that each page stores block_size * num_kv_heads\
  \ * head_size bytes, so block_size\n   directly scales per-page memory consumption.\n\n2. **Context Parallelism alignment**:\
  \ In vllm/config/parallel.py:338-342, when using\n   Decode Context Parallelism (DCP) or Prefill Context Parallelism (PCP),\
  \ the\n   cp_kv_cache_interleave_size must be compatible with block_size. The constraint is\n   that block_size must be\
  \ >= cp_kv_cache_interleave_size and divisible by it. The\n   vllm-ascend documentation at user_guide/feature_guide/context_parallel.md:69\n\
  \   explicitly states that for KV cache transfer scenarios (KV pooling, PD disaggregation),\n   cp_kv_cache_interleave_size\
  \ must equal block_size (default: 128 on Ascend).\n\n3. **Ascend-specific block size resolution**: vllm_ascend/patch/platform/patch_kv_cache_utils.py:20-40\n\
  \   patches the upstream resolve_kv_cache_block_sizes function. The Ascend version\n   computes scheduler_block_size as\
  \ lcm(group_block_sizes) * dcp * pcp for hybrid\n   KV cache groups with CP, overriding the upstream restriction that hybrid\
  \ groups\n   with multiple block sizes cannot use CP. This means block_size interacts with\n   dcp_size and pcp_size multiplicatively\
  \ on Ascend.\n\n4. **Xlite graph mode compatibility**: vllm_ascend/ascend_config.py:560-565 shows that\n   when xlite graph\
  \ mode is enabled, a block_size other than 128 triggers a warning\n   that performance may be suboptimal. The recommended\
  \ block_size for xlite graph\n   mode is 128.\n\n5. **Prefix caching granularity**: The hash_block_size parameter (vllm/config/cache.py:54-65)\n\
  \   controls the granularity of prefix-caching hash computation. When hash_block_size\n   differs from block_size, the effective\
  \ block size for hashing can be a multiple\n   of hash_block_size (vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:98-107),\n\
  \   with the constraint that block_size must be divisible by hash_block_size.\n\n6. **CPU offloading**: In KV cache CPU\
  \ offloading scenarios (user_guide/feature_guide/kv_cache_cpu_offload.md:68-69),\n   the CPU-side block_size should be a\
  \ multiple of the NPU-side block_size, with a\n   typical value of 128. Each CPU block consumes memory proportional to\n\
  \   block_size × num_layers × (key_size + value_size).\n\nThe upstream default is 16, but vllm-ascend documentation and\
  \ examples consistently recommend 128 for Ascend NPU deployments, as seen in tutorials/models/Mixtral-8x7B-Instruct-v0.1.md:93-105.\n"

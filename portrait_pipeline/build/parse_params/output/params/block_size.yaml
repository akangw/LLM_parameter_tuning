related_parameters:
- name: --hash-block-size
  relation: block_size must be divisible by hash_block_size when prefix caching is enabled
- name: --cp-kv-cache-interleave-size
  relation: block_size must be >= cp_kv_cache_interleave_size and divisible by it; must equal block_size for KV cache transfer
    scenarios
- name: --decode-context-parallel-size / --prefill-context-parallel-size
  relation: On Ascend, scheduler_block_size = lcm(group_block_sizes) * dcp * pcp for hybrid KV groups
- name: --gpu-memory-utilization
  relation: Together with block_size, determines how many KV cache blocks can be allocated in NPU memory
- name: --mamba-block-size
  relation: Separate block size for Mamba cache layers; must be multiple of 8
- name: --enable-prefix-caching
  relation: When enabled, hash_block_size granularity interacts with block_size
constraints:
- block_size must be a positive integer.
- block_size must be divisible by hash_block_size when prefix caching is enabled.
- block_size must be greater than or equal to cp_kv_cache_interleave_size.
- block_size must be divisible by cp_kv_cache_interleave_size.
- For KV cache transfer scenarios (KV pooling, PD disaggregation), cp_kv_cache_interleave_size must equal block_size.
- mamba_block_size must be a multiple of 8 to align with causal_conv1d kernel.
tuning_advice:
  summary: Use --block-size 128 for Ascend NPU deployments; this is the recommended value across vllm-ascend documentation
    and examples, and is required for optimal xlite graph mode performance.
  suggested_values:
  - scenario: General Ascend NPU deployment (v1 or v2 engine)
    value: '128'
    reason: Recommended by vllm-ascend documentation and tutorials; balances memory efficiency and fragmentation; required
      for xlite graph mode optimal performance.
  - scenario: Context Parallelism with KV cache transfer (KV pooling, PD disaggregation)
    value: '128'
    reason: cp_kv_cache_interleave_size must equal block_size for block-interleave KV cache splitting; 128 is the documented
      default.
  - scenario: CPU offloading enabled
    value: '128'
    reason: CPU-side block_size should be a multiple of NPU-side block_size; 128 is the typical documented value.
  - scenario: Short sequences / low max_model_len (testing only)
    value: '16'
    reason: Upstream default; reduces internal fragmentation for very short sequences but not recommended for production Ascend
      workloads.
  - scenario: Xlite graph mode enabled
    value: '128'
    reason: XliteGraphConfig warns if block_size != 128; using other values may cause suboptimal graph compilation performance.
  caveats:
  - The upstream vLLM default is 16, but vllm-ascend documentation and examples consistently use 128. Using 16 on Ascend may
    cause suboptimal performance, especially with xlite graph mode.
  - Larger block_size values (e.g., 256, 512) reduce metadata overhead but increase internal fragmentation — wasted KV cache
    space when sequences don't fill complete blocks.
  - When using Context Parallelism (DCP/PCP), block_size interacts multiplicatively with dcp_size and pcp_size on Ascend due
    to the patched block size resolution in patch_kv_cache_utils.py.
  - Changing block_size after prefix caching has been enabled with a different hash_block_size may cause hash mismatches.
  - For hybrid models with multiple KV cache groups, the Ascend patch allows CP with different block sizes per group, but
    the scheduler_block_size becomes lcm(group_block_sizes) * dcp * pcp, which can grow large.
  quick_guide: Always set --block-size 128 on Ascend NPU unless you have a specific reason to deviate (e.g., extremely short
    sequences in testing).

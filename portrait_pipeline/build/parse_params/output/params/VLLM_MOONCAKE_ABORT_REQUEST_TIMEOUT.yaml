  relation: Analogous timeout parameter for NixlConnector in disaggregated PD setups; same default value (480s)
constraints:
- Must be a positive integer representing seconds
- Only applicable when using MooncakeConnector in a disaggregated prefill-decode setup
tuning_advice:
  summary: 'Adjust this timeout based on your maximum expected request latency and available KV cache memory in disaggregated
    prefill-decode deployments on Ascend NPU.

    '
  suggested_values:
  - scenario: Default / general-purpose disaggregated serving
    value: '480'
    reason: The default 480 seconds (8 minutes) provides ample time for most inference requests to complete before resources
      are forcibly freed
  - scenario: High-throughput serving with limited KV cache memory
    value: '120'
    reason: A shorter timeout (2 minutes) frees stale KV cache blocks faster, reducing memory pressure at the cost of potentially
      aborting long-running requests
  - scenario: Serving very long-context or slow-generation models
    value: '900'
    reason: A longer timeout (15 minutes) accommodates requests that may take many minutes to generate, preventing premature
      aborts
  caveats:
  - This parameter only takes effect in disaggregated prefill-decode (PD) deployments using MooncakeConnector; it has no effect
    in monolithic serving or with other KV connectors
  - On Ascend NPU, the vllm-ascend Mooncake connector uses this timeout for delayed request cleanup, not for transfer timeout
    — the behavior differs from upstream vLLM's usage
  - Setting the timeout too low may cause active requests to be forcibly aborted, leading to failed generations and wasted
    computation
  - Setting the timeout too high may cause KV cache memory to be exhausted if many requests stall or fail to send completion
    notifications
  quick_guide: Use the default 480s unless you observe KV cache memory exhaustion (reduce) or premature request aborts (increase)
    in your disaggregated PD setup
analysis_date: '2026-07-06'

name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
type: env
category: communication
scope: both
source_file:
- vllm/envs.py:1490
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:201
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_hybrid_connector.py:194
value_type: int
default: '480'
valid_choices: positive integer (seconds)
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- memory
- throughput
impact_detail: 'This environment variable controls the timeout (in seconds) for the MooncakeConnector in a disaggregated prefill-decode
  (PD) setup. It is used in two distinct code paths:

  1. **vllm-ascend (Ascend NPU)**: In `mooncake_connector.py` and `mooncake_hybrid_connector.py`, the timeout governs how
  long a "delayed free request" is held before its resources (KV cache blocks) are forcibly released. When a request''s delay
  exceeds this timeout, the request is removed from the processing queue and its blocks are freed, preventing memory leaks
  on the producer side. This directly affects memory pressure: a shorter timeout frees memory faster but risks prematurely
  aborting requests that are still being processed; a longer timeout preserves requests longer but may cause memory exhaustion
  under high load.

  2. **vllm upstream (GPU)**: In `vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py`, the timeout
  is used in `asyncio.wait()` calls when waiting for the producer side to signal readiness for KV transfer. If the timeout
  expires, all pending transfer requests are cancelled and an error response is sent. This affects throughput by determining
  how long the system waits before aborting stalled transfers.

  On Ascend NPU, the primary performance impact is on memory management in disaggregated serving scenarios. The parameter
  does not directly affect compute throughput or latency for individual requests, but improper tuning can lead to memory pressure
  (too high) or unnecessary request aborts (too low), indirectly affecting overall throughput.

  '
usage_locations:
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:201
  context: Checks if a delayed free request has exceeded the timeout; if so, forcibly frees its resources
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_hybrid_connector.py:194

related_parameters:
- name: --gpu-memory-utilization
  relation: When num_gpu_blocks_override is None, gpu_memory_utilization determines the profiled num_gpu_blocks. When override
    is set, gpu_memory_utilization is effectively ignored for KV cache sizing.
- name: --block-size
  relation: The total KV cache memory equals num_gpu_blocks * block_size * bytes_per_token. Changing block_size changes the
    memory per block, so the same num_gpu_blocks_override value results in different total KV cache memory.
- name: --max-model-len
  relation: When max_model_len is -1 (auto), the system determines the maximum model length based on available KV cache blocks.
    The override affects this auto-fit calculation.
- name: --max-num-batched-tokens
  relation: The number of available KV cache blocks constrains how many tokens can be batched. Insufficient blocks may prevent
    reaching the configured max_num_batched_tokens.
constraints:
- Must be a positive integer or None. Negative values or zero are not valid.
- Must not exceed the number of blocks that can fit in available GPU/NPU memory. Setting this too high causes out-of-memory
  errors at initialization.
- On Ascend NPU, the effective maximum is limited by available HBM after model weights and CANN runtime overhead are loaded.
tuning_advice:
  summary: Leave as default (None) for automatic KV cache sizing based on gpu_memory_utilization. Only override for testing
    preemption behavior or when you need deterministic cache sizes across different hardware configurations.
  suggested_values:
  - scenario: Normal production deployment
    value: None
    reason: Allows vLLM to automatically profile and allocate the optimal number of KV cache blocks based on available GPU/NPU
      memory and gpu_memory_utilization. This is the safest and most efficient setting.
  - scenario: Testing preemption or memory-constrained scenarios
    value: A small integer (e.g., 32 or 64)
    reason: Artificially limits the KV cache size to trigger preemption behavior for testing. The test files use values like
      16 and 32 for this purpose.
  - scenario: Reproducible benchmarking across different hardware
    value: A fixed integer matching the target cache size
    reason: Ensures the same number of KV cache blocks regardless of available memory, enabling apples-to-apples comparisons
      between different GPU/NPU models or configurations.
  caveats:
  - Setting this too high on Ascend NPU can cause OOM because NPU HBM may be smaller than GPU VRAM for the same model. Always
    verify available HBM before setting a large override.
  - This parameter is intended for testing preemption. Using it in production to limit KV cache size is better achieved by
    adjusting gpu_memory_utilization, which automatically accounts for model weight memory and runtime overhead.
  - When this override is set, the auto-fit mechanism for max_model_len still uses the overridden block count, which may result
    in a max_model_len that does not reflect actual memory availability.
  - The override is applied per-worker. In multi-GPU/NPU setups with tensor parallelism, each worker gets the same number
    of blocks, so total KV cache memory scales with the number of workers.
  quick_guide: Keep as default (None) for production. Only set a specific value for preemption testing or cross-hardware benchmarking.

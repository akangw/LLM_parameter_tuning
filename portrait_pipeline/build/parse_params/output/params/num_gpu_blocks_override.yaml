name: --num-gpu-blocks-override
type: cli
category: kv_cache
scope: vllm
source_file:
- vllm/engine/arg_utils.py:1090
- vllm/config/cache.py:85
value_type: int | None
default: None
valid_choices: any positive integer or None
cli_example: --num-gpu-blocks-override 1024
deprecated: false
performance_impact: medium
performance_scope:
- memory
- throughput
- latency
impact_detail: "This parameter directly overrides the profiled `num_gpu_blocks` in the KV cache configuration. When set to\
  \ a non-None value, it replaces the automatically determined number of GPU KV cache blocks (which is calculated based on\
  \ available GPU memory and `gpu_memory_utilization`) with a user-specified value. This affects:\n1. **Memory allocation**:\
  \ The KV cache is the primary consumer of GPU memory during inference.\n   Setting this too high causes out-of-memory (OOM)\
  \ errors; setting it too low wastes GPU memory\n   and reduces the maximum batch size / sequence length that can be served.\n\
  \n2. **Throughput and latency**: The number of KV cache blocks determines how many tokens can be\n   stored simultaneously.\
  \ Fewer blocks mean the scheduler must evict or preempt requests more\n   aggressively, reducing throughput and increasing\
  \ latency. More blocks allow larger batches\n   and longer sequences, improving throughput but potentially increasing per-token\
  \ latency due\n   to larger memory footprint.\n\n3. **Auto-fit behavior**: In v1, when `original_max_model_len` is -1 (auto),\
  \ the system\n   automatically determines the maximum model length that fits in available GPU memory. The\n   override decouples\
  \ the cache size from profiled `available_memory`, and the code at\n   `vllm/v1/core/kv_cache_utils.py:1984-2003` adjusts\
  \ `available_memory` to reflect the\n   override so that auto-fit, admission checks, and per-worker config builders all\
  \ plan\n   against the same effective capacity.\n\n4. **CUDA graph profiling**: During CUDA graph capture, the system temporarily\
  \ overrides\n   `num_gpu_blocks_override` to allocate a minimal KV cache (`max_cudagraph_capture_size`\n   blocks) for profiling\
  \ purposes, then restores the original value. This is visible at\n   `vllm/v1/worker/gpu_model_runner.py:5973-5979`.\n\n\
  On Ascend NPU, the KV cache is allocated in NPU HBM (High Bandwidth Memory). The same override mechanism applies, but the\
  \ practical effect depends on the available NPU memory and the memory overhead of the Ascend CANN runtime. vllm-ascend does\
  \ not override or modify this parameter's behavior, but the effective number of blocks that can be allocated is constrained\
  \ by NPU HBM capacity, which may differ from GPU VRAM capacity for the same model.\nThe parameter is explicitly excluded\
  \ from the computation graph hash (`vllm/config/cache.py:194`), meaning changing it does not trigger recompilation.\n"

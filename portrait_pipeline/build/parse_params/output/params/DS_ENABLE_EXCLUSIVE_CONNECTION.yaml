name: DS_ENABLE_EXCLUSIVE_CONNECTION
type: env
category: communication
scope: vllm-ascend
source_file:
- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/backend/yuanrong_backend.py:36
value_type: bool
default: false
valid_choices:
- 0 (false)
- 1 (true)
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This environment variable controls whether the Yuanrong Datasystem client uses exclusive connection mode when
  communicating with the remote KV cache store. When enabled (set to "1"), it is passed to `HeteroClient.enable_exclusive_connection`,
  which may reduce connection contention in multi-process or multi-node deployments by dedicating a connection per client.
  The performance impact is indirect: "it affects the efficiency of KV cache transfer operations" (send/recv) between nodes
  during disaggregated prefill-decode scenarios. If connection multiplexing causes head-of-line blocking or contention, enabling
  exclusive connections can improve KV transfer latency and thus end-to-end throughput. However, this only applies when the
  Yuanrong backend is actively used for KV cache transfer; in standard vLLM deployments without disaggregated KV cache, this
  parameter has no effect.

  '
usage_locations:
- file: vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/backend/yuanrong_backend.py:36
  context: Read from environment in YuanrongConfig.load_from_env() to set enable_exclusive_connection field
related_parameters:
- name: DS_WORKER_ADDR
  relation: Required prerequisite; DS_ENABLE_EXCLUSIVE_CONNECTION is only meaningful when DS_WORKER_ADDR is set and the Yuanrong
    backend is active
- name: DS_ENABLE_REMOTE_H2D
  relation: Sibling parameter in YuanrongConfig, both control Yuanrong HeteroClient behavior
constraints:
- DS_WORKER_ADDR must be set for this parameter to have any effect; otherwise the Yuanrong backend is not configured
- Value must be parseable as an integer (0 or 1); any other value will cause a ValueError from bool(int(...))
tuning_advice:
  summary: 'Enable exclusive connection mode (set to 1) only if you observe KV transfer latency spikes or connection contention
    in multi-node disaggregated prefill-decode deployments using the Yuanrong Datasystem backend.

    '
  suggested_values:
  - scenario: Standard single-node or non-disaggregated deployment
    value: '0'
    reason: The Yuanrong backend is not active; the parameter has no effect and should remain at default
  - scenario: Multi-node disaggregated prefill-decode with Yuanrong backend and no connection issues
    value: '0'
    reason: Default shared connection mode is sufficient and avoids unnecessary resource usage
  - scenario: Multi-node disaggregated prefill-decode with Yuanrong backend experiencing KV transfer latency spikes
    value: '1'
    reason: Exclusive connections can eliminate head-of-line blocking caused by connection multiplexing, reducing KV transfer
      latency
  caveats:
  - This parameter only takes effect when the Yuanrong Datasystem backend is configured via DS_WORKER_ADDR; it is silently
    ignored otherwise
  - Enabling exclusive connections may increase the number of open connections to the Datasystem worker, which could strain
    worker-side resources if many vLLM instances are running
  - 'The performance benefit is workload-dependent: only observable when KV cache transfer is a bottleneck in disaggregated
    serving'
  quick_guide: Leave at default (0) unless KV transfer latency is a proven bottleneck in your Yuanrong-based disaggregated
    deployment
analysis_date: '2026-07-06'

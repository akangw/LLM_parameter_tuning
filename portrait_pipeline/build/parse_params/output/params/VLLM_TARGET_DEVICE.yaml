name: VLLM_TARGET_DEVICE
type: env
category: hardware
scope: vllm
source_file:
- vllm/envs.py:513
- vllm/envs.py:81
- setup.py:40
value_type: str
default: cuda
valid_choices:
- cuda
- rocm
- cpu
- xpu
- empty
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
- memory
impact_detail: 'VLLM_TARGET_DEVICE is an installation-time environment variable that determines which hardware backend vLLM
  is compiled for. It is read during `pip install` (setup.py:40) and at runtime (vllm/envs.py:513). On Ascend NPU, this parameter
  does NOT directly control runtime dispatch — vllm-ascend overrides the device detection via its own plugin mechanism. However,
  setting it incorrectly can cause vLLM to compile CUDA-specific kernels or skip Ascend-compatible code paths, leading to
  runtime errors or fallback to CPU. The vllm-ascend documentation explicitly recommends setting VLLM_TARGET_DEVICE=empty
  when installing vLLM for Ascend use (doc: developer_guide/contribution/index.md:47, testing.md:53, tutorials/models/Hunyuan-A13B-Instruct.md:53).
  This prevents vLLM from compiling any device-specific extensions, allowing vllm-ascend to provide the Ascend backend entirely.
  Performance impact is low because this is primarily a build-time flag; at runtime, vllm-ascend''s platform detection takes
  precedence.

  '
usage_locations:

related_parameters:
- name: VLLM_MAIN_CUDA_VERSION
  relation: Companion installation-time variable; only meaningful when VLLM_TARGET_DEVICE=cuda
- name: CMAKE_BUILD_TYPE
  relation: Both affect the vLLM build process; VLLM_TARGET_DEVICE selects which device-specific CMake targets are built
constraints:
- On macOS, VLLM_TARGET_DEVICE is automatically forced to "cpu" regardless of the set value.
- On non-Linux and non-macOS platforms, VLLM_TARGET_DEVICE is automatically forced to "empty".
- When installing vLLM for use with vllm-ascend on Ascend NPU, VLLM_TARGET_DEVICE must be set to "empty" to avoid compiling
  incompatible CUDA kernels.
tuning_advice:
  summary: 'For Ascend NPU deployments, always set VLLM_TARGET_DEVICE=empty during vLLM installation to prevent CUDA-specific
    compilation and let vllm-ascend provide the full backend.

    '
  suggested_values:
  - scenario: Installing vLLM for use with vllm-ascend on Ascend NPU
    value: empty
    reason: 'Prevents vLLM from compiling any device-specific (CUDA/ROCm) extensions. vllm-ascend provides the complete Ascend
      backend as a plugin, so the base vLLM installation should be device-agnostic. This is the documented recommendation
      in vllm-ascend developer guides.

      '
  - scenario: Installing vLLM for native CUDA GPU use
    value: cuda
    reason: Default value; compiles CUDA kernels and enables CUDA-specific optimizations.
  - scenario: Installing vLLM on macOS (any hardware)
    value: cpu
    reason: Automatically forced by setup.py; explicit setting is unnecessary but harmless.
  caveats:
  - This is primarily a build-time (pip install) variable. Changing it after installation has no effect on already-compiled
    extensions.
  - If VLLM_TARGET_DEVICE is not set to "empty" when building for Ascend, vLLM may attempt to compile CUDA kernels, which
    will fail if CUDA toolkit is not installed, or produce incompatible binaries if it is.
  - At runtime, vllm-ascend overrides device detection through its plugin system, so the runtime value of VLLM_TARGET_DEVICE
    has minimal direct impact on Ascend — but incorrect build-time configuration can cause import errors or missing operators.
  quick_guide: 'Set VLLM_TARGET_DEVICE=empty when pip-installing vLLM for Ascend NPU; this is a build-time flag, not a runtime
    tuning knob.

    '
analysis_date: '2026-07-06'

  context: get_io_processor() loads the plugin from vllm.io_processor_plugins entry point group
related_parameters:
- name: pooling_task
  relation: IOProcessor plugin is only used when pooling_task is 'plugin' or when has_io_processor() returns true
- name: VLLM_PLUGINS
  relation: Environment variable that can restrict which plugins are allowed to load
constraints:
- The plugin name must correspond to a registered entry point under the 'vllm.io_processor_plugins' group.
- The plugin's registered callable must return a fully-qualified class name string or None.
- The returned class must be importable and a valid IOProcessor subclass.
tuning_advice:
  summary: 'Only set this when deploying a custom pooling model that requires specialized input/output processing. For standard
    models, leave it unset (null) to avoid unnecessary plugin loading overhead.

    '
  suggested_values:
  - scenario: Standard embedding/classification/pooling models with built-in IO processors
    value: null
    reason: vLLM provides built-in IO processors for common pooling tasks (embed, classify, score, etc.); no plugin needed
  - scenario: Custom pooling model requiring specialized pre/post-processing
    value: <your_registered_plugin_name>
    reason: Enables custom data parsing and output formatting specific to your model
  caveats:
  - Plugin code runs in the API server process (process0) only — it does not benefit from NPU acceleration.
  - A slow plugin can become a bottleneck, increasing per-request latency regardless of NPU inference speed.
  - The plugin is loaded once at startup; runtime overhead is per-request, not per-token.
  - This parameter is listed in `ignored_factors` for model cache key computation, so changing it does not invalidate the
    compiled model cache.
  quick_guide: Leave unset unless deploying a custom pooling model with a registered IOProcessor plugin.
analysis_date: '2026-07-06'

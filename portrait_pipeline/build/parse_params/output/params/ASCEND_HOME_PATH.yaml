name: ASCEND_HOME_PATH
type: env
category: hardware
scope: vllm-ascend
source_file:
- vllm_ascend/envs.py:58
value_type: str
default: /usr/local/Ascend/ascend-toolkit/latest
valid_choices: any valid filesystem path to CANN toolkit installation
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
- latency
impact_detail: 'ASCEND_HOME_PATH specifies the root directory of the CANN (Compute Architecture for Neural Networks) toolkit
  installation on the Ascend NPU system. This path is used at runtime to locate critical compilation resources (TBE operator
  headers, AscendC API headers, op_common includes) during JIT compilation of custom CANN operators. When custom operators
  (e.g., add_rms_norm_bias, apply_top_k_top_p_custom, causal_conv1d, chunk_fwd_o, compressor, dequant_swiglu_quant) are compiled
  on-the-fly, the toolkit_path is resolved from this env var and used to construct include paths for the AscendC compiler.
  If ASCEND_HOME_PATH is not set, the code falls back to /usr/local/Ascend/latest/ (see add_rms_norm_bias.py:198-199 and similar
  patterns in all custom operator implementations). Additionally, ASCEND_HOME_PATH is used in the worker''s uninstall_static_kernel
  method (worker.py:173) to locate and execute the static kernel uninstall script at <ASCEND_HOME_PATH>/opp/static_kernel/ai_core/uninstall.sh.
  An incorrect or missing ASCEND_HOME_PATH will cause JIT compilation failures for custom operators, leading to runtime errors
  or fallback to slower execution paths. However, in normal deployments where CANN is installed at the standard location,
  this parameter has no direct performance tuning effect — it is purely a path configuration variable.

  '

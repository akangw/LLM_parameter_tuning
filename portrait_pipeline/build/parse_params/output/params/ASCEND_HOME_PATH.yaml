related_parameters:
- name: SOC_VERSION
  relation: Both are CANN toolkit configuration parameters; SOC_VERSION specifies the Ascend chip version used during package
    building, while ASCEND_HOME_PATH specifies the toolkit installation location
- name: HCCL_SO_PATH
  relation: Both are Ascend hardware path configurations; HCCL_SO_PATH specifies the HCCL communication library path, while
    ASCEND_HOME_PATH specifies the CANN toolkit root
constraints:
- ASCEND_HOME_PATH must point to a valid CANN toolkit installation directory containing the opp/static_kernel and pkg_inc/op_common
  subdirectories
- If ASCEND_HOME_PATH is not set or is empty, the system falls back to /usr/local/Ascend/latest/ for JIT compilation include
  paths
- The worker's uninstall_static_kernel method reads ASCEND_HOME_PATH directly from os.environ without a fallback, so it must
  be set before worker initialization to avoid KeyError
tuning_advice:
  summary: Set ASCEND_HOME_PATH only if CANN is installed at a non-standard location; otherwise leave it unset to use the
    default /usr/local/Ascend/ascend-toolkit/latest
  suggested_values:
  - scenario: Standard CANN installation at default path
    value: <unset>
    reason: The code falls back to /usr/local/Ascend/latest/ for JIT compilation and the envs.py default is /usr/local/Ascend/ascend-toolkit/latest;
      no explicit setting needed
  - scenario: CANN installed at a custom or versioned path (e.g., /opt/Ascend/ascend-toolkit/8.0.RC1)
    value: /opt/Ascend/ascend-toolkit/8.0.RC1
    reason: Ensures JIT compilation of custom operators uses the correct CANN headers and the static kernel uninstall script
      is found at the correct location
  caveats:
  - Setting ASCEND_HOME_PATH to an incorrect or non-existent path will cause JIT compilation failures for custom CANN operators,
    potentially falling back to slower execution or crashing at runtime
  - The worker.py uninstall_static_kernel method accesses os.environ['ASCEND_HOME_PATH'] without a default fallback, so the
    variable must be set before the worker process starts
  - This parameter does not directly tune performance; it only ensures correct compilation and execution of Ascend-specific
    operators
  quick_guide: Leave ASCEND_HOME_PATH unset unless CANN is installed at a non-default location; verify the path contains opp/static_kernel
    and pkg_inc/op_common subdirectories

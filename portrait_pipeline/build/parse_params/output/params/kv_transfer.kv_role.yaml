impact_detail: "This parameter determines the role of the vLLM instance in Prefill-Decode (PD) disaggregation, which is a\
  \ critical architecture choice for Ascend NPU deployments. The three roles are:\n- \"`kv_producer`: The instance runs the\
  \ prefill phase and produces KV cache blocks, which are\"\n  transferred to consumer instances via KV transfer connectors\
  \ (e.g., Mooncake, AscendStore).\n  This instance does NOT perform decode — it offloads that work to consumers.\n\n- \"\
  `kv_consumer`: The instance receives KV cache blocks from a producer and performs only the\"\n  decode phase. It does not\
  \ run prefill computation.\n\n- \"`kv_both`: The instance performs both prefill and decode locally (PD-mixed mode). No KV\"\
  \n  transfer between instances occurs.\n\nOn Ascend NPU, this parameter gates multiple performance-critical features:\n\
  1. **Layer Sharding** (`additional_config.layer_sharding`): Only available when `kv_role` is\n   `kv_producer` (vllm_ascend/platform.py:307).\
  \ Layer sharding distributes transformer layers\n   across NPUs for memory savings and higher throughput on the prefill\
  \ side.\n\n2. **Recompute Scheduler** (`recompute_scheduler_enable`): Only available in PD-disaggregated\n   mode (`kv_producer`\
  \ or `kv_consumer`). It is explicitly forbidden in PD-mixed mode\n   (`kv_both`), and startup will fail with a clear error\
  \ (vllm_ascend/platform.py:586-593).\n   The recompute scheduler trades compute for memory by recomputing activations during\n\
  \   backward passes, enabling larger batch sizes on memory-constrained NPUs.\n\n3. **Balance Scheduling** (`enable_balance_scheduling`):\
  \ Only supports PD-mixed mode\n   (`kv_both` or no kv_transfer_config). It is explicitly forbidden in PD-disaggregated mode\n\
  \   (vllm_ascend/platform.py:574-582). Balance scheduling optimizes load distribution across\n   NPUs in mixed prefill-decode\
  \ scenarios.\n\n4. **DSA Context Parallel with Layer Sharding** (`enable_dsa_cp_with_layer_shard`): Only\n   activates on\
  \ the prefill side when `kv_role` is `kv_producer` (vllm_ascend/utils.py:1510).\n   This optimization hides layer-sharding\
  \ broadcast overhead behind prefill computation.\n\n5. **KV Transfer Connector Selection**: The role determines which connector\
  \ code paths are\n   active. In `kv_producer` mode, the instance sends KV cache; in `kv_consumer` mode, it\n   receives.\
  \ The Mooncake and AscendStore connectors use this to configure RDMA transfers\n   over HCCS/RoCE on Ascend NPUs.\n\n6.\
  \ **RFork Model Loading**: The disaggregation mode derived from `kv_role` is encoded into\n   the seed key for RFork topology-sensitive\
  \ model loading (vllm_ascend/model_loader/\n   rfork/rfork_loader.py:96). This ensures only topology-compatible instances\
  \ share seeds.\n\nThe upstream vLLM default is `kv_both` (vllm/config/vllm.py:714), which means no disaggregation. vllm-ascend\
  \ inherits this default but adds Ascend-specific validation and feature gating on top of it.\nChoosing the wrong role for\
  \ your deployment topology will cause either startup failures (due to validation checks) or severe performance degradation\
  \ (e.g., running prefill on a consumer-only instance wastes compute, while running decode on a producer-only instance leaves\
  \ decode capacity idle).\n"

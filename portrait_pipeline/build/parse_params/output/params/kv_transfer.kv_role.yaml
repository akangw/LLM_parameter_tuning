related_parameters:
- name: kv_transfer_config.kv_connector
  relation: Must be set to a valid connector (e.g., MooncakeConnector, AscendStoreConnector) for PD-disaggregated mode to
    function
- name: additional_config.layer_sharding
  relation: Only valid when kv_role is kv_producer; raises ValueError otherwise
- name: additional_config.recompute_scheduler_enable
  relation: Only valid when kv_role is kv_producer or kv_consumer; raises ValueError if kv_both
- name: additional_config.enable_balance_scheduling
  relation: Only valid when kv_role is kv_both or no kv_transfer_config; raises ValueError in PD-disaggregated mode
- name: parallel_config.prefill_context_parallel_size
  relation: Context parallelism on prefill side interacts with kv_role for KV transfer block size calculation
- name: parallel_config.decode_context_parallel_size
  relation: Context parallelism on decode side interacts with kv_role for KV transfer block size calculation
constraints:
- kv_role must be 'kv_producer' to enable additional_config.layer_sharding; startup will fail with ValueError otherwise
- kv_role must be 'kv_producer' or 'kv_consumer' to enable recompute_scheduler_enable; startup will fail with ValueError if
  kv_role is 'kv_both'
- kv_role must be 'kv_both' (or kv_transfer_config must be absent) to enable enable_balance_scheduling; startup will fail
  with ValueError in PD-disaggregated mode
- When kv_role is 'kv_producer' or 'kv_consumer', a valid kv_connector must be configured for KV transfer to function
- Mooncake Hybrid Connector requires cp_world_size (pcp_size * dcp_size) to be 1
tuning_advice:
  summary: 'Choose kv_role based on your deployment topology: "use kv_both for single-instance or" homogeneous deployments,
    and kv_producer/kv_consumer for PD-disaggregated deployments that separate prefill and decode across different Ascend
    NPU instances.

    '
  suggested_values:
  - scenario: Single-instance or homogeneous multi-instance deployment (all instances do both prefill and decode)
    value: kv_both
    reason: 'This is the default and simplest configuration. All instances perform both prefill and decode locally. Compatible
      with balance_scheduling for load optimization. No KV transfer overhead. Suitable for most standard deployments.

      '
  - scenario: PD-disaggregated deployment — prefill node (P node)
    value: kv_producer
    reason: 'The prefill node runs only the prefill phase and sends KV cache to consumer nodes. This enables layer_sharding
      for memory savings and higher prefill throughput. DSA context parallel with layer sharding is automatically activated
      on Ascend NPU. The recompute_scheduler can be enabled to trade compute for memory, allowing larger batch sizes.

      '
  - scenario: PD-disaggregated deployment — decode node (D node)
    value: kv_consumer
    reason: 'The decode node receives KV cache from the producer and runs only the decode phase. This allows the decode node
      to be optimized specifically for low-latency token generation. The recompute_scheduler can be enabled for memory-compute
      tradeoffs. Decode nodes can scale independently from prefill nodes.

      '
  caveats:
  - PD-disaggregated mode (kv_producer/kv_consumer) requires a KV transfer connector (e.g., MooncakeConnector, AscendStoreConnector)
    and network infrastructure (RDMA/RoCE) for KV cache transfer between nodes
  - balance_scheduling is incompatible with PD-disaggregated mode — if you need both prefill-decode separation and load balancing,
    you must implement load balancing at the orchestration layer instead
  - recompute_scheduler_enable is incompatible with PD-mixed mode (kv_both) — it only works in disaggregated mode where the
    memory-compute tradeoff is beneficial
  - layer_sharding is only available on the prefill side (kv_producer) — decode nodes cannot use layer sharding
  - RFork model loading uses kv_role to build seed keys — changing kv_role will prevent seed matching with instances that
    have a different role, potentially slowing down model loading
  - 'Mooncake Hybrid Connector has additional constraints: it requires cp_world_size to be 1, meaning context parallelism
    cannot be combined with hybrid KV transfer'
  - When switching between PD-mixed and PD-disaggregated modes, you must also update related parameters (kv_connector, layer_sharding,
    recompute_scheduler_enable, balance_scheduling) to avoid startup failures
  quick_guide: 'Use kv_both for standard deployments; use kv_producer on prefill nodes and kv_consumer on decode nodes for
    PD-disaggregated deployments with KV transfer connectors.

    '

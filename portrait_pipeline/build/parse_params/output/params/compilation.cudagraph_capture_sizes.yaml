performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter defines the exact batch sizes (in number of sequences) for which CUDA/ACL graphs are captured.\
  \ On Ascend NPU, graph capture eliminates per-step kernel launch overhead by pre-recording a static execution graph. The\
  \ capture sizes directly determine:\n1) **Latency**: At runtime, actual batch sizes are padded up to the nearest\n   captured\
  \ size. If the gap between captured sizes is large, many requests\n   waste computation on padding tokens, increasing per-step\
  \ latency. Finer\n   granularity reduces padding waste but increases graph capture time and\n   memory.\n\n2) **Throughput**:\
  \ More captured sizes mean better batch size matching, which\n   improves hardware utilization. However, each captured graph\
  \ consumes NPU\n   memory. On Ascend, the vllm-ascend platform overrides the default max\n   capture size computation: \"\
  instead of upstream's `max_num_seqs * 2` (capped\"\n   at 512), Ascend uses `max_num_seqs * decode_query_len` (capped at\
  \ 512),\n   where `decode_query_len = 1 + num_speculative_tokens`. This means with\n   speculative decoding, the capture\
  \ sizes must be multiples of\n   `decode_query_len`.\n\n3) **Memory**: Each captured graph allocates persistent NPU memory\
  \ for\n   intermediate tensors. Excessive capture sizes can cause OOM, especially\n   with large models or high `max_num_seqs`.\n\
  \n4) **Sequence Parallelism (SP)**: When TP > 1 and SP is enabled, vllm-ascend\n   filters capture sizes to only those that\
  \ are multiples of `tp_size`\n   (vllm_ascend/platform.py:463-476). Non-conforming sizes are dropped, and\n   `max_cudagraph_capture_size`\
  \ is adjusted to the largest valid size.\n\n5) **Speculative Decoding**: With EAGLE/MTP, each decode step processes\n  \
  \ `1 + num_speculative_tokens` tokens per sequence. The documentation\n   explicitly states that capture sizes must be `n\
  \ * (K + 1)` where K is\n   `num_speculative_tokens`. The vllm-ascend compilation interface filters\n   sizes to those between\
  \ `uniform_decode_query_len` and `max_num_tokens`\n   (vllm_ascend/compilation/compiler_interface.py:71-79).\n\nThe parameter\
  \ is read in v1 worker (model_runner_v1.py:532) to set `cudagraph_batch_sizes`, in v2 worker (aclgraph_utils.py:62) to set\
  \ `capture_sizes`, and in Eagle speculative decode managers (spec_decode/eagle/aclgraph.py:52,141) for draft model graph\
  \ capture. It also affects MC2 token capacity computation (ascend_forward_context.py:202-210).\n"

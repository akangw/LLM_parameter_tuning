related_parameters:
- name: compilation.cudagraph_mode
  relation: cudagraph_capture_sizes is only used when cudagraph_mode is not NONE. If mode is NONE, capture sizes are ignored.
- name: compilation.max_cudagraph_capture_size
  relation: Mutually exclusive with cudagraph_capture_sizes at the CLI level. When cudagraph_capture_sizes is set, max_cudagraph_capture_size
    is derived from the largest capture size.
- name: scheduler_config.max_num_seqs
  relation: The default capture sizes are computed based on max_num_seqs. On Ascend, the default max is min(max_num_seqs *
    decode_query_len, 512).
- name: speculative_config.num_speculative_tokens
  relation: With speculative decoding, capture sizes must be multiples of (1 + num_speculative_tokens). The compilation interface
    filters sizes accordingly.
- name: parallel_config.tensor_parallel_size
  relation: When sequence parallelism is enabled with TP > 1, capture sizes must be multiples of tp_size.
- name: model_config.enforce_eager
  relation: When enforce_eager is True, cudagraph_mode is set to NONE and cudagraph_capture_sizes is set to [].
constraints:
- cudagraph_capture_sizes and max_cudagraph_capture_size are mutually exclusive at the CLI level; setting both raises a ValueError.
- When speculative decoding (EAGLE/MTP) is enabled, each capture size must be a multiple of (1 + num_speculative_tokens).
- When sequence parallelism is enabled with tensor_parallel_size > 1, each capture size must be a multiple of tensor_parallel_size,
  otherwise an assertion error is raised.
- When enforce_eager is True, cudagraph_capture_sizes is forcibly set to an empty list and cudagraphs are disabled.
- Capture sizes must be positive integers; the compilation interface filters out sizes outside [uniform_decode_query_len,
  max_num_tokens].
tuning_advice:
  summary: Set cudagraph_capture_sizes to cover your typical batch size distribution with fine granularity at small sizes
    and coarser granularity at large sizes, while respecting Ascend-specific constraints for speculative decoding and sequence
    parallelism.
  suggested_values:
  - scenario: Standard decode-only deployment without speculative decoding (max_num_seqs <= 64)
    value: '[1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64]'
    reason: Provides good coverage for typical batch sizes with 8-step granularity. The default Ascend behavior auto-generates
      similar sizes capped at min(max_num_seqs * decode_query_len, 512).
  - scenario: EAGLE speculative decoding with num_speculative_tokens=4, supporting batch sizes 1-4
    value: '[5, 10, 15, 20]'
    reason: Each decode step processes 5 tokens per sequence (1 target + 4 draft). Capture sizes must be multiples of 5. This
      is explicitly required by vllm-ascend documentation.
  - scenario: MTP speculative decoding with num_speculative_tokens=1, max_num_seqs=32
    value: '[2, 4, 8, 16, 24, 32, 40, 48, 56, 64]'
    reason: With MTP, decode_query_len=2. Sizes must be multiples of 2. The recommended pattern is n * (mtp + 1) for n from
      1 to max_num_seqs.
  - scenario: Sequence parallelism enabled with tp_size=8
    value: '[8, 16, 24, 32, 40, 48, 56, 64]'
    reason: All capture sizes must be multiples of tp_size=8. Non-conforming sizes are filtered out and may cause the max
      capture size to be reduced.
  - scenario: High-throughput production with max_num_seqs=128, no speculation
    value: '[1, 2, 4, 8, 16, 24, 32, 48, 64, 80, 96, 112, 128]'
    reason: Coarser granularity at larger sizes reduces graph capture time and memory while still providing reasonable padding
      efficiency for high-concurrency scenarios.
  caveats:
  - On Ascend NPU, the default max capture size is min(max_num_seqs * decode_query_len, 512), which differs from upstream's
    min(max_num_seqs * 2, 512). With speculative decoding, this can produce larger capture sizes than expected.
  - Each captured graph consumes NPU memory. Setting too many capture sizes can cause OOM, especially with large models. Monitor
    NPU memory usage when adding sizes.
  - When sequence parallelism filters out non-conforming sizes, the effective max_cudagraph_capture_size may be reduced, potentially
    causing runtime errors if no valid sizes remain.
  - The vllm-ascend compilation interface (compiler_interface.py:77) filters capture sizes to [uniform_decode_query_len, max_num_tokens].
    Sizes outside this range are silently dropped.
  - In PD (Prefill-Decode) separation scenarios, set capture sizes based on the frequently occurring request counts on decode
    nodes for optimal performance.
  quick_guide: For standard deployments, use the default auto-computed sizes. For speculative decoding, set sizes to multiples
    of (1 + num_speculative_tokens). For sequence parallelism, ensure all sizes are multiples of tp_size.

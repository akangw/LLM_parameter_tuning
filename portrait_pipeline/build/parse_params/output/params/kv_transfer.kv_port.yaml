valid_choices: integer port number, typically >= 20000; must avoid AscendDirectTransport reserved range
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'This parameter serves as the base port for Mooncake KV transfer handshake channels in vllm-ascend''s P/D (prefill/decode)
  disaggregation. It is used to compute `side_channel_port` by adding an offset based on data_parallel_rank, tp_size, pp_size,
  and pcp_size. Each device then derives its `handshake_port` as `side_channel_port + device_index`. If kv_port conflicts
  with AscendDirectTransport''s randomly allocated RDMA ports (range [20000, 20000 + npu_per_node × 1000)), startup fails
  with "Address already in use" errors, preventing KV cache transfer between prefill and decode nodes. This directly blocks
  P/D disaggregation, causing deployment failure and zero throughput. Even without conflicts, incorrect port assignment can
  cause connection delays during handshake, increasing end-to-end latency for KV cache transfer operations.

  '

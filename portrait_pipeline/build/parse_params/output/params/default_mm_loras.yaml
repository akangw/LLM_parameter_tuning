name: --default-mm-loras
type: cli
category: model
scope: vllm
source_file:
- vllm/engine/arg_utils.py:1260
- vllm/config/lora.py:52
value_type: dict
default: 'null'
valid_choices: dict[str, str] | None
cli_example: '--default-mm-loras ''{"image": "/path/to/image_lora"}'''
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This parameter controls automatic LoRA adapter selection for multimodal models. When a request contains a
  specific modality (e.g., image, audio), the corresponding LoRA adapter is automatically applied without the client explicitly
  specifying it. The performance impact is indirect and minor: "it affects which LoRA weights are" loaded and applied during
  inference. On Ascend NPU, LoRA computation follows the same code path as explicitly requested LoRAs — the parameter only
  changes the selection logic, not the computation itself. The primary effect is on model behavior correctness rather than
  raw performance. However, if this parameter causes a LoRA to be applied where none would otherwise be used, it adds the
  computational overhead of LoRA matrix operations (typically small relative to the base model). Conversely, if it avoids
  loading unnecessary adapters, it may slightly reduce memory pressure. The parameter is only relevant when --enable-lora
  is also set and the model is multimodal.

  '
usage_locations:

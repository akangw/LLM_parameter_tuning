related_parameters:
- name: --enable-lora
  relation: Must be enabled for --default-mm-loras to have any effect
- name: --lora-modules
  relation: Default mm loras are merged into the static lora_modules list at server startup
- name: --max-loras
  relation: Default mm loras count toward the max_loras limit when active
constraints:
- --default-mm-loras can only be used with multimodal models; setting it for a non-multimodal model raises a ValueError
- Only one default modality LoRA can be active per request; if a prompt contains multiple modalities with registered default
  LoRAs, none will be applied
- Currently only supported for chat completions in online serving mode
tuning_advice:
  summary: 'Use --default-mm-loras only when your multimodal model always requires a specific LoRA adapter for certain modalities.
    This avoids clients needing to specify the LoRA in every request, but has negligible direct performance impact on Ascend
    NPU.

    '
  suggested_values:
  - scenario: Multimodal model where image inputs always need a specific LoRA
    value: '{"image": "/path/to/image_lora"}'
    reason: Automatically applies the image LoRA without client-side specification, reducing API complexity
  - scenario: No modality-specific LoRA requirement
    value: 'null'
    reason: Default; avoids unnecessary LoRA loading and keeps request routing simple
  caveats:
  - On Ascend NPU, LoRA computation overhead is the same whether the adapter is selected via --default-mm-loras or explicitly
    by the client — this parameter does not change the NPU kernel execution
  - If multiple modalities in a single prompt each have a default LoRA, none will be applied due to the single-LoRA-per-request
    limitation
  - This parameter is only active for chat completions in online serving; other endpoints and offline mode have separate resolution
    logic
  quick_guide: Set only if your multimodal model always needs a LoRA for a specific modality; otherwise leave as null.
analysis_date: '2026-07-06'

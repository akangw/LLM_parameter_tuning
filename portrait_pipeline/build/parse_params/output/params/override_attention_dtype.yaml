name: --override-attention-dtype
type: cli
category: model
scope: vllm
source_file:
- vllm/config/model.py:302
- vllm/engine/arg_utils.py:651
- vllm/engine/arg_utils.py:829
value_type: str
default: null
valid_choices: any valid torch dtype string (e.g., 'float16', 'bfloat16', 'float32')
cli_example: --override-attention-dtype float16
deprecated: false
performance_impact: low
performance_scope:
- memory
- throughput
impact_detail: 'This parameter overrides the data type used for attention computation, which is normally inferred from the
  model''s configuration. On Ascend NPU, the attention dtype affects: 1) Memory usage of attention intermediate tensors (Q,
  K, V projections and softmax outputs). 2) Whether FlashAttention or other optimized attention kernels can be selected —
  some kernels only support specific dtypes (e.g., float16 or bfloat16). 3) Numerical precision of attention scores, which
  can indirectly affect output quality but not directly throughput/latency in a significant way.

  The parameter is listed in `ignored_factors` in `ModelConfig.compute_hash` (vllm/config/model.py:373), meaning changing
  it does NOT invalidate the model cache hash. This confirms it is a runtime precision override rather than a structural model
  change.

  No vllm-ascend specific override or special handling was found for this parameter in the provided context. It is passed
  through to the model configuration and used by attention backends during initialization. The actual performance impact depends
  on whether the Ascend attention backend (e.g., torch_npu-based FlashAttention) supports the chosen dtype natively — if not,
  it may fall back to a slower generic implementation or cause errors.

  '
usage_locations:
- file: vllm/config/model.py:302
  context: Field definition in ModelConfig dataclass with default None
- file: vllm/engine/arg_utils.py:651
  context: EngineArgs attribute declaration, mapped from ModelConfig

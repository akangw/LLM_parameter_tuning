  context: Passed to ModelConfig constructor during engine initialization
related_parameters:
- name: --dtype
  relation: Sets the base model dtype; --override-attention-dtype overrides only the attention subset
- name: --attention-backend
  relation: The attention backend must support the overridden dtype, otherwise it may fall back or error
- name: --kv-cache-dtype
  relation: KV cache dtype is separate but should be compatible with attention dtype for consistency
constraints:
- Must be a valid PyTorch dtype string (e.g., 'float16', 'bfloat16', 'float32') or None.
- The chosen dtype must be supported by the selected attention backend on Ascend NPU.
tuning_advice:
  summary: Leave as default (None) unless you have a specific need to force attention precision; on Ascend NPU, float16 is
    generally optimal.
  suggested_values:
  - scenario: Default behavior (auto-inference from model config)
    value: null
    reason: Allows vLLM to automatically select the attention dtype based on the model's configuration, which is typically
      optimal and avoids compatibility issues with Ascend attention kernels.
  - scenario: Reducing memory usage on Ascend NPU when model uses float32 attention by default
    value: '''float16'''
    reason: Forces attention to use half precision, reducing memory footprint of attention intermediates. Ascend NPUs have
      native float16 support in their attention kernels.
  - scenario: Debugging numerical precision issues in attention
    value: '''float32'''
    reason: Forces full precision attention computation at the cost of higher memory usage and potentially slower execution
      on Ascend NPU.
  caveats:
  - On Ascend NPU, not all attention backends support all dtypes — forcing an unsupported dtype may cause runtime errors or
    silent fallback to slower implementations.
  - This parameter only affects attention computation, not the KV cache dtype (controlled separately by --kv-cache-dtype).
  - Changing this value does not invalidate the model cache hash, so it can be toggled without triggering model recompilation.
  quick_guide: Use default (None) for automatic dtype selection; only override to float16 if you need to reduce attention
    memory on Ascend NPU.
analysis_date: '2026-07-06'

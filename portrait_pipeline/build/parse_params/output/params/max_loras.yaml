cli_example: --max-loras 4
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: '--max-loras controls the maximum number of distinct LoRA adapters that can be active in a single batch. This
  parameter directly affects throughput and latency because it acts as a hard scheduling constraint: "when the number of distinct"
  LoRA adapters in the running batch reaches max_loras, the scheduler skips all waiting requests that require a different
  LoRA adapter, even if token budget and sequence capacity remain available. This is enforced across ALL Ascend scheduler
  variants (balance_schedule, recompute_scheduler, dynamic_batch, profiling_chunk) via the same pattern: after recording scheduled_loras
  from running requests, the scheduler checks `len(scheduled_loras) == self.lora_config.max_loras` and skips requests whose
  lora_int_id is not already in the set. Additionally, max_loras affects CUDA graph capture: when cudagraph_specialize_lora
  is enabled, separate graphs are captured for powers of 2 up to max_loras, and when specialization is disabled, graphs are
  captured with max_loras + 1 active adapters. On Ascend NPU, the v1 worker''s model_runner_v1.py uses max_loras as the num_active_loras
  for dummy runs (line 3297), which affects graph dispatch and memory allocation. Higher max_loras increases the number of
  CUDA graph variants captured, consuming more NPU memory and increasing capture time, but allows more LoRA diversity per
  batch, improving throughput in multi-tenant LoRA serving scenarios. Setting max_loras too low causes scheduler head-of-line
  blocking where requests with different LoRA adapters starve.

  '

related_parameters:
- name: --enable-lora
  relation: Must be enabled for --max-loras to take effect; without it, LoRA config is None and max_loras is ignored
- name: --max-cpu-loras
  relation: Must be >= max_loras; controls how many LoRA adapters can be stored in CPU memory
- name: --max-lora-rank
  relation: Together with max_loras determines LoRA memory footprint per batch
- name: --fully-sharded-loras
  relation: Affects how LoRA computation is distributed across tensor parallel ranks; interacts with max_loras memory usage
- name: --specialize-active-lora
  relation: When enabled, CUDA graphs are captured for powers of 2 up to max_loras; higher max_loras means more graph variants
constraints:
- --max-loras must be >= 1 (enforced by Field(ge=1) in LoRAConfig)
- --max-cpu-loras must be >= --max-loras when set
- --max-loras only takes effect when --enable-lora is set; otherwise the entire LoRA config is None
- The number of distinct LoRA adapters in a single batch must not exceed --max-loras (enforced by assert in all Ascend schedulers)
tuning_advice:
  summary: 'Set --max-loras to the expected maximum number of distinct LoRA adapters that will be active concurrently in a
    single batch. Higher values increase NPU memory usage (more CUDA graph variants) but prevent scheduler head-of-line blocking
    in multi-tenant LoRA serving.

    '
  suggested_values:
  - scenario: Single LoRA adapter serving (one model variant)
    value: '1'
    reason: 'Minimizes CUDA graph capture overhead and NPU memory usage. No scheduler blocking since all requests use the
      same adapter.

      '
  - scenario: Multi-tenant LoRA serving with 2-4 concurrent adapters
    value: '4'
    reason: 'Balances batch diversity with memory overhead. Powers of 2 align with CUDA graph specialization capture sizes
      when --specialize-active-lora is enabled, avoiding wasted graph variants.

      '
  - scenario: High multi-tenancy with 5-8 concurrent adapters
    value: '8'
    reason: 'Allows up to 8 distinct LoRA adapters per batch. Expect increased NPU memory consumption for additional CUDA
      graph variants. Monitor GPU memory and consider reducing --max-num-seqs if OOM occurs.

      '
  - scenario: Maximum LoRA diversity (many tenants)
    value: '16'
    reason: 'Upper bound for most practical deployments. Beyond 16, CUDA graph capture time and memory overhead become significant.
      Consider disabling --specialize-active-lora to reduce graph variants at the cost of some performance.

      '
  caveats:
  - On Ascend NPU, higher --max-loras increases CUDA graph capture time and NPU memory usage because separate graphs are captured
    for different active LoRA counts (powers of 2 up to max_loras when --specialize-active-lora is enabled)
  - 'Setting --max-loras too low causes scheduler starvation: requests with LoRA adapters not in the current batch will be
    repeatedly skipped, increasing time-to-first-token latency'
  - The v1 Ascend worker uses max_loras as num_active_loras for dummy runs during model execution, which may allocate more
    memory than actually needed if the batch has fewer active LoRAs
  - All Ascend scheduler variants (balance_schedule, recompute_scheduler, dynamic_batch, profiling_chunk) enforce the same
    max_loras constraint — there is no Ascend-specific relaxation of this limit
  - When --specialize-active-lora is disabled, CUDA graphs are captured with max_loras + 1 active adapters, meaning even a
    small max_loras value results in graphs sized for max_loras + 1
  quick_guide: 'Match --max-loras to the number of distinct LoRA adapters you expect to serve concurrently. Use powers of
    2 (1, 2, 4, 8) for optimal CUDA graph specialization. Start with 4 for multi-tenant serving and adjust based on observed
    NPU memory usage and scheduler statistics.

    '

name: --attention-config
type: cli
category: other
scope: both
source_file:
- vllm/engine/arg_utils.py:1430
- vllm_ascend/platform.py:1025
value_type: dict
default: AttentionConfig()
valid_choices: JSON string or dict mapping to AttentionConfig fields
cli_example: '--attention-config ''{"flash_attn_version": 2}'''
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: '--attention-config accepts a JSON string that is deserialized into an AttentionConfig object (vllm/config/attention.py).
  This config controls which attention backend is used (e.g., FLASH_ATTN, FLASHINFER, TORCH_SDPA, etc.), the FlashAttention
  version, and several GPU-vendor-specific flags. On Ascend NPU, vllm-ascend (platform.py:1025-1043) silently resets six NVIDIA-specific
  boolean flags to False if they were set to True: use_prefill_decode_attention, use_cudnn_prefill, use_trtllm_ragged_deepseek_prefill,
  use_trtllm_attention, disable_flashinfer_prefill, and disable_flashinfer_q_quantization. The backend field is the primary
  performance lever — it determines which attention kernel implementation runs on the NPU. The flash_attn_version field controls
  the FlashAttention variant (2, 3, or 4) and is read by the v1 attention backend (vllm/v1/attention/backends/flash_attn.py:325,376)
  to configure CUDA graph capture splits and AOT scheduling. On Ascend, the actual supported backends and FA versions depend
  on the CANN/PTA attention operator availability, so setting an unsupported backend may cause fallback to a slower path or
  runtime errors.

  '

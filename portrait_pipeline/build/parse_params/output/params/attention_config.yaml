related_parameters:
- name: --attention-backend
  relation: Mutually exclusive with attention_config.backend; if both set, raises ValueError
- name: --compilation-config
  relation: flash_attn_max_num_splits_for_cuda_graph interacts with CUDA graph capture sizes
- name: --enable-flashinfer-autotune
  relation: Related to flashinfer attention backend; disable_flashinfer_prefill flag in attention_config
constraints:
- attention_backend and attention_config.backend are mutually exclusive — setting both raises a ValueError
- On Ascend NPU, use_prefill_decode_attention, use_cudnn_prefill, use_trtllm_ragged_deepseek_prefill, use_trtllm_attention,
  disable_flashinfer_prefill, and disable_flashinfer_q_quantization are silently reset to False
- TurboQuant cache dtype requires flash_attn_version=2; if version >= 3 is set, it is overridden to 2 with a warning
tuning_advice:
  summary: On Ascend NPU, use --attention-config primarily to set the backend and flash_attn_version; GPU-specific flags are
    silently ignored.
  suggested_values:
  - scenario: Ascend NPU with vllm-ascend (default attention backend)
    value: '{}'
    reason: Let vllm-ascend auto-select the appropriate Ascend attention backend; all GPU-specific flags are reset anyway
  - scenario: Ascend NPU requiring specific FlashAttention version
    value: '''{"flash_attn_version": 2}'''
    reason: Explicitly set FA2 which is most widely supported; FA3/FA4 are NVIDIA-specific and may not work on Ascend
  - scenario: Ascend NPU with custom attention backend override
    value: '''{"backend": "TORCH_SDPA"}'''
    reason: Fallback to PyTorch SDPA if the default Ascend attention backend has issues; may reduce throughput
  caveats:
  - vllm-ascend silently resets 6 NVIDIA-specific attention flags — setting them has no effect and produces a warning log
  - flash_attn_version values 3 and 4 are designed for NVIDIA Hopper/Blackwell architectures and may not be supported on Ascend
    NPU
  - The backend field directly selects the attention kernel — an unsupported backend on Ascend may cause runtime errors or
    fallback to a slow path
  - flash_attn_max_num_splits_for_cuda_graph only takes effect when CUDA graphs are enabled and FA3 AOT scheduling is active
    (NVIDIA-specific)
  quick_guide: On Ascend NPU, pass --attention-config only to set backend or flash_attn_version; all GPU-specific flags are
    silently ignored by vllm-ascend.

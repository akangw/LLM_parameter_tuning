name: speculative.num_speculative_tokens
type: nested
category: speculation
scope: both
source_file:
- vllm/config/speculative.py:734
- vllm_ascend/attention/attention_v1.py:245
- vllm_ascend/platform.py:208
- vllm_ascend/worker/model_runner_v1.py:461
- vllm_ascend/worker/pcp_utils.py:68
value_type: int
default: <computed>
valid_choices: 1 to 15 (Ascend NPU hard limit); must be divisible by draft model n_predict if using MTP
cli_example: '--speculative-config ''{"num_speculative_tokens": 4, "method": "eagle"}'''
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: "This parameter directly controls the number of tokens the draft model predicts per decoding step. On Ascend\
  \ NPU, it affects multiple performance-critical paths:\n1. **Decode threshold and attention kernel selection** (vllm_ascend/attention/attention_v1.py:245-251):\n\
  \   The Ascend attention backend computes `decode_threshold = 1 + num_speculative_tokens`.\n   This threshold determines\
  \ whether a request is treated as decode (query_len <= threshold)\n   or prefill. The `npu_fused_infer_attention_score`\
  \ operator has a hard limit of 16 on\n   the TND layout, so `num_speculative_tokens` must be <= 15. Exceeding this causes\
  \ an\n   assertion failure.\n\n2. **CUDA graph capture size** (vllm_ascend/platform.py:208-211):\n   The Ascend platform\
  \ overrides the default CUDA graph capture upper bound to\n   `min(max_num_seqs * (1 + num_speculative_tokens), 512)`. Larger\
  \ speculative token\n   counts increase the capture size, consuming more NPU memory but potentially improving\n   throughput\
  \ by covering more batch sizes.\n\n3. **Input batch and block table sizing** (vllm_ascend/worker/model_runner_v1.py:508,\n\
  \   vllm_ascend/worker/npu_input_batch.py:121): The `num_speculative_tokens` is passed\n   to `NPUInputBatch` and `MultiGroupBlockTable`,\
  \ affecting the allocation of block\n   tables and sampling buffers. Larger values increase memory footprint.\n\n4. **PCP\
  \ (Prefill-Chunked-Prefill) decode threshold** (vllm_ascend/worker/pcp_utils.py:68):\n   Same `decode_threshold = 1 + num_speculative_tokens`\
  \ logic applies in PCP mode,\n   affecting how requests are split between prefill and decode phases.\n\n5. **Batch token\
  \ validation** (vllm/engine/arg_utils.py:2016-2022): When LoRA is enabled,\n   `max_num_batched_tokens` must be >= `max_num_seqs\
  \ * (num_speculative_tokens + 1)`,\n   otherwise a ValueError is raised.\n\n6. **MTP divisibility constraint** (vllm/config/speculative.py:728-736):\
  \ For MTP draft\n   models with `n_predict`, `num_speculative_tokens` must be divisible by `n_predict`\n   to enable module\
  \ reuse.\n\nHigher values increase the number of candidate tokens per step, potentially improving throughput if the draft\
  \ model has high acceptance rates, but also increase memory usage and may reduce per-step latency due to larger attention\
  \ computations.\n"

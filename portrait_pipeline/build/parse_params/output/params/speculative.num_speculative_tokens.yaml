related_parameters:
- name: speculative_config.method
  relation: Must be set to 'mtp', 'eagle', 'eagle3', 'ngram', or 'deepseek_mtp' to enable speculative decoding
- name: speculative_config.draft_model_config
  relation: Draft model's n_predict determines default and divisibility constraint for num_speculative_tokens
- name: scheduler_config.max_num_seqs
  relation: Combined with num_speculative_tokens to compute CUDA graph capture size and batch token validation
- name: scheduler_config.max_num_batched_tokens
  relation: Must be >= max_num_seqs * (num_speculative_tokens + 1) when LoRA is enabled
- name: compilation_config.cudagraph_capture_sizes
  relation: When using EAGLE, must be set to multiples of (num_speculative_tokens + 1) for fullgraph mode
- name: speculative_config.disable_padded_drafter_batch
  relation: Controls whether speculative batches can have variable-length sequences; affects MTP method
constraints:
- num_speculative_tokens must be <= 15 on Ascend NPU due to npu_fused_infer_attention_score TND layout limit of 16 (decode_threshold
  = 1 + num_speculative_tokens <= 16)
- When using MTP with a draft model that has n_predict, num_speculative_tokens must be divisible by n_predict
- When LoRA is enabled, max_num_batched_tokens must be >= max_num_seqs * (num_speculative_tokens + 1)
- num_speculative_tokens is required when a speculative model is provided and the draft model config does not define a default
  (n_predict)
- When using EAGLE with fullgraph CUDA graph mode, cudagraph_capture_sizes must be multiples of (num_speculative_tokens +
  1)
tuning_advice:
  summary: Set num_speculative_tokens based on draft model acceptance rate and NPU memory budget; start with 1-4 for MTP,
    3-5 for EAGLE, and increase only if acceptance rate justifies the memory and compute overhead.
  suggested_values:
  - scenario: DeepSeek-V3 MTP on Ascend NPU (general recommendation)
    value: 1
    reason: Documentation default for DeepSeek MTP; balances speculative gain with minimal memory overhead and avoids large
      CUDA graph capture sizes
  - scenario: EAGLE draft model on Ascend NPU (balanced throughput)
    value: 4
    reason: Documentation example value; provides good throughput improvement with manageable memory overhead; cudagraph_capture_sizes
      should be [5, 10, 15, 20] for batch sizes 1-4
  - scenario: High-acceptance-rate draft model with ample NPU memory
    value: 5
    reason: Higher speculation depth can improve throughput if draft model consistently predicts correctly; monitor acceptance
      rate to ensure gains outweigh memory cost
  - scenario: Memory-constrained deployment or low acceptance rate
    value: 1
    reason: Minimizes memory overhead from larger block tables and CUDA graph capture sizes; reduces wasted computation from
      rejected tokens
  caveats:
  - 'Ascend NPU hard limit: num_speculative_tokens must be <= 15. The attention operator npu_fused_infer_attention_score uses
    a TND layout with a maximum of 16 tokens per decode round (1 target + up to 15 speculative).'
  - Higher num_speculative_tokens increases CUDA graph capture size (capped at 512), consuming more NPU memory. Monitor memory
    usage when increasing this value.
  - On 310P NPUs, ngram speculative decoding forces uniform_decode_query_len=1 for graph capture, which may interact with
    num_speculative_tokens settings.
  - EAGLE draft models require draft_tensor_parallel_size=1 (no tensor parallelism for the draft model), even if the target
    model uses TP.
  - When using fullgraph CUDA graph mode with EAGLE, cudagraph_capture_sizes must be explicitly set to multiples of (num_speculative_tokens
    + 1) for each desired batch size.
  - The actual throughput gain depends heavily on the draft model's acceptance rate. If acceptance rate is low, higher num_speculative_tokens
    wastes computation and memory.
  quick_guide: Start with num_speculative_tokens=1 for MTP or 4 for EAGLE; increase only if NPU memory permits and draft model
    acceptance rate is high.

name: --stream-interval
type: cli
category: scheduling
scope: vllm
source_file:
- vllm/config/scheduler.py:151
- vllm/engine/arg_utils.py:681
- vllm/engine/arg_utils.py:1374
- vllm/engine/arg_utils.py:1983

name: VLLM_DP_MASTER_IP
type: env
category: communication
scope: both
source_file:
- vllm/envs.py:1162
- vllm/envs.py:147
- vllm/config/parallel.py:816
value_type: str
default: 127.0.0.1
valid_choices: any valid IPv4 address string
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'VLLM_DP_MASTER_IP specifies the IP address of the master node in a data-parallel (DP) deployment. It is read
  in vllm/config/parallel.py:816 when the distributed executor backend is not "ray" or "mp" (i.e., the offline SPMD case).
  The value is stored as `self.data_parallel_master_ip` and used to establish the distributed communication backend (e.g.,
  torch.distributed or Ray) for coordinating multiple DP ranks. An incorrect or unreachable IP will cause the DP initialization
  to hang or fail, preventing the engine from starting. When DP is correctly configured, this parameter has no direct effect
  on per-step inference performance; it only affects the one-time setup cost and the ability to form the DP group. Therefore,
  its performance impact is low — it influences whether DP works at all, but not the steady-state throughput or latency of
  a successfully initialized deployment. On Ascend NPU, the same mechanism applies: the IP is used for HCCL/network communication
  setup between DP ranks. The vllm-ascend plugin does not override or alter this parameter''s behavior.

  '
usage_locations:
- file: vllm/envs.py:1162
  context: Environment variable definition with default '127.0.0.1'
- file: vllm/config/parallel.py:816
  context: Read into self.data_parallel_master_ip for offline SPMD DP mode

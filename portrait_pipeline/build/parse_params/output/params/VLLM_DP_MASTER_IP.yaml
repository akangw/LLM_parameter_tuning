related_parameters:
- name: VLLM_DP_MASTER_PORT
  relation: Must be set together; defines the full address for DP master node communication
- name: VLLM_DP_SIZE
  relation: DP world size; must be > 1 for this parameter to have any effect
- name: VLLM_DP_RANK
  relation: DP rank of the current process; used alongside master IP for distributed init
- name: VLLM_DP_RANK_LOCAL
  relation: Local DP rank; used alongside master IP for distributed init
constraints:
- VLLM_DP_MASTER_IP must be a valid, reachable IP address from all DP worker nodes.
- VLLM_DP_MASTER_IP is only used when data_parallel_size > 1 and the distributed executor backend is not 'ray' or 'mp' (i.e.,
  offline SPMD mode).
- In offline data parallel mode, this parameter is only supported for MoE models; dense models will raise a ValueError.
tuning_advice:
  summary: 'Set VLLM_DP_MASTER_IP to the IP address of the node running the DP rank-0 process. For single-node multi-NPU deployments,
    the default ''127.0.0.1'' is sufficient. For multi-node deployments, ensure the IP is reachable and not blocked by firewalls.

    '
  suggested_values:
  - scenario: Single-node multi-NPU DP (all ranks on one machine)
    value: 127.0.0.1
    reason: Localhost is sufficient and avoids network configuration issues.
  - scenario: Multi-node DP with a dedicated master node
    value: <master-node-ip>
    reason: Must be the IP address of the node where DP rank 0 will run, reachable from all worker nodes.
  caveats:
  - This parameter has no effect if data_parallel_size is 1 (the default).
  - Incorrect IP will cause the distributed initialization to hang or timeout, not fail immediately.
  - On Ascend, ensure the IP is reachable over the HCCL communication network (usually the high-speed interconnect subnet).
  quick_guide: Use '127.0.0.1' for single-node DP; set to the master node's IP for multi-node DP.

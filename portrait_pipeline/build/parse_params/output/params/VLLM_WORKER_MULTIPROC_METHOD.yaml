name: VLLM_WORKER_MULTIPROC_METHOD
type: env
category: hardware
scope: both
source_file:
- vllm/envs.py:791
- vllm/envs.py:65
- vllm/entrypoints/utils.py:169
- vllm/platforms/cpu.py:199
- vllm/platforms/xpu.py:252
value_type: str
default: fork
valid_choices:
- fork
- spawn
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'This environment variable controls the Python multiprocessing start method used to create worker processes
  in vLLM. The choice between "fork" and "spawn" has significant implications for Ascend NPU runtime performance and stability.

  On Ascend NPU, the vllm-ascend examples consistently set this to "spawn" (see examples/offline_inference_npu.py:24, examples/offline_data_parallel.py:68,
  examples/offline_disaggregated_prefill_npu.py:25, and others). This is because the "fork" method can cause issues with NPU
  device contexts and CANN runtime initialization. When using "fork", the child process inherits the parent''s memory space
  including NPU device state, which can lead to hangs, crashes, or incorrect behavior with HCCL communication and CANN driver
  interactions.

  The upstream vLLM CLI entrypoint (vllm/entrypoints/utils.py:169) automatically sets this to "spawn" if not already set,
  citing compatibility issues with accelerators. The CPU platform (vllm/platforms/cpu.py:199) and XPU platform (vllm/platforms/xpu.py:252)
  both force "spawn" as the only supported method.

  Performance impact: "\"spawn\" creates a fresh Python interpreter for each worker," which incurs additional startup overhead
  (model reloading, CANN context initialization per worker). However, this is necessary for correct operation on Ascend NPU.
  Using "fork" may appear to start faster but can cause intermittent failures, deadlocks in HCCL collective operations, or
  silent correctness issues that manifest as degraded throughput or hangs under load.

  The vllm-ascend documentation for large-scale expert parallelism (user_guide/feature_guide/large_scale_ep.md:206) explicitly
  sets this to "fork" for distributed DP server scenarios, suggesting that "fork" may be acceptable in specific multi-node
  configurations where workers are launched via external process managers rather than Python''s multiprocessing module.

  Additionally, NUMA binding (vllm/utils/numa_utils.py:297) requires "spawn" and will be silently ineffective with "fork",
  which can impact memory access locality and throughput on multi-socket Ascend servers.

  The Whisper model architecture (vllm/config/vllm.py:1168) and torch_shm IPC for multimodal tensors (vllm/config/vllm.py:920)
  both require "spawn" and will raise errors or warnings if "fork" is used.

  '

related_parameters:
- name: VLLM_ASCEND_EXTERNAL_DP_LB_ENABLED
  relation: When using external DP load balancing, documentation recommends setting VLLM_WORKER_MULTIPROC_METHOD to "fork"
- name: distributed_executor_backend
  relation: The multiprocessing method affects how Ray and mp executors spawn workers
constraints:
- torch_shm multimodal tensor IPC requires VLLM_WORKER_MULTIPROC_METHOD to be set to spawn, otherwise a ValueError is raised
- NUMA binding is silently ineffective unless VLLM_WORKER_MULTIPROC_METHOD is set to spawn
- Whisper model architecture may hang during startup if VLLM_WORKER_MULTIPROC_METHOD is not set to spawn
tuning_advice:
  summary: Always use 'spawn' on Ascend NPU for reliable operation; only consider 'fork' in externally-managed multi-node
    deployments with expert parallelism
  suggested_values:
  - scenario: Standard single-node or multi-node Ascend NPU inference
    value: spawn
    reason: Ensures clean NPU device context initialization per worker, avoids HCCL deadlocks, and is required by vllm-ascend
      examples and upstream accelerator safety defaults
  - scenario: Large-scale expert parallelism with external DP load balancing (multi-node)
    value: fork
    reason: vllm-ascend documentation recommends 'fork' when VLLM_ASCEND_EXTERNAL_DP_LB_ENABLED is set, as workers are managed
      externally and 'fork' avoids re-initialization overhead
  - scenario: NUMA-aware deployment on multi-socket Ascend servers
    value: spawn
    reason: NUMA binding requires 'spawn' to function; with 'fork' the binding is silently skipped, losing memory locality
      benefits
  caveats:
  - '''spawn'' incurs higher worker startup latency because each worker must re-import all modules and re-initialize the CANN
    runtime from scratch'
  - '''fork'' may appear to work initially but can cause intermittent HCCL communication failures or silent hangs under heavy
    load on Ascend NPU'
  - The upstream CLI entrypoint (vllm serve) automatically sets this to 'spawn' if not explicitly configured, but library
    usage (LLM() constructor) does not
  - When using 'spawn', ensure your inference script is guarded with 'if __name__ == "__main__":' to avoid recursive process
    spawning
  - The 'forkserver' method (checked in api_server.py) is not listed in valid_choices and is not supported on Ascend
  quick_guide: Set VLLM_WORKER_MULTIPROC_METHOD=spawn for all Ascend NPU deployments unless using external DP load balancing
    with expert parallelism

name: VLLM_ASCEND_ENABLE_MATMUL_ALLREDUCE
type: env
category: communication
scope: vllm-ascend
source_file:
- vllm_ascend/envs.py:71
- vllm_ascend/ascend_config.py:143
value_type: bool
default: false
valid_choices:
- 0 (disabled)
- 1 (enabled)
cli_example: null
deprecated: true
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: 'When enabled, this parameter activates a MatmulAllReduce fusion kernel that fuses the matrix multiplication
  and all-reduce communication operations during the prefill phase when tensor parallelism (TP) is enabled. On Ascend NPUs,
  all-reduce communication between TP ranks can be a significant bottleneck. By fusing the matmul computation with the all-reduce
  communication, the kernel overlaps computation and communication, reducing the overall latency of the prefill phase and
  improving throughput. The feature is specifically supported on Ascend A2 hardware (Ascend910B) and is noted to achieve better
  performance in eager mode rather than graph mode. The parameter is read in vllm_ascend/ascend_config.py:143 via the _get_config_value
  method, which checks both the additional_config dict (key: enable_matmul_allreduce) and the environment variable, with additional_config
  taking precedence. The env var is deprecated in favor of the additional_config key.

  '

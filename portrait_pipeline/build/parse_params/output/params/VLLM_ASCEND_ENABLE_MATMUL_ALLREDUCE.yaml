related_parameters:
- name: enable_matmul_allreduce
  relation: additional_config key that overrides this env var; takes precedence when both are set
- name: VLLM_ASCEND_ENABLE_FLASHCOMM1
  relation: Another communication optimization for TP; both can be enabled independently
- name: HCCL_BUFFSIZE
  relation: HCCL buffer size env var; test cases set HCCL_BUFFSIZE=500 alongside this feature
- name: tensor_parallel_size
  relation: This feature only takes effect when tensor parallelism is enabled (TP > 1)
constraints:
- This feature is only supported on Ascend A2 hardware (Ascend910B).
- Tensor parallelism must be enabled (tensor_parallel_size > 1) for this feature to have any effect.
- Eager mode is recommended over graph mode for better performance with this feature.
tuning_advice:
  summary: Enable on Ascend A2 (910B) with TP > 1 in eager mode to fuse matmul and all-reduce in prefill, improving throughput.
  suggested_values:
  - scenario: Ascend A2 (910B) with TP > 1, eager mode, prefill-heavy workloads
    value: '1'
    reason: Fuses matmul and all-reduce during prefill, overlapping computation with communication to reduce latency and improve
      throughput. Release notes confirm this feature was implemented specifically for prefill phase optimization.
  - scenario: Ascend A3 or other non-A2 hardware
    value: '0'
    reason: Feature is explicitly documented as supported only on A2 hardware. Enabling on unsupported hardware may cause
      errors or have no effect.
  - scenario: Graph mode (ACL graph / npugraph) with TP > 1
    value: '0'
    reason: Documentation states eager mode gets better performance with this feature. Graph mode may not benefit or could
      conflict with the fusion kernel.
  - scenario: Single card deployment (TP = 1)
    value: '0'
    reason: Feature requires tensor parallelism to be enabled; with TP=1 there is no all-reduce to fuse, so enabling has no
      effect.
  caveats:
  - This env var is deprecated; prefer using the additional_config key enable_matmul_allreduce instead.
  - The additional_config key takes precedence over the env var when both are set.
  - Performance benefit is most noticeable in prefill-heavy workloads where the matmul-allreduce fusion reduces communication
    overhead.
  - Test cases combine this with HCCL_BUFFSIZE=500, suggesting HCCL buffer tuning may complement this optimization.
  quick_guide: Set VLLM_ASCEND_ENABLE_MATMUL_ALLREDUCE=1 on Ascend910B with TP>1 in eager mode for prefill performance gains;
    use additional_config key enable_matmul_allreduce for non-deprecated configuration.

related_parameters:
- name: --speculative-config
  relation: Async scheduling is only compatible with EAGLE/MTP/Draft Model/NGram GPU speculative methods; incompatible methods
    force async_scheduling=False
- name: --scheduler-cls
  relation: When async_scheduling=True, vllm-ascend overrides scheduler_cls to AsyncRecomputeScheduler
- name: disable_padded_drafter_batch
  relation: Setting disable_padded_drafter_batch=True with async_scheduling=True raises ValueError
constraints:
- Async scheduling is only supported with EAGLE, MTP, Draft Model, or NGram GPU speculative decoding methods
- Async scheduling is not compatible with disable_padded_drafter_batch=True
- The executor backend must support async scheduling (checked via executor_class.supports_async_scheduling())
- Pooling models automatically disable async scheduling by default due to negative performance impact
tuning_advice:
  summary: Enable async scheduling (--async-scheduling) for most Ascend deployments to overlap CPU scheduling with NPU execution,
    improving throughput and reducing latency gaps; disable only if using incompatible speculative decoding methods or pooling
    models.
  suggested_values:
  - scenario: General LLM inference on Ascend NPU (v1 worker)
    value: 'true'
    reason: Async scheduling overlaps scheduler work with NPU computation, reducing idle time and improving throughput. vllm-ascend
      has full integration with AsyncRecomputeScheduler and PCPManager.
  - scenario: Using EAGLE speculative decoding on Ascend (v1 worker)
    value: 'true'
    reason: vllm-ascend explicitly adapted async scheduling for EAGLE speculative decoding; the AscendSpecDecodeBaseProposer
      reads this flag to coordinate draft token handling.
  - scenario: Pooling models (e.g., embedding models)
    value: 'false'
    reason: Upstream auto-disables async scheduling for pooling models because it negatively impacts performance; explicitly
      setting false avoids the overhead.
  - scenario: Using unsupported speculative decoding method (e.g., Medusa on v2 worker)
    value: 'false'
    reason: Async scheduling raises ValueError for unsupported speculative methods; must be disabled.
  caveats:
  - On Ascend v1 worker, async_scheduling=True triggers vllm-ascend's AsyncRecomputeScheduler, which has different behavior
    from the upstream AsyncScheduler — ensure compatibility with your workload.
  - When async scheduling is enabled with pipeline parallelism (PP), token IDs are broadcast via GPU instead of CPU payload,
    which changes communication patterns.
  - The vllm-ascend documentation (v0.12.0rc1) notes async scheduler is 'more stable and ready to be enabled' but suggests
    disabling it as a workaround if issues occur.
  - Async scheduling interacts with PCP (pipeline context parallelism) — the flag is passed to PCPManager and affects draft
    token ID update logic in pcp_utils.py.
  quick_guide: Enable --async-scheduling for most Ascend deployments to improve throughput; disable only for pooling models
    or incompatible speculative decoding methods.

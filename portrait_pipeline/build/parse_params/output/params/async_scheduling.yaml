name: --async-scheduling
type: cli
category: scheduling
scope: both
source_file:
- vllm/engine/arg_utils.py:1371
- vllm/config/scheduler.py:146
- vllm/config/vllm.py:818
- vllm_ascend/core/recompute_scheduler.py:88
- vllm_ascend/worker/model_runner_v1.py:404
- vllm_ascend/worker/model_runner_v1.py:651
- vllm_ascend/worker/pcp_utils.py:59
- vllm_ascend/worker/pcp_utils.py:896
- vllm_ascend/spec_decode/llm_base_proposer.py:120
value_type: bool
default: 'null'
valid_choices: true, false
cli_example: --async-scheduling
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
impact_detail: 'When enabled, async scheduling decouples the CPU scheduler from GPU execution, allowing the scheduler to prepare
  the next batch while the current batch is still running on the NPU. This overlaps scheduling overhead with computation,
  reducing GPU idle gaps and improving both latency and throughput. On Ascend, vllm-ascend integrates async scheduling deeply:
  "it selects a custom" AsyncRecomputeScheduler (vllm_ascend/core/recompute_scheduler.py:88-89), propagates the flag to PCPManager
  for pipeline context parallelism (vllm_ascend/worker/pcp_utils.py:59, vllm_ascend/worker/model_runner_v1.py:404), and uses
  it to control draft token handling in speculative decoding (vllm_ascend/spec_decode/llm_base_proposer.py:120, vllm_ascend/worker/model_runner_v1.py:651).
  The upstream default is None (auto-detect), which enables async scheduling unless incompatible features are detected (pooling
  models, unsupported speculative methods). Disabling it forces synchronous step-by-step execution, which can significantly
  reduce throughput under high load.

  '

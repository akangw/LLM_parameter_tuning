name: --enable-prefix-caching
type: cli
category: kv_cache
scope: both
source_file:
- vllm/engine/arg_utils.py:1093
- vllm/config/cache.py:91
value_type: bool
default: None
valid_choices: true, false
cli_example: --enable-prefix-caching
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'Enables automatic reuse of KV cache blocks across requests that share a common prefix. When enabled, the scheduler
  computes block hashes for incoming requests and attempts to match them against cached blocks, avoiding recomputation of
  attention for those tokens. On Ascend NPU, this parameter has several platform-specific effects:

  1. **Block size resolution for hybrid KV cache groups** (vllm_ascend/patch/ platform/patch_kv_cache_utils.py:53): When multiple
  KV cache groups exist (e.g., MLA + SWA-MLA layers) and context parallelism is active, the hash block size is computed as
  gcd(group_block_sizes) rather than the scheduler block size. This enables finer-grained prefix matching across groups with
  different block sizes.

  2. **Mamba block allocation** (vllm_ascend/worker/model_runner_v1.py:4252, vllm_ascend/_310p/model_runner_310p.py:869):
  When prefix caching is enabled for Mamba models, the number of Mamba blocks per request is set to max_num_blocks_per_req
  instead of 1, significantly increasing memory usage but enabling prefix caching for Mamba layers.

  3. **Mamba block size alignment** (vllm_ascend/patch/platform/ patch_mamba_config.py:113): When prefix caching is enabled
  and mamba_cache_mode is "align", mamba_block_size is forced to equal block_size to ensure consistent hashing across attention
  and Mamba blocks.

  4. **CPU offloading connector** (vllm_ascend/distributed/kv_transfer/ kv_pool/cpu_offload/cpu_offload_connector.py:69):
  The CPU offloading connector is only instantiated when prefix caching is enabled. Without it, the connector scheduler and
  worker are set to None, disabling KV transfer to CPU.

  5. **Mamba prefix caching limitation** (vllm_ascend/distributed/kv_transfer/ kv_pool/cpu_offload/cpu_offload_connector.py:442):
  Prefix caching raises NotImplementedError for Mamba models in the CPU offloading path.

  The upstream default in CacheConfig is True (vllm/config/cache.py:91), but the CLI argument overrides this with default=None
  (vllm/engine/arg_utils.py: 1095-1097), meaning the config default is used unless explicitly set. On Ascend, the documentation
  recommends disabling it for Mamba-like models (e.g., Qwen3.5) due to very large effective block sizes that make short prefixes
  uncacheable.

  '
usage_locations:
- file: vllm_ascend/patch/platform/patch_kv_cache_utils.py:53

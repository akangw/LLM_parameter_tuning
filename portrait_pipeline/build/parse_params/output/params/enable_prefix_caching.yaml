- file: vllm/v1/engine/core.py:203
  context: Controls request_block_hasher creation for prefix matching
related_parameters:
- name: --mamba-cache-mode
  relation: Must be 'align' for prefix caching to work with Mamba/hybrid models on Ascend
- name: --block-size
  relation: Prefix caching hash granularity depends on block_size; mamba_block_size is forced to equal block_size when prefix
    caching is enabled with mamba_cache_mode=align
- name: --prefix-caching-hash-algo
  relation: Selects the hash algorithm used for prefix block identification
- name: --kv-cache-dtype
  relation: Affects KV cache memory layout which interacts with prefix caching block management
constraints:
- Prefix caching is not supported for Mamba models in the CPU offloading path (raises NotImplementedError)
- When prefix caching is enabled with mamba_cache_mode=align, mamba_block_size is forced to equal block_size
- For hybrid KV cache models (e.g., Qwen3.5), enabling prefix caching may result in very large effective block_size (e.g.,
  2048), meaning prefixes shorter than block_size will never be cached
tuning_advice:
  summary: Enable for workloads with shared prompt prefixes to reduce prefill computation; disable for Mamba/hybrid models
    unless mamba_cache_mode=align is also set, and be aware of large effective block sizes
  suggested_values:
  - scenario: Standard transformer models with shared prefixes (e.g., system prompts, RAG)
    value: 'true'
    reason: Reuses KV cache across requests with common prefixes, reducing prefill latency and compute
  - scenario: Mamba/hybrid models (e.g., Qwen3.5) on Ascend
    value: 'false'
    reason: Hybrid KV cache may produce very large effective block_size (e.g., 2048), making short prefixes uncacheable; also
      raises NotImplementedError in CPU offloading path
  - scenario: Mamba/hybrid models requiring prefix caching on Ascend
    value: true (with --mamba-cache-mode align)
    reason: Forces mamba_block_size to equal block_size for consistent hashing, but still subject to large effective block_size
      limitation
  - scenario: Workloads with unique prompts and no shared prefixes
    value: 'false'
    reason: Avoids hash computation overhead and extra memory for Mamba block allocation without benefit
  caveats:
  - On Ascend with hybrid KV cache models, enabling prefix caching may cause block_size to be adjusted to a very large value
    (e.g., 2048), rendering prefix caching ineffective for short prefixes
  - Enabling prefix caching for Mamba models increases Mamba blocks per request from 1 to max_num_blocks_per_req, significantly
    increasing memory usage
  - CPU offloading connector only functions when prefix caching is enabled; disabling it also disables KV transfer to CPU
  - The upstream CacheConfig default is True, but the CLI default is None, meaning the config default applies unless explicitly
    overridden
  quick_guide: Enable --enable-prefix-caching for workloads with shared prefixes on standard transformer models; disable for
    Mamba/hybrid models on Ascend unless --mamba-cache-mode align is also set
analysis_date: '2026-07-06'

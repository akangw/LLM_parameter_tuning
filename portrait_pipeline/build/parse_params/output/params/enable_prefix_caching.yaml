- file: vllm_ascend/patch/platform/patch_mamba_config.py:113
  context: Forces mamba_block_size alignment when prefix caching is enabled
- file: vllm_ascend/platform.py:283
  context: Controls mamba_block_size adjustment for KV transfer with hybrid cache
- file: vllm_ascend/worker/model_runner_v1.py:4252
  context: Sets Mamba blocks per request based on prefix caching status (v1)
- file: vllm_ascend/_310p/model_runner_310p.py:869
  context: Sets Mamba blocks per request based on prefix caching status (310P)
- file: vllm_ascend/distributed/kv_transfer/kv_pool/cpu_offload/cpu_offload_connector.py:69
  context: Controls CPU offloading connector instantiation
- file: vllm_ascend/distributed/kv_transfer/kv_pool/cpu_offload/cpu_offload_connector.py:442
  context: Raises NotImplementedError for Mamba with prefix caching in CPU offload path

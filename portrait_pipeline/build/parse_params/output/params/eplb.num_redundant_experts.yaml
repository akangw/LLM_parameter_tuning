related_parameters:
- name: eplb.dynamic_eplb
  relation: Must be True for num_redundant_experts to take effect; if False, n_redundant is forced to 0
- name: enable_eplb
  relation: Must be True; otherwise num_redundant_experts > 0 raises ValueError
- name: enable_expert_parallel
  relation: Must be True to use EPLB; EPLB requires expert parallelism
- name: tensor_parallel_size
  relation: Documentation recommends num_redundant_experts match tensor-parallel size for sufficient redundancy
- name: data_parallel_size
  relation: EPLB requires TP * DP > 1; redundant experts are distributed across the EP group
- name: eplb.expert_map_path
  relation: When expert_map_path is provided, n_redundant is overridden to physical_count - n_experts from the file
constraints:
- num_redundant_experts must be 0 if enable_eplb is False, otherwise a ValueError is raised
- enable_expert_parallel must be True to use EPLB
- tensor_parallel_size * data_parallel_size must be greater than 1 to use EPLB
- num_redundant_experts must not exceed the number of available GPUs in the EP group, or system failure may occur
- When dynamic_eplb is False, num_redundant_experts is silently forced to 0 regardless of the configured value
tuning_advice:
  summary: Set num_redundant_experts equal to the expert-parallel size (ep_size) to provide one redundant expert per rank,
    enabling effective load balancing without excessive memory overhead.
  suggested_values:
  - scenario: Stable production deployment with dynamic EPLB enabled
    value: ep_size (typically equals tensor_parallel_size)
    reason: Provides one redundant expert per EP rank, matching the documentation recommendation for sufficient redundancy
      during load rebalancing
  - scenario: Memory-constrained deployment where EPLB is not critical
    value: '0'
    reason: Disables redundant experts entirely, minimizing memory usage; only valid when dynamic_eplb is False or EPLB is
      disabled
  - scenario: High-load-fluctuation deployment requiring aggressive rebalancing
    value: ep_size * 2
    reason: Doubles the redundancy budget, allowing more aggressive expert migration during traffic spikes at the cost of
      higher memory usage
  caveats:
  - Setting num_redundant_experts higher than the EP group size wastes memory without additional balancing benefit and may
    cause OOM
  - When expert_map_path is provided, num_redundant_experts is overridden by the physical count from the file — the configured
    value is ignored
  - During elastic EP scaling, num_redundant_experts is dynamically recomputed and the original configured value is overwritten
  - On Ascend NPU, redundant experts consume HBM memory proportional to expert weight size; monitor memory usage when increasing
    this value
  quick_guide: Match num_redundant_experts to your expert-parallel size for optimal load balancing; set to 0 only if EPLB
    is disabled.

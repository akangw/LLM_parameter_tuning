impact_detail: 'This parameter controls the number of redundant (duplicate) experts created during Expert Parallelism Load
  Balancing (EPLB). On Ascend NPU, it directly determines the total physical expert count: "n_physical_experts = n_logical_experts
  + num_redundant_experts." The physical experts are distributed across EP ranks, so increasing this value increases the per-rank
  expert count (n_local_physical_experts = n_physical_experts // ep_size), which proportionally increases GPU memory consumption
  for expert weights and KV cache. During EPLB rebalancing, redundant experts allow the balancer to migrate load without dropping
  tokens — insufficient redundancy causes load imbalance and throughput degradation. The vllm-ascend documentation explicitly
  states this value "Must match tensor-parallel size (e.g., 16 for 16 GPUs) to ensure sufficient redundancy." Setting it too
  low causes resource underutilization; setting it too high wastes memory and may cause OOM. In vllm-ascend''s eplb_utils.py:76,
  when dynamic_eplb is disabled, n_redundant is forced to 0 regardless of the configured value. In upstream vllm, elastic
  EP scaling dynamically recomputes this value based on physical-to-logical expert mapping.

  '

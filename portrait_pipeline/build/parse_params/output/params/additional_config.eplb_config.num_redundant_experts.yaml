name: additional_config.eplb_config.num_redundant_experts
type: nested
category: parallelism
scope: both
source_file:
- vllm_ascend/ascend_config.py:635
- vllm/config/parallel.py:461
value_type: int
default: 0
valid_choices: non-negative integer
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- throughput
- memory
impact_detail: 'This parameter controls the number of redundant (physical) experts added beyond the model''s logical expert
  count in MoE (Mixture of Experts) models. It directly affects the Expert Parallelism Load Balancing (EPLB) mechanism on
  Ascend NPUs. The total physical expert count becomes `n_logical_experts + num_redundant_experts`, and each EP rank gets
  `n_physical_experts // ep_size` local experts. Redundant experts allow the EPLB algorithm to replicate heavily-loaded experts
  across multiple NPUs, reducing token dispatch imbalance and improving throughput. However, each redundant expert consumes
  additional NPU memory for its weight parameters. On Ascend, this is consumed in `vllm_ascend/models/deepseek_v4.py:265-268`
  and `vllm_ascend/eplb/core/eplb_utils.py:76-92`, where `n_redundant` is used to generate global expert placements and logical-to-physical
  mapping tensors. The parameter is only effective when EPLB is enabled (`enable_eplb=True` or `dynamic_eplb=True`). When
  EPLB is disabled, setting a non-zero value raises a `ValueError` in `vllm/config/parallel.py:461-467`. During elastic EP
  scaling, the value is dynamically recomputed in `vllm/distributed/elastic_ep/elastic_execute.py:167-169` and `:353-355`.

  '
usage_locations:

related_parameters:
- name: additional_config.eplb_config.dynamic_eplb
  relation: Must be True for num_redundant_experts to take effect; otherwise raises ValueError
- name: parallel_config.enable_eplb
  relation: Must be True for num_redundant_experts to take effect; upstream validation enforces this
- name: parallel_config.enable_expert_parallel
  relation: EPLB requires expert parallelism to be enabled
- name: parallel_config.tensor_parallel_size
  relation: Documentation recommends num_redundant_experts match tensor_parallel_size
- name: additional_config.eplb_config.eplb_policy_type
  relation: Controls which EPLB balancing algorithm uses the redundant experts
constraints:
- num_redundant_experts must be a non-negative integer
- num_redundant_experts must be 0 when EPLB is not enabled (enable_eplb=False), otherwise a ValueError is raised
- EPLB must be used with expert parallelism (ep_size > 1), otherwise an assertion fails
- num_redundant_experts must not exceed the number of available GPUs, otherwise system failure occurs
tuning_advice:
  summary: 'Set num_redundant_experts equal to the tensor-parallel size (tp_size) to provide one redundant expert slot per
    GPU, enabling effective load balancing for MoE models on Ascend NPU.

    '
  suggested_values:
  - scenario: Standard MoE deployment with EPLB enabled (e.g., DeepSeek-V2/V3 on 8 or 16 NPUs)
    value: tensor_parallel_size
    reason: 'Documentation recommends matching tensor-parallel size to ensure sufficient redundancy. Each redundant expert
      slot allows the EPLB algorithm to replicate a hot expert onto another NPU, reducing token dispatch skew and improving
      throughput.

      '
  - scenario: EPLB disabled or expert_parallel not used
    value: 0
    reason: 'Required by validation; non-zero value with EPLB disabled raises ValueError. Redundant experts have no effect
      without the EPLB balancing mechanism.

      '
  - scenario: Memory-constrained deployment where expert weights are large
    value: 0 or a small value (1-2)
    reason: 'Each redundant expert adds a full copy of expert weights, increasing NPU memory usage. If memory is tight, reduce
      or disable redundant experts and accept potential load imbalance.

      '
  caveats:
  - Each redundant expert consumes additional NPU memory equal to one expert's weight parameters
  - Setting num_redundant_experts > available GPUs causes system failure per documentation
  - During elastic EP scaling, this value is dynamically recomputed and should not be manually set
  - The parameter only affects models with MoE layers (DeepSeek-V2/V3/V4, AFMoE, Ernie 4.5 MoE, AXK1)
  - On Ascend, the vllm-ascend plugin's EplbConfig class manages this parameter; upstream vLLM validation still applies
  quick_guide: 'Set num_redundant_experts = tensor_parallel_size when EPLB is enabled; set to 0 otherwise.

    '
analysis_date: '2026-07-06'

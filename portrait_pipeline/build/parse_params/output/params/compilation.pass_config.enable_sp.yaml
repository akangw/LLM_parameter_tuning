name: compilation.pass_config.enable_sp
type: nested
category: compilation
scope: both
source_file:
- vllm/config/compilation.py:1154
- vllm/config/vllm.py:1035
- vllm_ascend/platform.py:223
- vllm_ascend/platform.py:456
- vllm_ascend/ascend_config.py:250
- vllm_ascend/compilation/graph_fusion_pass_manager.py:74
value_type: bool
default: None (resolved to False if not explicitly set)
valid_choices:
- true
- false
cli_example: '''--compilation-config {"pass_config": {"enable_sp": true}}'''
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: 'Sequence parallelism (SP) shards the sequence dimension across tensor-parallel ranks, reducing per-device
  activation memory and enabling larger batch sizes. On Ascend NPU, when enable_sp is True, vllm-ascend injects two graph
  fusion passes (SequenceParallelismPass and SequenceParallelismMoePass) that rewrite the computation graph to insert all-gather
  / reduce-scatter collectives at layer boundaries. This directly affects throughput and latency: "at small token counts the
  fixed communication" overhead dominates and hurts performance, but at larger token counts (>= sp_min_token_num, default
  1000 on Ascend) the memory savings allow higher batch sizes and net throughput gains. The parameter also forces full-graph
  compilation (splitting_ops is cleared) and requires cudagraph capture sizes to be multiples of tensor_parallel_size, which
  can constrain scheduling flexibility. On Ascend, the platform layer auto-sets sp_min_token_num to 1000 for dense models
  and 1 for MoE models when enable_sp is True and sp_min_token_num is unset.

  '
usage_locations:

performance_impact: low
performance_scope:
- latency
impact_detail: 'This parameter is an internal set that collects file paths traced during torch.compile/Dynamo tracing. It
  is populated automatically by the compilation framework (not user-configured) and used to compute a code hash for the compilation
  cache key. The hash determines whether a cached compiled graph can be reused or must be recompiled. On cache hit, compilation
  is skipped, reducing startup latency. On cache miss, recompilation occurs. The parameter itself does not directly control
  any runtime performance knob — it only affects cache invalidation behavior. It is cleared after hash computation (backends.py:1052)
  and is not exposed as a user-facing configuration.

  '
usage_locations:
- file: vllm/compilation/backends.py:1031
  context: Read traced_files to compute code hash for compilation cache key
- file: vllm/compilation/backends.py:1052
  context: Cleared after hash consumption
- file: vllm/compilation/caching.py:379

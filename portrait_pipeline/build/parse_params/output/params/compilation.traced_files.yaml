- file: vllm/compilation/decorators.py:274
  context: Populated with source files during source verification
- file: vllm/compilation/decorators.py:604
  context: Populated with traced file names during Dynamo tracing
related_parameters:
- name: compilation_config.cache_dir
  relation: traced_files contributes to the hash used to derive cache_dir when cache_dir is not explicitly set
- name: VLLM_CACHE_ROOT
  relation: Environment variable that determines the root directory for compilation cache
constraints: []
tuning_advice:
  summary: 'This is an internal mechanism for compilation cache invalidation and requires no user tuning. It has no direct
    performance impact on Ascend NPU.

    '
  suggested_values: []
  caveats:
  - This parameter is not user-configurable; it is populated and consumed internally by the compilation framework.
  - On Ascend NPU, torch.compile behavior may differ from GPU, but traced_files operates at the Python tracing level and is
    hardware-agnostic.
  quick_guide: No tuning needed — this is an internal cache invalidation mechanism.

related_parameters:
- name: --tensor-parallel-size
  relation: When enable_expert_parallel is True, MoE layers use EP instead of TP; TP still applies to non-MoE (dense) layers
- name: --data-parallel-size
  relation: EP group size is derived from world_size_across_dp / pp_size; DP and EP interact in multi-node deployments
- name: --enable-eplb
  relation: EPLB (expert parallelism load balancing) requires enable_expert_parallel=True
- name: --enable-ep-weight-filter
  relation: Only effective when enable_expert_parallel is True; skips non-local expert weights during loading
- name: VLLM_ASCEND_ENABLE_FLASHCOMM1
  relation: FlashComm1 for MoE models requires enable_expert_parallel=True (enforced by assertion)
- name: --enable-elastic-ep
  relation: Elastic EP scaling builds on expert parallelism
- name: --enable-shared-expert-dp
  relation: Only activated when enable_expert_parallel=True and tensor_parallel_size > 1
constraints:
- FlashComm1 (VLLM_ASCEND_ENABLE_FLASHCOMM1=1) requires enable_expert_parallel=True for MoE models
- EPLB (--enable-eplb) requires enable_expert_parallel=True
- MC2 and FusedMC2 communication methods require enable_expert_parallel=True
- vLLM does not support mixed ETP and EP; MoE layers use either pure EP or pure TP
tuning_advice:
  summary: Enable for all MoE model deployments on Ascend NPU to reduce memory usage and enable optimized MC2 communication;
    required for FlashComm1 optimization.
  suggested_values:
  - scenario: MoE model deployment on Ascend NPU (any scale)
    value: 'True'
    reason: Enables expert parallelism which distributes experts across devices, reducing per-device memory and enabling MC2/FusedMC2
      optimized all-to-all communication. Required for FlashComm1 optimization which further improves throughput.
  - scenario: Non-MoE (dense) model deployment
    value: 'False'
    reason: Expert parallelism has no effect on dense models; the parameter is ignored.
  - scenario: Single-device MoE deployment (tp_size=1, dp_size=1)
    value: 'False'
    reason: With only one device, EP group world_size=1, so the system falls back to ALLGATHER regardless. Enabling EP provides
      no benefit and may add unnecessary overhead.
  caveats:
  - When HCCL_OP_EXPANSION_MODE=AIV, enabling expert parallelism adds an extra parallel_factor, which reduces the maximum
    supported batch sizes for ACL graph capture
  - EP distributes experts across devices; if expert load is imbalanced, some devices may be underutilized while others are
    overloaded. Consider using EPLB for load balancing
  - On A2 devices, MC2 is only selected when num_experts_per_device <= 24, ep_world_size >= 16, and num_tokens <= mc2_tokens_capacity;
    otherwise ALLGATHER is used
  - On A3 devices, FusedMC2 requires ep_world_size <= 32 and non-draft-model mode; dispatch_ffn_combine has additional constraints
  - W4A8 quantization with new_quant_version and tp_size > 16 raises an error when EP is enabled (tp_size becomes 1 internally,
    avoiding this limit)
  quick_guide: Always use --enable-expert-parallel for MoE models on Ascend NPU with multi-device deployments; pair with VLLM_ASCEND_ENABLE_FLASHCOMM1=1
    for best performance.

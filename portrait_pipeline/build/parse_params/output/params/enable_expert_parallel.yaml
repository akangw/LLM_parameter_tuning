name: --enable-expert-parallel
type: cli
category: parallelism
scope: both
source_file:
- vllm/engine/arg_utils.py:1021
- vllm/config/parallel.py:151
- vllm_ascend/ascend_config.py:108
- vllm_ascend/platform.py:646
- vllm_ascend/ascend_forward_context.py:270
- vllm_ascend/ops/fused_moe/moe_comm_method.py:217
- vllm_ascend/ops/fused_moe/moe_comm_method.py:261
- vllm_ascend/quantization/methods/w4a8.py:363
- vllm_ascend/utils.py:697
- vllm_ascend/xlite/xlite.py:418
- vllm_ascend/xlite/xlite.py:483
value_type: bool
default: 'False'
valid_choices:
- 'True'
- 'False'
cli_example: --enable-expert-parallel
deprecated: false
performance_impact: high
performance_scope:
- throughput
- memory
- latency
impact_detail: "When enabled, MoE layers use expert parallelism (EP) instead of tensor parallelism (TP). On Ascend NPU, this\
  \ triggers a fundamentally different communication path:\n1. **Communication method selection** (vllm_ascend/ascend_forward_context.py:270):\n\
  \   If enable_expert_parallel is True and EP group world_size > 1, the system selects\n   between MC2 (Communication-Computation\
  \ fusion) and ALLGATHER methods based on\n   soc_version (A2 vs A3), num_experts_per_device, ep_world_size, and num_tokens.\n\
  \   When disabled or EP world_size=1, it falls back to ALLGATHER.\n\n2. **MC2/FusedMC2 communication** (vllm_ascend/ops/fused_moe/moe_comm_method.py:217,261):\n\
  \   Both MC2CommImpl and FusedMC2CommImpl require enable_expert_parallel=True.\n   These use npu_moe_distribute_dispatch\
  \ and npu_moe_distribute_combine for\n   optimized all-to-all communication on Ascend devices, overlapping\n   communication\
  \ with computation.\n\n3. **Weight loading** (vllm_ascend/quantization/methods/w4a8.py:363):\n   When enable_expert_parallel\
  \ is True, tp_size is set to 1 for MoE weight\n   partitioning, meaning each device loads only its expert shard. This\n\
  \   drastically reduces per-device memory usage for large MoE models.\n\n4. **FlashComm1 compatibility** (vllm_ascend/platform.py:646):\n\
  \   FlashComm1 optimization for MoE models requires enable_expert_parallel=True.\n   An assertion enforces this: \"\\\"\
  Flash Comm v1 requires enable_expert_parallel=True\"\n   for MoE models.\"\n\n5. **Shared expert DP** (vllm_ascend/ascend_config.py:108):\n\
  \   enable_shared_expert_dp is only activated when enable_expert_parallel is True\n   AND tensor_parallel_size > 1.\n\n\
  6. **ACL graph capture** (vllm_ascend/utils.py:697):\n   When HCCL_OP_EXPANSION_MODE=AIV, enable_expert_parallel adds an\
  \ extra\n   parallel_factor, reducing the maximum supported batch sizes for ACL graph\n   capture.\n\n7. **XLite backend**\
  \ (vllm_ascend/xlite/xlite.py:418,483):\n   For QwenMoe and GLM4Moe models, enable_expert_parallel determines whether\n\
  \   moe_ep_size equals ep_group.world_size (EP mode) or 1 (TP mode), and\n   moe_tp_size is set to 1 (EP mode) or ep_group.world_size\
  \ (TP mode).\n\nOverall, enabling this parameter on Ascend NPU for MoE models: - \"Reduces per-device memory by loading\
  \ only local expert shards\" - \"Enables MC2/FusedMC2 optimized communication (lower latency, higher throughput)\" - \"\
  Is required for FlashComm1 optimization\" - \"May reduce max batch sizes in ACL graph mode due to additional stream usage\"\
  \ - \"Changes the parallelism strategy from TP (all experts replicated across TP group)\"\n  to EP (experts distributed\
  \ across EP group)\n"

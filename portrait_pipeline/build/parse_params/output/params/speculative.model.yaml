related_parameters:
- name: speculative.method
  relation: Determines how speculative.model is interpreted and auto-assigned
- name: speculative.num_speculative_tokens
  relation: Number of tokens the draft model generates per step; must be compatible with draft model training
- name: speculative.draft_tensor_parallel_size
  relation: TP size for draft model; must equal target TP size on Ascend
- name: speculative.draft_model_config
  relation: ModelConfig derived from speculative.model; controls draft model architecture settings
- name: speculative.draft_load_config
  relation: LoadConfig for draft model weights; affects loading format and memory usage
constraints:
- When method is 'draft_model', the draft model vocab size must match the target model vocab size
- When method is 'draft_model', draft_tensor_parallel_size must equal tensor_parallel_size
- When method is 'mtp' or 'eagle', the model parameter is auto-set and should not be manually specified
- When method is 'ngram', 'ngram_gpu', 'suffix', or 'extract_hidden_states', the model parameter is auto-set to a method identifier
  string
- The draft model must fit in NPU device memory alongside the target model
- The draft model's max_model_len must be sufficient for the target model's sequences when using padded batch drafting
tuning_advice:
  summary: Choose a draft model that balances acceptance rate against forward pass cost on Ascend NPU; for MTP methods the
    model is auto-set to the target model.
  suggested_values:
  - scenario: Using MTP (Multi-Token Prediction) speculative decoding
    value: <auto-set to target model path>
    reason: MTP methods reuse the target model weights and only add small prediction heads; the model parameter is automatically
      set to target_model_config.model in vllm/config/speculative.py:535
  - scenario: Using EAGLE speculative decoding with a trained eagle head
    value: <path to eagle head weights>
    reason: EAGLE requires a separately trained eagle head model; provide the HuggingFace model name or local path to the
      eagle head weights
  - scenario: Using standalone draft model (draft_model method)
    value: <smaller model from same family, e.g., 'meta-llama/Llama-3.2-1B' for 'meta-llama/Llama-3.1-8B' target>
    reason: A smaller model from the same family provides good acceptance rates with lower draft forward pass cost on Ascend
      NPU; the draft model must share the same tokenizer/vocab
  - scenario: Memory-constrained Ascend NPU deployment
    value: <smallest compatible draft model>
    reason: Draft model consumes additional NPU memory for weights and KV cache; on memory-constrained devices (e.g., Atlas
      300I Duo), use the smallest draft model that still provides acceptable acceptance rates
  caveats:
  - On Ascend NPU, the draft model uses separate graph compilation parameters (vllm_ascend/attention/attention_v1.py:546-551),
    which may cause additional compilation overhead on first run
  - The draft model's max_model_len limits the effective sequence length for speculative decoding; if draft max_model_len
    is smaller than target max_model_len, long sequences may fall back to non-speculative execution
  - When using padded batch drafting (default on Ascend v1), the draft model must support the same batch padding as the target
    model
  - Draft model TP size must match target TP size on Ascend (vllm/v1/spec_decode/draft_model.py:46-51); this constraint is
    enforced with a ValueError
  - For MTP methods on Ascend, the model is auto-set and the draft heads are part of the target model checkpoint; ensure the
    checkpoint includes MTP heads
  quick_guide: For MTP/EAGLE on Ascend, use auto-set model; for standalone draft models, choose a model from the same family
    that is 5-10x smaller than the target to balance acceptance rate and NPU compute cost.

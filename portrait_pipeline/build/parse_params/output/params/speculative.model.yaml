name: speculative.model
type: nested
category: speculation
scope: both
source_file:
- vllm/config/speculative.py:535
- vllm/config/speculative.py:541
- vllm/config/speculative.py:543
- vllm/config/speculative.py:545
- vllm/config/speculative.py:547
value_type: str
default: <computed>
valid_choices:
- A HuggingFace model name or path (e.g., 'meta-llama/Llama-3.1-8B')
- A local path to model weights
- Auto-set to target model path for MTP/EAGLE methods
- Auto-set to 'ngram' for ngram method
- Auto-set to 'ngram_gpu' for ngram_gpu method
- Auto-set to 'suffix' for suffix method
- Auto-set to 'extract_hidden_states' for extract_hidden_states method
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'This parameter specifies the draft model weights used for speculative decoding. On Ascend NPU, the draft model
  directly affects inference performance through several mechanisms:

  1. **Draft model loading and memory**: The draft model is loaded onto the NPU and consumes device memory. In vllm-ascend''s
  AscendSpecDecodeBaseProposer._get_model() (vllm_ascend/spec_decode/llm_base_proposer.py:222), the draft model is loaded
  with its own VllmConfig and occupies separate KV cache space. The model size directly impacts available memory for the target
  model''s KV cache.

  2. **Draft quality vs. overhead tradeoff**: A larger/more accurate draft model produces better speculative tokens (higher
  acceptance rate), reducing the number of target model forward passes needed. However, each draft forward pass consumes NPU
  compute. The balance between draft model cost and acceptance rate determines net throughput gain.

  3. **Ascend-specific dispatch paths**: In vllm_ascend/worker/model_runner_v1.py:1553, the code checks `self.speculative_config.use_eagle()
  or self.speculative_config.uses_draft_model()` to determine whether to use padded batch drafting. The draft model type affects
  which attention metadata path is used (vllm_ascend/attention/attention_v1.py:546-557), with draft models using separate
  graph parameters and attention metadata structures.

  4. **Method-specific model assignment**: In vllm/config/speculative.py:530-551, the model parameter is auto-assigned based
  on the speculative method: - "MTP methods: model = target_model_config.model (same weights, different heads)" - "EAGLE methods:
  model = user-provided eagle head weights" - "ngram/ngram_gpu/suffix/extract_hidden_states: model = method name string" -
  "draft_model method: model = user-provided standalone draft model path"

  5. **Ascend attention graph selection**: In vllm_ascend/attention/attention_v1.py:546-551, when `_EXTRA_CTX.is_draft_model`
  is True, the code selects draft-specific graph parameters (`get_draft_graph_prefill_params()` or `get_draft_graph_params()`)
  instead of target model graph parameters. This affects NPU graph compilation and execution efficiency.

  6. **Sequence length constraints**: In vllm_ascend/worker/model_runner_v1.py:2244-2247, the draft model has its own max_model_len
  (`effective_drafter_max_model_len`), and input sequences must fit within this limit. A draft model with a smaller context
  window than the target model can bottleneck long-sequence inference.

  '

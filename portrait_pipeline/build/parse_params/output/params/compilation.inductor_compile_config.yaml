name: compilation.inductor_compile_config
type: nested
category: compilation
scope: vllm
source_file:
- vllm/config/compilation.py:904
- vllm/v1/worker/cpu_model_runner.py:241
- vllm/compilation/backends.py:863
- vllm/compilation/wrapper.py:96
- vllm/platforms/cpu.py:170
value_type: dict
default: '''{}'''
valid_choices: dict of torch._inductor.config keys
cli_example: '--compilation-config ''{"inductor_compile_config": {"max_autotune": true, "epilogue_fusion": true}}'''
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter is a dictionary that is directly passed to torch._inductor.config to control the behavior of\
  \ the PyTorch Inductor compiler backend. On Ascend NPU, vLLM uses torch.compile with the inductor backend for graph-level\
  \ optimizations (e.g., kernel fusion, memory planning, autotuning). The keys in this dict correspond to inductor configuration\
  \ options such as max_autotune, epilogue_fusion, size_asserts, etc. These settings affect:\n1. Compilation time vs. runtime\
  \ performance tradeoff (e.g., max_autotune increases\n   compile time but can produce faster kernels).\n2. Memory usage\
  \ (e.g., enabling certain fusions may reduce intermediate tensor\n   allocations).\n3. Kernel launch overhead (e.g., epilogue_fusion\
  \ merges pointwise operations into\n   a single kernel, reducing launch overhead on NPU).\n\nOn Ascend NPU, the inductor\
  \ backend generates code that is further compiled by the CANN compiler. Inductor configurations that work well on GPU may\
  \ have different effects on Ascend due to differences in the Da Vinci architecture and CANN's own fusion passes. For example,\
  \ excessive fusion may conflict with CANN's graph optimization, and autotuning may select suboptimal configurations for\
  \ Ascend's memory hierarchy.\nvLLM internally sets some defaults: \"enable_auto_functionalized_v2 is forced to\" False (line\
  \ 895), and on PyTorch < 2.12, assertion configs (size_asserts, alignment_asserts, scalar_asserts) are tied to VLLM_LOGGING_LEVEL\
  \ (line 907-914). On CPU platforms, additional defaults are applied (dce, epilogue_fusion, etc. at vllm/platforms/cpu.py:170-178).\
  \ No Ascend-specific overrides were found in vllm-ascend, meaning the upstream inductor config is used as-is on NPU.\n"
usage_locations:
- file: vllm/config/compilation.py:904
  context: Sets default inductor config values (enable_auto_functionalized_v2=False, assertion configs based on logging level)
- file: vllm/compilation/backends.py:863
  context: Deep-copies inductor_compile_config into VllmBackend.inductor_config for use during compilation
- file: vllm/compilation/wrapper.py:96
  context: Passes inductor_compile_config as options to torch.compile when backend is 'inductor'
- file: vllm/v1/worker/cpu_model_runner.py:241
  context: CPU model runner reads inductor_compile_config to set freezing based on max_autotune
- file: vllm/platforms/cpu.py:170
  context: CPU platform applies additional inductor defaults (dce, epilogue_fusion, cpp.dynamic_threads)
related_parameters:
- name: compilation.mode
  relation: inductor_compile_config is only used when compilation mode uses the inductor backend (e.g., VLLM_COMPILE, DYNAMO_TRACE_ONCE)
- name: compilation.backend
  relation: inductor_compile_config is passed as options only when backend is 'inductor'
- name: compilation.pass_config
  relation: Custom inductor passes defined in pass_config may be merged into inductor_compile_config
constraints:
- Keys must be valid torch._inductor.config attributes; invalid keys will raise AttributeError at compile time.
- enable_auto_functionalized_v2 is always forced to False by vLLM, regardless of user input.
- On PyTorch < 2.12, size_asserts, alignment_asserts, and scalar_asserts default to VLLM_LOGGING_LEVEL==DEBUG; explicit user
  values override this.
tuning_advice:
  summary: On Ascend NPU, start with default inductor config and only tune specific keys (max_autotune, epilogue_fusion) after
    profiling, as CANN's own compiler passes may interact unpredictably with inductor settings.
  suggested_values:
  - scenario: Default / general-purpose Ascend deployment
    value: '{}'
    reason: vLLM's internal defaults are conservative and tested; inductor autotuning on Ascend may select suboptimal kernels
      due to CANN's different optimization pipeline.
  - scenario: Max throughput on Ascend NPU (after profiling)
    value: '{"max_autotune": true, "epilogue_fusion": true, "coordinate_descent_tuning": true}'
    reason: 'Enables inductor''s autotuning and fusion passes to reduce kernel launch overhead. Coordinate descent tuning
      searches more configurations. Note: significantly increases cold-start compilation time and may cause CANN compilation
      failures on some operators.'
  - scenario: Reducing compilation time / CI environments
    value: '{"max_autotune": false, "epilogue_fusion": false, "dce": true}'
    reason: Disables expensive autotuning and fusion passes. Dead code elimination (dce) is safe and reduces graph size. Suitable
      for testing or when compilation cache is cold.
  caveats:
  - Inductor autotuning (max_autotune) on Ascend NPU may select kernels that are suboptimal after CANN compilation, because
    inductor benchmarks Triton/C++ kernels before CANN's ATC compilation applies its own optimizations.
  - Excessive fusion (epilogue_fusion, pattern_matcher) can produce large fused kernels that exceed CANN's resource limits,
    causing compilation failures or fallback to slow paths.
  - The enable_auto_functionalized_v2 key is silently overridden to False by vLLM; setting it to True has no effect.
  - On PyTorch < 2.12, assertion configs (size_asserts, etc.) add ~2ms overhead per forward pass on large models; they are
    disabled by default unless VLLM_LOGGING_LEVEL=DEBUG.
  - No Ascend-specific inductor config defaults are applied by vllm-ascend; all tuning is inherited from upstream vLLM, which
    is GPU-optimized.
  quick_guide: Use default empty dict on Ascend NPU; only add max_autotune or epilogue_fusion after confirming they don't
    cause CANN compilation errors in your model.
analysis_date: '2026-07-06'

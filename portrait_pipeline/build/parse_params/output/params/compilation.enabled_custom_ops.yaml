impact_detail: 'This is an internal, runtime-populated set that tracks which custom ops are currently enabled. It is not a
  user-facing configuration parameter — it is populated automatically by the CustomOp.dispatch_forward() method (vllm/model_executor/custom_op.py:187)
  based on each op''s enabled() check and _enforce_enable flag. The set is used by the compilation config to know which ops
  should use platform-specific (e.g., Ascend OOT) implementations vs. the native PyTorch fallback. On Ascend NPU, when current_platform.is_out_of_tree()
  returns True, enabled custom ops will dispatch to forward_oot() (line 204-205), which by default delegates to forward_native().
  The performance impact is indirect: this set controls whether certain ops use optimized platform kernels or fallback paths,
  but the set itself is a passive tracker, not a tuning knob. No vllm-ascend override was found for this specific field.

  '

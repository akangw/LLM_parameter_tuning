name: --limit-mm-per-prompt
type: cli
category: scheduling
scope: both
source_file:
- vllm/engine/arg_utils.py:1171
- vllm/config/model.py:324
- vllm/v1/core/encoder_cache_manager.py:291
value_type: dict
default: '{''image'': 999, ''video'': 999, ''audio'': 999}'
valid_choices: dict[str, int | dict[str, int]] — modality name to max item count
cli_example: '--limit-mm-per-prompt ''{"image": 5, "video": 0}'''
deprecated: false
performance_impact: medium
performance_scope:
- memory
- throughput
impact_detail: 'This parameter caps the number of multimodal input items (images, videos, audio clips) allowed per prompt
  for each modality. On Ascend NPU, its primary performance impact is on memory: "setting a modality limit to 0 disables that
  modality entirely, which causes" the encoder cache manager to skip allocating encoder cache for that modality (vllm/v1/core/encoder_cache_manager.py:291-294).
  This directly reduces NPU memory consumption reserved for multimodal encoder outputs. For video modalities in particular,
  the vllm-ascend documentation explicitly recommends setting `--limit-mm-per-prompt.video 0` when only image inputs are expected,
  because enabling video inputs reserves memory for long video embeddings (tutorials/models/Qwen3-VL-30B-A3B-Instruct.md:89-98).
  Lowering limits also reduces the maximum encoder compute budget, which can improve scheduling throughput by preventing oversized
  multimodal prefill batches. The parameter is used identically in both vllm upstream and vllm-ascend — no Ascend-specific
  override exists, but the memory savings are more critical on NPUs due to typically smaller HBM capacity compared to high-end
  GPUs.

  '

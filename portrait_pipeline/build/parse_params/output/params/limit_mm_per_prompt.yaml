related_parameters:
- name: --language-model-only
  relation: If set to true, all multimodal processing is disabled, making limit-mm-per-prompt irrelevant
- name: --max-model-len
  relation: Larger max_model_len combined with high multimodal limits increases encoder cache memory pressure
- name: --max-num-batched-tokens
  relation: When chunked MM input is disabled, max_tokens_per_mm_item must not exceed max_num_batched_tokens
- name: --gpu-memory-utilization
  relation: Higher multimodal limits consume more encoder cache; may require lowering gpu_memory_utilization to avoid OOM
constraints:
- Each modality key must correspond to a modality supported by the model (e.g., 'image', 'video', 'audio')
- Setting a modality limit to 0 disables that modality and prevents encoder cache allocation for it
- When chunked MM input is disabled, the maximum tokens per multimodal item must not exceed max_num_batched_tokens
tuning_advice:
  summary: Set modality limits to match your actual workload — disable unused modalities to save NPU memory.
  suggested_values:
  - scenario: Image-only inference on Ascend NPU
    value: '{''image'': <expected_max_images_per_prompt>, ''video'': 0, ''audio'': 0}'
    reason: Disabling video and audio prevents encoder cache allocation for those modalities, saving significant NPU HBM as
      recommended by vllm-ascend docs
  - scenario: Mixed image+video inference with known max items
    value: '{''image'': 5, ''video'': 1}'
    reason: Limits encoder cache to a predictable size, preventing memory spikes from prompts with unexpectedly many items
  - scenario: Benchmarking or stress testing
    value: '{''image'': 255, ''video'': 1}'
    reason: High limits allow maximum multimodal throughput testing; matches RandomMultiModalDataset defaults
  caveats:
  - Setting a modality limit to 0 when that modality is actually used in requests will cause errors — ensure limits match
    your workload
  - Video modalities consume disproportionately more encoder cache memory than images due to multi-frame embeddings; disable
    video if not needed
  - On Ascend NPUs with limited HBM (e.g., 32GB cards), disabling unused modalities can be the difference between OOM and
    successful deployment
  - This parameter does not affect the language model's KV cache directly, only the multimodal encoder cache
  quick_guide: 'Disable unused modalities (especially video) with --limit-mm-per-prompt ''{"video": 0}'' to reduce NPU memory
    usage.'
analysis_date: '2026-07-06'

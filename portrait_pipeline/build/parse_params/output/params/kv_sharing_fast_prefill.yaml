name: kv_sharing_fast_prefill
type: cli
category: kv_cache
scope: both
source_file:
- vllm/config/cache.py:148
- vllm/engine/arg_utils.py:683
- vllm/engine/arg_utils.py:1109
- vllm_ascend/worker/model_runner_v1.py:1833
- vllm_ascend/worker/model_runner_v1.py:2956
value_type: bool
default: 'False'
valid_choices:
- 'True'
- 'False'
cli_example: --kv-sharing-fast-prefill
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This flag is explicitly documented as a work-in-progress feature that currently performs NO prefill optimization.
  The docstring in vllm/config/cache.py:149-156 states: "\"This feature is work in progress and no prefill optimization takes
  place" with this flag enabled currently." When enabled, it overrides attention metadata for eligible layers in KV-sharing
  architectures (e.g., YOCO, Gemma3n) to prepare for future prefill-skipping optimizations. On Ascend NPU, the v1 worker (vllm_ascend/worker/model_runner_v1.py:1833-1838)
  checks this flag and asserts that prompt logprobs are disabled, then at line 2956-2958 it prepares logits_indices for the
  fast prefill path. However, since the actual optimization is not yet implemented, enabling this flag currently only adds
  metadata preparation overhead without any latency or throughput benefit. It also introduces incompatibilities: "it is not
  supported with v2 model runner" (vllm/config/vllm.py:1884-1886), not compatible with EAGLE speculative decoding (vllm/config/vllm.py:1148-1158),
  and produces incorrect prompt logprobs (vllm/v1/engine/async_llm.py:306-314). The flag is excluded from compiled graph hash
  factors (vllm/config/cache.py:207), confirming it does not affect compiled graph shape.

  '
usage_locations:
- file: vllm_ascend/worker/model_runner_v1.py:1833
  context: 'v1-ascend: asserts prompt logprobs are disabled when kv_sharing_fast_prefill is True'
- file: vllm_ascend/worker/model_runner_v1.py:2956
  context: 'v1-ascend: prepares logits_indices for fast prefill attention metadata override'
- file: vllm/config/vllm.py:1148
  context: 'upstream: validates incompatibility with EAGLE speculative decoding'
- file: vllm/config/vllm.py:1884
  context: 'upstream: marks as unsupported in v2 model runner'
- file: vllm/v1/engine/async_llm.py:306
  context: 'upstream: raises ValueError if prompt logprobs requested with fast prefill enabled'
- file: vllm/v1/attention/backends/utils.py:367
  context: 'upstream: make_kv_sharing_fast_prefill_common_attn_metadata function for v1 attention'
related_parameters:
- name: speculative_config (EAGLE)
  relation: 'Incompatible: --kv-sharing-fast-prefill cannot be used with EAGLE speculative decoding'
- name: prompt_logprobs
  relation: 'Incompatible: --kv-sharing-fast-prefill produces incorrect prompt logprobs'
- name: VLLM_USE_V2_MODEL_RUNNER
  relation: 'Incompatible: --kv-sharing-fast-prefill is not supported with v2 model runner'
constraints:
- --kv-sharing-fast-prefill must not be used when requests require prompt logprobs
- --kv-sharing-fast-prefill is not compatible with EAGLE speculative decoding (use_eagle)
- --kv-sharing-fast-prefill is not supported with VLLM_USE_V2_MODEL_RUNNER
tuning_advice:
  summary: 'Keep this flag disabled (default) on Ascend NPU. It is a work-in-progress feature that currently provides no performance
    benefit and introduces compatibility restrictions.

    '
  suggested_values:
  - scenario: All Ascend NPU deployments
    value: 'False'
    reason: 'The feature is explicitly documented as not yet implementing any prefill optimization. Enabling it only adds
      metadata preparation overhead and restricts compatibility with prompt logprobs, EAGLE speculation, and v2 model runner.

      '
  caveats:
  - 'This flag is a work-in-progress: no prefill optimization is actually performed when enabled'
  - Enabling this flag on Ascend v1 worker adds logits_indices preparation overhead with no benefit
  - Not supported with v2 model runner — will raise ValueError if attempted
  - Produces incorrect prompt logprobs — requests requiring prompt_logprobs will be rejected
  - Incompatible with EAGLE speculative decoding — raises ValueError at config validation
  quick_guide: Leave --kv-sharing-fast-prefill disabled (default) on Ascend NPU until the feature is complete.
analysis_date: '2026-07-06'

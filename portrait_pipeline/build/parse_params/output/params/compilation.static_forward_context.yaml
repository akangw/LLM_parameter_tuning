constraints:
- Each layer name (prefix) must be unique within static_forward_context; duplicate registration raises ValueError
- Layers must register themselves during model initialization before any code attempts to look them up
tuning_advice:
  summary: This is an internal runtime structure, not a user-tunable parameter. Ensure all model layers register correctly
    to avoid silently skipping Ascend-specific optimizations.
  suggested_values:
  - scenario: Default (all models)
    value: <automatically populated>
    reason: The context is filled automatically during model initialization; no user action is needed
  caveats:
  - If a custom model does not call the standard layer registration (e.g., custom Attention subclass that bypasses vllm_ascend's
    layer.py), that layer will be missing from static_forward_context, causing Ascend-specific KV cache binding, MLA optimizations,
    and MoE expert capturing to silently skip that layer
  - On 310P devices, missing layers in static_forward_context will prevent KV cache binding, leading to runtime errors or
    zero output
  - The context is cleared during shutdown (vllm/v1/worker/gpu/shutdown.py:17); any code that accesses it after shutdown will
    find an empty dict
  quick_guide: No tuning needed — this is an internal data structure automatically populated at model load time

impact_detail: "`compilation.static_forward_context` is a runtime-populated dictionary that maps layer names (e.g., \"model.layers.0.self_attn\"\
  ) to their corresponding module objects (Attention, MLAAttention, FusedMoE, DSA, etc.). It is NOT a user-facing configuration\
  \ knob — it is filled automatically during model initialization when each layer registers itself (see vllm_ascend/models/layer/attention/layer.py:121-123\
  \ and vllm_ascend/ops/dsa.py:161-163). Duplicate layer names raise ValueError.\nOn Ascend NPU, this context is critical\
  \ for performance because it is the primary mechanism by which vllm-ascend accesses layer objects outside the normal forward\
  \ pass. Key Ascend-specific performance paths that depend on it:\n1. **KV cache binding** (vllm_ascend/_310p/model_runner_310p.py:633):\
  \ binds\n   allocated KV cache tensors to each attention layer via\n   `bind_kv_cache(kv_caches, static_forward_context,\
  \ ...)`. Without this,\n   KV cache memory would not be accessible to attention kernels.\n\n2. **HashK cache binding for\
  \ MLA models** (vllm_ascend/worker/kvcomp_utils.py:642):\n   binds hash-based KV compression caches to attention layers.\
  \ This is an\n   Ascend-specific optimization for DeepSeek-V2/V3 MLA models that reduces\n   KV cache memory and speeds\
  \ up attention.\n\n3. **Mamba state preprocessing** (vllm_ascend/worker/model_runner_v1.py:1930):\n   passes the context\
  \ to `preprocess_mamba()` for state copy operations.\n\n4. **Routed experts capturer** (vllm_ascend/worker/model_runner_v1.py:3570):\n\
  \   iterates over all layers to find FusedMoE instances and attaches Ascend-specific\n   expert routing capturers (`_ascend_routed_experts_capturer`).\
  \ This is needed\n   because Ascend's `select_experts` bypasses upstream's `BaseRouter` hook.\n\n5. **MLA weight processing**\
  \ (vllm_ascend/attention/mla_v1.py:996,1014): looks up\n   the attention layer to read quantization scales (`quant_kscale`,\
  \ `fak_descale_float`,\n   `fak_descale_reciprocal`) needed for fused FA-quant and MLAPO kernels.\n\n6. **KV transfer with\
  \ C8 quantization** (vllm_ascend/distributed/kv_transfer/kv_p2p/\n   mooncake_layerwise_connector.py:1696): reads per-layer\
  \ C8 quantization scales\n   (`_c8_k_inv_scale`, `_c8_k_offset`) from the context for KV cache compression\n   during P2P\
  \ transfer.\n\nThe context is also used upstream for MLA hyperparameter resolution, FP8 scale initialization, KV block zeroing,\
  \ and shutdown cleanup. While the dict itself is not directly tunable, its contents determine which layers are accessible\
  \ for Ascend-specific optimizations. If a layer fails to register (e.g., due to custom model code), all Ascend optimizations\
  \ that depend on layer lookup will silently skip that layer, potentially causing significant performance degradation.\n"

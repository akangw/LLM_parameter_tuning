related_parameters:
- name: compilation_config.cudagraph_mode
  relation: static_forward_context is used alongside cudagraph capture to identify layers that need special handling
- name: model_config.use_mla
  relation: When use_mla is True, hash-based KV compression caches are bound to layers via static_forward_context
- name: cache_config.cache_dtype
  relation: Quantized KV cache dtype determines which per-layer scales are read from static_forward_context

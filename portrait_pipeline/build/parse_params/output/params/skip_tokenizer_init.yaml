name: --skip-tokenizer-init
type: cli
category: model
scope: vllm
source_file:
- vllm/config/model.py:246
- vllm/engine/arg_utils.py:806
value_type: bool
default: 'False'
valid_choices:
- 'True'
- 'False'
cli_example: --skip-tokenizer-init
deprecated: false
performance_impact: low
performance_scope:
- memory
impact_detail: 'When enabled, this flag skips initialization of the tokenizer and detokenizer. This reduces CPU memory usage
  and startup time by avoiding loading tokenizer vocabulary files and related data structures. On Ascend NPU, the tokenizer
  runs on the host CPU, so this parameter does not directly affect NPU compute performance. However, it indirectly affects
  memory by eliminating the tokenizer''s memory footprint on the host. The v1 upstream structured output module (vllm/v1/structured_output/__init__.py:70)
  also conditionally skips creating a ThreadPoolExecutor and loading the tokenizer when this flag is set, further reducing
  CPU resource usage. This parameter is listed in ModelConfig.computed_hash_ignored_factors (vllm/config/model.py:368), meaning
  it does not affect the computation graph hash — confirming it has no impact on model execution or NPU kernel selection.

  '
usage_locations:
- file: vllm/config/model.py:246
  context: 'Field definition with docstring: ''Skip initialization of tokenizer and detokenizer.'''

related_parameters:
- name: --tokenizer
  relation: When --skip-tokenizer-init is True, the --tokenizer value is ignored since no tokenizer is loaded.
- name: --tokenizer-mode
  relation: When --skip-tokenizer-init is True, --tokenizer-mode is ignored since no tokenizer is loaded.
- name: --enable-prompt-embeds
  relation: Both parameters relate to bypassing text tokenization; --enable-prompt-embeds allows raw embeddings as input while
    --skip-tokenizer-init skips tokenizer loading entirely.
constraints:
- When --skip-tokenizer-init is True, inputs must provide valid prompt_token_ids and prompt must be None.
- When --skip-tokenizer-init is True, generated output will contain token IDs instead of decoded text.
tuning_advice:
  summary: Enable only when providing pre-tokenized inputs and raw token ID outputs are acceptable; reduces host CPU memory
    usage and startup time.
  suggested_values:
  - scenario: Offline batch inference with pre-tokenized datasets
    value: 'True'
    reason: Eliminates tokenizer memory overhead and startup latency when inputs are already tokenized.
  - scenario: Standard online serving with text prompts
    value: 'False'
    reason: Tokenizer is required to convert text prompts to token IDs and decode output token IDs to text.
  caveats:
  - When enabled, all inputs must be pre-tokenized (prompt_token_ids); text prompts will not work.
  - Output will be raw token IDs — no text decoding is performed, which may complicate result interpretation.
  - On Ascend NPU, the tokenizer runs on CPU, so this flag only affects host memory, not device (NPU) memory.
  quick_guide: Set to True only for pre-tokenized input pipelines; keep False (default) for normal text-based inference.
analysis_date: '2026-07-06'

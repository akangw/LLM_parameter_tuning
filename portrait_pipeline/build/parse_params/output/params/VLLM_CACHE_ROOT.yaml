name: VLLM_CACHE_ROOT
type: env
category: compilation
scope: vllm
source_file:
- vllm/envs.py:572
value_type: str
default: ~/.cache/vllm
valid_choices: any valid filesystem path
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'VLLM_CACHE_ROOT controls the root directory for all vLLM cache files, including torch.compile cache artifacts,
  GPU P2P access caches, model info caches, XLA caches, and asset caches. On Ascend NPU, the most performance-critical subdirectory
  is `torch_compile_cache`, which stores compiled graph artifacts generated by the inductor backend. When torch.compile is
  enabled (via compilation_config), vLLM computes a hash based on environment, config, source code, and compiler version,
  then stores compiled graphs under `VLLM_CACHE_ROOT/torch_compile_cache/<hash>/`. On cache hit, the compilation step is skipped
  entirely, significantly reducing cold-start latency. On cache miss, the full compilation pipeline runs, which can take minutes
  for large models. The cache also affects AOT compilation artifacts stored under `torch_aot_compile/`. Additionally, GPU
  P2P access check results are cached under this root, avoiding repeated peer-to-peer capability probing on subsequent launches.
  While vllm-ascend does not override this parameter, the compilation cache behavior is equally relevant on Ascend NPU because
  CANN graph compilation is expensive and caching avoids redundant recompilation across restarts.

  '
usage_locations:
- file: vllm/compilation/backends.py:1063
  context: Constructs torch.compile cache directory path under VLLM_CACHE_ROOT/torch_compile_cache/<hash>
- file: vllm/compilation/caching.py:474
  context: Creates dummy cache directory under VLLM_CACHE_ROOT for standalone compilation artifacts
- file: vllm/compilation/decorators.py:528
  context: Stores AOT compilation artifacts under VLLM_CACHE_ROOT/torch_compile_cache/torch_aot_compile/<hash>
- file: vllm/distributed/device_communicators/all_reduce_utils.py:329
  context: Stores GPU P2P access cache JSON under VLLM_CACHE_ROOT
- file: vllm/model_executor/models/registry.py:806
  context: Stores model info cache under VLLM_CACHE_ROOT/modelinfos
- file: vllm/envs.py:57
  context: VLLM_XLA_CACHE_PATH defaults to VLLM_CACHE_ROOT/xla_cache
- file: vllm/envs.py:66
  context: VLLM_ASSETS_CACHE defaults to VLLM_CACHE_ROOT/assets
- file: vllm/benchmarks/startup.py:118
  context: Benchmark overrides VLLM_CACHE_ROOT to a temp directory for cold-start measurement isolation
related_parameters:
- name: VLLM_CONFIG_ROOT
  relation: Sibling parameter controlling configuration file root; follows the same XDG base directory pattern
- name: VLLM_XLA_CACHE_PATH
  relation: Defaults to a subdirectory under VLLM_CACHE_ROOT; can be overridden independently
- name: VLLM_ASSETS_CACHE
  relation: Defaults to a subdirectory under VLLM_CACHE_ROOT; can be overridden independently
- name: VLLM_DISABLE_COMPILE_CACHE
  relation: When set, disables torch.compile cache entirely, making VLLM_CACHE_ROOT irrelevant for compilation caching
- name: compilation_config.cache_dir
  relation: If explicitly set in the config, overrides the auto-generated cache directory under VLLM_CACHE_ROOT
constraints:
- The path must be writable by the vLLM process; otherwise cache creation will fail silently or raise permission errors
- The path must have sufficient disk space for compilation artifacts, which can be several GB for large models
tuning_advice:
  summary: 'Set VLLM_CACHE_ROOT to a persistent, fast-storage location to retain torch.compile caches across restarts, eliminating
    redundant compilation on Ascend NPU.

    '
  suggested_values:
  - scenario: Production deployment with frequent restarts
    value: /persistent/fast-storage/vllm-cache
    reason: 'Retains compiled graph artifacts across container/pod restarts, avoiding expensive CANN graph recompilation on
      every launch. Use a high-performance filesystem (local NVMe SSD) to minimize cache read/write latency.

      '
  - scenario: Ephemeral or CI environments
    value: /tmp/vllm-cache-$(hostname)
    reason: 'Acceptable for short-lived environments where cache persistence is not needed. Using /tmp avoids filling home
      directories and is automatically cleaned on reboot.

      '
  - scenario: Multi-node cluster with shared filesystem
    value: /shared-nfs/vllm-cache/$(hostname)
    reason: 'Each node should have its own subdirectory to avoid cache conflicts from different hardware configurations. Shared
      filesystems may introduce latency; prefer local storage when possible.

      '
  caveats:
  - 'Compilation cache is hash-based: any change to environment variables, model config, source code, or compiler version
    invalidates the cache and triggers recompilation'
  - On Ascend NPU, CANN compilation is particularly expensive; losing the cache can add minutes to startup time for large
    models
  - Cache directories can grow large (multiple GB); monitor disk usage and periodically clean old hash directories
  - The cache is NOT automatically cleaned; stale entries from previous versions accumulate indefinitely
  - When running multiple vLLM instances on the same host, ensure they use the same VLLM_CACHE_ROOT to share compilation artifacts
  quick_guide: Set VLLM_CACHE_ROOT to a persistent local SSD path to retain torch.compile caches across restarts and avoid
    expensive CANN recompilation on Ascend NPU.
analysis_date: '2026-07-06'

  context: Appends DP rank suffix to engine_id for uniqueness in data-parallel PD setups
related_parameters:
- name: --additional-config
  relation: Contains Ascend-specific PD settings like recompute_scheduler_enable, layer_sharding that only work when kv_transfer_config
    is set
- name: --tensor-parallel-size
  relation: prefill.tp_size and decode.tp_size in kv_transfer_config extra_config determine pd_tp_ratio, which must be compatible
    with the global TP size
- name: --speculative-config
  relation: Speculative decoding with draft models interacts with PD disaggregation; kv_transfer_config affects how draft
    model KV cache is managed
- name: --disable-hybrid-kv-cache-manager
  relation: When hybrid KV cache manager is disabled, KV transfer behavior for mamba/attention hybrid models changes
constraints:
- Encoder-decoder models are not supported when kv_transfer_config is set
- prefill.tp_size must be divisible by decode.tp_size when both are specified in extra_config
- recompute_scheduler_enable in additional_config is only valid when kv_role is kv_producer or kv_consumer (PD-disaggregated
  mode), not in PD-mixed mode
- layer_sharding in additional_config can only be enabled on kv_producer nodes (P nodes in PD-disaggregated mode)
- When using PD disaggregation with hybrid KV cache (mamba + attention), mamba_block_size must be a multiple of block_size
  if mamba_cache_mode is 'align'
- For DeepSeek MLA models, the pd_tp_ratio and pd_head_ratio calculations are skipped; PD disaggregation uses a different
  path
tuning_advice:
  summary: Enable PD disaggregation on Ascend NPU by setting kv_transfer_config with appropriate kv_role, kv_connector, and
    prefill/decode TP sizes; this fundamentally changes the deployment architecture and requires careful node configuration.
  suggested_values:
  - scenario: PD-disaggregated prefill node (kv_producer)
    value: '{"kv_connector": "MooncakeConnectorV1", "kv_buffer_device": "npu", "kv_role": "kv_producer", "kv_parallel_size":
      "1", "kv_port": "20001"}'
    reason: Documented in vllm-ascend large_scale_ep guide; uses MooncakeConnectorV1 with NPU buffer device for optimal Ascend
      transfer performance. Set HCCL_BUFFSIZE=256 on prefill nodes.
  - scenario: PD-disaggregated decode node (kv_consumer)
    value: '{"kv_connector": "MooncakeConnectorV1", "kv_buffer_device": "npu", "kv_role": "kv_consumer", "kv_parallel_size":
      "1", "kv_port": "20001"}'
    reason: Documented in vllm-ascend large_scale_ep guide; decode nodes should use HCCL_BUFFSIZE=1024 for larger communication
      buffers.
  - scenario: PD-disaggregated with asymmetric TP (prefill TP > decode TP)
    value: '{"kv_connector": "MooncakeConnectorV1", "kv_buffer_device": "npu", "kv_role": "kv_producer", "kv_parallel_size":
      "1", "extra_config": {"prefill": {"tp_size": 8}, "decode": {"tp_size": 4}}}'
    reason: Enables asymmetric TP between prefill and decode nodes; prefill TP must be divisible by decode TP. vllm-ascend
      computes pd_tp_ratio=2 and adjusts head distribution accordingly.
  - scenario: PD-mixed mode (no disaggregation)
    value: null (do not set --kv-transfer-config)
    reason: When PD disaggregation is not needed, omit this parameter entirely. The system runs in PD-mixed mode where each
      node handles both prefill and decode.
  caveats:
  - Setting kv_transfer_config increases KV cache memory usage due to alignment padding required for NPU DMA transfers (v1
    and v2 workers both add alignment bytes)
  - PD disaggregation requires network connectivity between prefill and decode nodes; MooncakeConnectorV1 uses TCP with configurable
    ports
  - When using data parallelism with PD disaggregation, engine_id is automatically suffixed with _dp{N} to avoid connector
    registration collisions
  - The recompute_scheduler_enable additional config can be used on P nodes to reduce memory pressure by recomputing activations
    instead of caching them
  - For DeepSeek MLA models, the pd_tp_ratio and pd_head_ratio calculations are bypassed; PD disaggregation uses a different
    internal path
  - v1 and v2 workers both support kv_transfer_config but may have different internal dispatch logic for KV cache management
  quick_guide: For PD disaggregation on Ascend, set kv_role to kv_producer on prefill nodes and kv_consumer on decode nodes
    with MooncakeConnectorV1 and npu buffer device; omit the parameter entirely for PD-mixed mode.

name: --kv-transfer-config
type: cli
category: kv_cache
scope: both
source_file:
- vllm/engine/arg_utils.py:1420
- vllm/config/vllm.py:323
- vllm_ascend/ascend_config.py:133
- vllm_ascend/ascend_config.py:180
- vllm_ascend/platform.py:278
- vllm_ascend/platform.py:306
- vllm_ascend/worker/model_runner_v1.py:454
- vllm_ascend/worker/model_runner_v1.py:3705
- vllm_ascend/worker/v2/attn_utils.py:270
- vllm_ascend/worker/v2/attn_utils.py:401
value_type: dict
default: None
valid_choices: A JSON dictionary string conforming to KVTransferConfig schema
cli_example: '--kv-transfer-config ''{"kv_connector": "MooncakeConnectorV1", "kv_buffer_device": "npu", "kv_role": "kv_producer",
  "kv_parallel_size": "1", "kv_port": "20001"}'''
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter enables and configures distributed KV cache transfer, which is the foundation for Prefill-Decode\
  \ (PD) disaggregation. When set, it activates the KVConnector subsystem that pushes KV cache from prefill nodes (kv_producer)\
  \ to decode nodes (kv_consumer) over the network. On Ascend NPU, this triggers several hardware-specific behaviors:\n1.\
  \ **PD disaggregation TP ratio calculation** (vllm_ascend/ascend_config.py:180-197):\n   vllm-ascend reads `prefill.tp_size`\
  \ and `decode.tp_size` from the config's\n   extra_config to compute `pd_tp_ratio`, `pd_head_ratio`, and `num_head_replica`.\n\
  \   These ratios directly control how KV heads are distributed between prefill and\n   decode nodes, affecting both memory\
  \ usage and communication volume.\n\n2. **KV cache memory alignment** (vllm_ascend/worker/model_runner_v1.py:3705-3710,\n\
  \   vllm_ascend/worker/v2/attn_utils.py:270-277): When kv_transfer_config is set,\n   KV cache tensors are allocated with\
  \ extra alignment padding to support efficient\n   NPU DMA transfers. This increases memory usage but is required for PD\
  \ transfer\n   correctness on Ascend hardware.\n\n3. **KV connector activation** (vllm/v1/core/sched/scheduler.py:119-133):\
  \ The\n   scheduler creates a KVConnector that manages remote KV cache push/pull operations.\n   The `kv_load_failure_policy`\
  \ field controls whether failed KV loads trigger\n   recomputation, directly impacting latency under network contention.\n\
  \n4. **Block hash computation** (vllm/v1/core/kv_cache_utils.py:608-610): When\n   kv_transfer_config is set, the hash block\
  \ size is computed differently to\n   support KV connector operations, affecting prefix caching efficiency.\n\n5. **Ascend-specific\
  \ constraints**: The `recompute_scheduler_enable` additional\n   config is only valid when kv_transfer_config is set with\
  \ kv_role as kv_producer\n   or kv_consumer (vllm_ascend/ascend_config.py:133). `layer_sharding` is only\n   valid on P\
  \ nodes (vllm_ascend/platform.py:306-308).\n\nWithout this parameter (None), PD disaggregation is disabled entirely, and\
  \ the system runs in PD-mixed mode where each node handles both prefill and decode.\n"

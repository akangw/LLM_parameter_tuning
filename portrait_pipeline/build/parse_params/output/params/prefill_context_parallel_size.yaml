related_parameters:
- name: --decode-context-parallel-size
  relation: Together with PCP, forms the total context parallel size (cp_size = dcp × pcp). Both affect KV cache sharding
    and block size alignment.
- name: --tensor-parallel-size
  relation: world_size = pp_size × tp_size × pcp_size. On Ascend, tp_size must be divisible by dcp_size; PCP interacts with
    TP for FLASHCOMM1 alignment (max_num_batched_tokens must be divisible by tp_size × pcp_size).
- name: --max-num-batched-tokens
  relation: Automatically adjusted when FLASHCOMM1 is enabled and pcp > 1 to satisfy tp_size × pcp_size divisibility.
- name: --cp-kv-cache-interleave-size
  relation: Must equal block_size when cp_size > 1 in P/D disaggregation scenarios.
- name: --max-model-len
  relation: Effectively divided by dcp × pcp for per-device KV cache allocation when CP is active.
- name: VLLM_ASCEND_ENABLE_FLASHCOMM1
  relation: When enabled with pcp > 1, triggers automatic max_num_batched_tokens adjustment.
constraints:
- prefill_context_parallel_size must be a positive integer.
- On Ascend NPU, prefill_context_parallel_size > 1 is only supported with the V1 model runner; the V2 model runner raises
  NotImplementedError.
- When using P/D disaggregation with KV transfer and cp_size > 1, cp_kv_cache_interleave_size must equal block_size.
- When FLASHCOMM1 is enabled and pcp > 1, max_num_batched_tokens must be divisible by tp_size × pcp_size (automatically adjusted
  if not).
- Upstream vLLM V2 model runner does not support prefill_context_parallel_size > 1.
- Upstream vLLM does not support context parallelism with hybrid KV cache groups having multiple block sizes (Ascend patches
  this limitation).
- The --enable-return-routed-experts feature is not validated with pcp > 1.
tuning_advice:
  summary: Enable PCP for long-context inference when a single NPU cannot hold the full KV cache; use V1 worker on Ascend
    and ensure tp_size is divisible by dcp_size.
  suggested_values:
  - scenario: Long-context inference (e.g., 128K+ tokens) on single-node 8-NPU Ascend
    value: 2
    reason: Common setting from vllm-ascend documentation; balances KV cache reduction with communication overhead. With tp=8,
      pcp=2, dcp=2, each device holds 1/4 of the KV cache.
  - scenario: Standard context lengths that fit in single-device KV cache
    value: 1
    reason: Default; avoids unnecessary all-to-all communication overhead during prefill. No KV cache sharding benefit when
      memory is sufficient.
  - scenario: Multi-node long-context inference with large TP
    value: 2
    reason: Documentation example uses tp=16, pcp=2, dcp=8 for multi-node deployment. PCP=2 provides additional KV cache reduction
      beyond DCP alone.
  caveats:
  - PCP > 1 is only supported with the V1 model runner on Ascend NPU. The V2 worker will raise NotImplementedError.
  - Increasing PCP adds all-to-all communication during prefill attention, which increases prefill latency. Only enable when
    KV cache memory is the bottleneck.
  - When FLASHCOMM1 is enabled with PCP > 1, max_num_batched_tokens is automatically adjusted, which may affect scheduling
    behavior.
  - 'PCP multiplies the total device count: world_size = pp_size × tp_size × pcp_size. Ensure sufficient NPUs are available.'
  - On Ascend, tp_size must be divisible by dcp_size. PCP does not have this constraint directly, but the combined cp_size
    affects block alignment.
  - The V1 worker adds pcp_size × 2 × max_num_seqs padding tokens to max_num_batched_tokens, slightly increasing memory usage
    for communication buffers.
  quick_guide: Set --prefill-context-parallel-size to 2 for long-context inference on Ascend with V1 worker; leave at 1 (default)
    when KV cache fits in single-device memory.
analysis_date: '2026-07-06'

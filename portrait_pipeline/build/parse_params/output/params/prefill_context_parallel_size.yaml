name: --prefill-context-parallel-size
type: cli
category: parallelism
scope: both
source_file:
- vllm/engine/arg_utils.py:963
- vllm/config/parallel.py:115
value_type: int
default: 1
valid_choices: positive integer; must divide tensor_parallel_size on Ascend
cli_example: --prefill-context-parallel-size 2
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "Controls the number of prefill context parallel (PCP) groups, which shard the KV cache along the sequence\
  \ dimension during prefill to reduce per-device memory footprint and enable long-context inference. On Ascend NPU, PCP interacts\
  \ with multiple subsystems:\n1. **World size calculation** (vllm/config/parallel.py:765): world_size = pp_size × tp_size\
  \ × pcp_size.\n   Increasing PCP multiplies the total number of required NPU devices.\n\n2. **KV cache memory** (vllm_ascend/patch/platform/patch_kv_cache_interface.py:190-194):\n\
  \   When dcp × pcp > 1, max_model_len is divided by dcp × pcp, proportionally reducing\n   per-device KV cache memory usage.\
  \ This is the primary mechanism enabling long sequences.\n\n3. **Block size alignment** (vllm_ascend/patch/platform/patch_kv_cache_utils.py:40-56):\n\
  \   Ascend patches the upstream block size resolver to support CP with multiple KV cache\n   groups. scheduler_block_size\
  \ = lcm(group_block_sizes) × dcp × pcp, ensuring proper\n   alignment for Ascend's MLA and SWA-MLA layers.\n\n4. **FLASHCOMM1\
  \ constraint** (vllm_ascend/ascend_config.py:116-130): When FLASHCOMM1 is\n   enabled and pcp > 1, max_num_batched_tokens\
  \ is automatically adjusted to be divisible\n   by tp_size × pcp_size to satisfy communication alignment requirements.\n\
  \n5. **V1 worker padding** (vllm_ascend/worker/model_runner_v1.py:258-261): The V1 model\n   runner adds pcp_size × 2 ×\
  \ max_num_seqs padding tokens to max_num_batched_tokens to\n   accommodate PCP communication buffers.\n\n6. **V2 worker\
  \ unsupported** (vllm_ascend/worker/v2/model_runner.py:68-69): The Ascend V2\n   model runner explicitly raises NotImplementedError\
  \ when pcp > 1, meaning PCP only works\n   with the V1 worker on Ascend.\n\n7. **P/D disaggregation** (vllm_ascend/platform.py:615-625):\
  \ When KV transfer is configured\n   and cp_size > 1, cp_kv_cache_interleave_size must equal block_size.\n\nPerformance-wise,\
  \ PCP reduces per-device KV cache memory (enabling longer contexts or larger batch sizes) at the cost of additional all-to-all\
  \ communication during prefill attention, which increases prefill latency. The tradeoff is favorable for long-context workloads\
  \ where a single device cannot hold the full KV cache.\n"

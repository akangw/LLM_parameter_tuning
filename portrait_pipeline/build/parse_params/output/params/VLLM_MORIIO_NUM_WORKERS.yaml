name: VLLM_MORIIO_NUM_WORKERS
type: env
category: communication
scope: vllm
source_file:
- vllm/envs.py:1488
- vllm/envs.py:209
value_type: int
default: '1'
valid_choices: positive integer
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
- latency
impact_detail: 'This environment variable controls the number of worker threads used by the Mori-IO connector for RDMA-based
  KV cache transfer operations in a disaggregated prefill-decode setup. It is read in vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:381
  and passed as `num_worker_threads` to the `RdmaBackendConfig` constructor, which configures the Mori-IO engine''s backend.
  More worker threads can increase parallelism for KV cache transfer operations, potentially improving throughput and reducing
  transfer latency. However, this parameter only takes effect when using the Mori-IO connector in a disaggregated deployment,
  which is a niche scenario. On Ascend NPU, the Mori-IO connector is not Ascend-specific and there is no vllm-ascend override
  for this parameter. The performance impact is low because it only affects a specific connector in a specific deployment
  mode, and the default of 1 worker is sufficient for most use cases.

  '
usage_locations:
- file: vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:381
  context: Reads VLLM_MORIIO_NUM_WORKERS to set num_worker_threads in RdmaBackendConfig for Mori-IO engine backend creation.
related_parameters:
- name: VLLM_MORIIO_QP_PER_TRANSFER
  relation: Also part of RdmaBackendConfig; controls queue pairs per transfer for Mori-IO connector.
- name: VLLM_MORIIO_POST_BATCH_SIZE
  relation: Also part of RdmaBackendConfig; controls post-processing batch size for Mori-IO connector.
- name: VLLM_MORIIO_CONNECTOR_READ_MODE
  relation: Controls the read mode for the Mori-IO connector; must be enabled for Mori-IO to be active.
constraints:
- VLLM_MORIIO_NUM_WORKERS must be a positive integer.
- This parameter has no effect unless the Mori-IO connector is being used in a disaggregated prefill-decode setup.
tuning_advice:
  summary: 'Only relevant for disaggregated prefill-decode deployments using the Mori-IO connector. The default value of 1
    is sufficient for most scenarios; increase only if KV cache transfer becomes a bottleneck.

    '
  suggested_values:
  - scenario: Default / single-stream KV transfer
    value: '1'
    reason: A single worker thread is sufficient for typical KV cache transfer workloads and avoids unnecessary thread overhead.
  - scenario: High-throughput disaggregated deployment with multiple concurrent KV transfers
    value: 2-4
    reason: Increasing worker threads can parallelize KV cache transfer operations, reducing latency under high concurrency.
      Beyond 4 threads, diminishing returns are expected due to RDMA NIC limitations.
  caveats:
  - This parameter only affects the Mori-IO connector, which is used in disaggregated prefill-decode setups. It has no effect
    in standard monolithic deployments.
  - Increasing worker threads consumes additional CPU resources. Monitor CPU utilization when tuning this value.
  - On Ascend NPU, there is no special handling or override for this parameter; behavior is identical to upstream vLLM.
  quick_guide: Keep the default value of 1 unless KV cache transfer is a proven bottleneck in a Mori-IO disaggregated deployment.
analysis_date: '2026-07-06'

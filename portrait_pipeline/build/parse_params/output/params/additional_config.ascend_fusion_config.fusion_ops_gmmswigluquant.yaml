name: additional_config.ascend_fusion_config.fusion_ops_gmmswigluquant
type: nested
category: compilation
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:529
- vllm_ascend/ops/fused_moe/moe_comm_method.py:69
value_type: bool
default: true
valid_choices:
- true

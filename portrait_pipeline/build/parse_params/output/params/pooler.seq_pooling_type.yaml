impact_detail: 'This parameter selects the sequence-level pooling method for embedding/pooling models. It affects performance
  indirectly through two mechanisms:

  1. **Chunked prefill compatibility** (vllm/config/model.py:1734): When `seq_pooling_type` is "MEAN" or "CLS" (combined with
  `tok_pooling_type == "STEP"`), chunked prefill is disabled for decoder-attention pooling models. Chunked prefill is a key
  throughput optimization that interleaves prefill and decode — disabling it can reduce throughput for workloads with long
  prompts.

  2. **Pooling computation path** (vllm/model_executor/layers/pooler/seqwise/poolers.py:93): The selected pooling type determines
  which pooling function is dispatched at runtime. Different pooling methods (MEAN, CLS, LAST, STEP) have slightly different
  computational costs, but the difference is negligible compared to the model''s forward pass.

  On Ascend NPU, the pooling operation itself is a lightweight reduction over the hidden states tensor. The primary performance
  consideration is whether the chosen pooling type allows chunked prefill to remain enabled. No vllm-ascend specific overrides
  or modifications were found for this parameter — it behaves identically on Ascend as on GPU.

  '

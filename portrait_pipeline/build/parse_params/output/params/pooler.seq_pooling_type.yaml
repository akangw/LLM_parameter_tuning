constraints:
- Must be one of MEAN, CLS, LAST, or STEP
- Only applicable when runner_type is 'pooling'
tuning_advice:
  summary: 'Use the model''s default pooling type unless you have a specific reason to change it. On Ascend NPU, prefer pooling
    types that allow chunked prefill (avoid MEAN/CLS with STEP token pooling on decoder models) to maintain throughput.

    '
  suggested_values:
  - scenario: Default usage with embedding/pooling models
    value: <model default>
    reason: The model's default pooling type is set from its HuggingFace config and matches the training setup. Changing it
      may produce incorrect embeddings.
  - scenario: Decoder-attention pooling model where chunked prefill throughput matters
    value: LAST
    reason: LAST pooling (unlike MEAN/CLS) allows chunked prefill to remain enabled on decoder models, preserving throughput
      for long-prompt workloads.
  caveats:
  - Using MEAN or CLS pooling on decoder-attention models disables chunked prefill, which can significantly reduce throughput
    on Ascend NPU for workloads with long prompts.
  - The pooling type must match what the model was trained with — using the wrong type produces semantically incorrect embeddings.
  - For CLIP-style models, seq_pooling_type is also used to determine vision feature selection strategy, affecting multimodal
    correctness.
  quick_guide: Stick to the model's default pooling type. If chunked prefill throughput is critical and your decoder model
    supports it, use LAST pooling.

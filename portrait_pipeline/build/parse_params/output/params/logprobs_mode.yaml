name: --logprobs-mode
type: cli
category: model
scope: both
source_file:
- vllm/config/model.py:227
- vllm/engine/arg_utils.py:521
- vllm/engine/arg_utils.py:798
- vllm_ascend/sample/sampler.py:67
- vllm_ascend/sample/rejection_sampler.py:134
- vllm_ascend/_310p/sample/sampler.py:68
value_type: str
default: raw_logprobs
valid_choices:
- raw_logprobs
- processed_logprobs
- raw_logits
- processed_logits
cli_example: --logprobs-mode processed_logprobs
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: "This parameter controls what intermediate values are returned in logprobs/prompt_logprobs fields of the API\
  \ response. It does NOT change the sampling result (the chosen token is identical regardless of mode). The performance impact\
  \ comes from two sources:\n1. **Sampler fast-path eligibility (GPU-only, not Ascend).** In upstream vLLM v1,\n   `TopKTopPSampler.__init__`\
  \ (vllm/v1/sample/ops/topk_topp_sampler.py:30-109) checks\n   whether `logprobs_mode` is `processed_logits` or `processed_logprobs`.\
  \ If it is,\n   the FlashInfer/aiter fast-path is disabled and the sampler falls back to the\n   PyTorch-native implementation.\
  \ This is because the fast-path kernels cannot return\n   intermediate logits/logprobs after top-k/top-p filtering. **On\
  \ Ascend NPU, this\n   fast-path logic is irrelevant** — the Ascend sampler (`AscendTopKTopPSampler` in\n   vllm_ascend/sample/sampler.py:131-160\
  \ and vllm_ascend/_310p/sample/sampler.py:62-87)\n   always uses its own `forward_native` implementation and does not have\
  \ a FlashInfer\n   equivalent. Therefore, the mode choice does not affect which sampling kernel is used\n   on Ascend.\n\
  \n2. **Extra computation in the sampler.** When `logprobs_mode` is `processed_logits`\n   or `processed_logprobs`, the Ascend\
  \ sampler computes and returns the intermediate\n   logits/logprobs after top-k/top-p filtering (vllm_ascend/sample/sampler.py:141-157,\n\
  \   vllm_ascend/_310p/sample/sampler.py:68-84). This involves an additional\n   `log_softmax` call for `processed_logprobs`\
  \ mode. The overhead is small (a single\n   softmax/log_softmax per token) and only applies when logprobs are actually requested\n\
  \   by the client. When logprobs are not requested, this code path is not executed.\n\n3. **Speculative decoding.** In the\
  \ rejection sampler (both upstream\n   vllm/v1/sample/rejection_sampler.py:138 and vllm_ascend/sample/rejection_sampler.py:134),\n\
  \   the mode determines whether `raw_target_logits` or `target_logits` (after processors)\n   is used for logprobs computation.\
  \ The `is_processed_logprobs_mode` flag also controls\n   whether a clone of `raw_target_logits` is made before applying\
  \ processors\n   (vllm/v1/sample/rejection_sampler.py:151-155). This clone adds a minor memory and\n   compute overhead\
  \ for non-processed modes.\n\nOverall, the performance impact is low because: (a) the extra computation is minimal (softmax/log_softmax),\
  \ (b) it only occurs when logprobs are requested, and (c) on Ascend there is no fast-path kernel to lose.\n"

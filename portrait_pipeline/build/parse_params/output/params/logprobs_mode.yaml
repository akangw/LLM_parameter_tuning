related_parameters:
- name: --max-logprobs
  relation: Controls how many logprobs are returned; logprobs-mode determines what those values represent (raw vs processed,
    logprobs vs logits)
- name: logprobs (SamplingParams)
  relation: The per-request logprobs field in SamplingParams triggers logprobs computation; logprobs-mode is the server-level
    default for what content to return
constraints:
- 'Must be one of: raw_logprobs, processed_logprobs, raw_logits, processed_logits'
tuning_advice:
  summary: Choose based on API semantics, not performance — the overhead difference between modes is negligible on Ascend
    NPU.
  suggested_values:
  - scenario: Default usage — standard OpenAI-compatible logprobs
    value: raw_logprobs
    reason: Matches the default vLLM behavior and OpenAI API semantics. No extra softmax computation in the sampler when logprobs
      are requested.
  - scenario: Need logprobs after temperature, top_k, top_p, and other processors are applied
    value: processed_logprobs
    reason: Returns logprobs that reflect the actual sampling distribution after all transformations. Adds a small log_softmax
      overhead per token when logprobs are requested.
  - scenario: Need raw logits for custom post-processing or debugging
    value: raw_logits
    reason: Returns the unprocessed logits directly from the model output. Useful for debugging logit processors or implementing
      custom sampling logic externally.
  - scenario: Need processed logits (after processors but before softmax)
    value: processed_logits
    reason: Returns logits after applying all processors (temperature, top_k/top_p, penalties, etc.) but before converting
      to probabilities.
  caveats:
  - On Ascend NPU, all four modes use the same sampling kernel (AscendTopKTopPSampler.forward_native) — there is no fast-path
    to lose unlike GPU where FlashInfer is disabled for processed modes.
  - The extra log_softmax computation for processed_logprobs mode is only triggered when the client actually requests logprobs
    in SamplingParams. Requests without logprobs incur zero overhead regardless of this setting.
  - In speculative decoding, the rejection sampler internally overrides logprobs_mode to 'processed_logits' or 'raw_logits'
    for bonus token sampling (vllm_ascend/sample/rejection_sampler.py:134). This override is hardcoded and independent of
    the user's --logprobs-mode setting.
  - The vllm-ascend AscendSampler has a TODO comment (vllm_ascend/sample/sampler.py:68) indicating that full logprobs_mode
    support is still being worked on. Currently only processed_logits and processed_logprobs are explicitly handled in the
    Ascend sampler's forward_native.
  quick_guide: Use raw_logprobs (default) for standard OpenAI-compatible behavior; switch to processed_logprobs only if you
    need logprobs that reflect the post-processing sampling distribution.
analysis_date: '2026-07-06'

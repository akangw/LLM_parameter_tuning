name: additional_config.finegrained_tp_config.oproj_tensor_parallel_size
type: nested
category: parallelism
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:418
value_type: int
default: '0'
valid_choices: non-negative integer; must divide data_parallel_size when > 0
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: 'When set to a positive value, this parameter enables fine-grained tensor parallelism specifically for the
  output projection (o_proj) layer in MoE models on Ascend NPU. It creates a dedicated communication group (_OTP) of the specified
  size via `_create_or_get_group` in vllm_ascend/distributed/parallel_state.py:135-143, which is then used by AscendRowParallelLinear
  for the o_proj layer (tests/ut/ops/test_linear.py:126-134). This allows the o_proj computation to be parallelized across
  a subset of devices independently from the global tensor parallel size, reducing communication overhead for this specific
  layer. The feature is designed for Prefill-Decode (PD) disaggregation scenarios on Ascend NPU, specifically for the decode
  (D) node, and requires graph mode (enforce_eager must be False). It is only supported for MoE models. Performance improvement
  comes from reducing the all-reduce communication cost for the o_proj layer by using a smaller communication group than the
  global tensor parallel group, which is particularly beneficial for DeepSeek models as noted in the release notes (PR #2167).

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:418
  context: Parsed from finegrained_tp_config dict with default 0
- file: vllm_ascend/ascend_config.py:425-434
  context: 'Validation: requires graph mode and PD D-node scenario'
- file: vllm_ascend/distributed/parallel_state.py:135
  context: Creates _OTP communication group when size > 0
- file: vllm_ascend/utils.py:971
  context: oproj_tp_enable() helper checks if size > 0
- file: vllm_ascend/utils.py:1338-1341
  context: Mutual exclusion check with flashcomm2_oproj_tensor_parallel_size
related_parameters:

  relation: Sibling fine-grained TP parameter for o_lora layer
- name: flashcomm2_oproj_tensor_parallel_size
  relation: Mutually exclusive; cannot be enabled simultaneously
- name: --enforce-eager
  relation: Must be False (graph mode required) when oproj_tensor_parallel_size > 0
- name: --data-parallel-size
  relation: oproj_tensor_parallel_size must divide data_parallel_size
constraints:
- oproj_tensor_parallel_size must be 0 or a positive integer.
- When oproj_tensor_parallel_size > 0, enforce_eager must be False (graph mode is required).
- When oproj_tensor_parallel_size > 0, the model must be an MoE model (is_moe must be True).
- When oproj_tensor_parallel_size > 0, kv_transfer_config must be set and is_kv_consumer must be True (PD D-node scenario
  only).
- oproj_tensor_parallel_size must divide data_parallel_size evenly.
- oproj_tensor_parallel_size cannot be enabled simultaneously with flashcomm2_oproj_tensor_parallel_size.
tuning_advice:
  summary: 'Enable oproj_tensor_parallel_size for MoE models (especially DeepSeek) in PD disaggregation decode nodes to reduce
    o_proj all-reduce communication overhead and improve throughput.

    '
  suggested_values:
  - scenario: Default / feature disabled
    value: '0'
    reason: Disables fine-grained TP for o_proj; safe default for all scenarios.
  - scenario: MoE model (e.g., DeepSeek) in PD disaggregation D-node with graph mode
    value: '2'
    reason: 'Enables o_proj TP with a group size of 2, reducing communication overhead for the output projection layer. This
      is the value used in tests and aligns with the documented improvement for DeepSeek models (PR #2167).'
  caveats:
  - This feature is only supported for MoE models — attempting to use it with dense models will raise an AssertionError.
  - Requires PD (Prefill-Decode) disaggregation deployment and must be set on the D (decode) node only.
  - Graph mode is mandatory (enforce_eager=False); eager mode will raise an AssertionError.
  - Mutually exclusive with flashcomm2_oproj_tensor_parallel_size — choose one approach for o_proj optimization.
  - The oproj_tensor_parallel_size must divide data_parallel_size evenly, otherwise an AssertionError is raised.
  quick_guide: Set to 2 for DeepSeek MoE models on Ascend PD D-nodes with graph mode to reduce o_proj communication overhead.
analysis_date: '2026-07-06'

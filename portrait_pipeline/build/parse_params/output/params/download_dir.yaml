related_parameters:
- name: --load-format
  relation: Determines which loader path uses download_dir (safetensors, gguf, bitsandbytes, etc.)
- name: --model
  relation: If model is a local path, download_dir is not used; only used for Hugging Face Hub model IDs
- name: --ignore-patterns
  relation: Filters which files to download into download_dir
constraints: []
tuning_advice:
  summary: 'Set --download-dir to a path on fast local storage (NVMe SSD) to minimize model loading latency on Ascend NPU;
    avoid network-mounted filesystems for production deployments.

    '
  suggested_values:
  - scenario: Production deployment with local NVMe storage
    value: /data/model_cache
    reason: Local NVMe provides the fastest read speeds, minimizing cold-start latency when loading large models onto Ascend
      NPU
  - scenario: Development or testing with limited local storage
    value: None (use Hugging Face default cache)
    reason: Allows Hugging Face to manage cache location automatically; acceptable when startup time is not critical
  - scenario: Multi-node Ascend cluster with shared storage
    value: /shared/models
    reason: Centralized model storage avoids per-node downloads; ensure the shared filesystem has sufficient read throughput
  caveats:
  - This parameter only affects model download location, not runtime inference performance on Ascend NPU
  - If the model path (--model) is already a local directory, --download-dir is ignored
  - On Ascend NPU, model weights are loaded into HBM via the CANN runtime; download_dir only affects the initial file read
    phase
  - Ensure sufficient disk space in the specified directory — large models (70B+) can require hundreds of GB
  quick_guide: Point --download-dir to fast local storage to reduce model loading time; has no effect on inference throughput
    or memory usage on Ascend NPU
analysis_date: '2026-07-06'

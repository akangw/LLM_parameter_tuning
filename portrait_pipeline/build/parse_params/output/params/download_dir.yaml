name: --download-dir
type: cli
category: model
scope: vllm
source_file:
- vllm/config/load.py:60
- vllm/engine/arg_utils.py:849
value_type: str
default: None
valid_choices: any valid filesystem path
cli_example: --download-dir /data/model_cache
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'This parameter specifies the local directory for downloading and caching model weights from Hugging Face Hub.
  It is passed to `huggingface_hub.snapshot_download` as the `cache_dir` argument. On Ascend NPU, this parameter does not
  directly affect inference throughput or memory usage. However, it can indirectly affect startup latency: if the specified
  directory is on slow storage (e.g., NFS without sufficient caching), model loading time increases. Conversely, placing weights
  on fast local NVMe storage reduces cold-start latency. The parameter is used identically in vllm-ascend (no override detected)
  — it flows through `LoadConfig.download_dir` into `download_weights_from_hf`, `download_safetensors_index_file_from_hf`,
  `download_gguf`, and the bitsandbytes loader. In vllm-ascend''s `aisbench.py`, a similar `download_dir` parameter is used
  for ModelScope downloads, but this is a separate tool path, not the vLLM engine path.

  '
usage_locations:

name: additional_config.ascend_compilation_config.enable_npugraph_ex
type: nested
category: compilation
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:483
- vllm_ascend/platform.py:503
- vllm_ascend/platform.py:529
- vllm_ascend/compilation/compiler_interface.py:259
value_type: bool
default: 'True'
valid_choices:
- true
- false
cli_example: '''--additional-config {"ascend_compilation_config":{"enable_npugraph_ex":false}}'''
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'When enabled (default), the FX graph generated by Dynamo is compiled through the npugraph_ex backend (vllm_ascend/compilation/compiler_interface.py:259-275),
  which applies Ascend-specific graph fusion optimizations including norm-quant fusion, qknorm-rope fusion, and allreduce-rmsnorm
  fusion. This directly reduces kernel launch overhead and improves compute efficiency on Ascend NPUs. When disabled, the
  system falls back to a simpler fusion_pass_compile path that provides fewer optimizations. The parameter also interacts
  with cudagraph_mode: if cudagraph_mode is NONE or PIECEWISE, enable_npugraph_ex is forcibly set to False (vllm_ascend/platform.py:503,529),
  meaning the full graph optimization is only available with FULL cudagraph modes. Additionally, enable_npugraph_ex is a prerequisite
  for enable_static_kernel (vllm_ascend/ascend_config.py:520-521), which can further improve performance for static-shape
  workloads by pre-compiling operator binaries.

  '
usage_locations:
- file: vllm_ascend/compilation/compiler_interface.py:259
  context: Selects npugraph_ex_compile vs fusion_pass_compile backend
- file: vllm_ascend/platform.py:503
  context: Forcibly disabled when cudagraph_mode is NONE
- file: vllm_ascend/platform.py:529
  context: Forcibly disabled when cudagraph_mode is PIECEWISE
- file: vllm_ascend/ascend_config.py:381
  context: Controls whether allreduce-rmsnorm fusion split points are added
- file: vllm_ascend/worker/worker.py:151
  context: Gates static kernel signal handler installation
- file: vllm_ascend/compilation/compiler_interface.py:221
  context: Included in compilation cache hash computation
related_parameters:
- name: additional_config.ascend_compilation_config.enable_static_kernel
  relation: Requires enable_npugraph_ex to be True; assertion fails otherwise
- name: compilation_config.cudagraph_mode
  relation: NONE or PIECEWISE modes forcibly disable enable_npugraph_ex
- name: additional_config.ascend_compilation_config.fuse_allreduce_rms
  relation: Only takes effect when enable_npugraph_ex is True
- name: additional_config.ascend_compilation_config.fuse_norm_quant
  relation: Graph fusion pass controlled by npugraph_ex backend
- name: additional_config.ascend_compilation_config.fuse_qknorm_rope
  relation: Graph fusion pass controlled by npugraph_ex backend
constraints:
- enable_static_kernel requires enable_npugraph_ex to be True; an assertion error is raised otherwise
- When cudagraph_mode is NONE, enable_npugraph_ex is forcibly set to False regardless of user configuration
- When cudagraph_mode is PIECEWISE, enable_npugraph_ex is forcibly set to False regardless of user configuration
- When cudagraph_mode is an unsupported value on NPU, enable_npugraph_ex is forcibly set to False
tuning_advice:
  summary: Keep enable_npugraph_ex enabled (default) for best performance; only disable for debugging or when using cudagraph
    modes that do not support it
  suggested_values:
  - scenario: Standard production deployment with FULL_DECODE_ONLY or FULL cudagraph mode
    value: true
    reason: Enables npugraph_ex backend with graph fusion optimizations (norm-quant, qknorm-rope, allreduce-rmsnorm) that
      significantly improve throughput and reduce latency on Ascend NPU
  - scenario: Debugging graph compilation issues or verifying correctness
    value: false
    reason: Falls back to simpler fusion_pass_compile path, making it easier to isolate compilation problems
  - scenario: Using cudagraph_mode NONE or PIECEWISE
    value: false
    reason: The platform layer forcibly disables npugraph_ex for these modes; setting it true has no effect
  caveats:
  - Disabling npugraph_ex removes all graph fusion optimizations, which can significantly degrade throughput and increase
    latency
  - The parameter is silently overridden to False when cudagraph_mode is NONE, PIECEWISE, or unsupported on NPU — user configuration
    is ignored in these cases
  - When enable_npugraph_ex is False, fuse_allreduce_rms split points are still added via a separate code path (vllm_ascend/ascend_config.py:394-405),
    but other fusions are lost
  - The documentation table in additional_config.md shows a default of False at the top level but True under ascend_compilation_config;
    the source code default is True
  quick_guide: Keep the default True for production; only set to False for debugging or when forced by cudagraph_mode constraints
analysis_date: '2026-07-06'

name: additional_config.eplb_config.algorithm_execution_interval
type: nested
category: scheduling
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:633
- vllm_ascend/eplb/eplb_updator.py:70
value_type: int
default: 30
valid_choices: integer >= 0
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: 'This parameter controls how many forward iterations the EPLB (Expert Parallel Load Balancing) worker waits
  before completing its CPU-side rebalancing computation. In the EPLB updater (vllm_ascend/eplb/eplb_updator.py:78-85), the
  total cycle length is: expert_heat_collection_interval + algorithm_execution_interval + num_moe_layers. After expert_heat_collection_interval
  iterations of load data collection, the algorithm execution phase begins. The parameter determines how long the CPU algorithm
  runs before the expert maps are updated and load counters reset. A smaller value causes more frequent expert redistribution,
  which can improve load balance but adds CPU overhead and may trigger premature rebalancing during startup. A larger value
  delays rebalancing, potentially causing temporary expert load imbalance and reduced throughput. The documentation explicitly
  states this value should be >= 30 to avoid premature balancing during startup.

  '
usage_locations:
- file: vllm_ascend/eplb/eplb_updator.py:70
  context: Stored as self.algorithm_execution_interval and used in update_iteration() to determine when the EPLB cycle completes
    and expert maps are refreshed.
- file: vllm_ascend/ascend_config.py:633
  context: Default value definition in EplbConfig._defaults dict.
related_parameters:
- name: additional_config.eplb_config.expert_heat_collection_interval
  relation: Together with algorithm_execution_interval, defines the total EPLB cycle length. The heat collection phase runs
    first, then the algorithm execution phase.
- name: additional_config.eplb_config.dynamic_eplb
  relation: Must be enabled (True) for algorithm_execution_interval to have any effect. When dynamic_eplb is False, EPLB is
    not active.
- name: additional_config.eplb_config.num_redundant_experts
  relation: The number of redundant experts affects how much rebalancing the algorithm can perform; must match tensor-parallel
    size for sufficient redundancy.
constraints:
- algorithm_execution_interval must be an integer.
- algorithm_execution_interval must be greater than or equal to 0.
- algorithm_execution_interval should be at least 30 to avoid premature balancing during startup.
tuning_advice:
  summary: Set algorithm_execution_interval to 30 or higher for stable workloads; increase for very stable traffic to reduce
    CPU overhead, decrease (but not below 30) for rapidly changing expert load patterns.
  suggested_values:
  - scenario: Stable workloads with consistent expert load distribution
    value: 30
    reason: Default value; sufficient for most stable workloads. Minimizes CPU overhead while providing timely rebalancing.
  - scenario: Fluctuating traffic with rapidly changing expert load patterns
    value: 50
    reason: Allows more time for the CPU algorithm to compute optimal expert maps before the next cycle, improving rebalancing
      quality under dynamic loads.
  - scenario: Startup or warm-up phase
    value: 30
    reason: Documentation recommends >= 30 to avoid premature balancing during startup. Lower values may trigger rebalancing
      before sufficient load data is collected.
  caveats:
  - Setting this value too low (< 30) may cause premature expert rebalancing during model startup, leading to suboptimal expert
    distribution.
  - Setting this value too high delays expert redistribution, which can cause temporary load imbalance and reduced throughput
    if expert load patterns shift rapidly.
  - The total EPLB cycle time is expert_heat_collection_interval + algorithm_execution_interval + num_moe_layers iterations.
    Tuning both intervals together is necessary for optimal performance.
  - This parameter only takes effect when dynamic_eplb is enabled and the DYNAMIC_EPLB or EXPERT_MAP_RECORD environment variable
    is set to true.
  quick_guide: Use the default value of 30 for most deployments; increase to 50-100 only if expert load patterns change very
    rapidly and you observe load imbalance.
analysis_date: '2026-07-06'

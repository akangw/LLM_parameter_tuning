name: additional_config.finegrained_tp_config
type: nested
category: parallelism
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:45
value_type: dict
default: '{}'
valid_choices: 'dict with keys: enabled, embedding_tp_size, lm_head_tp_size, o_proj_tp_size, mlp_tp_size'
cli_example: '--additional-config ''{"finegrained_tp_config": {"enabled": true, "embedding_tp_size": 1, "lm_head_tp_size":
  1, "o_proj_tp_size": 4, "mlp_tp_size": 4}}'''
deprecated: false
performance_impact: high
performance_scope:
- throughput
- memory
impact_detail: 'Fine-grained TP allows different model components (embedding, lm_head, o_proj, MLP) to use independent tensor-parallel
  sizes instead of a single global tensor_parallel_size. This directly affects: "(1) weight distribution and memory layout
  across NPUs — components with smaller TP sizes" replicate weights on each device, increasing per-device memory usage but
  eliminating all-reduce communication for those components; (2) communication volume — reducing TP size for specific components
  removes the need for tensor-parallel all-reduce on their activations, lowering HCCL communication overhead and improving
  throughput; (3) compute efficiency — components with larger TP sizes benefit from parallel computation but incur communication
  costs. The configuration is parsed in vllm_ascend/ascend_config.py:45-46 where FinegrainedTPConfig is instantiated from
  the additional_config dict. The actual dispatch logic lives in the FinegrainedTPConfig class (not shown in context but referenced),
  which determines how each module''s TP group is constructed. On Ascend NPUs, reducing communication for embedding/lm_head
  (which are typically communication bottlenecks due to their large vocabulary dimensions) can yield significant throughput
  gains, while keeping MLP and attention projections at higher TP sizes preserves compute parallelism for the most FLOP-intensive
  layers.

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:45
  context: Parsed from additional_config dict and passed to FinegrainedTPConfig constructor
related_parameters:
- name: tensor_parallel_size
  relation: Global TP size; finegrained_tp_config overrides this for specific modules
- name: enable_flashcomm1
  relation: FlashComm1 optimization affects all-reduce communication; fine-grained TP can reduce the need for all-reduce on
    certain modules
- name: enable_matmul_allreduce
  relation: Matmul-allreduce fusion interacts with TP communication patterns; fine-grained TP may change which modules benefit
    from this fusion
constraints:
- Each per-module TP size must be a divisor of the global tensor_parallel_size
- Each per-module TP size must be a positive integer
- The global tensor_parallel_size must be divisible by each per-module TP size
tuning_advice:
  summary: 'Set embedding_tp_size=1 and lm_head_tp_size=1 to eliminate all-reduce on large vocabulary projections, while keeping
    o_proj_tp_size and mlp_tp_size equal to the global TP size for maximum compute parallelism on FLOP-intensive layers.

    '
  suggested_values:
  - scenario: Standard dense model (e.g., Llama, Qwen) with vocabulary size > 50k
    value:
      enabled: true
      embedding_tp_size: 1
      lm_head_tp_size: 1
      o_proj_tp_size: <global_tp_size>
      mlp_tp_size: <global_tp_size>
    reason: 'Embedding and lm_head involve large vocabulary-sized matrix multiplications where all-reduce communication dominates.
      Setting TP=1 for these modules eliminates HCCL all-reduce overhead entirely, trading a small amount of per-device memory
      for significant throughput improvement. MLP and o_proj are compute-bound and benefit from full TP parallelism.

      '
  - scenario: Memory-constrained deployment where per-device memory is the bottleneck
    value:
      enabled: true
      embedding_tp_size: <global_tp_size>
      lm_head_tp_size: <global_tp_size>
      o_proj_tp_size: <global_tp_size>
      mlp_tp_size: <global_tp_size>
    reason: 'When NPU memory is scarce, keeping all modules at full TP size distributes weights across devices, minimizing
      per-device memory usage at the cost of higher communication.

      '
  - scenario: MoE model with shared experts (e.g., DeepSeek)
    value:
      enabled: true
      embedding_tp_size: 1
      lm_head_tp_size: 1
      o_proj_tp_size: <global_tp_size>
      mlp_tp_size: <global_tp_size>
    reason: 'MoE models have even larger MLP weight volumes; keeping MLP at full TP is critical for memory distribution. Embedding/lm_head
      at TP=1 still provides communication savings without significantly impacting memory since vocabulary weights are small
      relative to expert weights.

      '
  caveats:
  - Setting embedding_tp_size=1 or lm_head_tp_size=1 replicates the full vocabulary weight matrix on each NPU, increasing
    per-device memory usage by (vocab_size * hidden_dim * dtype_bytes) per module
  - Fine-grained TP requires the global tensor_parallel_size to be divisible by each per-module TP size; mismatched values
    will cause initialization errors
  - The performance benefit is most pronounced on models with large vocabularies (>50k tokens) where embedding/lm_head all-reduce
    is a significant fraction of total communication
  - On Ascend NPUs, HCCL all-reduce latency is the primary bottleneck for embedding/lm_head; reducing TP for these modules
    can yield 5-15% throughput improvement depending on model architecture and sequence length
  quick_guide: 'For most deployments, set embedding_tp_size=1 and lm_head_tp_size=1 to reduce communication overhead; keep
    o_proj_tp_size and mlp_tp_size at the global TP size for compute parallelism.

    '
analysis_date: '2026-07-06'

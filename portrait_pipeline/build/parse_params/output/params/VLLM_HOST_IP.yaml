name: VLLM_HOST_IP
type: env
category: communication
scope: vllm
source_file:
- vllm/envs.py:582
- vllm/utils/network_utils.py:34
- vllm/v1/executor/ray_utils.py:34
- vllm/v1/executor/ray_executor.py:303
value_type: str
default: '''""'''
valid_choices: any valid IP address string (IPv4 or IPv6)
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'VLLM_HOST_IP is used in multi-node distributed inference to specify the IP address of the current node when
  the node has multiple network interfaces. It is read by `get_ip()` in vllm/utils/network_utils.py, which is called during
  Ray executor initialization to determine the node''s communication address. If not set, vLLM auto-detects the IP via socket
  connection to 8.8.8.8 (IPv4) or 2001:4860:4860::8888 (IPv6), falling back to "0.0.0.0". An incorrect or auto-detected wrong
  IP can cause multi-node communication failures (HCCL/NCCL timeouts, Ray placement group errors), which manifest as startup
  failures or severe performance degradation. On Ascend NPU, multi-node communication uses HCCL, and incorrect IP binding
  can cause HCCL initialization failures or suboptimal inter-node bandwidth utilization. The parameter itself does not directly
  tune performance knobs, but misconfiguration in multi-node setups can prevent the system from running or cause communication
  bottlenecks. It is excluded from torch.compile cache keys (vllm/envs.py:1890) and is treated as a worker-specific env var
  that must not be copied from driver to Ray workers (vllm/v1/executor/ray_utils.py:34).

  '
usage_locations:
- file: vllm/utils/network_utils.py:34
  context: get_ip() reads VLLM_HOST_IP to determine the node's IP address for distributed communication
- file: vllm/v1/executor/ray_utils.py:34
  context: Listed in WORKER_SPECIFIC_ENV_VARS — not copied from driver to Ray workers, set per-worker
- file: vllm/v1/executor/ray_executor.py:303
  context: Error message references VLLM_HOST_IP when node IP uniqueness check fails
- file: vllm/v1/executor/ray_utils.py:469
  context: Log message advises checking VLLM_HOST_IP matches Ray cluster IPs during placement group wait
related_parameters:
- name: VLLM_PORT
  relation: Used together in distributed environments; VLLM_HOST_IP specifies the address, VLLM_PORT specifies the communication
    port
- name: VLLM_DP_MASTER_IP
  relation: Similar purpose for data-parallel master node; VLLM_HOST_IP is for general distributed communication
- name: VLLM_DP_MASTER_PORT
  relation: Companion to VLLM_DP_MASTER_IP, analogous to VLLM_HOST_IP + VLLM_PORT for data-parallel setups
constraints:
- In multi-node deployments, VLLM_HOST_IP must be unique for each node; duplicate IPs across nodes will raise a RuntimeError
- VLLM_HOST_IP must match the IP addresses used by the Ray cluster; mismatched IPs can cause placement group timeouts
- The deprecated HOST_IP env var is ignored if VLLM_HOST_IP is set; use only VLLM_HOST_IP
tuning_advice:
  summary: Set VLLM_HOST_IP explicitly on each node in multi-node Ascend NPU deployments to ensure correct HCCL communication
    binding and avoid auto-detection failures.
  suggested_values:
  - scenario: Single-node deployment
    value: '''""'''
    reason: Not needed; vLLM auto-detects the IP or uses localhost for single-node communication
  - scenario: Multi-node deployment with multiple network interfaces
    value: <node-specific IP address>
    reason: Explicitly setting the correct high-speed network interface IP (e.g., RoCE or HCCS interconnect IP) ensures HCCL
      uses the optimal communication path, avoiding auto-detection picking a slow management interface
  - scenario: Multi-node deployment with single network interface
    value: '''""'''
    reason: Auto-detection typically works correctly; only set explicitly if auto-detection fails or picks the wrong interface
  caveats:
  - On Ascend NPU multi-node setups, HCCL communication performance is sensitive to network interface selection — ensure VLLM_HOST_IP
    points to the high-bandwidth interconnect interface (e.g., RoCE), not the management network
  - The deprecated HOST_IP env var is silently ignored when VLLM_HOST_IP is set; do not rely on HOST_IP
  - VLLM_HOST_IP is excluded from torch.compile cache keys, so changing it does not invalidate compiled kernels
  quick_guide: In multi-node Ascend NPU deployments, set VLLM_HOST_IP to each node's high-speed interconnect IP to ensure
    correct HCCL binding.
analysis_date: '2026-07-06'

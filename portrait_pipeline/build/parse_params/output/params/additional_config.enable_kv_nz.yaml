name: additional_config.enable_kv_nz
type: nested
category: kv_cache
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:232
value_type: bool
default: false
valid_choices:
- true
- false
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- memory
- throughput
impact_detail: 'When enabled, this parameter changes the KV cache layout to NZ (NCHW-like) format on Ascend NPU for MLA (Multi-head
  Latent Attention) models such as DeepSeek. The NZ layout is a Da Vinci architecture-specific memory arrangement that can
  improve memory access efficiency and computational throughput by aligning data with the NPU''s optimal access patterns.
  This directly affects KV cache memory consumption and the performance of attention operations during decode. The parameter
  is only read during AscendConfig initialization (ascend_config.py:232) and validated immediately: "it raises RuntimeError
  if the model is not DeepSeek MLA" (ascend_config.py:234-235) and NotImplementedError if not running on a PD decode node
  (ascend_config.py:236-239). The actual KV cache layout change is applied downstream in the attention backend when self.enable_kv_nz
  is True.

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:232
  context: Read from additional_config dict with default False, stored as self.enable_kv_nz
- file: vllm_ascend/ascend_config.py:233-239
  context: 'Validation: checks model is DeepSeek MLA and running on PD decode node (kv_consumer)'
related_parameters:
- name: kv_transfer_config
  relation: Must be configured with is_kv_consumer=True (PD decode node); enable_kv_nz is only valid in PD-disaggregated decode
    nodes
- name: model_config.is_deepseek_mla
  relation: Model must be a DeepSeek MLA variant; enable_kv_nz raises RuntimeError otherwise
- name: weight_nz_mode
  relation: Related NZ format concept but for weights, not KV cache; weight_nz_mode controls weight layout while enable_kv_nz
    controls KV cache layout
constraints:
- enable_kv_nz can only be enabled on DeepSeek MLA models (is_deepseek_mla must be True)
- enable_kv_nz can only be enabled on PD-disaggregated decode nodes (kv_transfer_config must exist and is_kv_consumer must
  be True)
- enable_kv_nz cannot be used with sparse models that have index_topk in hf_text_config
tuning_advice:
  summary: Enable on PD decode nodes running DeepSeek MLA models to optimize KV cache memory layout for Ascend NPU; disable
    otherwise.
  suggested_values:
  - scenario: PD-disaggregated decode node running DeepSeek-V2/V3/R1 MLA model
    value: true
    reason: NZ layout aligns KV cache data with Ascend NPU memory access patterns, improving decode throughput and memory
      efficiency for MLA attention
  - scenario: PD-mixed mode or prefill-only node
    value: false
    reason: Parameter is only valid on decode nodes; enabling on prefill or mixed nodes raises NotImplementedError
  - scenario: Non-DeepSeek MLA models
    value: false
    reason: Parameter raises RuntimeError for non-MLA models; NZ layout is specific to MLA attention computation
  caveats:
  - Only effective on PD decode nodes (kv_consumer); has no effect and raises error on prefill nodes or PD-mixed deployments
  - Only applicable to DeepSeek MLA architecture; other model types will raise RuntimeError at startup
  - NZ layout may increase KV cache memory footprint slightly due to padding for alignment, but the throughput gain from optimized
    access patterns typically outweighs this
  - This parameter is read from additional_config dict, not from environment variables or CLI flags
  quick_guide: 'Set enable_kv_nz: true in additional_config for PD decode nodes serving DeepSeek MLA models to improve KV
    cache performance on Ascend NPU.'
analysis_date: '2026-07-06'

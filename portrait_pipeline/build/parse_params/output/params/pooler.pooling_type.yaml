related_parameters:
- name: pooler.seq_pooling_type
  relation: '`pooling_type` is a convenience alias that sets both `seq_pooling_type` and `tok_pooling_type`. If `seq_pooling_type`
    is set explicitly, it takes precedence over the value from `pooling_type`.

    '
- name: pooler.tok_pooling_type
  relation: '`pooling_type` is a convenience alias that sets both `seq_pooling_type` and `tok_pooling_type`. If `tok_pooling_type`
    is set explicitly, it takes precedence over the value from `pooling_type`.

    '
- name: runner_type
  relation: '`pooling_type` is only meaningful when `runner_type` is "pooling".

    '
constraints:
- pooling_type is only used when runner_type is 'pooling'.
- If both pooling_type and seq_pooling_type/tok_pooling_type are set, the explicit seq_pooling_type/tok_pooling_type values
  take precedence.
tuning_advice:
  summary: 'Choose the pooling type that matches your model''s training objective; the performance difference between pooling
    methods is negligible on Ascend NPU.

    '
  suggested_values:
  - scenario: 'Standard embedding models (e.g., BERT, Sentence-BERT) where the model was trained with mean pooling.

      '
    value: MEAN
    reason: 'Matches the training objective of most sentence embedding models and produces the best quality embeddings.

      '
  - scenario: 'Classification models that use the [CLS] token representation (e.g., BERT for sequence classification).

      '
    value: CLS
    reason: 'Uses the first token''s hidden state, which is the standard approach for BERT-like classification models.

      '
  - scenario: 'Decoder-only embedding models (e.g., Llama-based bidirectional models) where you want to preserve chunked prefill
      support.

      '
    value: LAST
    reason: 'LAST pooling does not disable chunked prefill for decoder models, unlike MEAN or CLS, which can improve throughput
      for long sequences.

      '
  caveats:
  - 'For decoder-only pooling models, using MEAN or CLS for seq_pooling_type (or STEP for tok_pooling_type) disables chunked
    prefill, which can significantly reduce throughput for long-context workloads.

    '
  - 'The pooling operation itself is computationally cheap — the choice of pooling type primarily affects model output quality,
    not inference speed.

    '
  quick_guide: 'Use MEAN for embedding models, CLS for classification models, and LAST for decoder-only models if chunked
    prefill is desired.

    '
analysis_date: '2026-07-06'

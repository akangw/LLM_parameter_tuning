name: pooler.pooling_type
type: nested
category: model
scope: vllm
source_file:
- vllm/config/pooler.py
value_type: str
default: null
valid_choices:
- LAST
- MEAN
- CLS
- STEP
- ALL
- SUM
- ABS_MAX
- INDEX
- null
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
- latency
impact_detail: 'This parameter is a convenience alias that populates `seq_pooling_type` and/or `tok_pooling_type` in the PoolerConfig.
  It does not directly affect performance; rather, the downstream pooling methods it selects determine the computational cost
  of the pooling step. On Ascend NPU, the pooling operation itself is a lightweight reduction over hidden states — its cost
  is negligible compared to the transformer forward pass. However, the chosen pooling type can indirectly affect throughput
  and latency by influencing whether chunked prefill is supported: for decoder-only pooling models, `seq_pooling_type` of
  "MEAN" or "CLS", or `tok_pooling_type` of "STEP", disables chunked prefill (see `vllm/config/model.py:1734`), which can
  reduce throughput for long-context workloads. No vllm-ascend specific overrides were found for this parameter.

  '
usage_locations:
- file: vllm/config/pooler.py
  context: 'PoolerConfig.__init__ — if `pooling_type` is set, it populates `seq_pooling_type` and `tok_pooling_type` with
    the same value.

    '

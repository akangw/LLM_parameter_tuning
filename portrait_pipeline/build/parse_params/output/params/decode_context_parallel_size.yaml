name: --decode-context-parallel-size
type: cli
category: parallelism
scope: both
source_file:
- vllm/config/parallel.py:310
- vllm/engine/arg_utils.py:946
- vllm_ascend/platform.py:324
- vllm_ascend/worker/v2/model_runner.py:68
value_type: int
default: 1
valid_choices: positive integer; must divide tensor_parallel_size
cli_example: --decode-context-parallel-size 4
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'Decode Context Parallelism (DCP) shards the KV cache across multiple NPUs within a TP group during the decode
  phase, reducing per-device KV cache memory pressure and enabling longer context lengths. On Ascend, DCP reuses the TP group''s
  devices — it does not increase the total world size. Instead, it splits one TP group into tp_size // dcp_size DCP sub-groups.
  Each DCP rank stores only max_model_len // dcp_size tokens locally (see vllm_ascend/patch/platform/patch_kv_cache_interface.py:189-194),
  which directly reduces per-NPU KV cache memory consumption. This is critical for long-sequence inference on Ascend NPUs
  where HBM capacity is limited. DCP also affects attention computation: during decode, partial attention outputs are computed
  per DCP shard and then combined via all-gather + reduce-scatter (or all-to-all for MLA models with dcp_comm_backend="a2a").
  The communication overhead can impact decode latency, but the memory savings often enable serving longer sequences that
  would otherwise OOM. On Ascend v1 worker, DCP is fully supported and validated for both MLA and GQA/MQA models. On Ascend
  v2 worker, DCP is explicitly NOT supported (raises NotImplementedError at vllm_ascend/worker/v2/model_runner.py:68-69).
  The Mooncake Hybrid Connector also requires dcp_size * pcp_size == 1 (vllm_ascend/distributed/kv_transfer/kv_p2p/ mooncake_hybrid_connector.py:1083).
  DCP interacts with speculative decoding: for GQA/MQA draft models, additional constraints apply on the relationship between
  dcp_size, draft_tp_size, and num_kv_heads (vllm_ascend/platform.py:324-369).

  '
usage_locations:
- file: vllm_ascend/patch/platform/patch_kv_cache_interface.py:189
  context: Reduces max_model_len per DCP rank for KV cache memory calculation
- file: vllm_ascend/patch/platform/patch_kv_cache_utils.py:39
  context: Adjusts scheduler_block_size for CP with multiple KV cache groups
- file: vllm_ascend/platform.py:324
  context: Validates DCP constraints for speculative decoding with draft models
- file: vllm_ascend/worker/v2/model_runner.py:68
  context: Raises NotImplementedError — DCP not supported in v2 worker
- file: vllm_ascend/worker/worker.py:765
  context: Passes dcp_size to ensure_model_parallel_initialized for HCCL init
- file: vllm_ascend/attention/utils.py:61
  context: Checks if any context parallelism (PCP or DCP) is enabled
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:1383
  context: Uses dcp_size in Mooncake KV transfer scheduler
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_hybrid_connector.py:1082
  context: Asserts dcp_size * pcp_size == 1 for hybrid connector
- file: vllm/config/parallel.py:474
  context: Validates tp_size % dcp_size == 0
- file: vllm/config/model.py:1161
  context: Validates DCP constraints for GQA/MQA models (num_kv_heads, num_q_per_kv)
- file: vllm/v1/attention/backend.py:577

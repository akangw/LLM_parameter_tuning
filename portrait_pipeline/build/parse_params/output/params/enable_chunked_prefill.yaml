related_parameters:
- name: --max-num-batched-tokens
  relation: Chunked prefill splits prompts into chunks bounded by max_num_batched_tokens minus decode tokens
- name: --max-num-partial-prefills
  relation: Controls how many sequences can be partially prefilled concurrently when chunked prefill is enabled
- name: --max-long-partial-prefills
  relation: Limits concurrent long prompts being chunked; only meaningful with chunked prefill enabled
- name: --long-prefill-token-threshold
  relation: Defines what constitutes a long prefill for chunked prefill scheduling priority
- name: --pipeline-parallel-size
  relation: Dynamic Chunked Pipeline Parallel requires both pipeline-parallel-size > 1 and enable-chunked-prefill
- name: VLLM_ASCEND_BALANCE_SCHEDULING
  relation: Incompatible with Dynamic Chunked Pipeline Parallel which requires chunked prefill
- name: --additional-config (profiling_chunk_config)
  relation: Dynamic Chunked Pipeline Parallel requires enable-chunked-prefill as a hard prerequisite
constraints:
- Encoder-decoder models do not support chunked prefill; it is forcibly disabled.
- Models without KV cache (e.g., encoder-only) do not support chunked prefill; it is auto-disabled with a warning.
- Dynamic Chunked Pipeline Parallel (profiling_chunk_config.enabled=true) requires --enable-chunked-prefill.
- Dynamic Chunked Pipeline Parallel requires --pipeline-parallel-size > 1.
- Dynamic Chunked Pipeline Parallel is incompatible with VLLM_ASCEND_BALANCE_SCHEDULING.
- When SLO_limits_for_dynamic_batch is set, vllm-ascend silently forces enable_chunked_prefill=True, overriding any user setting.
tuning_advice:
  summary: Enable chunked prefill on Ascend NPU for all workloads except encoder-decoder models to maximize throughput and
    reduce tail latency.
  suggested_values:
  - scenario: General LLM serving on Ascend NPU (v1 or v2 worker)
    value: true
    reason: Enables splitfuse attention path on Ascend, allowing interleaved prefill-decode scheduling that maximizes NPU
      utilization and prevents head-of-line blocking from long prompts.
  - scenario: Encoder-decoder models
    value: false
    reason: Chunked prefill is forcibly disabled upstream for encoder-decoder models; setting it true has no effect.
  - scenario: Dynamic Chunked Pipeline Parallel with pipeline-parallel-size > 1
    value: true
    reason: This feature requires chunked prefill as a hard prerequisite; the profiling-based chunk sizing depends on it.
  - scenario: SLO-based dynamic batching (SLO_limits_for_dynamic_batch set)
    value: true
    reason: vllm-ascend forces this to True automatically; the dynamic batch scheduler requires chunked prefill for proper
      operation.
  - scenario: Pure decode-only serving with no prefill requests
    value: false
    reason: If all requests are decode-only (e.g., continuation serving), chunked prefill adds unnecessary overhead to the
      attention state selection logic.
  caveats:
  - When enable_chunked_prefill=False and a prompt exceeds the available token budget, the scheduler stops processing that
    request entirely, causing head-of-line blocking and increased TTFT for all queued requests.
  - vllm-ascend silently overrides this to True when SLO_limits_for_dynamic_batch is configured — user settings are ignored
    in that case.
  - The splitfuse attention path (ChunkedPrefill state) on Ascend NPU has different performance characteristics than the pure
    PrefillNoCache or DecodeOnly paths; test with your specific model and batch sizes.
  - 'Chunked prefill interacts with --max-num-batched-tokens: the effective chunk size is max_num_batched_tokens minus tokens
    already allocated to decode requests in the batch.'
  - For pooling models, chunked prefill requires explicit enabling and uses hidden_states_cache to accumulate partial results
    across chunks.
  quick_guide: Always enable --enable-chunked-prefill on Ascend NPU for production LLM serving; disable only for encoder-decoder
    models or pure decode-only workloads.
analysis_date: '2026-07-06'

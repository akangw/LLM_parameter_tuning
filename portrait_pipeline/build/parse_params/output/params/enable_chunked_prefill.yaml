name: --enable-chunked-prefill
type: cli
category: scheduling
scope: both
source_file:
- vllm/config/scheduler.py:84
- vllm/engine/arg_utils.py:586
- vllm/engine/arg_utils.py:1350
- vllm_ascend/platform.py:605
- vllm_ascend/attention/attention_v1.py:256
- vllm_ascend/attention/mla_v1.py:258
- vllm_ascend/worker/model_runner_v1.py:1342
- vllm_ascend/worker/v2/attn_utils.py:180
value_type: bool
default: None
valid_choices: true, false
cli_example: --enable-chunked-prefill
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "Chunked prefill is a critical scheduling feature that splits long prefill requests into smaller chunks, interleaving\
  \ them with decode requests. On Ascend NPU, this parameter directly controls the attention state selection in both v1 and\
  \ v2 worker paths:\n- \"In v1 worker (vllm_ascend/worker/model_runner_v1.py:1342), when enable_chunked_prefill\"\n  is True,\
  \ the attention state is set to AscendAttentionState.ChunkedPrefill, which\n  triggers the splitfuse attention path optimized\
  \ for mixed prefill-decode batches.\n\n- \"In v2 worker (vllm_ascend/worker/v2/attn_utils.py:180), the same logic applies:\"\
  \n  enable_chunked_prefill=True routes to AscendAttentionState.ChunkedPrefill.\n\n- \"In the Ascend attention backends (vllm_ascend/attention/attention_v1.py:256\
  \ and\"\n  vllm_ascend/attention/mla_v1.py:258), the chunked_prefill_enabled flag is read from\n  scheduler_config and used\
  \ to configure attention metadata building.\n\n- \"vllm-ascend silently forces enable_chunked_prefill=True when SLO_limits_for_dynamic_batch\"\
  \n  is set (vllm_ascend/platform.py:605), overriding any user setting.\n\n- \"In all Ascend scheduler variants (balance_schedule,\
  \ recompute_scheduler,\"\n  scheduler_dynamic_batch, scheduler_profiling_chunk), when enable_chunked_prefill is\n  False\
  \ and a request's remaining tokens exceed the token budget, scheduling stops\n  immediately — meaning long prompts cannot\
  \ be partially processed and must wait for\n  sufficient budget, causing head-of-line blocking and increased latency.\n\n\
  - \"Dynamic Chunked Pipeline Parallel (profiling_chunk_config) requires\"\n  enable_chunked_prefill=True as a hard prerequisite\
  \ (documented in\n  user_guide/feature_guide/dynamic_chunk_pipeline_parallel.md:143).\n\n- \"For encoder-decoder models,\
  \ chunked prefill is forcibly disabled upstream\"\n  (vllm/config/scheduler.py:228).\n\n- \"For models without KV cache\
  \ (e.g., encoder-only), chunked prefill is automatically\"\n  disabled with a warning (vllm/v1/engine/core.py:137-139).\n\
  \nEnabling chunked prefill improves throughput by allowing the scheduler to pack decode tokens alongside partial prefill\
  \ chunks, maximizing NPU utilization. It reduces time-to-first-token (TTFT) latency for later requests by preventing long\
  \ prefills from monopolizing the batch. The tradeoff is slightly increased per-iteration overhead from the splitfuse attention\
  \ path and potential memory overhead from maintaining partial prefill state.\n"

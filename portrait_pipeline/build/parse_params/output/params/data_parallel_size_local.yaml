name: --data-parallel-size-local
type: cli
category: parallelism
scope: both
source_file:
- vllm/engine/arg_utils.py:986
- vllm/config/parallel.py:120
- vllm_ascend/worker/worker.py:296
- vllm_ascend/_310p/worker_310p.py:175
value_type: int
default: <computed>
valid_choices: 1 to data_parallel_size
cli_example: --data-parallel-size-local 2
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: 'Controls how many data parallel (DP) replicas run on a single node. On Ascend NPU, this parameter directly
  determines the number of local engine core processes spawned per node, each consuming its own NPU memory for model weights
  and KV cache. When data_parallel_size_local > 1, multiple DP replicas share the same node''s NPU devices, increasing total
  throughput via concurrent request processing but proportionally multiplying memory consumption. The vllm-ascend worker (both
  standard and 310P variants) uses this parameter to validate that local_world_size does not exceed visible NPU device count,
  preventing oversubscription. In KV transfer scenarios (mooncake connectors), data_parallel_size_local is used as dp_size
  for device ID calculation and transfer group sizing. When not explicitly set, vllm upstream auto-infers it as max(local_world_size
  // world_size_within_dp, 1), meaning it defaults to packing as many DP replicas as possible onto each node.

  '
usage_locations:
- file: vllm_ascend/worker/worker.py:296
  context: Validates local_world_size <= visible NPU device count when DP > 1 and local DP > 0
- file: vllm_ascend/_310p/worker_310p.py:175
  context: Same validation for 310P Ascend devices
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:1584
  context: Used as dp_size for KV transfer metadata and device ID calculation
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_hybrid_connector.py:1392
  context: Used as dp_size for hybrid KV transfer connector
- file: vllm/v1/engine/core_client.py:560
  context: Determines number of local engine ranks managed by the client
- file: vllm/v1/engine/input_processor.py:253
  context: Used with local_engines_only to determine valid DP rank range for request routing
- file: vllm/v1/engine/coordinator.py:89
  context: Compared against dp_size to determine if coordinator uses local-only engine binding
- file: vllm/v1/engine/core.py:1112
  context: Reset to 1 for non-MoE DP ranks (treated as independent instances)
related_parameters:
- name: --data-parallel-size
  relation: data_parallel_size_local must be <= data_parallel_size; auto-inferred from data_parallel_size and world_size when
    not set
- name: --tensor-parallel-size
  relation: world_size_within_dp = pipeline_parallel_size * tensor_parallel_size; affects how many DP replicas fit per node
- name: --pipeline-parallel-size
  relation: Contributes to world_size_within_dp, affecting local DP replica count
- name: --data-parallel-backend
  relation: When backend is 'ray' or executor is 'ray'/'external_launcher', the Ascend device count validation is skipped
- name: --data-parallel-rank
  relation: When set (external LB mode), data_parallel_size_local auto-inference is skipped
- name: --nnodes
  relation: 'Used in auto-inference: local_world_size = world_size // nnodes'
constraints:
- data_parallel_size_local must be less than or equal to data_parallel_size
- When data_parallel_size > 1 and data_parallel_size_local > 0 on Ascend NPU, local_world_size must not exceed the number
  of visible NPU devices (unless using ray or external_launcher backend)
- For non-MoE models with data_parallel_size > 1, data_parallel_size_local is internally reset to 1 per DP rank
tuning_advice:
  summary: Set to the number of DP replicas you want per node; higher values increase throughput at the cost of multiplied
    NPU memory usage per replica.
  suggested_values:
  - scenario: Single-node deployment with sufficient NPU memory for multiple model replicas
    value: 2 to 4
    reason: Maximizes throughput by running multiple independent DP replicas on the same node, each handling separate request
      streams. Each replica requires its own full model weights and KV cache memory.
  - scenario: Memory-constrained single-node deployment
    value: '1'
    reason: Limits memory consumption to a single model replica. Prevents OOM errors when NPU memory is insufficient for multiple
      replicas.
  - scenario: Multi-node deployment with external load balancer
    value: <computed>
    reason: When --data-parallel-rank is set (external LB mode), auto-inference is skipped and the value should be explicitly
      set based on per-node capacity. Otherwise, vllm auto-infers the maximum replicas that fit.
  caveats:
  - Each local DP replica consumes full model weights and KV cache memory on Ascend NPU — memory usage scales linearly with
    data_parallel_size_local
  - On Ascend NPU, the worker validates that local_world_size (tp_size * pp_size * dp_size_local) does not exceed visible
    NPU device count; this check is skipped for ray or external_launcher backends
  - For non-MoE models, vllm internally resets data_parallel_size_local to 1 per DP rank, treating each as an independent
    instance — the parameter has no effect in this case
  - When not explicitly set, vllm auto-infers data_parallel_size_local as max(local_world_size // world_size_within_dp, 1),
    which may pack more replicas than intended
  quick_guide: Set --data-parallel-size-local to the number of DP replicas per node; ensure total NPU memory can accommodate
    all replicas' model weights and KV caches.
analysis_date: '2026-07-06'

name: --attention-backend
type: cli
category: model
scope: both
source_file:
- vllm/engine/arg_utils.py:877
- vllm/config/speculative.py:110
- vllm_ascend/worker/model_runner_v1.py:4342
value_type: str
default: null
valid_choices:
- auto
- FLASH_ATTN
- FLASHINFER
- FLASHMLA
- FLASH_ATTN_VLLM_V1
- TORCH_SDPA
- FLEX_ATTENTION
- TRITON_MLA
- CUTLASS_MLA
- CUSTOM
- null (auto-select)
cli_example: --attention-backend FLASH_ATTN
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'This parameter controls which attention kernel implementation is used for all attention layers in the model.
  On Ascend NPU, the choice of attention backend directly determines which CANN operator or custom kernel executes the attention
  computation, affecting both compute throughput and memory bandwidth utilization.

  In vllm-ascend, the attention backend is resolved per KV cache group via `get_attn_backends_for_group()` and stored in `self.attn_groups`
  (see vllm_ascend/worker/model_runner_v1.py:4342-4352). The resolved backend classes are then used to create attention metadata
  builders and ultimately dispatch to NPU-specific attention implementations.

  The vllm-ascend documentation explicitly recommends using `FLASH_ATTN` as the attention backend for Ascend NPU (see user_guide/feature_guide/
  flash_attention.md:70), and the test suite includes dedicated FA3 vs FIA comparison tests (tests/e2e/pull_request/one_card/test_attention_fa3.py)
  that validate numerical correctness of FLASH_ATTN on Ascend hardware.

  The attention backend also interacts with CUDA graph capture: the `_check_and_update_cudagraph_mode` method (called at vllm_ascend/worker/model_runner_v1.py:4493)
  uses the resolved attention backends to determine valid capture sizes for ACL graphs on Ascend NPU. An incompatible backend
  selection could prevent graph capture entirely, forcing eager execution and significantly degrading throughput.

  For speculative decoding, the draft model can use a different attention backend than the target model (vllm/config/speculative.py:110-113),
  allowing optimization of the drafter independently.

  '
usage_locations:
- file: vllm/engine/arg_utils.py:877
  context: CLI argument definition under AttentionConfig group

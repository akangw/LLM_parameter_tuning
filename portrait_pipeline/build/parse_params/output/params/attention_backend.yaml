related_parameters:
- name: --enforce-eager
  relation: When enforce-eager is set, CUDA/ACL graph capture is disabled, reducing the performance difference between attention
    backends
- name: --speculative-config
  relation: SpeculativeConfig has its own attention_backend field for the draft model, independent of the target model's attention
    backend
- name: attention_config.backend
  relation: Mutually exclusive with --attention-backend; only one can be set
constraints:
- --attention-backend and attention_config.backend are mutually exclusive; setting both raises a ValueError
- TurboQuant requires FlashAttention version < 3; if flash_attn_version >= 3, it is overridden to 2 with a warning
- On Ascend 310P, Deepseek Sparse Attention is not supported and raises a ValueError
- On Ascend 310P, KV cache transfer is not supported and raises a ValueError
tuning_advice:
  summary: On Ascend NPU, use --attention-backend FLASH_ATTN for best performance; this is the recommended and most tested
    backend in vllm-ascend.
  suggested_values:
  - scenario: General inference on Ascend 910B/310P
    value: FLASH_ATTN
    reason: Recommended by vllm-ascend documentation; has dedicated correctness tests (FA3 vs FIA comparison) and is the primary
      backend validated for Ascend NPU
  - scenario: Auto-selection (default behavior)
    value: null
    reason: When set to null or "auto", vllm-ascend automatically selects the appropriate backend based on model architecture
      and hardware; safe for initial deployment
  - scenario: Speculative decoding with draft model requiring non-causal attention
    value: FLASH_ATTN
    reason: Draft models like DFlash may require a non-causal-capable backend; FLASH_ATTN supports this while some other backends
      do not
  caveats:
  - FLASH_ATTN on Ascend NPU may require setting VLLM_BATCH_INVARIANT=1 for correct behavior with certain models (e.g., Qwen3-8B),
    as documented in vllm-ascend flash_attention.md
  - The attention backend choice affects ACL graph capture compatibility; an unsupported backend may prevent graph capture
    and force eager execution, significantly reducing throughput
  - On Ascend 310P, some features (Deepseek Sparse Attention, KV cache transfer) are explicitly unsupported regardless of
    attention backend choice
  - When using speculative decoding, the draft model attention backend is independently auto-selected unless explicitly specified
    in the speculative config; it does not inherit from the target model
  quick_guide: Set --attention-backend FLASH_ATTN for Ascend NPU; add VLLM_BATCH_INVARIANT=1 if using Qwen3 or similar models.
analysis_date: '2026-07-06'

name: VLLM_USE_STANDALONE_COMPILE
type: env
category: compilation
scope: vllm
source_file:
- vllm/envs.py:618
value_type: bool
default: '1'
valid_choices:
- '0'
- '1'
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'This environment variable controls whether vLLM uses PyTorch Inductor''s standalone compile mode (InductorStandaloneAdaptor)
  instead of the default InductorAdaptor. When enabled (default), compilation is performed via torch._inductor.standalone_compile,
  which provides better compilation caching and reuse. The primary performance impact is on cold-start latency: standalone
  compile mode can significantly reduce model loading and first-inference time by enabling more efficient compilation caching.
  On Ascend NPU, this is particularly important because CANN graph compilation is already expensive — reducing redundant Inductor
  recompilation helps minimize total startup overhead. The flag is enabled by default in torch >= 2.9 and is required for
  VLLM_USE_MEGA_AOT_ARTIFACT to function. Disabling it falls back to the older InductorAdaptor path, which may cause longer
  cold-start times and less effective compilation caching.

  '
usage_locations:
- file: vllm/compilation/backends.py:97
  context: Asserts that VLLM_USE_MEGA_AOT_ARTIFACT requires VLLM_USE_STANDALONE_COMPILE=1
- file: vllm/compilation/backends.py:104
  context: Selects InductorStandaloneAdaptor vs InductorAdaptor based on this flag and torch version
- file: vllm/compilation/compiler_interface.py:258
  context: InductorStandaloneAdaptor class docstring references this flag for toggling
related_parameters:
- name: VLLM_USE_MEGA_AOT_ARTIFACT
  relation: VLLM_USE_MEGA_AOT_ARTIFACT=1 requires VLLM_USE_STANDALONE_COMPILE=1 (enforced by assertion)
- name: VLLM_USE_AOT_COMPILE
  relation: Both control compilation caching behavior; standalone compile is the underlying mechanism for AOT compilation
- name: VLLM_FORCE_AOT_LOAD
  relation: Force-loading AOT artifacts depends on standalone compile being enabled
constraints:
- VLLM_USE_MEGA_AOT_ARTIFACT=1 requires VLLM_USE_STANDALONE_COMPILE=1; violating this raises an AssertionError
- Standalone compile requires torch._inductor.standalone_compile to exist in the PyTorch build; if absent, falls back to InductorAdaptor
  silently
- In torch <= 2.7, this flag is ignored regardless of its value
tuning_advice:
  summary: Keep enabled (default) on Ascend NPU to minimize cold-start compilation overhead; only disable for debugging compilation
    issues.
  suggested_values:
  - scenario: Normal production deployment on Ascend NPU
    value: '1'
    reason: Enables Inductor standalone compile which provides better compilation caching, reducing cold-start latency and
      avoiding redundant recompilation across restarts
  - scenario: Debugging Inductor compilation issues or compatibility problems with specific PyTorch/CANN versions
    value: '0'
    reason: Falls back to the older InductorAdaptor path which may help isolate whether a compilation bug is specific to standalone
      compile mode
  caveats:
  - On Ascend NPU, CANN graph compilation already adds significant startup latency; disabling standalone compile may compound
    this by causing additional Inductor recompilation on every restart
  - This flag has no effect in torch <= 2.7 and is enabled by default in torch >= 2.9
  - Disabling this flag will also prevent VLLM_USE_MEGA_AOT_ARTIFACT from working, which may further increase cold-start times
  quick_guide: Keep VLLM_USE_STANDALONE_COMPILE=1 (default) on Ascend NPU to minimize cold-start compilation overhead; only
    set to 0 for debugging Inductor issues
analysis_date: '2026-07-06'

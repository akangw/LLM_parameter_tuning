related_parameters:
- name: kv_transfer.kv_connector
  relation: Determines which connector reads kv_connector_extra_config and which keys are valid
- name: kv_transfer.kv_role
  relation: kv_role (producer/consumer/both) determines which extra_config keys are relevant
- name: compilation_config.cudagraph_mode
  relation: use_layerwise=true in extra_config forces PIECEWISE cudagraph mode, overriding user setting
- name: parallel_config.prefill_context_parallel_size
  relation: prefill_pp_size in extra_config controls prefill pipeline parallelism, interacting with pcp_size
- name: cache_config.kv_offloading_size
  relation: When kv_offloading_size is set, extra_config is populated with cpu_bytes_to_use automatically
constraints:
- When prefill_pp_layer_partition is provided, its comma-separated layer counts must sum to the model's total hidden layers
- When prefill_pp_layer_partition is provided, the number of partition values must equal prefill_pp_size
- ascend_local_comm_res_path must point to a directory containing ub_endpoint_npu_*.json files, or ASCEND_LOCAL_COMM_RES setup
  will fail
- AscendStore layerwise mode does not support hybrid KV cache groups (multiple kv_cache_group_ids)
- AscendStore hybrid linear-attention support requires mamba_cache_mode='align'
tuning_advice:
  summary: 'Configure connector-specific keys based on the active kv_connector; for AscendStore on NPU, enable use_layerwise
    to reduce memory pressure and set load_async=true for lower latency.

    '
  suggested_values:
  - scenario: AscendStore with PD separation, memory-constrained prefill nodes
    value:
      use_layerwise: true
      load_async: true
      consumer_is_to_put: false
    reason: Layerwise transfer reduces peak memory on prefill nodes; async loading hides transfer latency
  - scenario: AscendStore with PD separation, consumer also stores KV cache
    value:
      use_layerwise: true
      load_async: true
      consumer_is_to_put: true
    reason: consumer_is_to_put=true allows decode nodes to write KV cache back to the pool, enabling cache reuse
  - scenario: AscendStore with prefill pipeline parallelism
    value:
      prefill_pp_size: 2
      prefill_pp_layer_partition: null
    reason: Let the system auto-partition layers evenly; only specify partition_list if manual control is needed
  - scenario: MooncakeConnectorV1 on Ascend NPU for PD separation
    value:
      mooncake_protocol: rdma
      num_workers: 10
    reason: RDMA protocol provides best NPU-to-NPU transfer bandwidth; 10 workers is the upstream default
  - scenario: CPU offloading with native backend
    value:
      cpu_bytes_to_use: <kv_offloading_size_in_GB * 1073741824>
    reason: Automatically set by vllm when kv_offloading_size is configured; manual override rarely needed
  caveats:
  - use_layerwise=true forces PIECEWISE CUDA graph mode, which disables full-graph capture and may reduce throughput for small
    models
  - consumer_is_to_put and consumer_is_to_load are mutually exclusive in practice — enabling both may cause undefined behavior
  - prefill_pp_layer_partition must be carefully aligned with the model's layer count; misconfiguration raises ValueError
    at startup
  - ascend_local_comm_res_path is Ascend-specific and required only when using local communication resources for KV transfer
  - Keys not recognized by the active connector are silently ignored — verify key names against connector documentation
  quick_guide: For AscendStore on NPU, set use_layerwise=true and load_async=true; for Mooncake, set mooncake_protocol=rdma

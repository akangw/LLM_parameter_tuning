impact_detail: "This is a catch-all dictionary that controls behavior of KV transfer connectors (AscendStore, Mooncake, LMCache,\
  \ CPU offloading, etc.). On Ascend NPU, the AscendStoreConnector reads keys like `use_layerwise`, `consumer_is_to_put`,\
  \ `load_async`, `backend`, `prefill_pp_size`, `prefill_pp_layer_partition`, and `ascend_local_comm_res_path` from this dict.\
  \ These keys directly affect:\n- \"**Latency/throughput**: `use_layerwise` enables layer-by-layer KV transfer\"\n  which\
  \ forces PIECEWISE CUDA graph mode (disabling full-graph capture), trading\n  some throughput for reduced memory pressure.\
  \ `load_async` controls whether KV\n  cache loads are asynchronous, directly impacting request scheduling latency.\n  `consumer_is_to_put`\
  \ and `consumer_is_to_load` change the data flow direction\n  in PD separation deployments, affecting end-to-end latency.\n\
  \n- \"**Memory**: `use_layerwise` reduces peak memory by transferring KV cache\"\n  layer-by-layer instead of all at once.\
  \ `prefill_pp_size` and\n  `prefill_pp_layer_partition` control how layers are partitioned across\n  prefill pipeline stages,\
  \ directly determining per-worker memory usage.\n\n- \"**Communication**: `ascend_local_comm_res_path` provides the path\
  \ to NPU\"\n  endpoint configuration files for local communication resources, which is\n  critical for inter-NPU KV transfer\
  \ performance on Ascend hardware.\n\nThe dict is connector-specific — different connectors read different keys. Misconfiguration\
  \ can cause crashes (e.g., invalid partition strings) or silently degraded performance (e.g., missing async loading).\n"

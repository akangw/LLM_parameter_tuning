related_parameters:
- name: VLLM_MLA_DISABLE
  relation: When VLLM_USE_V2_MODEL_RUNNER is enabled, hybrid models like Qwen3.5 (MLA + GDN) are unsupported and tests skip
    them
- name: --enforce-eager
  relation: v2 mode is tested with enforce_eager=True in Ascend e2e tests; interaction with CUDA graphs on Ascend may differ
    between v1 and v2
constraints:
- VLLM_USE_V2_MODEL_RUNNER is not supported on vllm version 0.21.0; the worker automatically falls back to v1 with a warning.
- V2 model runner does not support hybrid models that mix Mamba-style GDN with attention layers (e.g., Qwen3.5).
- V2 model runner does not support routed experts capture, custom logits processors, KV sharing fast prefill, or EC transfer;
  enabling any of these with v2 raises a ValueError.
tuning_advice:
  summary: On Ascend NPU, keep VLLM_USE_V2_MODEL_RUNNER=0 (v1) for production unless you specifically need v2's MoE communication
    optimizations and can accept reduced attention backend support.
  suggested_values:
  - scenario: Production deployment on Ascend NPU with standard dense or MoE models
    value: '0'
    reason: v1 mode uses Ascend-native attention backends (ASCEND_DSA, ASCEND_MLA, ASCEND_SFA) with full feature support including
      context parallelism and speculative decoding (ngram, MTP, Medusa, Eagle). This is the most mature and tested path on
      Ascend hardware.
  - scenario: MoE model deployment where Ascend-specific MoE communication optimizations are critical
    value: '1'
    reason: v2 mode enables the Ascend MoE forward context setup in platform.py, which selects optimal moe_comm_method and
      detects profile runs. This can improve MoE throughput but sacrifices Ascend-native attention backend names and some
      forward context features.
  - scenario: Development or testing on vllm 0.21.0
    value: '0'
    reason: v2 is explicitly unsupported on vllm 0.21.0; the worker automatically falls back to v1 regardless of the env var
      setting.
  caveats:
  - In v2 mode, all Ascend attention backends report as "FLASH_ATTN" to pass v2's KV cache initialization assertions, which
    may bypass Ascend-specific attention optimizations available in v1.
  - v2 mode lacks v1's extra forward context fields (is_first_layer, prefetch_mlp_*, model_instance, is_draft_model), which
    may affect performance of pipeline-parallel or speculative decoding setups.
  - v2 mode has stricter feature validation and will raise errors for unsupported configurations (routed experts capture,
    custom logits processors, KV sharing fast prefill, EC transfer).
  - Hybrid models like Qwen3.5 are not supported in v2 mode.
  - The v2 path on Ascend is less mature; e2e tests for v2 are marked with skipif and noted as broken after CANN/triton-ascend
    upgrades.
  quick_guide: Use VLLM_USE_V2_MODEL_RUNNER=0 (v1) on Ascend NPU for production stability and full feature support; only enable
    v2 if you specifically need its MoE communication optimizations and have verified compatibility with your model.

name: VLLM_USE_V2_MODEL_RUNNER
type: env
category: other
scope: both
source_file:
- vllm/envs.py:1711
- vllm_ascend/worker/worker.py:144
- vllm_ascend/platform.py:849
- vllm_ascend/ascend_forward_context.py:365
value_type: bool
default: 'False'
valid_choices:
- '0'
- '1'
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This environment variable toggles between vLLM's v1 and v2 model runner architectures. On Ascend NPU, the\
  \ choice has profound performance implications because vllm-ascend maintains completely separate code paths for v1 and v2,\
  \ with different attention backends, forward context handling, and feature support.\nIn v1 mode (VLLM_USE_V2_MODEL_RUNNER=0,\
  \ default): - \"vllm-ascend uses its own Ascend-native attention backends (ASCEND_DSA, ASCEND_MLA,\"\n  ASCEND_SFA, CUSTOM)\
  \ with full feature support including context parallelism.\n- \"The forward context uses Ascend-specific extra attributes\
  \ (is_first_layer,\"\n  prefetch_mlp_gate_up_proj, prefetch_mlp_gate_down_proj, prefetch_mlp_enabled,\n  model_instance,\
  \ is_draft_model) for optimized execution.\n- \"Speculative decoding supports ngram, MTP, Medusa, and Eagle through Ascend-native\"\
  \n  proposers in the v1 dispatch path.\n\nIn v2 mode (VLLM_USE_V2_MODEL_RUNNER=1): - \"All attention backends report as\
  \ \\\"FLASH_ATTN\\\" to satisfy v2's KV cache initialization\"\n  assertions, potentially losing Ascend-specific optimizations.\n\
  - \"The forward context uses a simplified additional_kwargs dict, lacking v1's extra\"\n  fields (is_first_layer, prefetch_mlp_*,\
  \ model_instance, is_draft_model).\n- \"The platform.py MoE communication setup is only active in v2 mode, enabling\"\n\
  \  Ascend-specific MoE optimizations (moe_comm_method selection, in_profile_run detection).\n- v2 has stricter feature validation:\
  \ \"it rejects routed experts capture, custom logits\"\n  processors, KV sharing fast prefill, and EC transfer configurations.\n\
  - \"On vllm 0.21.0, v2 is explicitly unsupported and falls back to v1 with a warning.\" - \"Hybrid models (e.g., Qwen3.5\
  \ with Mamba-style GDN + attention layers) are not\"\n  supported in v2 mode.\n\nThe v2 runner generally offers better scheduling\
  \ and throughput on GPUs, but on Ascend NPU the v1 path has more mature Ascend-specific optimizations. The choice directly\
  \ affects which attention kernels execute, how MoE communication is handled, and which speculative decoding methods are\
  \ available.\n"

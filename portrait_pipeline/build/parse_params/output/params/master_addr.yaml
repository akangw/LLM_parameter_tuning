name: --master-addr
type: cli
category: communication
scope: both
source_file:
- vllm/engine/arg_utils.py:927
- vllm/config/parallel.py:255
- vllm_ascend/patch/platform/patch_multiproc_executor.py:59
value_type: str
default: 127.0.0.1
valid_choices: any valid IPv4 address string
cli_example: --master-addr 192.168.1.100
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: '--master-addr specifies the IP address of the master node for torch.distributed process group initialization
  in multi-node deployments. It is only used when distributed_executor_backend is "mp" and nnodes > 1. On Ascend NPU, this
  address is passed to HCCL (Huawei Collective Communication Library) via the torch.distributed.init_process_group call with
  backend "npu:hccl". The address itself does not directly affect throughput or latency — it is a connectivity parameter.
  However, an incorrect or suboptimal address (e.g., using a slow management network interface instead of a high-speed RoCE/IB
  interface) can severely degrade multi-node communication performance. In vllm-ascend, the multiproc executor patch (patch_multiproc_executor.py:59)
  uses master_addr as the connect_ip for MessageQueue initialization, which is used for broadcasting scheduler outputs to
  worker processes. For single-node deployments, vllm-ascend examples default to "127.0.0.1" (loopback), which is optimal.

  '
usage_locations:
- file: vllm/config/parallel.py:255
  context: Default value definition (127.0.0.1) in ParallelConfig class
- file: vllm/engine/arg_utils.py:927
  context: CLI argument registration in ParallelConfig group
- file: vllm/distributed/parallel_state.py:1396
  context: Used as IP for distributed_init_method when nnodes > 1

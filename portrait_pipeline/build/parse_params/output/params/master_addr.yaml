related_parameters:
- name: --master-port
  relation: Must be set together with --master-addr for multi-node communication
- name: --distributed-executor-backend
  relation: --master-addr is only used when this is set to "mp"
- name: --nnodes
  relation: --master-addr is only meaningful when nnodes > 1
- name: --node-rank
  relation: Together with --master-addr, defines the multi-node topology
constraints:
- --master-addr must be a valid IPv4 address string reachable from all worker nodes
- --master-addr is only used when --distributed-executor-backend is "mp" and --nnodes is greater than 1
- --master-addr is ignored in the hash computation for data-parallel worker configuration validation (it is in the ignored_factors
  set)
tuning_advice:
  summary: 'For multi-node Ascend deployments, set --master-addr to the IP of the high-speed network interface (RoCE/IB) used
    for HCCL communication, not the management network interface.

    '
  suggested_values:
  - scenario: Single-node deployment (all NPUs on one server)
    value: 127.0.0.1
    reason: Loopback is optimal for single-node; no network overhead
  - scenario: Multi-node deployment with dedicated high-speed interconnect (RoCE/IB)
    value: <IP of the high-speed network interface on the master node>
    reason: HCCL uses this address for all-reduce and other collective operations; using the high-speed interface minimizes
      communication latency
  - scenario: Multi-node deployment without dedicated interconnect (using management network)
    value: <IP of the management network interface on the master node>
    reason: Fallback when no dedicated high-speed network is available; expect higher communication overhead
  caveats:
  - Using the wrong network interface IP can cause HCCL to route collective communication over a slow link, significantly
    degrading multi-node throughput
  - On Ascend NPU, HCCL communication performance is highly sensitive to network bandwidth and latency; ensure the chosen
    interface has sufficient bandwidth
  - For single-node multi-NPU deployments, leave --master-addr at its default (127.0.0.1) — setting it to an external IP adds
    unnecessary network stack overhead
  - The vllm-ascend multiproc executor uses master_addr for MessageQueue connect_ip; this is local IPC on single-node and
    should remain loopback
  quick_guide: 'For multi-node Ascend: "set --master-addr to the RoCE/IB IP of the master node." For single-node: "use the
    default 127.0.0.1."

    '
analysis_date: '2026-07-06'

name: --mm-encoder-fp8-scale-save-margin
type: cli
category: quantization
scope: vllm
source_file:
- vllm/config/multimodal.py:176
- vllm/engine/arg_utils.py:1215
- vllm/model_executor/layers/attention/mm_encoder_attention.py:50
value_type: float
default: 1.5
valid_choices: '> 0.0'
cli_example: --mm-encoder-fp8-scale-save-margin 2.0
deprecated: false
performance_impact: low
performance_scope:
- throughput
- latency
impact_detail: 'This parameter is a safety multiplier applied to dynamically calibrated FP8 scales when they are auto-saved
  via `mm_encoder_fp8_scale_save_path`. It does NOT affect runtime inference directly — it only modifies the scale values
  written to the saved JSON file. The saved file can then be used as `mm_encoder_fp8_scale_path` in subsequent runs to enable
  static FP8 scaling for the ViT encoder attention. A larger margin produces more conservative (smaller) scales, reducing
  the risk of FP8 overflow on inputs with larger activations than the calibration set, at the cost of slightly reduced numerical
  precision. The parameter is read once during model initialization (in `MMEncoderAttention.__init__`, line 431 of mm_encoder_attention.py)
  and stored in a module-level global `_fp8_scale_save_margin`. It is consumed during the forward pass when the amax history
  buffer wraps and scales are saved (in `_maybe_save_fp8_scales`). On Ascend NPU, the FP8 attention backend for ViT encoders
  follows the same vLLM upstream path — there is no vllm-ascend override for this parameter. The performance impact is indirect:
  it affects the quality of statically-scaled FP8 inference in subsequent runs, which can influence throughput and latency
  if the saved scales cause numerical issues requiring fallback or recomputation.

  '
usage_locations:
- file: vllm/config/multimodal.py:176
  context: Field definition with default=1.5 and gt=0.0 constraint
- file: vllm/engine/arg_utils.py:561
  context: EngineArgs attribute declaration, reads from MultiModalConfig

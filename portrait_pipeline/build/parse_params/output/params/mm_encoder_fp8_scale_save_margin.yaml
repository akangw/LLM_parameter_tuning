related_parameters:
- name: --mm-encoder-attn-dtype
  relation: Must be set to 'fp8' for this parameter to have any effect. Without FP8 attention, no scales are saved.
- name: --mm-encoder-fp8-scale-save-path
  relation: This parameter is only used when --mm-encoder-fp8-scale-save-path is set. It controls the margin applied to the
    scales written to that file.
- name: --mm-encoder-fp8-scale-path
  relation: The saved file (with margin applied) can be used as --mm-encoder-fp8-scale-path in subsequent runs for static
    FP8 scaling.
constraints:
- Must be greater than 0.0 (enforced by pydantic Field(gt=0.0)).
- Only takes effect when --mm-encoder-attn-dtype is set to 'fp8' and --mm-encoder-fp8-scale-save-path is provided.
tuning_advice:
  summary: 'Use the default 1.5 unless you observe FP8 overflow (NaN/inf) with saved scales, in which case increase to 2.0–3.0;
    if precision is more critical than overflow safety, reduce toward 1.0.

    '
  suggested_values:
  - scenario: General-purpose deployment with mixed input distributions
    value: 1.5
    reason: The default provides a reasonable balance between overflow safety and numerical precision for most vision encoder
      workloads.
  - scenario: Inputs known to have larger activations than the calibration set (e.g., high-resolution images, diverse video
      frames)
    value: 2.0
    reason: A larger margin leaves more headroom to prevent FP8 overflow, avoiding NaN propagation that can degrade output
      quality or cause request failures.
  - scenario: Calibration set is representative and precision is critical (e.g., fine-grained visual tasks)
    value: 1.0
    reason: No margin maximizes numerical precision of the saved scales, assuming the calibration set accurately captures
      the full activation range.
  caveats:
  - This parameter does not affect runtime performance directly — it only changes the scale values written to disk during
    calibration runs.
  - A margin that is too large can unnecessarily reduce the effective dynamic range of FP8, potentially degrading model accuracy.
  - On Ascend NPU, the FP8 ViT attention path follows upstream vLLM; there is no Ascend-specific override or additional constraint
    for this parameter.
  - The saved scales are only used in subsequent runs when --mm-encoder-fp8-scale-path points to the saved file; the margin
    has no effect on dynamic scaling during the current run.
  quick_guide: Keep the default 1.5 unless you encounter FP8 overflow with saved scales (increase to 2.0) or need maximum
    precision (reduce to 1.0).
analysis_date: '2026-07-06'

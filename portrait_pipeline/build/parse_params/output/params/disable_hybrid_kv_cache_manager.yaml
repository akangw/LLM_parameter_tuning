name: --disable-hybrid-kv-cache-manager
type: cli
category: kv_cache
scope: both
source_file:
- vllm/engine/arg_utils.py:1367
- vllm/config/scheduler.py:132
- vllm/config/vllm.py:1311
- vllm_ascend/platform.py:278
- vllm_ascend/distributed/kv_transfer/ascend_multi_connector.py:28
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:1604
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_hybrid_connector.py:1109
- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/pool_scheduler.py:168
value_type: bool
default: None
valid_choices: true, false, or None (auto-detect)
cli_example: --disable-hybrid-kv-cache-manager
deprecated: false
performance_impact: high
performance_scope:
- memory
- throughput
impact_detail: 'This parameter controls whether the KV cache manager allocates different cache sizes for different attention
  layer types (full attention vs sliding window attention vs Mamba). When disabled (default=None or False), the hybrid KV
  cache manager (HMA) is active: layers with sliding window attention get smaller KV caches proportional to their window size,
  saving significant GPU/NPU memory. When enabled (True), all layers get the same KV cache size as full attention layers,
  wasting memory on layers that don''t need it.

  On Ascend NPU, this parameter has additional critical effects beyond memory savings:

  1. **KV Transfer compatibility**: vllm-ascend''s KV transfer connectors (Mooncake, AscendMultiConnector) check this flag
  to determine whether HMA (Hybrid Memory Allocation) is required. If HMA is enabled and a connector doesn''t support it,
  the system raises a ValueError (vllm/distributed/kv_transfer/kv_connector/factory.py:55-60). The AscendMultiConnector asserts
  that all sub-connectors support HMA when it''s enabled (vllm_ascend/distributed/kv_transfer/ascend_multi_connector.py:28-30).

  2. **Mamba model support**: vllm-ascend patches Mamba config verification to check this flag (vllm_ascend/patch/platform/patch_mamba_config.py:25).
  When HMA is active with KV transfer, Mamba block sizes are aligned with attention block sizes (vllm_ascend/platform.py:277-293).

  3. **Mooncake connector behavior**: Both MooncakeConnector and MooncakeHybridConnector use this flag to determine if hybrid
  KV cache handling is needed (mooncake_connector.py:1604, mooncake_hybrid_connector.py:1109,1407). When HMA is active, the
  connector must handle multiple KV cache groups with different specs.

  4. **Ascend KV pool scheduling**: The AscendStore pool scheduler and worker check this flag to determine if hybrid KV cache
  is in use, which affects cache transfer granularity and Mamba group inference (pool_scheduler.py:168-172, pool_worker.py:286-290).

  5. **Auto-disable on Ascend**: vllm-ascend''s platform may not support hybrid KV cache (current_platform.support_hybrid_kv_cache()
  returns False for non-GPU platforms), causing automatic disable (vllm/config/vllm.py:1315-1317). This means on Ascend NPU,
  HMA may be force-disabled regardless of user preference.

  Memory impact is substantial for hybrid models (e.g., models with both full and sliding window attention): sliding window
  layers may only need 1/8 to 1/32 of the full attention KV cache, so disabling HMA can waste 30-50% of KV cache memory.

  '

related_parameters:
- name: --kv-transfer-config
  relation: When KV transfer config is set and disable_hybrid_kv_cache_manager is None, HMA is auto-disabled
- name: --speculative-config
  relation: HMA is auto-disabled when using Eagle speculative decoding with chunked local attention
- name: --attention-chunk-size
  relation: Chunked local attention with HMA causes latency regression; HMA auto-disabled unless VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE=1
- name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
  relation: Environment variable to override auto-disable of HMA with chunked local attention
constraints:
- When --disable-hybrid-kv-cache-manager is not set (None) and --kv-transfer-config is set, HMA is automatically disabled.
- When --disable-hybrid-kv-cache-manager is not set (None) and Eagle speculative decoding is used with chunked local attention,
  HMA is automatically disabled.
- When --disable-hybrid-kv-cache-manager is not set (None) and chunked local attention is used, HMA is automatically disabled
  unless VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE=1 is set.
- On Ascend NPU platforms, HMA may be force-disabled if the platform does not support hybrid KV cache (current_platform.support_hybrid_kv_cache()
  returns False).
- When HMA is enabled and a KV connector is used, all sub-connectors must support HMA or an assertion error is raised.
- When HMA is enabled with Mamba models and KV transfer, mamba_block_size must be a multiple of block_size.
tuning_advice:
  summary: 'For Ascend NPU, leave this parameter at default (None) to let vllm-ascend auto-detect the best setting. Only explicitly
    set --disable-hybrid-kv-cache-manager if you encounter compatibility issues with KV transfer connectors or speculative
    decoding.

    '
  suggested_values:
  - scenario: Default usage on Ascend NPU with standard attention models
    value: None (default, auto-detect)
    reason: vllm-ascend will automatically determine whether HMA is supported and appropriate. On Ascend, HMA may be auto-disabled
      if the platform doesn't support it.
  - scenario: Using KV transfer (disaggregated prefill) on Ascend NPU
    value: None (default, auto-detect)
    reason: vllm-ascend auto-disables HMA when KV transfer config is set, ensuring compatibility with Mooncake and other connectors.
  - scenario: Hybrid model (full + sliding window attention) without KV transfer or speculative decoding
    value: false (do not disable, i.e., enable HMA)
    reason: Enables memory-efficient KV cache allocation where sliding window layers use proportionally less cache, saving
      30-50% memory on Ascend NPU.
  - scenario: Using Eagle speculative decoding with chunked local attention
    value: None (default, auto-detect)
    reason: HMA is auto-disabled in this configuration to avoid compatibility issues.
  caveats:
  - On Ascend NPU, vllm-ascend may force-disable HMA even if you explicitly enable it, because current_platform.support_hybrid_kv_cache()
    may return False for non-GPU platforms.
  - When HMA is auto-disabled due to KV transfer config, a warning is logged but the system continues to function normally.
  - 'Disabling HMA (setting to True) on hybrid models wastes KV cache memory: sliding window layers get full-attention-sized
    caches they don''t need.'
  - The MooncakeHybridConnector on Ascend requires HMA to be enabled for hybrid models with multiple KV cache groups; disabling
    HMA may cause it to fall back to non-hybrid mode.
  quick_guide: Leave at default (None) for Ascend NPU — vllm-ascend auto-configures HMA based on platform capabilities and
    feature compatibility.

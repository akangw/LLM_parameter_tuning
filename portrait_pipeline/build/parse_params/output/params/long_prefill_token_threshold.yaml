name: --long-prefill-token-threshold
type: cli
category: scheduling
scope: both
source_file:
- vllm/config/scheduler.py:80
- vllm/engine/arg_utils.py:518
- vllm/engine/arg_utils.py:1341
- vllm_ascend/patch/platform/patch_balance_schedule.py:132
- vllm_ascend/patch/platform/patch_balance_schedule.py:401

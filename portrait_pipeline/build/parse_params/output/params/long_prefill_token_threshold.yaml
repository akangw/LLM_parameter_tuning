- vllm_ascend/core/scheduler_dynamic_batch.py:398
- vllm_ascend/core/scheduler_profiling_chunk.py:288
- vllm_ascend/core/scheduler_profiling_chunk.py:519
value_type: int
default: '0'
valid_choices: integer >= 0
cli_example: --long-prefill-token-threshold 400
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'This parameter caps the number of new tokens scheduled per step for a single request during chunked prefill.
  When a request''s remaining prompt tokens exceed this threshold, the scheduler limits the tokens issued in that step to
  the threshold value, effectively splitting long prefill work into multiple chunks. On Ascend NPU, this is used across all
  scheduler variants (balance_schedule, recompute_scheduler, dynamic_batch, profiling_chunk) in both v1 and v2 worker paths.
  The mechanism is identical to upstream vLLM: "the scheduler computes `num_new_tokens` for a request, and if" `0 < long_prefill_token_threshold
  < num_new_tokens`, it clamps `num_new_tokens` to the threshold. This directly controls the maximum prefill chunk size per
  request, which affects the tradeoff between prefill latency (smaller chunks = lower per-step latency but more steps) and
  throughput (larger chunks = better NPU utilization per step). Setting it to 0 (default) disables the cap, allowing requests
  to consume as many tokens as the token budget permits in a single step. The parameter works in conjunction with `--max-num-partial-prefills`
  and `--max-long-partial-prefills` to control how many long-prefill requests can be processed concurrently.

  '

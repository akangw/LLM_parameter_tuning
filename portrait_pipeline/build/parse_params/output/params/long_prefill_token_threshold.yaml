related_parameters:
- name: --max-num-partial-prefills
  relation: Controls how many partially-prefilled sequences can run concurrently; long_prefill_token_threshold defines which
    requests count as 'long' for the separate --max-long-partial-prefills limit
- name: --max-long-partial-prefills
  relation: Limits concurrent long-prefill requests (those exceeding long_prefill_token_threshold); setting this lower than
    max_num_partial_prefills allows short prompts to jump the queue
- name: --enable-chunked-prefill
  relation: Chunked prefill must be enabled for this parameter to have any effect; when disabled, requests exceeding the token
    budget are skipped rather than chunked
- name: --max-num-batched-tokens
  relation: The per-step token budget; long_prefill_token_threshold caps individual request tokens, but the total across all
    requests cannot exceed max_num_batched_tokens
constraints:
- long_prefill_token_threshold must be >= 0 (negative values are not valid)
- When mamba_cache_mode is 'align' and long_prefill_token_threshold > 0, it must be >= block_size
- This parameter only takes effect when chunked prefill is enabled (--enable-chunked-prefill, default True)
tuning_advice:
  summary: Set to a value that balances prefill latency against NPU utilization; typical values range from 256 to 2048 tokens
    depending on model size and sequence length requirements
  suggested_values:
  - scenario: Short prompts (< 2K tokens) with low latency requirements
    value: '0'
    reason: Disabling the cap allows full prefill in one step, minimizing scheduling overhead and maximizing throughput for
      short sequences
  - scenario: Long prompts (4K-32K tokens) where prefill latency matters
    value: '512'
    reason: Limits each prefill chunk to 512 tokens, keeping per-step latency bounded while allowing other requests to be
      interleaved; good starting point for Ascend NPU with typical block_size=128
  - scenario: Very long prompts (> 32K tokens) with strict latency SLOs
    value: '256'
    reason: Smaller chunks reduce maximum per-step latency further, at the cost of more scheduling steps; useful when TPOT
      (time-per-output-token) must stay low even during prefill
  - scenario: Throughput-optimized batch processing with mixed-length prompts
    value: '1024'
    reason: Larger chunks improve NPU compute utilization per step; combined with --max-long-partial-prefills=1, this ensures
      one long request gets substantial NPU time while short requests complete quickly
  caveats:
  - On Ascend NPU, the profiling_chunk scheduler (vllm_ascend/core/scheduler_profiling_chunk.py) may further reduce chunk
    size dynamically based on profiling data, overriding the static threshold
  - Setting this too low (< 128) may cause excessive scheduling overhead and underutilize the NPU, especially with large block_size
    values
  - 'This parameter interacts with --max-long-partial-prefills: if both are set, long requests are both capped per-step AND
    limited in concurrency, which can significantly increase end-to-end latency for long prompts'
  - The vllm-ascend schedulers apply this threshold identically to upstream vLLM; no Ascend-specific override of the parameter
    value or behavior exists
  quick_guide: Start with 512 for long-context workloads on Ascend NPU; increase to 1024-2048 if throughput is prioritized
    over latency, or set to 0 to disable chunking for short-prompt scenarios

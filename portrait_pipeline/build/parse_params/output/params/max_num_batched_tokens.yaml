related_parameters:
- name: --max-num-seqs
  relation: Together define the scheduling budget per iteration; max_num_batched_tokens limits tokens, max_num_seqs limits
    request count
- name: --enable-chunked-prefill
  relation: When enabled, prompts longer than max_num_batched_tokens are split into chunks of this size
- name: --gpu-memory-utilization
  relation: KV cache size = gpu_memory_utilization * HBM - peak_memory; peak_memory is profiled using max_num_batched_tokens
- name: --max-model-len
  relation: Used as fallback for max_num_batched_tokens in KV cache coordinator when unset
- name: --tensor-parallel-size / --prefill-context-parallel-size
  relation: When FLASHCOMM1 is enabled, max_num_batched_tokens must be divisible by tp_size * pcp_size
- name: VLLM_ASCEND_ENABLE_FLASHCOMM1
  relation: When enabled with PCP, triggers the divisibility constraint on max_num_batched_tokens
constraints:
- max_num_batched_tokens must be >= 1
- When FLASHCOMM1 is enabled and prefill_context_parallel_size > 1, max_num_batched_tokens must be divisible by tp_size *
  pcp_size (vllm-ascend auto-adjusts with a warning)
- When profiling_chunk_config is enabled, max_num_batched_tokens acts as an upper bound for min_chunk (vllm-ascend auto-clamps)
tuning_advice:
  summary: Set max_num_batched_tokens as large as memory allows to maximize throughput; reduce if encountering OOM or when
    using FLASHCOMM1 with context parallelism.
  suggested_values:
  - scenario: General throughput optimization on Ascend NPU with sufficient HBM
    value: 8192 or 16384
    reason: Larger values batch more tokens per iteration, reducing scheduling overhead and improving throughput. The default
      2048 is conservative; Ascend NPUs with 64GB HBM can typically support 8192-16384 for most models.
  - scenario: Long-context inference (e.g., 128K) with limited HBM
    value: '4096'
    reason: Long prompts consume more activation memory per token. A moderate value balances chunked prefill efficiency with
      memory safety, avoiding OOM during warm-up profiling.
  - scenario: FLASHCOMM1 enabled with tp_size=8, pcp_size=2
    value: '8192'
    reason: Must be divisible by 16 (tp_size * pcp_size). 8192 is a common choice that satisfies the constraint while providing
      good throughput. The value will be auto-adjusted if not divisible.
  - scenario: High-concurrency serving with many concurrent requests
    value: 2048 to 4096
    reason: When max_num_seqs is high, a smaller max_num_batched_tokens prevents excessive activation memory per iteration
      while still allowing many requests to make progress via chunked prefill.
  caveats:
  - Larger values increase peak activation memory during warm-up profiling, which reduces available KV cache (KV cache = gpu_memory_utilization
    * HBM - peak_memory). This can cause OOM during inference even if warm-up succeeds.
  - On Ascend NPU with FLASHCOMM1 and context parallelism, the value is silently rounded up to be divisible by tp_size * pcp_size.
    The adjusted value may be larger than intended, increasing memory pressure.
  - In v1 worker, internal buffers are allocated with extra PCP padding (pcp_size * 2 * max_num_seqs additional tokens), so
    actual device memory usage is higher than max_num_batched_tokens alone suggests.
  - Setting this too low with chunked prefill causes long prompts to be split into many small chunks, increasing scheduling
    overhead and latency.
  - The default value (2048) is a testing convenience and is suboptimal for production deployments on Ascend NPU.
  quick_guide: Start with 4096-8192 for most Ascend deployments; increase if HBM permits, decrease if OOM occurs; ensure divisibility
    by tp_size * pcp_size when using FLASHCOMM1.

name: --max-num-batched-tokens
type: cli
category: scheduling
scope: both
source_file:
- vllm/engine/arg_utils.py:1320
- vllm/config/scheduler.py:49
- vllm_ascend/ascend_config.py:57
- vllm_ascend/ascend_config.py:121
- vllm_ascend/worker/model_runner_v1.py:261
- vllm_ascend/worker/model_runner_v1.py:293
- vllm_ascend/worker/block_table.py:18
- vllm_ascend/worker/block_table.py:92
- vllm_ascend/worker/npu_input_batch.py:38
- vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:56
- vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:92
value_type: int
default: '2048'
valid_choices: integer >= 1
cli_example: --max-num-batched-tokens 4096
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter controls the maximum number of tokens (prefill + decode) that the scheduler can batch into\
  \ a single model forward pass. It directly governs the compute intensity of each iteration and the peak activation memory\
  \ footprint.\nOn Ascend NPU, vllm-ascend applies several critical overrides and constraints beyond upstream vLLM:\n1. **v1\
  \ worker padding (vllm_ascend/worker/model_runner_v1.py:261-293):** In the v1 worker,\n   max_num_batched_tokens is temporarily\
  \ increased by `pcp_size * 2 * max_num_seqs` during\n   parent class initialization to allocate larger internal buffers\
  \ for context-parallel padding,\n   then restored afterward. This means the actual scheduling limit is unchanged, but internal\n\
  \   buffer allocation accounts for PCP overhead.\n\n2. **FLASHCOMM1 divisibility constraint (vllm_ascend/ascend_config.py:121-130):**\
  \ When\n   FLASHCOMM1 is enabled and prefill_context_parallel_size > 1, max_num_batched_tokens is\n   silently rounded up\
  \ to be divisible by `tp_size * pcp_size`. Non-divisible values are\n   adjusted with a warning. This is required for correct\
  \ communication pattern alignment.\n\n3. **Profiling chunk interaction (vllm_ascend/ascend_config.py:57-67):** When\n  \
  \ profiling_chunk_config is enabled, if max_num_batched_tokens is smaller than the configured\n   min_chunk, min_chunk is\
  \ clamped down to max_num_batched_tokens to avoid silent ignoring.\n\n4. **KV cache coordinator (vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:56-68):**\n\
  \   max_num_batched_tokens is passed to the KV cache coordinator and used as a recycling-aware\n   admission cap. When unset\
  \ (None), it falls back to max_model_len.\n\n5. **Block table allocation (vllm_ascend/worker/block_table.py:92):** The slot_mapping\
  \ buffer\n   size is `max_num_batched_tokens + 2 * pcp_world_size * max_num_reqs`, directly coupling\n   this parameter\
  \ to device memory allocation.\n\n6. **GPU memory profiling (documented in docs):** During warm-up profiling, vLLM records\
  \ peak\n   GPU memory usage with an input size of max_num_batched_tokens. The available KV cache is\n   computed as `gpu_memory_utilization\
  \ * HBM - peak_memory`. Larger values increase peak\n   activation memory, reducing KV cache capacity and potentially causing\
  \ OOM.\n\nLarger values reduce scheduling overhead and improve throughput by batching more tokens per iteration, but increase\
  \ activation memory pressure and may cause OOM. Smaller values reduce memory usage but increase the number of iterations\
  \ needed for long prefill sequences (due to chunked prefill splitting).\n"

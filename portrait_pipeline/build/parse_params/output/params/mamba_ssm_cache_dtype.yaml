name: --mamba-ssm-cache-dtype
type: cli
category: memory
scope: vllm
source_file:
- vllm/engine/arg_utils.py:1115
- vllm/config/cache.py:128
value_type: str
default: auto
valid_choices:
- auto
- float16
- float32
- bfloat16
cli_example: --mamba-ssm-cache-dtype float16
deprecated: false
performance_impact: medium
performance_scope:
- memory
- throughput
impact_detail: 'This parameter controls the data type of the SSM (State Space Model) state cache in Mamba-family models (Mamba1,
  Mamba2, GatedDeltaNet). It is consumed by `MambaStateDtypeCalculator._mamba_state_dtype()` in `vllm/model_executor/layers/mamba/mamba_utils.py:84-90`,
  which resolves the SSM state dtype separately from the convolution state dtype. When set to "auto", the SSM state dtype
  falls back to the value of `--mamba-cache-dtype` (which itself defaults to "auto", ultimately resolving to the model''s
  native dtype). Setting a lower-precision dtype (e.g., float16 instead of float32) reduces the memory footprint of the SSM
  state cache, which can be significant for large-batch or long-sequence Mamba inference. This directly affects GPU/NPU memory
  usage and can improve throughput by allowing larger batch sizes. On Ascend NPU, float16 operations are natively accelerated
  by the Da Vinci architecture, making float16 the recommended choice for production deployments. The parameter also interacts
  with FlashAttention backend block size selection: "when `mamba_ssm_cache_dtype`" or `mamba_cache_dtype` is float32, the
  FlashAttention backend restricts supported block sizes to [16, 32, 64] instead of the default MultipleOf(16) to avoid NaN
  propagation issues (see `vllm/v1/attention/backends/flash_attn.py:86-94`). This block size restriction can reduce KV cache
  efficiency in hybrid Mamba/Attention models. Additionally, stochastic rounding for Mamba cache requires the SSM cache to
  be float16; setting any other value with stochastic rounding enabled raises a ValueError (see `vllm/config/vllm.py:778-788`).

  '

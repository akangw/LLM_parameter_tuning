related_parameters:
- name: --mamba-cache-dtype
  relation: Controls the convolution state dtype; mamba_ssm_cache_dtype overrides only the SSM state portion when set to a
    non-auto value
- name: --enable-mamba-cache-stochastic-rounding
  relation: Requires mamba_ssm_cache_dtype to be float16; raises ValueError otherwise
- name: --block-size
  relation: FlashAttention block size selection is restricted when mamba_ssm_cache_dtype is float32 in hybrid models
constraints:
- Must be one of 'auto', 'float16', 'float32', or 'bfloat16'.
- If --enable-mamba-cache-stochastic-rounding is set, --mamba-ssm-cache-dtype must be float16.
tuning_advice:
  summary: Use float16 for SSM state cache on Ascend NPU to reduce memory footprint and leverage native float16 acceleration,
    unless numerical precision requirements demand float32.
  suggested_values:
  - scenario: Production deployment on Ascend NPU with Mamba models
    value: float16
    reason: Reduces SSM state cache memory by ~50% compared to float32; Da Vinci architecture natively accelerates float16
      operations; avoids FlashAttention block size restrictions triggered by float32 in hybrid models.
  - scenario: Debugging numerical issues or when maximum precision is required
    value: float32
    reason: Provides full precision for SSM state computations at the cost of higher memory usage and potential block size
      restrictions in hybrid Attention/Mamba models.
  - scenario: Default behavior when no explicit tuning is needed
    value: auto
    reason: Falls back to --mamba-cache-dtype value, which itself defaults to the model's native dtype; suitable for initial
      testing before optimization.
  caveats:
  - Setting float32 triggers FlashAttention block size restrictions (only 16, 32, 64) in hybrid Mamba/Attention models, which
    may reduce KV cache efficiency.
  - Stochastic rounding for Mamba cache is incompatible with non-float16 SSM cache dtypes and will cause a startup error.
  - On Ascend NPU, float16 is the recommended precision for production inference due to hardware acceleration; float32 may
    significantly increase memory pressure.
  quick_guide: Set --mamba-ssm-cache-dtype float16 for Ascend NPU production deployments to halve SSM state memory and avoid
    block size restrictions in hybrid models.
analysis_date: '2026-07-06'

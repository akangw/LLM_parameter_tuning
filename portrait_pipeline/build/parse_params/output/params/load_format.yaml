related_parameters:
- name: --model-loader-extra-config
  relation: Provides configuration for custom loaders (netloader, rfork, tensorizer). Required when using --load-format netloader
    or --load-format rfork.
- name: --download-dir
  relation: Specifies the directory for downloading/caching model weights, used by default loader when load_format is auto/pt/safetensors.
- name: --safetensors-load-strategy
  relation: Controls how safetensors weights are loaded (eager, lazy, prefetch, torchao). Only effective when load_format
    is safetensors or auto (when safetensors files exist).
- name: --tensor-parallel-size
  relation: sharded_state format requires pre-sharded checkpoints matching the TP size. RFork seed key includes deployment
    topology.
- name: --quantization
  relation: When quantization is set and using netloader, weights post-processing is applied after loading. bitsandbytes format
    requires --load-format bitsandbytes.
constraints:
- When loading from Run:ai object storage (S3/GCS/Azure), --load-format must be runai_streamer or runai_streamer_sharded,
  otherwise a ValueError is raised.
- GGUF model files require --load-format gguf, which is auto-set when the model path ends with .gguf.
- Model reloading (hot-reload) is only supported for certain load formats; unsupported formats raise NotImplementedError.
- Netloader requires --model-loader-extra-config to be provided as a JSON string with network configuration.
- RFork requires --model-loader-extra-config to be provided as a JSON string with planner/seed configuration.
tuning_advice:
  summary: Use Ascend-native loaders (sharded_state, rfork, netloader) for faster cold-start on NPU; fall back to safetensors
    for broad compatibility.
  suggested_values:
  - scenario: Production deployment with frequent restarts or scaling events on Ascend NPU
    value: rfork
    reason: RFork performs direct NPU-to-NPU weight transfer from a seed instance, eliminating disk I/O and CPU-side copies.
      This provides the fastest cold-start latency on Ascend when a seed instance is available.
  - scenario: Large tensor-parallel models (TP >= 4) on Ascend NPU with pre-sharded checkpoints
    value: sharded_state
    reason: Each TP worker reads only its own shard, reducing per-worker I/O and memory usage during loading. Requires pre-sharded
      checkpoints generated by save_sharded_state_310.py.
  - scenario: Remote weight distribution from a central seed server on Ascend NPU
    value: netloader
    reason: Netloader fetches weights over the network from a remote seed, bypassing local disk entirely. Useful when model
      weights are not stored locally on each node.
  - scenario: Standard single-node or first-time deployment on Ascend NPU
    value: safetensors
    reason: Safetensors format loads faster than pytorch bin (pt) format and is the recommended default for HuggingFace models.
      Use with --safetensors-load-strategy eager for fastest loading.
  - scenario: Profiling or testing without real weights on Ascend NPU
    value: dummy
    reason: Initializes random weights instantly, skipping all I/O. Useful for benchmarking model architecture performance
      without weight loading overhead.
  caveats:
  - RFork and netloader are vllm-ascend specific and only work on Ascend NPU. They require additional infrastructure (seed
    instances, planner service).
  - RFork falls back silently to auto format if seed transfer fails, which may hide configuration issues. Check logs for fallback
    warnings.
  - sharded_state requires pre-generated sharded checkpoints matching the exact TP size. Mismatched sharding will cause loading
    failures.
  - The instanttensor format is CUDA-specific and has no effect on Ascend NPU.
  - bitsandbytes format is primarily for CUDA quantization; Ascend NPU uses ascend quantization instead.
  - When using speculative decoding on Ascend (v1-ascend), the draft model's load_format is controlled separately via speculative_config.draft_load_config,
    not the main --load-format flag.
  quick_guide: For fastest Ascend NPU cold-start, use --load-format rfork with a seed instance; otherwise use --load-format
    safetensors for reliable disk-based loading.
analysis_date: '2026-07-06'

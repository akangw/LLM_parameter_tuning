name: --load-format
type: cli
category: model
scope: both
source_file:
- vllm/config/load.py:29
- vllm/engine/arg_utils.py:848
- vllm_ascend/model_loader/netloader/netloader.py:345
- vllm_ascend/model_loader/rfork/rfork_loader.py:114
- vllm_ascend/model_loader/rfork/rfork_loader.py:173
value_type: str
default: auto
valid_choices:
- auto
- pt
- safetensors
- instanttensor
- npcache
- dummy
- tensorizer
- runai_streamer
- runai_streamer_sharded
- bitsandbytes
- sharded_state
- gguf
- mistral
- netloader
- rfork
cli_example: --load-format safetensors
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: "Controls which model loader is used to read and initialize model weights on Ascend NPU. The choice directly\
  \ affects cold-start latency (model loading time), memory usage during loading, and in some cases runtime throughput.\n\
  Standard formats (auto, pt, safetensors) use DefaultModelLoader which reads weights from disk/HuggingFace cache and copies\
  \ them to NPU memory. On Ascend, this is the baseline path.\nAscend-specific formats provide significant performance benefits:\
  \ - \"\\\"sharded_state\\\" loads pre-sharded checkpoints where each TP worker reads only its own\"\n  shard, avoiding full-checkpoint\
  \ reads and reducing memory pressure during loading.\n- \"\\\"netloader\\\" (vllm-ascend) loads weights over the network\
  \ from a remote seed instance,\"\n  bypassing local disk I/O entirely. Internally resets load_format to \"auto\" and delegates\n\
  \  to DefaultModelLoader after receiving weights (netloader.py:345).\n- \"\\\"rfork\\\" (vllm-ascend) performs batch weight\
  \ transfer from a seed NPU process to the\"\n  new instance's NPU memory via direct device-to-device transfer, avoiding\
  \ both disk I/O\n  and CPU-side copies. Falls back to \"auto\" on failure (rfork_loader.py:173).\n\nThe \"dummy\" format\
  \ initializes random weights and is used for profiling/testing — it skips all I/O but produces non-functional models.\n\
  For speculative decoding on Ascend (v1-ascend), the draft model loading also respects load_format via draft_load_config\
  \ (llm_base_proposer.py:220), so the choice affects both target and draft model loading performance.\n"
usage_locations:
- file: vllm/config/load.py:29
  context: Field definition with default "auto" and docstring listing all supported formats

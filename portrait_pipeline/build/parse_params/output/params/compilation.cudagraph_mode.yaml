name: compilation.cudagraph_mode
type: nested
category: compilation
scope: both
source_file:
- vllm/config/vllm.py:947
- vllm/config/vllm.py:1021
- vllm_ascend/platform.py:431
- vllm_ascend/platform.py:449
- vllm_ascend/worker/model_runner_v1.py:310
- vllm_ascend/worker/model_runner_v1.py:533
- vllm_ascend/worker/v2/model_runner.py:131

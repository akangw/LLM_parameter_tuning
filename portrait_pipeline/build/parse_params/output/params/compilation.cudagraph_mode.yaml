related_parameters:
- name: enforce_eager
  relation: When True, forces cudagraph_mode to NONE on both upstream and Ascend
- name: compilation_config.mode
  relation: If not NONE or VLLM_COMPILE, Ascend forces cudagraph_mode to NONE
- name: ascend_config.xlite_graph_config.enabled
  relation: When enabled with full_mode, forces cudagraph_mode to NONE; with decode-only mode, forces to FULL_DECODE_ONLY
- name: compilation_config.cudagraph_capture_sizes
  relation: Only used when cudagraph_mode is not NONE; determines which batch sizes are graph-captured
- name: compilation_config.cudagraph_num_of_warmups
  relation: vllm-ascend hardcodes this to 1 regardless of cudagraph_mode
constraints:
- FULL_DECODE_ONLY mode cannot be used with AscendFAImpl attention backend; use the default FIA backend or set enforce_eager=True
- Graph mode (any non-NONE cudagraph_mode) is only available on the V1 engine, not V2
- FULL mode is not sufficiently supported in context parallel scenarios
- When xlite full mode is enabled, cudagraph_mode is silently forced to NONE
- When compilation mode is not NONE or VLLM_COMPILE, cudagraph_mode is silently forced to NONE on NPU
tuning_advice:
  summary: 'For most Ascend deployments, use the default FULL_AND_PIECEWISE (v1) or FULL_DECODE_ONLY for pure decode workloads
    to maximize throughput via ACLGraph capture and Npugraph_ex optimization. Avoid FULL_DECODE_ONLY if using AscendFAImpl
    attention backend.

    '
  suggested_values:
  - scenario: Default production deployment on V1 engine
    value: FULL_AND_PIECEWISE
    reason: 'Provides the best balance: "PIECEWISE for mixed prefill-decode batches" and FULL-capable for uniform decode batches.
      This is the v1 default and works with most attention backends.

      '
  - scenario: Pure decode-only serving with FIA attention backend
    value: FULL_DECODE_ONLY
    reason: 'Enables Npugraph_ex FX optimization and ACLGraph capture for decode paths, plus paged attention for supported
      shapes. Provides maximum decode throughput.

      '
  - scenario: Debugging or when graph capture causes issues
    value: NONE
    reason: 'Disables all graph capture and runs in eager mode. Useful for debugging with PrecisionDebugger or when encountering
      graph capture compatibility issues.

      '
  - scenario: When using AscendFAImpl attention backend
    value: PIECEWISE
    reason: 'FULL_DECODE_ONLY raises ValueError with AscendFAImpl. PIECEWISE provides partial graph capture without triggering
      the incompatibility.

      '
  caveats:
  - vllm-ascend silently overrides cudagraph_mode based on xlite config, enforce_eager, and compilation mode — the user-set
    value may not be the effective value
  - cudagraph_num_of_warmups is hardcoded to 1 by vllm-ascend regardless of mode
  - FULL mode is not sufficiently supported in context parallel (CP) scenarios
  - Graph mode is only available on V1 engine; V2 engine behavior may differ
  - Npugraph_ex is automatically enabled only for FULL and FULL_DECODE_ONLY modes, providing additional compile-time optimization
  quick_guide: 'Use default FULL_AND_PIECEWISE on V1 for general serving; switch to FULL_DECODE_ONLY for pure decode workloads
    with FIA backend; use NONE only for debugging.

    '
analysis_date: '2026-07-06'

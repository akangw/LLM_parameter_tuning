value_type: str
default: FULL_AND_PIECEWISE
valid_choices:
- NONE
- PIECEWISE
- FULL
- FULL_DECODE_ONLY
- FULL_AND_PIECEWISE
cli_example: '--compilation-config ''{"cudagraph_mode": "FULL_DECODE_ONLY"}'''
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'Controls the graph capture strategy on Ascend NPU, which directly determines whether kernel launch overhead
  is eliminated via ACLGraph (torch.npu.NPUGraph) capture/replay. On Ascend, the effective mode is heavily overridden by vllm-ascend
  in platform.py: if xlite full mode is enabled, it is forced to NONE; if xlite decode-only mode is enabled, it is forced
  to FULL_DECODE_ONLY; if enforce_eager is True, it is forced to NONE; if compilation mode is not NONE or VLLM_COMPILE, it
  is forced to NONE. In v1 worker, the mode determines whether cudagraph_batch_sizes are populated (model_runner_v1.py:533)
  and whether full graph streams are created. In v2 worker, has_full_cudagraphs() controls creation of an update stream for
  full graph parameter updates (model_runner.py:131). The mode also gates paged attention usage (attention/utils.py:51) —
  only FULL_DECODE_ONLY enables paged attention for supported shapes. Additionally, FULL_DECODE_ONLY is incompatible with
  AscendFAImpl attention backend (fa3_v1.py:54-60), which raises ValueError. Npugraph_ex (compile-time FX graph optimization)
  is enabled by default only for FULL and FULL_DECODE_ONLY modes, providing additional performance gains.

  '

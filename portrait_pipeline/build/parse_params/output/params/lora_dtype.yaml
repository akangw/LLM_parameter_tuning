name: --lora-dtype
type: cli
category: model
scope: vllm
source_file:
- vllm/config/lora.py:46
- vllm/engine/arg_utils.py:576
- vllm/engine/arg_utils.py:1246
value_type: str
default: auto
valid_choices: auto, float16, bfloat16, float32, or any torch.dtype string
cli_example: --lora-dtype float16
deprecated: false
performance_impact: medium
performance_scope:
- memory
- throughput
impact_detail: 'This parameter controls the data type used for LoRA adapter weight tensors (lora_a_stacked and lora_b_stacked)
  allocated on the NPU. When set to "auto", it defaults to the base model''s dtype. On Ascend NPU, the dtype directly affects:
  "(1) NPU memory consumption — LoRA weights are allocated as stacked tensors of shape" [max_loras, 1, output_dim, input_dim]
  for each linear layer, so lower-precision dtypes (float16/bfloat16) halve memory usage compared to float32; (2) compute
  throughput — Ascend NPUs have specialized hardware units for float16/bfloat16 matrix operations that can deliver higher
  throughput than float32. The parameter is used in vllm/lora/layers/base_linear.py:141, column_parallel_linear.py:229,240,
  and fused_moe.py:99,126 to allocate LoRA weight buffers. It also affects the computation graph hash (vllm/config/lora.py:91),
  meaning changing it invalidates cached compiled graphs. No vllm-ascend override was found for this parameter.

  '
usage_locations:
- file: vllm/config/lora.py:46
  context: Field definition with default 'auto' and docstring explaining fallback to base model dtype

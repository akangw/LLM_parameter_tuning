related_parameters:
- name: --enable-lora
  relation: Must be enabled for --lora-dtype to have any effect
- name: --max-loras
  relation: Together with max_lora_rank, determines the total size of stacked LoRA weight tensors; dtype multiplies the memory
    footprint
- name: --max-lora-rank
  relation: Together with max_loras, determines the dimensions of LoRA weight tensors; dtype multiplies the memory footprint
- name: --fully-sharded-loras
  relation: Affects the output dimension of LoRA tensors, which changes the absolute memory savings from dtype choice
constraints:
- Must be a valid torch.dtype string (e.g., float16, bfloat16, float32) or 'auto'
- Only takes effect when --enable-lora is set to True
tuning_advice:
  summary: Use float16 or bfloat16 for LoRA weights on Ascend NPU to reduce memory footprint and leverage faster mixed-precision
    compute, unless numerical precision issues arise.
  suggested_values:
  - scenario: Default / general-purpose LoRA deployment on Ascend NPU
    value: auto
    reason: Inherits the base model dtype, which is typically float16 or bfloat16 on Ascend NPU, providing a good balance
      of memory efficiency and precision without manual tuning.
  - scenario: Memory-constrained deployment with many LoRA adapters (high --max-loras)
    value: float16
    reason: Halves LoRA weight memory compared to float32; Ascend NPU has native float16 hardware acceleration for matrix
      operations, maintaining high throughput.
  - scenario: Numerical stability issues observed with float16 LoRA weights
    value: float32
    reason: Provides higher precision for LoRA weight accumulation at the cost of 2x memory and potentially lower throughput
      on Ascend NPU.
  caveats:
  - Changing --lora-dtype invalidates the computation graph hash, requiring recompilation of any cached CUDA/NPU graphs, which
    increases startup time.
  - On Ascend NPU, bfloat16 may offer better numerical range than float16 with similar memory savings, but support depends
    on the specific Ascend hardware generation and CANN version.
  - The actual memory savings depend on --max-loras and --max-lora-rank; larger values amplify the absolute memory difference
    between dtypes.
  quick_guide: Leave as 'auto' to match the base model dtype; set to 'float16' to explicitly reduce LoRA memory on Ascend
    NPU when using many adapters.
analysis_date: '2026-07-06'

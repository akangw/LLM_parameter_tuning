name: --cpu-offload-gb
type: cli
category: memory
scope: both
source_file:
- vllm/config/offload.py:23
- vllm/engine/arg_utils.py:1141
- vllm_ascend/worker/model_runner_v1.py:4261
- vllm_ascend/_310p/model_runner_310p.py:879
value_type: float
default: '0'
valid_choices: '''>= 0 (float)'''
cli_example: --cpu-offload-gb 10
deprecated: false
performance_impact: high
performance_scope:
- memory
- throughput
- latency
impact_detail: 'This parameter controls UVA (Unified Virtual Addressing) CPU offloading of model weights. When set to a positive
  value, up to `cpu_offload_gb` GiB of model parameters per GPU are offloaded to CPU-pinned memory and accessed via zero-copy
  during each forward pass. This effectively increases the available GPU memory for KV cache, enabling larger models or longer
  context lengths on memory-constrained NPUs. However, it introduces CPU-GPU data transfer overhead on every forward pass,
  which can significantly degrade throughput and increase latency, especially on Ascend NPUs where the CPU-NPU interconnect
  bandwidth may be a bottleneck. On Ascend, vllm-ascend enforces an additional constraint: when `cpu_offload_gb > 0`, the
  input batch cannot be re-initialized (e.g., when block sizes differ or multiple KV cache groups are used), which may limit
  certain advanced features.

  '
usage_locations:
- file: vllm/config/offload.py:23
  context: Field definition in UVAOffloadConfig with default=0, ge=0

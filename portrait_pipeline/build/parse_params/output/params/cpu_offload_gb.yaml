related_parameters:
- name: --offload-backend
  relation: When set to "auto" (default), cpu_offload_gb > 0 triggers UVA offloading backend selection
- name: --cpu-offload-params
  relation: Selectively filters which parameters are offloaded within the cpu_offload_gb budget
- name: --offload-group-size
  relation: Mutually exclusive with cpu_offload_gb; prefetch offloading takes priority if both are set
- name: --gpu-memory-utilization
  relation: cpu_offload_gb virtually increases GPU memory, affecting KV cache allocation under gpu_memory_utilization
constraints:
- cpu_offload_gb must be >= 0 (enforced by pydantic Field ge=0)
- When cpu_offload_gb > 0 and the input batch needs re-initialization (e.g., heterogeneous block sizes or multiple KV cache
  groups), vllm-ascend raises an assertion error
- cpu_offload_gb and prefetch offloading (offload_group_size > 0) are mutually exclusive; prefetch takes priority when both
  are set and offload_backend is "auto"
tuning_advice:
  summary: 'Use cpu_offload_gb only when NPU memory is insufficient to load the model or desired KV cache; expect significant
    throughput degradation due to CPU-NPU transfer overhead on Ascend.

    '
  suggested_values:
  - scenario: Model fits in NPU memory with desired KV cache
    value: '0'
    reason: No offloading avoids CPU-NPU transfer overhead, maximizing throughput and minimizing latency
  - scenario: Model slightly exceeds NPU memory (e.g., 13B model on 24GB NPU)
    value: 4-10
    reason: Offload just enough to fit the model; smaller values minimize the performance penalty
  - scenario: Large model with limited NPU memory, throughput is secondary
    value: 10-20
    reason: Accept higher offloading for model feasibility; expect 2-5x throughput reduction on Ascend
  caveats:
  - On Ascend NPUs, CPU-NPU interconnect bandwidth is typically lower than GPU CPU-GPU bandwidth, making UVA offloading more
    costly than on CUDA GPUs
  - When cpu_offload_gb > 0, vllm-ascend cannot re-initialize the input batch, which may prevent use of heterogeneous block
    sizes or multiple KV cache groups
  - Prefetch offloading (--offload-group-size) takes priority over UVA offloading when both are configured; ensure only one
    offloading strategy is active
  - CPU-pinned memory allocation requires sufficient system RAM; ensure host memory exceeds cpu_offload_gb * number_of_NPUs
  quick_guide: Set to 0 unless NPU memory is insufficient; if offloading is necessary, use the smallest value that allows
    the model to load.
analysis_date: '2026-07-06'

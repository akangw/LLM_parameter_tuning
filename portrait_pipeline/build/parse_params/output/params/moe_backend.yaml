name: --moe-backend
type: cli
category: other
scope: vllm
source_file:
- vllm/engine/arg_utils.py:1404
- vllm/config/kernel.py:141
- vllm/model_executor/layers/fused_moe/config.py:1263
- vllm/model_executor/layers/fused_moe/layer.py:511
value_type: str
default: auto
valid_choices:
- auto
- triton
- deep_gemm
- deep_gemm_mega_moe
- cutlass
- flashinfer_trtllm
- flashinfer_cutlass
- flashinfer_cutedsl
- marlin
- humming
- triton_unfused
- aiter
- emulation
cli_example: --moe-backend triton
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
- memory
impact_detail: 'This parameter selects the backend kernel implementation for Mixture-of-Experts (MoE) expert computation.
  On Ascend NPU, the available backends are limited to those supported by the CANN/HCCL stack. The "auto" default delegates
  selection to vLLM''s automatic backend resolution, which on Ascend typically falls back to "triton" or "triton_unfused"
  since GPU-specific backends (deep_gemm, cutlass, flashinfer_*, aiter) are not available on NPU. The parameter is consumed
  in FusedMoE layer construction (vllm/model_executor/layers/fused_moe/layer.py:511) where it is passed to FusedMoEConfig.moe_backend,
  which then drives kernel selection in the MoE dispatch path. Since Ascend NPU lacks most of the listed backends, the effective
  choice is between "auto" (which resolves to a Triton-based path) and "triton"/"triton_unfused" for explicit control. The
  performance difference between these options on Ascend is minimal because they all ultimately rely on the same underlying
  CANN operators. No vllm-ascend override of this parameter was found in the provided context.

  '
usage_locations:

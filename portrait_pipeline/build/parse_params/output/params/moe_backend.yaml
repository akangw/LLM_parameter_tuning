  relation: Draft model can override moe_backend via speculative_config.moe_backend field
- name: --enable-expert-parallel
  relation: Expert parallelism interacts with MoE kernel selection and dispatch strategy
constraints:
- On Ascend NPU, only 'auto', 'triton', and 'triton_unfused' backends are functional; other backends (deep_gemm, cutlass,
  flashinfer_*, aiter, marlin, humming, emulation) are GPU-specific and will fail or fall back to Triton.
- When LoRA is enabled with unquantized MoE, moe_backend must be 'triton' or 'auto' (which auto-selects Triton for LoRA compatibility).
tuning_advice:
  summary: On Ascend NPU, leave this at 'auto' (default) — the effective backend choice is limited to Triton-based paths,
    and explicit selection provides no measurable performance benefit.
  suggested_values:
  - scenario: Default Ascend NPU deployment
    value: auto
    reason: Automatically selects the best available backend; on Ascend this resolves to a Triton-based kernel which is the
      only viable option.
  - scenario: Debugging or isolating MoE kernel issues on Ascend
    value: triton
    reason: Explicitly forces Triton backend, which is functionally equivalent to 'auto' on Ascend but removes any auto-selection
      ambiguity.
  caveats:
  - GPU-specific backends (deep_gemm, cutlass, flashinfer_*, aiter) are not supported on Ascend NPU and will either error
    out or silently fall back to Triton.
  - The 'emulation' backend dequantizes weights and runs BF16/FP16 GEMM — this may work on Ascend but offers no performance
    advantage over Triton.
  - No vllm-ascend override was found for this parameter; behavior follows upstream vLLM with Ascend hardware limitations
    applied at kernel dispatch time.
  quick_guide: Use default 'auto' on Ascend NPU; only change to 'triton' for debugging MoE kernel issues.
analysis_date: '2026-07-06'

  caveats:
  - The backend parameter is read from kv_connector_extra_config dict; ensure it is properly set in the vLLM config to avoid
    relying on the default fallback.
  - Future vllm-ascend versions may introduce additional backends; verify compatibility before switching.
  quick_guide: Keep backend as 'mooncake' — it is the sole supported KV transfer backend for Ascend NPU disaggregated serving.

name: --offload-group-size
type: cli
category: memory
scope: vllm
source_file:
- vllm/config/offload.py:54
- vllm/engine/arg_utils.py:1146
- vllm/entrypoints/llm.py:233
value_type: int
default: 0
valid_choices: '>= 0'
cli_example: --offload-group-size 8
deprecated: false
performance_impact: high
performance_scope:
- memory
- throughput
- latency
impact_detail: 'This parameter controls the prefetch-based model weight offloading strategy. When set to a positive integer
  N, it groups every N consecutive transformer layers together and offloads the last `offload_num_in_group` layers of each
  group to CPU memory. This reduces GPU memory usage at the cost of CPU-GPU data transfer during inference. Unlike the simpler
  `cpu_offload_gb` (UVA-based) approach, this uses explicit async prefetching to hide transfer latency by overlapping H2D
  copies with computation. On Ascend NPU, the memory savings are critical for deploying large models within the limited HBM
  of NPU cards, but the PCIe/NPU interconnect bandwidth and the effectiveness of async prefetch overlap will determine the
  actual throughput impact. Setting this to a value > 0 also implicitly selects the "prefetch" offload backend when `offload_backend`
  is "auto" (see vllm/model_executor/offloader/base.py:141).

  '
usage_locations:
- file: vllm/config/offload.py:54
  context: Field definition with default=0, ge=0 constraint
- file: vllm/config/offload.py:86
  context: Used in OffloadConfig to auto-select 'prefetch' backend when > 0
- file: vllm/config/offload.py:100
  context: 'Validation: triggers constraint checks for num_in_group and prefetch_step'

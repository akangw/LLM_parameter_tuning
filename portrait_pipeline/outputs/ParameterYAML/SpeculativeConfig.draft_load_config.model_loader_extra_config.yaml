related_parameters:
- name: SpeculativeConfig.draft_load_config.load_format
  relation: Selects the loader that defines which keys in this mapping are meaningful.
- name: SpeculativeConfig.draft_load_config
  relation: Parent internal LoadConfig for the speculative draft model; when absent, vLLM uses the target model load configuration.
- name: SpeculativeConfig.draft_model_config
  relation: Identifies the draft model whose weights the configured loader loads.
constraints:
- draft_load_config is an internal field populated by vLLM and is not intended to be supplied as a key of the user-facing
  --speculative-config object.
- Keys and value shapes must match the loader selected by load_format; there is no cross-loader schema for this mapping.
- The default empty mapping is valid for ordinary loaders, but specialized loaders can require external services and mandatory
  keys.
- Ascend RFork requires a dictionary; model_url and model_deploy_strategy_name must be non-empty for seed-key construction.
- Ascend netloader uses uppercase keys, whereas RFork uses lowercase keys; configurations are not interchangeable.
tuning_advice:
  summary: Keep the inherited empty mapping for standard draft loading. Framework integrators should populate it only together
    with a known load_format and should benchmark an uncached cold start plus peak host and device memory.
  suggested_values:
  - scenario: Standard draft model loading
    value: {}
    reason: The default avoids activating loader-specific services or passing keys that another loader may reject or ignore.
  - scenario: Tensorizer draft checkpoint with constrained read concurrency
    value:
      deserialization_kwargs:
        num_readers: 2
    reason: The pinned upstream documentation identifies num_readers as the way to limit concurrent tensorizer deserialization
      readers; tune it against storage bandwidth and CPU pressure.
  - scenario: Ascend RFork integration
    value:
      model_url: /models/draft
      model_deploy_strategy_name: draft-strategy
      rfork_scheduler_url: http://scheduler.example
      rfork_seed_timeout_sec: 5.0
    reason: These are the fields consumed by the pinned RFork loader; valid deployment-specific endpoints allow transfer-based
      draft loading.
  caveats:
  - 'Loader-specific examples are not portable: tensorizer, netloader, and RFork interpret different keys and may require
    optional dependencies or external infrastructure.'
  - Increasing tensorizer reader concurrency can increase CPU, memory, and storage pressure without improving startup time
    once the storage path is saturated.
  - Invalid or unavailable Ascend transfer sources trigger fallback loading, adding failed-attempt and cleanup time to cold
    start.
  - Netloader INT8 cache placement can retain additional HBM or DRAM for its elastic server; measure memory on the actual
    deployment.
  quick_guide: Leave this mapping empty unless the selected draft load_format has a documented requirement. Configure only
    that loader's keys, validate all external endpoints, and compare cold-start time and peak memory against the empty-mapping
    baseline.
analysis_date: '2026-07-31'

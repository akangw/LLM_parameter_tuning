value_type: dict
default: {}
valid_choices: 'Any mapping accepted by the selected model loader. The empty mapping is the default. Keys are loader-specific:
  tensorizer accepts serialization and deserialization options; pinned vllm-ascend netloader accepts CONFIG_FILE, SOURCE,
  MODEL, LISTEN_PORT, INT8_CACHE, INT8_CACHE_NAME, and OUTPUT_PREFIX; pinned vllm-ascend rfork reads model_url, model_deploy_strategy_name,
  rfork_scheduler_url, rfork_seed_timeout_sec, and rfork_seed_key_separator.'
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- memory
impact_detail: 'This is the loader-specific option mapping inside the speculative draft model''s LoadConfig. It has no fixed
  effect by itself: the selected draft loader interprets its keys while the draft model is initialized. Upstream documentation
  shows tensorizer using deserialization_kwargs such as num_readers, which can trade model-load concurrency against CPU and
  I/O pressure. On Ascend, the proposer passes the complete draft_load_config to get_model. The netloader then reads this
  mapping to choose elastic-loading sources and optional INT8 cache placement, while rfork reads transfer endpoints and timeout
  settings; both loaders can fall back to the default loader when their specialized path is unavailable. These choices can
  change cold-start latency and loader/cache memory use, but the mapping does not alter the speculative decoding computation
  or steady-state token throughput.'
usage_locations:

name: CompilationConfig.pass_config.fuse_rope_kvcache
type: nested
category: compilation
scope: vllm
source_file:
- vllm/config/compilation.py:147
- vllm/config/compilation.py:282
- vllm/config/compilation.py:941
- vllm/config/compilation.py:1112

related_parameters:
- name: HCCL_EXEC_TIMEOUT
  relation: Controls HCCL operation execution timeout after connection setup; Ascend recipes commonly configure it beside
    HCCL_CONNECT_TIMEOUT.
- name: HCCL_IF_IP
  relation: Selects the local address used by HCCL; an invalid address can prevent connection establishment regardless of
    timeout length.
- name: HCCL_SOCKET_IFNAME
  relation: Selects the HCCL network interface in multi-node recipes and must identify a reachable interface.
- name: VLLM_ENGINE_READY_TIMEOUT_S
  relation: Separately limits how long vLLM orchestration waits for engines to become ready and should allow enough time for
    distributed initialization.
constraints:
- Set the variable in the process environment before launching vLLM so the external HCCL runtime sees it during initialization.
- Use a positive integer expressed in seconds.
- All participating nodes still require correct, mutually reachable HCCL_IF_IP and HCCL_SOCKET_IFNAME settings; increasing
  this timeout cannot repair network configuration errors.
tuning_advice:
  summary: Keep 120 seconds for ordinary deployments. Increase it only when a valid large or slow-starting distributed topology
    cannot finish HCCL connection establishment in that window; this tunes startup tolerance, not steady-state inference speed.
  suggested_values:
  - scenario: Ordinary distributed Ascend deployment
    value: 120
    reason: This is the value repeated across the pinned DeepSeek-V3 and standard disaggregated-prefill launch recipes.
  - scenario: Large multi-node deployment with demonstrably slow but successful HCCL initialization
    value: 1200
    reason: Pinned DeepSeek-V4 and nightly multi-node configurations use 1200 seconds to provide additional connection-setup
      headroom.
  - scenario: Very large DeepSeek-V4-Pro deployment matching the documented recipe
    value: 7200
    reason: The pinned DeepSeek-V4-Pro data-parallel and tensor-parallel launch recipe explicitly uses this extended value.
  caveats:
  - Larger values delay failure reporting when a rank, device, address, or interface is genuinely unavailable.
  - Do not raise this timeout to treat steady-state collective execution timeouts; HCCL_EXEC_TIMEOUT is the distinct setting
    shown for that purpose.
  - The repository documents launch values but does not implement or validate HCCL's external fallback default, so 120 is
    the vllm-ascend recipe baseline represented here.
  quick_guide: Start at 120 seconds; use 1200 only for measured large-cluster startup delays, and reserve 7200 for the documented
    very-large DeepSeek-V4-Pro topology.
analysis_date: '2026-08-03'

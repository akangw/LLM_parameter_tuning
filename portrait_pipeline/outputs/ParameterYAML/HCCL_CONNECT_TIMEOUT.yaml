value_type: int
default: 120
valid_choices: positive integer number of seconds
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'HCCL_CONNECT_TIMEOUT is consumed by the external HCCL runtime and bounds connection establishment rather than
  vLLM request execution. The pinned vllm-ascend source does not read or write it in Python, and pinned upstream vLLM has
  no occurrence. Ascend launch recipes nevertheless set it before starting distributed servers: the dynamic chunked pipeline-parallel,
  DeepSeek-V3.1, DeepSeek-V3.2, and several DeepSeek-V4 examples use 120 seconds, while larger DeepSeek-V4 multi-node configurations
  use 1200 or 7200 seconds. A value that is too short can make slow rank or device connection setup time out, causing startup
  failure or restart and increasing time-to-ready. A larger value does not improve healthy steady-state latency, throughput,
  or memory use; it only permits more time for connection establishment and therefore delays reporting a genuine connection
  failure.'
usage_locations:
- file: docs/source/tutorials/features/dynamic_chunked_pipeline_parallel.md:82

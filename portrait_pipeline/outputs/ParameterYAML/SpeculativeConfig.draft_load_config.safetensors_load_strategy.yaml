name: SpeculativeConfig.draft_load_config.safetensors_load_strategy
type: nested
category: model
scope: both
source_file:
- vllm/config/load.py:63
- vllm/config/speculative.py:186
- docs/features/speculative_decoding/README.md:138
- vllm_ascend/spec_decode/llm_base_proposer.py:218
value_type: str
default: null
valid_choices:
- null
- lazy
- eager
- prefetch
- torchao
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- memory
impact_detail: This nested field selects the safetensors loading policy for the speculative draft model. The default uses
  memory mapping and automatically starts page-cache prefetching for NFS or Lustre checkpoints only when their total size
  is at most 90% of available host RAM. "lazy" suppresses that automatic network-filesystem prefetch; "eager" reads each complete
  shard into CPU memory before yielding its tensors; and "prefetch" explicitly reads checkpoint blocks into the OS page cache
  in a background thread pool. These choices can materially change draft-model initialization time, storage access patterns,
  and transient host/page-cache memory, but they do not alter the computation graph or steady-state token throughput after
  weights have loaded. "torchao" reconstructs serialized torchao tensor subclasses and is also selected internally for a compatible
  serialized torchao checkpoint. The pinned Ascend proposer passes draft_load_config to the upstream model loader, so this
  startup behavior applies on Ascend without an Ascend-specific strategy override.
usage_locations:
- file: vllm/config/load.py:63
  context: Defines the default and documents lazy, eager, prefetch, and torchao loading behavior, including automatic prefetch
    for network filesystems when the checkpoint fits the host-RAM threshold.
- file: vllm/config/speculative.py:186

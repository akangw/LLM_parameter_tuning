name: KVTransferConfig.kv_buffer_device
type: nested
category: communication
scope: both
source_file:
- vllm/config/kv_transfer.py:16
- vllm/config/kv_transfer.py:33
- vllm_ascend/platform.py:109
- docs/source/user_guide/feature_guide/large_scale_ep.md:162
- examples/disaggregated_prefill_v1/mooncake_connector_deployment_guide.md:43
value_type: str
default: current_platform.device_type
valid_choices:
- npu
- cuda
- cpu
- xpu
cli_example: --kv-transfer-config '{"kv_connector":"MooncakeConnectorV1","kv_buffer_device":"npu","kv_role":"kv_producer"}'
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: This connector-facing setting selects the device on which a KV-transfer connector buffers cache data. The upstream
  default factory returns current_platform.device_type, and the pinned Ascend platform declares device_type as "npu"; therefore
  the computed Ascend default is "npu". Current vllm-ascend Mooncake deployment examples also set "npu" on both producer and
  consumer nodes so transferred KV remains associated with the NPU execution path. Buffer placement can affect transfer staging,
  device-memory consumption, and the copies on the latency-critical prefill/decode handoff, so it can affect latency, throughput,
  and the split between host and accelerator memory when a connector supports multiple placement targets. The pinned repositories
  do not contain a generic in-tree implementation that quantifies an "npu" versus "cpu" performance delta; the exact cost
  is connector- and transport-dependent.
usage_locations:
- file: vllm/config/kv_transfer.py:16
  context: Computes the default from the active platform device type.
- file: vllm/config/kv_transfer.py:33
  context: Declares the connector buffer-device field and documents upstream CUDA, CPU, and XPU choices.
- file: vllm_ascend/platform.py:109
  context: Declares the Ascend platform device type as npu, making npu the computed default under vllm-ascend.
- file: docs/source/user_guide/feature_guide/large_scale_ep.md:162

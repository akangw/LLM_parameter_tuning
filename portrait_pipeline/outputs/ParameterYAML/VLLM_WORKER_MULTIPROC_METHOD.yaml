- file: docs/source/user_guide/feature_guide/large_scale_ep.md:206
  context: The corresponding Ascend decoder-node external-DP launch template also explicitly selects fork.
related_parameters:
- name: VLLM_ASCEND_EXTERNAL_DP_LB_ENABLED
  relation: Ascend's large-scale EP prefill and decoder launch templates enable this setting in the same environment that
    selects fork.
- name: mm_tensor_ipc
  relation: The torch_shm choice requires VLLM_WORKER_MULTIPROC_METHOD=spawn; configuration validation otherwise raises ValueError.
- name: numa_bind_nodes
  relation: Upstream documentation says NUMA binding through the Python API requires the worker multiprocessing method to
    be spawn.
- name: numa_bind_cpus
  relation: Like node binding, explicit CPU binding through the Python API depends on spawn worker creation.
constraints:
- Only the literal values fork and spawn are accepted by the pinned environment-variable parser.
- Multimodal tensor IPC set to torch_shm requires the environment variable to be explicitly set to spawn.
- WhisperForConditionalGeneration is known to have problems with forked workers and may hang during startup.
- Spawn-based library entry points must protect process-creating code with an if __name__ == "__main__" guard to avoid recursive
  execution.
- Python-API NUMA binding requires spawn according to the pinned upstream optimization guide.
tuning_advice:
  summary: Use spawn for normal Ascend library and offline-inference deployments, especially when the parent may initialize
    the NPU. Retain fork only for a launch topology that is verified to support it, including the pinned large-scale EP external-DP
    recipe.
  suggested_values:
  - scenario: Standard Ascend offline inference or a parent process that may initialize the NPU before workers start
    value: spawn
    reason: Ascend's current examples and E2E server harness choose spawn, with the harness explicitly citing safe NPU initialization.
  - scenario: Multimodal torch_shm IPC, Whisper, or Python-API NUMA binding
    value: spawn
    reason: The pinned upstream configuration requires it for torch_shm and recommends or documents it for Whisper and NUMA
      binding.
  - scenario: Ascend large-scale expert parallelism using the pinned external-DP prefill/decoder launch templates
    value: fork
    reason: Both documented templates explicitly set fork together with VLLM_ASCEND_EXTERNAL_DP_LB_ENABLED=1.
  - scenario: Generic library use with no initialized accelerator state and no spawn-only feature
    value: fork
    reason: This is the pinned upstream default and has lower process-start overhead, provided the complete dependency stack
      is fork-safe.
  caveats:
  - Spawn starts a fresh interpreter and re-imports the main module, so startup is slower and unguarded library scripts can
    recurse.
  - Fork inherits parent process state and is unsafe after incompatible accelerator or threaded libraries have initialized;
    failures can appear as crashes or startup hangs.
  - The Ascend large-scale EP recipe documents fork but does not state that fork is a universal recommendation for external
    DP or quantify a performance gain.
  - This setting affects process creation and compatibility; the pinned sources do not establish a direct steady-state token-throughput
    improvement for either value.
  quick_guide: Start with spawn on Ascend; use fork only when following a fork-specific verified recipe or when startup speed
    matters and the parent and all dependencies are known to be fork-safe.
analysis_date: '2026-07-29'

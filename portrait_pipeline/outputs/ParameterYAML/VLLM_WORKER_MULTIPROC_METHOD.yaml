performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'VLLM_WORKER_MULTIPROC_METHOD selects the Python multiprocessing start method used for vLLM workers. The pinned
  upstream definition accepts only fork and spawn and defaults to fork. Upstream''s multiprocessing design describes fork
  as the faster method because it inherits the parent interpreter, while spawn starts a fresh interpreter and is more compatible
  with accelerator and threaded dependencies. Consequently, the setting primarily changes worker and engine startup latency;
  an incompatible choice can prevent workers from starting or leave startup hanging, eliminating useful throughput rather
  than changing the steady-state token kernels. Current Ascend examples set spawn before constructing LLM, and the Ascend
  E2E server harness explains that spawn is the safe choice when the parent might already have initialized the NPU. Ascend''s
  documented large-scale expert-parallel external-DP launch recipe is a specific exception: both prefill and decoder templates
  explicitly set fork together with VLLM_ASCEND_EXTERNAL_DP_LB_ENABLED=1. Upstream additionally rejects any value other than
  spawn for torch_shm multimodal tensor IPC, warns that Whisper can hang with forked workers, and documents that Python-API
  NUMA binding also requires spawn.'

name: SpeculativeConfig.synthetic_acceptance_rates
type: nested
category: model
scope: vllm
source_file:
- vllm/config/speculative.py:196
value_type: list[float]
default: null
valid_choices: A list of num_speculative_tokens floats in [0.0, 1.0], ordered non-increasingly, or null when synthetic rejection
  sampling is not selected
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
impact_detail: With rejection_sample_method='synthetic', each entry p_i is the unconditional probability that draft positions
  0 through i are all accepted. The config converts these cumulative probabilities to conditional rates for the early-terminating
  rejection loop, so the expected number of accepted draft tokens per verification step is sum(p_i), and the expected emitted
  length is 1 + sum(p_i) including the target bonus/replacement token. Higher rates therefore amortize each target verification
  pass over more emitted tokens, increasing synthetic-speculation throughput and reducing per-output-token latency; lower
  rates do the reverse. This controls a synthetic benchmark path, not the model-derived correctness-preserving acceptance
  decision. On the pinned Ascend implementation, passing synthetic conditional rates raises NotImplementedError, so this setting
  cannot realize a performance gain on NPU.
usage_locations:
- file: vllm/config/speculative.py:221
  context: Validates the list length, range, and non-increasing order and resolves either this list or synthetic_acceptance_length
    to per-position unconditional rates.
- file: vllm/config/speculative.py:952
  context: During config post-initialization, resolves the synthetic schedule when rejection_sample_method is synthetic and
    rejects synthetic-only fields for standard sampling.
- file: vllm_ascend/worker/v2/spec_decode/rejection_sampler_utils.py:344
  context: Ascend refuses non-null synthetic conditional rates because the NPU Triton path lacks the required 64-bit random
    generator.
related_parameters:
- name: SpeculativeConfig.rejection_sample_method
  relation: Must be 'synthetic' for this field to be valid; other methods require it to remain null.
- name: SpeculativeConfig.num_speculative_tokens
  relation: Fixes the required number of entries and therefore the maximum possible sum of unconditional acceptance rates.
- name: SpeculativeConfig.synthetic_acceptance_length
  relation: Mutually exclusive alternative that is converted to a minimum-variance synthetic_acceptance_rates schedule.
constraints:
- The list length must equal num_speculative_tokens.
- Every entry must be between 0.0 and 1.0 inclusive.
- Entries must be monotonically non-increasing because they are cumulative unconditional acceptance probabilities.
- Exactly one of synthetic_acceptance_rates and synthetic_acceptance_length must be set when rejection_sample_method is 'synthetic'.
- Both synthetic acceptance fields must be null unless rejection_sample_method is 'synthetic'.
- Synthetic rejection sampling is not supported by the pinned vllm-ascend NPU rejection sampler and raises NotImplementedError
  at runtime.
tuning_advice:
  summary: Use measured cumulative per-position acceptance rates to emulate a draft model on supported GPUs; do not treat
    the schedule as a production quality-preserving tuning knob.
  suggested_values:
  - scenario: Three-token synthetic run emulating moderate, decaying acceptance
    value:
    - 0.7
    - 0.4
    - 0.2
    reason: This valid cumulative schedule yields 1.3 expected accepted drafts and 2.3 expected emitted tokens per verification
      step.
  - scenario: Three-token synthetic upper-bound throughput experiment
    value:
    - 1.0
    - 1.0
    - 1.0
    reason: Every draft position is accepted, giving the maximum four emitted tokens per verification step, but it is an artificial
      best case.
  - scenario: Three-token synthetic rejection-heavy experiment
    value:
    - 0.2
    - 0.05
    - 0.0
    reason: This schedule yields only 0.25 expected accepted drafts and can model a poorly matched drafter for sensitivity
      testing.
  caveats:
  - Rates are unconditional cumulative probabilities, not independent per-position probabilities; the runtime derives conditional
    rates internally.
  - Synthetic acceptance may accept tokens independently of target-model probability and can change output quality or distribution,
    so throughput comparisons are synthetic rather than correctness-preserving production results.
  - Keep num_speculative_tokens fixed when comparing schedules because it changes verifier work and the required list length.
  - The pinned Ascend NPU implementation does not support synthetic rejection sampling; use rejection_sample_method='standard'
    there.
  quick_guide: For a supported-GPU synthetic test, set rejection_sample_method to synthetic, choose exactly num_speculative_tokens
    measured cumulative rates, and compare 1 + sum(rates) against observed emitted tokens per step.
analysis_date: '2026-07-31'

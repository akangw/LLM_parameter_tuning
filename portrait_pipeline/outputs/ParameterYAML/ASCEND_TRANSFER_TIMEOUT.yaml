- docs/source/user_guide/feature_guide/kv_pool.md:246
value_type: int
default: computed as int((4.096 * 2^HCCL_RDMA_TIMEOUT) * HCCL_RDMA_RETRY_CNT // 1000 + 3000); 33064 ms when HCCL_RDMA_TIMEOUT=20
  and HCCL_RDMA_RETRY_CNT=7
valid_choices: Integer milliseconds satisfying the documented RDMA retransmission bound.
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: ASCEND_TRANSFER_TIMEOUT controls the Mooncake one-sided KV-transfer timeout on Ascend. Each standard, hybrid,
  and layerwise Mooncake connector worker normalizes the environment variable during initialization by calling get_transfer_timeout_value().
  An explicitly configured value is parsed as an integer; when it is empty or unset, the pinned implementation derives the
  value from HCCL_RDMA_TIMEOUT and HCCL_RDMA_RETRY_CNT and adds 3000 ms of headroom. The fallback values 20 and 7 produce
  exactly 33064 ms. A timeout below the documented RDMA retransmission window can terminate a slow or retried KV transfer,
  causing request failures and lost throughput. A larger value gives stalled transfers more time to complete but extends detection
  latency for genuine transfer failures. Upstream vLLM contains no reference to this Ascend-specific environment variable.
usage_locations:

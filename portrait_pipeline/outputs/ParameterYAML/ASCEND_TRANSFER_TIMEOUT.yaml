related_parameters:
- name: HCCL_RDMA_TIMEOUT
  relation: Sets the RDMA retransmission timeout exponent used by the fallback calculation; changing it also affects HCCL
    collective communication.
- name: HCCL_RDMA_RETRY_CNT
  relation: Sets the retry count used by the fallback calculation and defaults to 7 when absent.
- name: ASCEND_CONNECT_TIMEOUT
  relation: Controls Mooncake connection establishment rather than data transfer; the KV lease TTL must exceed both timeouts.
- name: default_kv_lease_ttl
  relation: Must be larger than ASCEND_TRANSFER_TIMEOUT so a KV object's lease does not expire before its transfer timeout.
constraints:
- A non-empty value must be parseable by Python int() or connector-worker initialization raises ValueError.
- The documented requirement is ASCEND_TRANSFER_TIMEOUT greater than RDMA_TIMEOUT multiplied by 7, where RDMA_TIMEOUT is 4.096
  microseconds multiplied by 2^HCCL_RDMA_TIMEOUT.
- Mooncake default_kv_lease_ttl must be larger than ASCEND_TRANSFER_TIMEOUT.
- The parameter is normalized only by the Ascend standard, hybrid, and layerwise Mooncake KV-transfer connectors.
tuning_advice:
  summary: Keep the computed fallback unless transfer-timeout evidence justifies a change. When setting an explicit value,
    calculate the RDMA lower bound from HCCL_RDMA_TIMEOUT and keep the Mooncake KV lease TTL above the result.
  suggested_values:
  - scenario: Default environment with HCCL_RDMA_TIMEOUT=20 and HCCL_RDMA_RETRY_CNT=7
    value: 33064
    reason: This is the exact value produced by the pinned fallback expression and includes its 3000 ms headroom.
  - scenario: Pinned KV Pool guide configuration with HCCL_RDMA_TIMEOUT=17
    value: 10000
    reason: The guide uses this transfer timeout with exponent 17; it exceeds seven RDMA timeout windows and pairs it with
      an 11000 ms KV lease TTL.
  caveats:
  - Do not copy 10000 ms while retaining HCCL_RDMA_TIMEOUT=20; it would violate the guide's stated seven-retry lower bound.
  - Increasing HCCL_RDMA_TIMEOUT to influence the computed fallback also changes HCCL collective communication behavior.
  - A short value can turn congestion or retransmission into KV-transfer failures, while a long value delays failure detection
    and raises failed-request tail latency.
  - Ensure default_kv_lease_ttl remains larger after every timeout change.
  quick_guide: Use the computed 33064 ms fallback by default; if overriding it, first satisfy the RDMA bound and then set
    default_kv_lease_ttl above the chosen timeout.
analysis_date: '2026-07-28'

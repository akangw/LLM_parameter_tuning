impact_detail: DYNAMIC_EPLB is the process-start gate for Ascend dynamic Expert Parallel Load Balancing. Values "true" and
  "1" (case-insensitive for "true") load the Ascend multiprocessing-executor patch and satisfy validation when additional_config.eplb_config.dynamic_eplb
  is enabled. The configuration flag, rather than this environment variable alone, initializes a dedicated HCCL group, collects
  per-expert load, runs a separate balancing process, and asynchronously transfers expert weights and updates expert maps.
  The Ascend guide describes the resulting redistribution as reducing TTFT and TPOT and increasing token throughput for imbalanced
  MoE workloads. Enabling it also adds communication, load-tracking, process, mapping, and potentially redundant-expert storage;
  the dedicated HCCL group is assigned a buffer size of 100. Dynamic EPLB can therefore improve latency and throughput when
  expert activation is skewed, while adding periodic balancing work and memory overhead. The pinned upstream vLLM repository
  contains no DYNAMIC_EPLB definition or consumer.
usage_locations:

related_parameters:
- name: eplb_config.dynamic_eplb
  relation: Must be true to activate runtime balancing; setting DYNAMIC_EPLB alone only selects startup patches and satisfies
    the gate.
- name: EXPERT_MAP_RECORD
  relation: Alternative startup gate that imports the same executor patch and satisfies dynamic EPLB validation for expert-map
    recording.
- name: eplb_config.expert_heat_collection_interval
  relation: Controls how many forward iterations are used before waking the balancing worker to process collected expert load.
- name: eplb_config.algorithm_execution_interval
  relation: Controls the interval reserved for the balancing worker before expert update information is consumed.
- name: eplb_config.num_redundant_experts
  relation: Controls redundant expert capacity available to the placement algorithm and directly affects expert storage.
- name: eplb_config.eplb_policy_type
  relation: Selects policy 0 through 3; the current Ascend guide recommends SwiftBalancer policy 2.
- name: VLLM_ASCEND_ENABLE_FUSED_MC2
  relation: The fused dispatch_ffn_combine path is restricted to non-dynamic-EPLB configurations.
- name: --enable-expert-parallel
  relation: Dynamic EPLB is intended for MoE serving with expert parallelism, as shown by the documented invocation.
constraints:
- DYNAMIC_EPLB must be set before process startup so the conditional platform patch is imported.
- Runtime balancing additionally requires additional_config.eplb_config.dynamic_eplb=true; the environment variable alone
  does not set that field.
- If dynamic_eplb is true, validation accepts DYNAMIC_EPLB values "true" or "1", or the alternative exact EXPERT_MAP_RECORD
  value "true"; otherwise initialization asserts.
- Dynamic EPLB is an MoE expert-parallel feature and requires a usable expert placement map; it does not benefit dense models.
- Ascend NPU model runner v2 raises NotImplementedError when dynamic EPLB is enabled.
- The dispatch_ffn_combine fused MC2 optimization is restricted to non-dynamic-EPLB operation.
tuning_advice:
  summary: Enable dynamic EPLB for supported MoE expert-parallel serving only after measuring expert-load skew; start with
    the documented SwiftBalancer policy and tune its collection and execution intervals against the workload.
  suggested_values:
  - scenario: Imbalanced MoE serving with expert parallelism on the supported Ascend model runner
    value: 'true'
    reason: Activates the required process-start path so configured dynamic EPLB can redistribute expert load and reduce rank
      bottlenecks.
  - scenario: Dense models, single-rank deployments, model runner v2, or balanced MoE traffic
    value: 'false'
    reason: Avoids unsupported paths and the communication, worker-process, load-collection, and expert-update overhead when
      balancing has no expected gain.
  - scenario: Expert-map recording rather than live dynamic redistribution
    value: 'false'
    reason: Use EXPERT_MAP_RECORD=true with expert_map_record_path for the documented static-EPLB recording workflow.
  caveats:
  - Both the environment gate and eplb_config.dynamic_eplb must be configured for normal live dynamic EPLB.
  - The guide recommends policy 2 with collection interval 600 and algorithm interval 50 as a starting configuration, but
    explicitly says to adjust intervals for workload patterns.
  - Redundant experts consume model memory; setting num_redundant_experts to the EP size is a documented example, not a universal
    optimum.
  - The EPLB communication group, load tensors, multiprocessing worker, and expert transfers add overhead that can outweigh
    gains when expert traffic is already balanced.
  - Source and documentation establish the mechanism and expected direction of impact but provide no workload-independent
    benchmark gain.
  quick_guide: Export DYNAMIC_EPLB=true, enable expert parallelism, set additional_config.eplb_config.dynamic_eplb=true, begin
    with policy 2 and the guide's 600/50 intervals, then compare throughput, TTFT, TPOT, and NPU memory against DYNAMIC_EPLB=false
    on representative traffic.
analysis_date: '2026-07-28'

name: WeightTransferConfig.backend
type: nested
category: communication
scope: vllm
source_file:
- vllm/config/weight_transfer.py:12
- vllm/config/vllm.py:353
- vllm/engine/arg_utils.py:1446
- docs/training/weight_transfer/README.md:18
- docs/training/weight_transfer/nccl.md:3
- docs/training/weight_transfer/ipc.md:3
value_type: str
default: nccl
valid_choices:
- nccl
- ipc
cli_example: '--weight-transfer-config ''{"backend": "ipc"}'''
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: Selects the data plane used to synchronize updated model weights in online RL workflows. The nccl backend broadcasts
  weight tensors to inference workers and supports separate GPUs, multiple GPUs, and multiple nodes; its optional packed mode
  reduces collective-call overhead and overlaps packing, communication, and unpacking with multiple CUDA buffers. The ipc
  backend instead reconstructs CUDA tensors from IPC handles on the same physical GPU, avoiding the weight-data copy and process-group
  initialization. The choice can therefore change weight-update latency, temporary transfer memory, and rollout/training throughput
  when synchronization is on the critical path. It does not alter ordinary inference latency or throughput between weight-update
  events. The pinned vllm-ascend repository has no corresponding weight-transfer implementation, so no Ascend performance
  effect is claimed.
usage_locations:
- file: vllm/config/weight_transfer.py:12
  context: Declares the backend selector as Literal["nccl", "ipc"] with nccl as the default.
- file: vllm/engine/arg_utils.py:715
  context: Converts a structured weight-transfer configuration dictionary into WeightTransferConfig.
- file: vllm/engine/arg_utils.py:1446

- file: docs/training/weight_transfer/README.md:18
  context: Contrasts NCCL broadcast for separate training/inference GPUs with CUDA IPC for colocated use on the same GPU.
- file: docs/training/weight_transfer/nccl.md:14
  context: Documents incremental NCCL broadcast to all workers and optional packed, overlapped transfer for higher throughput.
- file: docs/training/weight_transfer/ipc.md:3

name: KVTransferConfig.kv_connector_extra_config.prefill
type: nested
category: parallelism
scope: vllm-ascend
source_file:
- vllm/config/kv_transfer.py:60
- vllm/config/kv_transfer.py:121
- vllm_ascend/ascend_config.py:177
- vllm_ascend/utils.py:1438
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:1566
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:1644
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_hybrid_connector.py:1374
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_hybrid_connector.py:1473

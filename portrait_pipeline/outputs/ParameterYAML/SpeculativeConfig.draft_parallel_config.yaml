name: SpeculativeConfig.draft_parallel_config
type: nested
category: parallelism
scope: both
source_file:
- vllm/config/speculative.py
- vllm_ascend/platform.py
value_type: dict
default: null
valid_choices: Internal ParallelConfig generated by vLLM, or null before post-initialization and for methods that do not create
  a separate draft worker
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: This is the resolved parallel configuration used for the speculative draft model, not an independent user-facing
  option. For a model-based proposer, vLLM copies the target model's pipeline and executor settings but substitutes the validated
  draft tensor-parallel size. That tensor-parallel degree controls how draft-model weights and compute are sharded and how
  much collective communication is added while producing proposals, so it can materially alter speculative-decoding overhead,
  memory per device, inter-token latency, and throughput. A single-rank draft avoids tensor-parallel collectives and is often
  preferable for a small draft model, while matching target TP can be required for model size or compatibility. On Ascend,
  the contained draft TP size also participates in decode-context-parallel validation for GQA/MQA draft models. The field
  itself should not be authored by users; tune SpeculativeConfig.draft_tensor_parallel_size and let post-initialization construct
  it.
usage_locations:
- file: vllm/config/speculative.py
  context: SpeculativeConfig post-initialization either aliases the target parallel config for n-gram and extract-hidden-states
    methods or calls create_draft_parallel_config for a model-based proposer after validating draft_tensor_parallel_size.
- file: vllm/config/speculative.py
  context: create_draft_parallel_config copies pipeline parallelism, executor, loading, custom-all-reduce, profiling, and
    placement-group settings from the target ParallelConfig while replacing tensor_parallel_size.
- file: vllm/config/speculative.py
  context: Model validation passes this resolved object to draft_model_config.verify_with_parallel_config.
- file: vllm_ascend/platform.py
  context: Ascend reads draft_parallel_config.tensor_parallel_size when validating decode context parallelism for a non-MLA
    GQA/MQA draft model, with fallbacks to draft_tensor_parallel_size and then target TP.
related_parameters:
- name: SpeculativeConfig.draft_tensor_parallel_size
  relation: User-facing input from which the tensor_parallel_size in this internal object is resolved; it may be 1 or the
    target model tensor-parallel size.
- name: SpeculativeConfig.target_parallel_config
  relation: Supplies every copied ParallelConfig setting and supplies target TP when draft TP is omitted.
- name: ParallelConfig.tensor_parallel_size
  relation: Target-model TP bounds the permitted draft TP choices and determines the default for most draft model types.
- name: ParallelConfig.decode_context_parallel_size
  relation: On Ascend, DCP must satisfy head-sharding constraints computed using the draft TP stored in this object.
- name: SpeculativeConfig.method
  relation: Determines whether the field aliases target_parallel_config or is built for a separate model-based proposer.
constraints:
- This is an internal post-initialization field; upstream documentation says draft_parallel_config is populated by vLLM and
  is not intended to be set by users.
- For a separately loaded draft model, its tensor_parallel_size is restricted to 1 or the target model's tensor_parallel_size.
- If draft_tensor_parallel_size is omitted, most draft models inherit target TP; mlp_speculator instead resolves to TP=1.
- N-gram and extract-hidden-states methods alias target_parallel_config rather than construct a separately tuned draft ParallelConfig.
- On Ascend with decode_context_parallel_size greater than 1, a non-MLA GQA/MQA draft model requires draft TP to exceed its
  total KV-head count, DCP to be no greater than draft TP divided by KV heads, and Q heads per KV head to be divisible by
  DCP.
- Ascend's EAGLE proposer documents that draft TP effectively supports either 1 or target TP and uses a patched single-rank
  TP group when the draft size differs from the target.
tuning_advice:
  summary: Do not set draft_parallel_config directly. Benchmark the user-facing draft_tensor_parallel_size, normally comparing
    1 with target TP, and let vLLM generate this object.
  suggested_values:
  - scenario: Small EAGLE draft model on Ascend
    value: generated from draft_tensor_parallel_size=1
    reason: Ascend documentation requires EAGLE draft models to run without tensor parallelism; a single rank also avoids
      draft-side TP communication.
  - scenario: Draft model needs sharding or single-rank memory is insufficient
    value: generated from draft_tensor_parallel_size=<target TP>
    reason: Matching target TP is the only supported alternative to 1 and shards draft weights and compute across the target
      TP ranks.
  - scenario: N-gram or extract-hidden-states speculation
    value: automatic alias of target_parallel_config
    reason: These paths do not create a separately parallelized draft-model worker.
  caveats:
  - Lower draft latency does not guarantee higher end-to-end throughput; measure acceptance rate and target verification cost
    with the same workload and num_speculative_tokens.
  - TP=1 reduces collectives but concentrates draft weights and temporary state on one device and may become compute- or memory-limited.
  - Ascend DCP validation can reject a draft TP setting that does not satisfy the draft model's attention-head layout.
  - The generated object inherits pipeline and executor settings from the target configuration; those fields are not independently
    tunable here.
  quick_guide: Leave this internal field unset. For a model-based speculative method, start with draft_tensor_parallel_size=1
    when the draft fits on one device (required for the documented Ascend EAGLE path), compare it against target TP when supported,
    and select using end-to-end throughput, inter-token latency, and peak device memory. If Ascend DCP is enabled, first verify
    the draft TP/KV-head and DCP divisibility constraints. For n-gram or extract-hidden-states methods, accept the automatic
    target-config alias.
analysis_date: '2026-07-31'

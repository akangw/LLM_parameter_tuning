name: KVTransferConfig.kv_connector_extra_config.backend
type: nested
category: kv_cache
scope: vllm-ascend
source_file:
- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/pool_worker.py:47
- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/pool_worker.py:105
- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/pool_worker.py:195
- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/backend/mooncake_backend.py:57
- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/backend/memcache_backend.py:23
- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/backend/yuanrong_backend.py:84

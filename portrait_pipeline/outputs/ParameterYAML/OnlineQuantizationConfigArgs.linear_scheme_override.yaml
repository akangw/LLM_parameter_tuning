impact_detail: 'This nullable field overrides the online-quantization recipe specifically for supported LinearBase layers.
  When it is null, linear layers use global_scheme; when set, the selected enum takes precedence for that layer family while
  MoE layers retain their global or MoE-specific recipe. Online quantization converts eligible BF16/FP16 weights during model
  loading and dynamically scales activations during forward execution. Changing the linear recipe can therefore alter linear-weight
  precision and scale metadata, device memory and bandwidth, load-time conversion work, runtime kernels, latency, throughput,
  and numerical quality across every eligible dense projection. Per-tensor FP8 uses one weight scale per tensor, per-block
  FP8 uses 128x128 weight blocks and 1x128 activation blocks, and MXFP8 uses 1x32 blocks; the INT8 recipe is documented as
  MoE-expert weight-only and leaves linear layers unquantized. Ascend takes precedence for NPU behavior: the pinned plugin
  does not list online quantization or its scheme aliases as supported.'

name: --mamba-ssm-cache-dtype
type: cli
category: memory
scope: vllm
source_file:
- vllm/config/cache.py:35
- vllm/config/cache.py:128
- vllm/engine/arg_utils.py:1115
- vllm/config/vllm.py:778
- vllm/v1/attention/backends/flash_attn.py:81
value_type: str
default: auto
valid_choices:
- auto
- float32
- float16
cli_example: --mamba-ssm-cache-dtype float16
deprecated: false
performance_impact: medium
performance_scope:
- memory
- throughput
impact_detail: 'This setting controls only the SSM-state portion of the Mamba cache; the convolution state remains controlled
  by mamba_cache_dtype. The current MambaDType accepts auto, float32, and float16. With auto, the cache config first follows
  mamba_cache_dtype, while model-specific configuration can replace auto: NemotronH uses its HF configuration or float32 by
  default, and Qwen3.5 uses its mamba_ssm_dtype when present. Choosing float16 rather than float32 reduces the storage required
  for this state cache, which can leave more device memory for active requests. In hybrid models, the FlashAttention backend
  restricts block sizes to 16, 32, or 64 whenever either Mamba cache dtype is float32; otherwise it permits multiples of 16.
  Stochastic rounding is also rejected unless this SSM cache dtype is explicitly float16. vLLM Ascend contains no package-code
  override of this option, so the pinned upstream behavior applies to Ascend integrations.'
usage_locations:
- file: vllm/config/cache.py:128
  context: Defines the SSM-only cache dtype and documents auto resolution through mamba_cache_dtype.

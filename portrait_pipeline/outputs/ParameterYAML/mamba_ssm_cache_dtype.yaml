related_parameters:
- name: --mamba-cache-dtype
  relation: Controls the convolution-state dtype and supplies the auto resolution path for the SSM state.
- name: --enable-mamba-cache-stochastic-rounding
  relation: Requires --mamba-ssm-cache-dtype float16.
- name: --block-size
  relation: In hybrid models, float32 SSM state restricts FlashAttention-supported block sizes to 16, 32, or 64.
constraints:
- Valid values in the current source are auto, float32, and float16.
- When Mamba stochastic rounding is enabled, set --mamba-ssm-cache-dtype float16 explicitly.
- For Qwen3.5, an explicit value different from the model mamba_ssm_dtype is used but produces a warning.
tuning_advice:
  summary: Leave the setting at auto to use model-aware resolution; use float16 when lower SSM-cache memory use and compatible
    precision are desired.
  suggested_values:
  - scenario: Initial deployment or a model with an intended SSM dtype in its configuration
    value: auto
    reason: Lets the current model-specific resolution choose the configured SSM dtype; NemotronH falls back to float32 if
      its configuration does not specify one.
  - scenario: Memory-constrained Mamba or hybrid-model serving with acceptable float16 state precision
    value: float16
    reason: Uses half the per-element cache storage of float32, satisfies stochastic rounding, and avoids the float32 hybrid
      FlashAttention block-size restriction.
  - scenario: A model or validation run that requires float32 SSM state
    value: float32
    reason: Preserves float32 state precision, but increases SSM-cache storage and can limit hybrid FlashAttention block sizes.
  caveats:
  - The option does not change the Mamba convolution-state dtype; tune --mamba-cache-dtype separately when needed.
  - Stochastic rounding fails configuration validation unless this value is float16.
  - In hybrid models, float32 restricts FlashAttention-supported block sizes to 16, 32, and 64.
  quick_guide: Start with auto; select float16 only after confirming the model and workload tolerate that SSM-state precision.
analysis_date: '2026-07-27'

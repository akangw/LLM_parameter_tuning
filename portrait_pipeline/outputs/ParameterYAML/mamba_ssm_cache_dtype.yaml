  context: Resolves auto for NemotronH from the HF configuration or the float32 fallback.
- file: vllm/model_executor/models/config.py:609
  context: Resolves auto from Qwen3.5 mamba_ssm_dtype and warns on an explicit mismatch.
- file: vllm/config/vllm.py:778

name: VLLM_ALLREDUCE_USE_SYMM_MEM
type: env
performance_impact: none
skip_reason: In the pinned current vLLM source this environment variable is declared and parsed with a default of 1 in vllm/envs.py,
  but no runtime code reads it. The pinned vllm-ascend source likewise has no reference to or override for the variable, and
  its Ascend collective implementations do not consult it. Changing the value therefore cannot affect latency, throughput,
  or memory in the target runtime.

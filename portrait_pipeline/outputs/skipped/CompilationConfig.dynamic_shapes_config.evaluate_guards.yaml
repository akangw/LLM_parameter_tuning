name: CompilationConfig.dynamic_shapes_config.evaluate_guards
type: nested
performance_impact: none
skip_reason: This is a dynamic-shape debugging switch, not a performance tuning control. In the pinned upstream source it
  is declared to retain Dynamo guards so that specialization-triggered recompilation can be detected and failed, and it is
  included in the compilation configuration hash; no runtime consumer in the pinned vLLM source uses it to select kernels,
  scheduling, batching, or memory behavior. The pinned vllm-ascend source has no override or consumer for this field. It therefore
  has no supported latency, throughput, or memory tuning effect.

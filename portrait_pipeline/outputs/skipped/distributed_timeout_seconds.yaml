name: --distributed-timeout-seconds
type: cli
performance_impact: none
skip_reason: This upstream-only option is passed to torch.distributed.init_process_group as its timeout. The pinned vllm-ascend
  source has no reference or override, and changing the timeout only changes how long startup waits before a distributed-initialization
  failure; it does not change successful inference latency, throughput, or memory use.

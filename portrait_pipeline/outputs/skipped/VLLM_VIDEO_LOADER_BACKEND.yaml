name: VLLM_VIDEO_LOADER_BACKEND
type: env
performance_impact: none
skip_reason: In the pinned sources this environment variable is only declared, assigned the default value "opencv", and included
  in the environment-variable name list in vllm/envs.py. Neither vLLM nor vLLM Ascend reads it at a video-loading call site
  or provides the referenced loader registry, so changing it cannot affect latency, throughput, or memory in these commits.

name: VLLM_SKIP_P2P_CHECK
type: env
performance_impact: none
skip_reason: In the pinned vLLM source this environment variable is parsed in vllm/envs.py but is never read by runtime code,
  and the pinned vLLM Ascend source neither defines nor references it. Ascend selects NPUCommunicator, whose CUDA custom-all-reduce
  compatibility field is always None, so changing this variable cannot affect latency, throughput, or memory in the pinned
  implementations.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tuning_pipeline/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r tuning_pipeline/requirements-dev.txt
      - name: Validate configuration and scan secrets
        run: python scripts/validate_repository.py
      - name: Run tests
        run: python -m pytest -q
